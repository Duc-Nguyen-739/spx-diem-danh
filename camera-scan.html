<script>
  // ===== CAMERA-SCAN-START: Quét mã bằng camera điện thoại (2026-08-11) =====
  // File riêng (camera-scan.html) — nhúng qua scriptlet include('camera-scan') NGAY
  // TRƯỚC include('js') trong index.html, nên các hàm ở đây định nghĩa trước khi
  // js.html chạy (wiring DOMContentLoaded ở js.html gọi onCamFileChange).
  //
  // RÀNG BUỘC NỀN TẢNG (2026-08-12, cập nhật sau khi verify thực tế):
  // - GAS serve web app trong IFRAME WRAPPER (userHtmlFrame). getUserMedia live trong
  //   iframe BỊ CHẶN trên máy thật (Permissions Policy — wrapper allow="camera *" không
  //   đủ; iOS Safari từ chối camera trong cross-origin iframe).
  // - GIẢI PHÁP POPUP (2026-08-12, hướng A — user chọn): bấm "📷 Quét Camera" trong
  //   iframe GAS → mở POPUP top-level (window.open — trang top-level nên getUserMedia
  //   chạy được trên iOS, đã verify với demo standalone) → popup TỰ nhận diện mã vạch
  //   (BarcodeDetector → jsQR → Quagga — lấy thư viện từ trang mở qua window.opener,
  //   about:blank kế thừa origin → cùng origin) → postMessage {type:'rcScanResult',
  //   code} về iframe → onCameraDecoded → Done. iOS lần đầu có thể cần chạm nút
  //   "▶ Bật camera" trong popup (user gesture không qua được document mới).
  // - Fallback an toàn (giữ nguyên đường cũ): popup bị chặn (window.open null) hoặc
  //   camera trong popup bị chặn → camera native = <input type=file capture> gọi ĐỒNG
  //   BỘ trong click handler (đang trong user gesture) → iOS/Android mở camera LẬP TỨC,
  //   chạy 100% trong iframe GAS. Chụp xong TỰ decode multi-scale (jsQR + 3 config
  //   Quagga) → điền mã → Done.
  // - BỎ TAB QUÉT RIÊNG (?scan=1) làm đường chính (bug 2026-08-12): mở URL content
  //   GAS trong tab mới bị TRẮNG lặp lại NHIỀU LẦN trên Safari/Chrome dù đã fix nhiều
  //   lần — wrapper GAS nạp app qua postMessage handshake vào iframe /blank, tab mới
  //   không render được nội dung app → không đáng dựa vào.
  //
  // CHUỖI NHẬN DIỆN (frame live lẫn ảnh chụp):
  //   1) BarcodeDetector — native Chrome/Edge/Android (QR + vạch 1D, nhanh nhất)
  //   2) jsQR (lib-jsqr.html) — QR — iOS Safari (KHÔNG có BarcodeDetector)
  //   3) Quagga (lib-quagga.html) — barcode vạch 1D (Code128/39/EAN/UPC/ITF…) — iOS
  // Ảnh chụp decode ở NHIỀU kích thước (gốc → 1280 → 800) × 3 cấu hình Quagga.
  // AUTO-DECODE (2026-08-12): live loop iOS (frame 800px + 1 config nhanh) KHÔNG bắt
  // được mã vạch kẻ; auto-snap cũ gate theo độ rung (CAM_STABLE_MOTION=6/255) quá nhạy
  // với noise camera iPhone thật → không bao giờ kích hoạt → user vẫn phải bấm "📸 Chụp"
  // (bug 2026-08-12). Giờ: TỰ ĐỘNG chạy ĐÚNG chain nút Chụp (frame 1280px + jsQR + 3
  // config Quagga — đường đã chạy tốt) theo nhịp cố định mỗi 2 tick frame (~1.2s) → đưa
  // mã vào khung là tự nhận, không cần bấm gì. Nút "📸 Chụp" vẫn giữ làm fallback thủ công.
  // Kết quả đưa thẳng vào scanInput rồi gọi submitScan() → ĐÚNG luồng quét hiện
  // tại (reconcile lẫn meal-move Ra/Vào), KHÔNG đổi logic quét.
  //
  // Nút "📷 Quét Camera" (#btnCamScan) CHỈ hiện trên mobile (desktop ẩn — CSS):
  //   - GAS (iframe): mở POPUP quét LIVE (tự nhận mã → postMessage về app → Done);
  //     popup/camera bị chặn → fallback camera native (chụp xong tự decode → Done)
  //   - Ngoài GAS (preview/hosting top-level): live scan ngay trong modal
  var camDecoding = false;   // đang decode 1 ảnh/frame (chống chồng lấn)
  var camSnapping = false;   // đang chụp/decode tĩnh (snap hoặc file)
  var camStream = null;      // MediaStream đang mở
  var camTimer = null;       // interval decode khi không có BarcodeDetector
  var camRaf = null;         // requestAnimationFrame khi có BarcodeDetector
  var camDetector = null;    // BarcodeDetector instance
  var camLastFrame = 0;      // chống decode trùng frame liên tiếp
  // AUTO-DECODE (2026-08-12): live loop iOS chạy ĐÚNG chain nút "📸 Chụp" (frame 1280px
  // + jsQR + 3 config Quagga — đường đã chạy tốt) theo nhịp cố định, KHÔNG gate theo độ
  // rung (threshold 6/255 quá nhạy với noise camera iPhone thật → auto-snap không bao giờ
  // kích hoạt → user vẫn phải bấm Chụp, bug 2026-08-12). Đưa mã vào khung là tự nhận.
  var camFullChainTick = 0;       // đếm tick frame giữa 2 lần chạy full-chain decode
  var CAM_FULL_CHAIN_INTERVAL = 2; // chạy full chain mỗi N tick frame (1 tick ≈ 600ms)
  var camFindMode = false;   // "🔍 Tìm Mã" (2026-08-16): full-chain decode MỖI tick + ép focus liên tục
  var camScanMode = false;   // đang ở TAB QUÉT RIÊNG (?scan=1) — kết quả gửi về trang gốc
  var camScanToken = '';     // token định danh phiên quét
  var scanPollTimer = null;  // poll localStorage chờ kết quả từ tab quét
  var scanPollSince = 0;     // chỉ nhận kết quả mới hơn thời điểm mở tab
  var CAM_FORMATS = ['qr_code', 'code_128', 'code_39', 'code_93', 'codabar', 'ean_13', 'ean_8', 'itf', 'upc_a', 'upc_e'];
  var CAM_QUAGGA_READERS = ['code_128_reader', 'code_39_reader', 'ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader', 'i2of5_reader', 'code_93_reader', 'codabar_reader'];

  function openCameraScan() {
    var btn = document.getElementById('btnCamScan');
    if (btn && btn.disabled) return;
    if (CURRENT_TASK && CURRENT_TASK.status !== TASK_STATUS_C.OPEN) return;
    var inFrame = false;
    try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
    if (inFrame) {
      // GAS iframe: mở POPUP top-level quét LIVE (tự nhận mã vạch — getUserMedia chạy
      // được ở trang top-level trên iOS, đã verify với demo standalone 2026-08-12).
      // Popup bị chặn (window.open null) hoặc camera trong popup bị chặn → fallback
      // camera native (<input capture>) — không bao giờ kẹt.
      openScanPopup();
      return;
    }
    // Ngoài GAS (preview/hosting top-level): quét LIVE ngay trong trang
    startCameraLive();
  }

  // ===== POPUP QUÉT LIVE (2026-08-12, hướng A) =====
  // Bấm "📷 Quét Camera" trong iframe GAS → mở POPUP top-level chứa màn hình quét LIVE.
  // Popup là trang top-level → getUserMedia hoạt động trên iOS (iframe GAS bị chặn).
  // Popup tự nhận mã (BarcodeDetector → jsQR → Quagga — lấy thư viện từ trang mở qua
  // window.opener, cùng origin vì about:blank kế thừa origin) → gửi về iframe qua
  // postMessage {type:'rcScanResult', code} → onCameraDecoded → Done. Nếu popup không
  // mở được (window.open null) hoặc camera popup bị chặn → fallback camera native.
  var CAM_POPUP_NAME = 'rcCamScanPopup';
  var camPopupBusy = false;
  var camPopupRef = null;  // reference popup đang mở — check .closed để biết popup đã đóng
                             // (đóng bằng ✕ Đóng / đóng tab đều không gửi message về parent)

  function buildScanPopupHtml() {
    return [
      '<!doctype html>',
      '<html lang="vi">',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">',
      '<title>Quét mã vạch</title>',
      // Ghép chuỗi như thẻ mở script bên trên — file không được chứa literal thẻ
      // style mở/đóng (test inline-html đếm số cặp theo file).
      '<sty' + 'le>',
      'html,body{margin:0;padding:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;}',
      '#wrap{position:fixed;inset:0;display:flex;flex-direction:column;}',
      '#view{position:relative;flex:1;overflow:hidden;background:#000;}',
      '#video{width:100%;height:100%;object-fit:cover;display:block;}',
      '#frame{position:absolute;inset:12% 8%;border:2px dashed rgba(255,255,255,.85);border-radius:14px;pointer-events:none;}',
      '#status{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;text-align:center;background:rgba(0,0,0,.62);font-size:14px;color:#e2e8f0;}',
      '#bar{display:flex;gap:12px;justify-content:center;align-items:center;padding:14px;background:#0d111a;}',
      'button{font-size:16px;padding:12px 22px;border-radius:12px;border:0;cursor:pointer;}',
      '#startBtn{background:#e85d04;color:#fff;display:none;}',
      '#findBtn{background:#0b57d0;color:#fff;}',
      '#findBtn.active{background:#e85d04;box-shadow:0 0 0 2px rgba(255,255,255,.4);}',
      '#cancelBtn{background:rgba(255,255,255,.12);color:#fff;}',
      '</sty' + 'le>',
      '</head>',
      '<body>',
      '<div id="wrap">',
      '<div id="view">',
      '<video id="video" autoplay playsinline muted></video>',
      '<div id="frame"></div>',
      '<div id="status">Đang mở camera…</div>',
      '</div>',
      '<div id="bar">',
      '<button id="startBtn" type="button">▶ Bật camera</button>',
      '<button id="findBtn" type="button">🔍 Tìm Mã</button>',
      '<button id="cancelBtn" type="button">✕ Đóng</button>',
      '</div>',
      '</div>',
      // Ghép chuỗi thẻ mở script của popup — file này không được chứa literal thẻ
      // mở script (test inline-html đếm số thẻ theo file; browser nhạy với chuỗi này).
      '<scr' + 'ipt>',
      '(function(){',
      '  var video = document.getElementById("video");',
      '  var statusEl = document.getElementById("status");',
      '  var startBtn = document.getElementById("startBtn");',
      '  var cancelBtn = document.getElementById("cancelBtn");',
      '  var stream = null;',
      '  var timer = null;',
      '  var busy = false;',
      '  var detected = false;',
      '  var tick = 0;',
      '  var findMode = false;',
      '  var findBtn = document.getElementById("findBtn");',
      '  // 🔍 Tìm Mã (2026-08-16): ép focus liên tục (nếu trình duyệt hỗ trợ) + decode MỖI',
      '  // tick thay vì mỗi 2 tick — đưa mã vào khung là nhận nhanh hơn. Bấm lần nữa để tắt.',
      '  function setFindMode(on) {',
      '    findMode = !!on;',
      '    if (findBtn) { findBtn.classList.toggle("active", findMode); findBtn.textContent = findMode ? "🔍 Tìm Mã…" : "🔍 Tìm Mã"; }',
      '    if (findMode && stream) {',
      '      try {',
      '        var track = stream.getVideoTracks && stream.getVideoTracks()[0];',
      '        if (track && track.applyConstraints) track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });',
      '      } catch (e) {}',
      '    }',
      '    if (findMode) statusEl.textContent = "🔍 Đang tìm mã — giữ yên camera";',
      '  }',
      '  var FORMATS = ["qr_code","code_128","code_39","code_93","codabar","ean_13","ean_8","itf","upc_a","upc_e"];',
      '  function getLibs() {',
      '    try {',
      '      var o = window.opener;',
      '      if (!o) return null;',
      '      return { jsQR: o.jsQR || null, Quagga: o.Quagga || null, readers: o.CAM_QUAGGA_READERS || null, configs: o.CAM_QUAGGA_CONFIGS || null, majority: o.camPickQuaggaMajority || null, known: o.camKnownStaffCode || null, allow: o.camQuaggaResultAllowed || null, ocr: o.camOcrFrame || null, fast: o.camFastDecode || null };',
      '    } catch (e) { return null; }',
      '  }',
      '  var LIBS = getLibs();',
      '  function sendResult(code) {',
      '    if (detected) return;',
      '    detected = true;',
      '    var clean = String(code || "").trim();',
      '    try { if (window.opener) window.opener.postMessage({ type: "rcScanResult", code: clean }, "*"); } catch (e) {}',
      '    statusEl.textContent = "✅ Đã nhận mã: " + clean;',
      '    stop();',
      '    setTimeout(function () { try { window.close(); } catch (e) {} }, 1000);',
      '  }',
      '  function sendFailed() {',
      '    try { if (window.opener) window.opener.postMessage({ type: "rcScanPopup", state: "failed" }, "*"); } catch (e) {}',
      '    setTimeout(function () { try { window.close(); } catch (e) {} }, 500);',
      '  }',
      '  function frameToImageData(maxSide) {',
      '    var w = video.videoWidth || 0;',
      '    var h = video.videoHeight || 0;',
      '    if (!w || !h) return null;',
      '    var scale = Math.min(1, maxSide / Math.max(w, h));',
      '    var cw = Math.max(1, Math.round(w * scale));',
      '    var ch = Math.max(1, Math.round(h * scale));',
      '    var canvas = document.createElement("canvas");',
      '    canvas.width = cw;',
      '    canvas.height = ch;',
      '    var ctx = canvas.getContext("2d");',
      '    ctx.drawImage(video, 0, 0, cw, ch);',
      '    var imageData;',
      '    try { imageData = ctx.getImageData(0, 0, cw, ch); } catch (e) { return null; }',
      '    return { canvas: canvas, imageData: imageData, w: cw, h: ch };',
      '  }',
      '  function decodeChain(f, onDone) {',
      '    if (window.BarcodeDetector) {',
      '      try {',
      '        var d = new window.BarcodeDetector({ formats: FORMATS });',
      '        d.detect(f.canvas).then(function (res) {',
      '          if (res && res.length && res[0].rawValue) sendResult(res[0].rawValue);',
      '          else decodeFallback(f, onDone);',
      '        }).catch(function () { decodeFallback(f, onDone); });',
      '        return;',
      '      } catch (e) { /* tiếp tục fallback */ }',
      '    }',
      '    decodeFallback(f, onDone);',
      '  }',
      '  function decodeFallback(f, onDone) {',
      '    if (LIBS && LIBS.jsQR) {',
      '      try {',
      '        var qr = LIBS.jsQR(f.imageData.data, f.w, f.h);',
      '        if (qr && qr.data) { sendResult(qr.data); return; }',
      '      } catch (e) { /* tiếp tục */ }',
      '    }',
      '    if (LIBS && LIBS.Quagga && LIBS.readers) {',
      '      try {',
      '        var canvas = document.createElement("canvas");',
      '        canvas.width = f.w;',
      '        canvas.height = f.h;',
      '        canvas.getContext("2d").putImageData(f.imageData, 0, 0);',
      '        var src = canvas.toDataURL("image/jpeg", 0.92);',
      '        runQuagga(src, LIBS.configs || [{ patchSize: "x-large", halfSample: false }], 0, [], onDone);',
      '        return;',
      '      } catch (e) { /* tiếp tục */ }',
      '    }',
      '    onDone();',
      '  }',
      '  function runQuagga(src, configs, idx, results, onDone) {',
      '    if (idx >= configs.length) {',
      '      // Chạy HẾT config rồi mới nhận — chỉ nhận mã được ≥2 config đồng thuận',
      '      // (sau normalize — Quagga quirk thừa checksum digit, bug 2026-08-16).',
      '      var agree = LIBS.majority ? LIBS.majority(results, LIBS.known || function () { return false; }, 2) : null;',
      '      if (agree) { sendResult(agree); return; }',
      '      onDone();',
      '      return;',
      '    }',
      '    LIBS.Quagga.decodeSingle({',
      '      src: src,',
      '      numOfWorkers: 0,',
      '      inputStream: { size: 1280 },',
      '      locator: configs[idx],',
      '      decoder: { readers: LIBS.readers }',
      '    }, function (result) {',
      '      var code = result && result.codeResult && result.codeResult.code;',
      '      var format = result && result.codeResult && result.codeResult.format;',
      '      // Cùng lọc format như trang app (bỏ EAN/UPC/i2of5 numeric-only — bug 2026-08-16)',
      '      if (code && (!LIBS.allow || LIBS.allow({ code: String(code).trim(), format: format }))) results.push(String(code).trim());',
      '      runQuagga(src, configs, idx + 1, results, onDone);',
      '    });',
      '  }',
      '  var ocrBusy = false;',
      '  // OCR song song (2026-08-16): đọc chữ Ops… khi mã vạch mờ — gọi qua window.opener',
      '  // (trang app giữ worker Tesseract + STAFF_INFO) — cái nào ra trước thì sendResult.',
      '  function ocrTick() {',
      '    if (!LIBS.ocr || ocrBusy || detected || !stream) return;',
      '    if (!video.videoWidth) return;',
      '    ocrBusy = true;',
      '    var f = frameToImageData(800);',
      '    if (!f) { ocrBusy = false; return; }',
      '    LIBS.ocr(f.canvas, function (code) { ocrBusy = false; if (code) sendResult(code); });',
      '  }',
      '  // AUTO-DECODE theo nhịp cố định (không gate độ rung — bug 2026-08-12): chạy',
      '  // full chain 1280px + jsQR + 3 config Quagga mỗi 2 tick (~1.2s) — đưa mã vào',
      '  // khung là tự nhận, không cần bấm gì.',
      '  function loop() {',
      '    if (!stream || detected) return;',
      '    if (!video.videoWidth) return;',
      '    tick++;',
      '    if (tick % 2 === 0) ocrTick();', // song song: OCR chạy kể cả khi chain barcode đang busy
      '    if (busy) return;',
      '    if (findMode || tick % 2 === 0) {',
      '      busy = true;',
      '      var f = frameToImageData(1280);',
      '      if (!f) { busy = false; return; }',
      '      decodeChain(f, function () { busy = false; });',
      '      return;',
      '    }',
      '    // FAST PATH (2026-08-16 tối ưu): 1 config Quagga qua window.opener — chỉ nhận',
      '    // mã khớp NV đã biết (opener camFastDecode) → done nhanh hơn, không chờ 3 config.',
      '    if (LIBS.fast) {',
      '      var f2 = frameToImageData(1280);',
      '      if (f2) LIBS.fast(f2, function (code) { if (code) sendResult(code); });',
      '    }',
      '  }',
      '  function start(force) {',
      '    if (stream) return;',
      '    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {',
      '      statusEl.textContent = "Trình duyệt không hỗ trợ camera";',
      '      sendFailed();',
      '      return;',
      '    }',
      '    if (!window.BarcodeDetector && !(LIBS && (LIBS.jsQR || LIBS.Quagga))) {',
      '      statusEl.textContent = "Không có thư viện quét — dùng chụp ảnh thay thế";',
      '      sendFailed();',
      '      return;',
      '    }',
      '    statusEl.textContent = "Đang mở camera…";',
      '    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })',
      '      .then(function (s) {',
      '        stream = s;',
      '        video.srcObject = s;',
      '        video.setAttribute("muted", "");',
      '        video.setAttribute("playsinline", "");',
      '        var p = video.play();',
      '        if (p && p.catch) p.catch(function () {});',
      '        statusEl.textContent = "Đưa mã vào khung, giữ yên — tự nhận diện";',
      '        startBtn.style.display = "none";',
      '        timer = setInterval(loop, 600);',
      '      })',
      '      .catch(function () {',
      '        if (force) {',
      '          statusEl.textContent = "Không mở được camera — quay lại chụp ảnh";',
      '          sendFailed();',
      '          return;',
      '        }',
      '        statusEl.textContent = "📷 Bấm nút dưới để bật camera";',
      '        startBtn.style.display = "inline-block";',
      '      });',
      '  }',
      '  function stop() {',
      '    if (timer) { clearInterval(timer); timer = null; }',
      '    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }',
      '    video.srcObject = null;',
      '  }',
      '  findBtn.addEventListener("click", function () { setFindMode(!findMode); });',
      '  startBtn.addEventListener("click", function () { start(true); });',
      '  cancelBtn.addEventListener("click", function () {',
      '    // Báo về trang cha để reset cờ busy — nếu không, lần bấm "Quét Camera" sau mở',
      '    // window mới mà bị kẹt ở nhánh focus → TAB TRẮNG (bug 2026-08-13).',
      '    try { if (window.opener) window.opener.postMessage({ type: "rcScanPopup", state: "closed" }, "*"); } catch (e) {}',
      '    stop(); try { window.close(); } catch (e) {}',
      '  });',
      '  window.addEventListener("unload", stop);',
      '  setTimeout(function () { start(false); }, 120);',
      '})();',
      '<\/script>',
      '</body>',
      '</html>'
    ].join('\n');
  }

  function openScanPopup() {
    var popup = null;
    try { popup = window.open('', CAM_POPUP_NAME); } catch (e) { popup = null; }
    if (!popup) {
      // Popup bị chặn (trình duyệt không cho mở) → fallback camera native
      camStatus('📷 Trình duyệt chặn popup — dùng camera chụp ảnh thay thế', true);
      pickCameraImage();
      return;
    }
    if (camPopupBusy && camPopupRef && !camPopupRef.closed) {
      // Popup quét đang mở (chưa nhận mã / chưa đóng) → đưa về popup đó
      try { camPopupRef.focus(); } catch (e) {}
      return;
    }
    // Popup trước đã đóng (bấm ✕ Đóng / đóng tab) hoặc chưa từng mở → mở popup mới.
    // KHÔNG được chỉ focus rồi return: window.open('', tên) tạo window MỚI khi window
    // cũ cùng tên đã đóng — nếu bỏ qua không viết nội dung → TAB TRẮNG (bug 2026-08-13).
    camPopupBusy = true;
    camPopupRef = popup;
    var html = buildScanPopupHtml();
    try {
      popup.document.open();
      popup.document.write(html);
      popup.document.close();
      camStatus('📷 Quét mã trong cửa sổ vừa mở — đưa mã vào khung là tự nhận', false);
    } catch (e) {
      camPopupBusy = false;
      camPopupRef = null;
      pickCameraImage();
    }
  }

  // ===== NHẬN KẾT QUẢ TỪ TAB QUÉT RIÊNG =====
  function startScanResultPolling(token) {
    stopScanResultPolling();
    scanPollSince = Date.now();
    var hintTimer = setTimeout(function () {
      camStatus('Nếu camera chưa mở: bấm lại 📷 Quét Camera và chọn Mở/Open khi trình duyệt hỏi', true);
    }, 8000);
    scanPollTimer = setInterval(function () {
      var data = null;
      try {
        var raw = localStorage.getItem('rcScanResult');
        if (raw) data = JSON.parse(raw);
      } catch (e) { data = null; }
      if (!data || !data.code) return;
      if (data.token !== token || data.ts < scanPollSince) return;
      try { localStorage.removeItem('rcScanResult'); } catch (e) {}
      stopScanResultPolling();
      onCameraDecoded(data.code); // điền mã + submitScan() — Done
    }, 400);
    scanPollTimer._hint = hintTimer;
  }

  function stopScanResultPolling() {
    if (scanPollTimer) {
      if (scanPollTimer._hint) clearTimeout(scanPollTimer._hint);
      clearInterval(scanPollTimer);
      scanPollTimer = null;
    }
  }

  // Nhận kết quả từ POPUP quét live / tab quét (postMessage về iframe này)
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('message', function (ev) {
      if (!ev.data || typeof ev.data !== 'object') return;
      if (ev.data.type === 'rcScanResult' && ev.data.code) {
        onCameraDecoded(String(ev.data.code));
        return;
      }
      if (ev.data.type === 'rcScanPopup' && ev.data.state === 'failed') {
        // Popup không mở được camera (bị chặn/không hỗ trợ) → fallback camera native
        camPopupBusy = false;
        camPopupRef = null;
        camStatus('📷 Camera popup bị chặn — dùng camera chụp ảnh thay thế', true);
        setTimeout(pickCameraImage, 250);
        return;
      }
      if (ev.data.type === 'rcScanPopup' && ev.data.state === 'closed') {
        // User bấm "✕ Đóng" trong popup → popup tự đóng → cho mở popup mới ở lần sau
        camPopupBusy = false;
        camPopupRef = null;
      }
    });
  }

  // ===== LIVE SCAN (trong trang — GAS iframe + ngoài GAS) =====
  // force=true khi gọi từ nút "▶ Bật camera" (user đã chạm — có gesture). Nếu getUserMedia
  // vẫn fail lúc này → iframe/trình duyệt chặn camera trực tiếp → fallback camera native
  // (<input capture>) để không kẹt ở màn hình đen.
  function startCameraLive(force) {
    var modal = document.getElementById('cameraModal');
    var video = document.getElementById('camVideo');
    var statusEl = document.getElementById('camStatusLive');
    if (!modal || !video) return;
    if (camStream) return; // đang mở rồi
    modal.style.display = 'flex';
    modal.setAttribute('aria-hidden', 'false');
    if (statusEl) statusEl.textContent = 'Đang mở camera…';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (statusEl) statusEl.textContent = 'Trình duyệt không hỗ trợ camera trực tiếp';
      var sb0 = document.getElementById('camStartBtn');
      if (sb0) sb0.style.display = 'inline-flex';
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(function (stream) {
        camStream = stream;
        video.srcObject = stream;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
        if (statusEl) statusEl.textContent = 'Đưa mã vào khung, giữ yên — tự nhận diện';
        var sb = document.getElementById('camStartBtn');
        if (sb) sb.style.display = 'none';
        startCameraDecodeLoop();
        startOcrLoop(); // song song: OCR đọc chữ Ops… khi mã vạch mờ (2026-08-16)
      })
      .catch(function () {
        if (force) {
          // Đã có user gesture mà getUserMedia VẪN fail → trình duyệt/iframe chặn
          // camera trực tiếp → dùng camera native (chạy 100% trong iframe GAS).
          camStatus('📷 Trình duyệt chặn camera trực tiếp — dùng camera chụp ảnh thay thế', true);
          setTimeout(pickCameraImage, 250);
          return;
        }
        // Lần đầu iOS chưa có user gesture (NotAllowedError) → hiện nút để chạm 1 lần
        var st = document.getElementById('camStatusLive');
        if (st) { st.textContent = '📷 Bấm nút dưới để bật camera'; st.style.color = '#ffd9a8'; }
        var sb = document.getElementById('camStartBtn');
        if (sb) sb.style.display = 'inline-flex';
      });
  }

  function startCameraDecodeLoop() {
    stopCameraDecodeLoop();
    // 1) BarcodeDetector — loop rAF trên video trực tiếp (QR + 1D)
    if (window.BarcodeDetector) {
      try { camDetector = new window.BarcodeDetector({ formats: CAM_FORMATS }); } catch (e) { camDetector = null; }
    }
    if (camDetector) {
      var loop = function () {
        var video = document.getElementById('camVideo');
        if (!camStream || !video || !video.videoWidth) { camRaf = null; return; }
        camDetector.detect(video).then(function (results) {
          if (results && results.length && results[0].rawValue) {
            onCameraDecoded(results[0].rawValue);
            return;
          }
          camRaf = requestAnimationFrame(loop);
        }).catch(function () { camRaf = requestAnimationFrame(loop); });
      };
      camRaf = requestAnimationFrame(loop);
      return;
    }
    // 2) Không có BarcodeDetector (iOS Safari…) → TỐI ƯU 2026-08-16: 1 canvas 1280px dùng
    //    chung cho cả fast path lẫn full chain (không chụp 2 lần). FAST PATH mỗi tick:
    //    jsQR + 1 config Quagga mạnh nhất — CHỈ nhận khi khớp NV đã biết (STAFF_INFO =
    //    nguồn chuẩn) → done NGAY, không chờ 3 config. Full chain mỗi 2 tick (majority)
    //    lo NV lạ (Dư). Đưa mã vào khung là tự nhận (không dùng motion gate — bug 2026-08-12).
    camTimer = setInterval(function () {
      if (camDecoding || camSnapping || !camStream) return;
      var video = document.getElementById('camVideo');
      if (!video || video.readyState < 2 || !video.videoWidth) return;
      var now = Date.now();
      if (now - camLastFrame < 600) return;
      camLastFrame = now;
      var frame = camFrameToImageData(video, 1280);
      if (!frame) return;
      var decide = camShouldFullDecode(camFullChainTick, camFindMode ? 1 : CAM_FULL_CHAIN_INTERVAL);
      camFullChainTick = decide.tickCount;
      if (decide.run) {
        camAutoDecode(frame); // full chain (jsQR + 3 config + majority) — nhận cả NV lạ
        return;
      }
      camDecoding = true;
      // jsQR trước (QR code — rẻ); rồi fast path Quagga 1 config
      if (window.jsQR) {
        try {
          var qr = window.jsQR(frame.data.data, frame.w, frame.h);
          if (qr && qr.data) { camDecoding = false; onCameraDecoded(qr.data); return; }
        } catch (err) { /* tiếp tục fast path */ }
      }
      camFastDecode(frame, function (code) {
        camDecoding = false;
        if (code) onCameraDecoded(code);
      });
    }, 300);
  }

  function stopCameraDecodeLoop() {
    if (camRaf) { cancelAnimationFrame(camRaf); camRaf = null; }
    if (camTimer) { clearInterval(camTimer); camTimer = null; }
    camDetector = null;
    camDecoding = false;
    camFullChainTick = 0;     // reset đếm tick khi dừng/khởi động lại loop
  }

  function camFrameToImageData(video, maxSide) {
    try {
      var w = video.videoWidth || 0;
      var h = video.videoHeight || 0;
      if (!w || !h) return null;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, cw, ch);
      var imageData = ctx.getImageData(0, 0, cw, ch);
      return { data: imageData, w: cw, h: ch, canvas: canvas };
    } catch (e) { return null; }
  }

  // "🔍 Tìm Mã" (2026-08-16, cạnh nút Đóng): bấm để camera lấy nét + tìm mã nhanh hơn.
  // - Ép focus liên tục qua applyConstraints({ focusMode: 'continuous' }) — Android
  //   Chrome/iOS 17+ hỗ trợ; trình duyệt không hỗ trợ → bỏ qua im lặng (iOS Safari
  //   không expose focus control qua web API, nhưng nhịp decode nhanh hơn vẫn giúp).
  // - Tăng nhịp decode: full chain (1280px + jsQR + 3 config Quagga) chạy MỖI tick thay
  //   vì mỗi 2 tick (camShouldFullDecode interval=1 — đã có test) → đưa mã vào khung là
  //   nhận nhanh hơn. Bấm lần nữa (hoặc nhận được mã / đóng modal) → tự tắt.
  function toggleCamFind() {
    camFindMode = !camFindMode;
    var btn = document.getElementById('camFindBtn');
    if (btn) {
      btn.classList.toggle('active', camFindMode);
      btn.textContent = camFindMode ? '🔍 Tìm Mã…' : '🔍 Tìm Mã';
    }
    if (camFindMode) {
      camFullChainTick = 0; // full chain chạy NGAY tick tiếp theo
      if (camStream) {
        try {
          var track = camStream.getVideoTracks && camStream.getVideoTracks()[0];
          if (track && track.applyConstraints) {
            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
          }
        } catch (e) { /* không hỗ trợ focus control — bỏ qua */ }
      }
      var statusEl = document.getElementById('camStatusLive');
      if (statusEl) statusEl.textContent = '🔍 Đang tìm mã — giữ yên camera';
    }
  }

  // Reset trạng thái + UI nút Tìm Mã (đóng modal / nhận được mã) — không reset camStream
  // (người gọi tự xử lý).
  function resetCamFindUi() {
    camFindMode = false;
    var btn = document.getElementById('camFindBtn');
    if (btn) { btn.classList.remove('active'); btn.textContent = '🔍 Tìm Mã'; }
  }

  function closeCameraModal() {
    stopCameraDecodeLoop();
    stopOcrLoop();
    camOcrQueue = [];
    camOcrBusy = false;
    if (camStream) {
      camStream.getTracks().forEach(function (t) { t.stop(); });
      camStream = null;
    }
    camSnapping = false;
    resetCamFindUi();
    var video = document.getElementById('camVideo');
    if (video) { video.srcObject = null; }
    var modal = document.getElementById('cameraModal');
    if (modal) { modal.style.display = 'none'; modal.setAttribute('aria-hidden', 'true'); }
    if (camScanMode) { try { window.close(); } catch (e) {} }
  }

  // 📸 Chụp frame hiện tại rồi decode tĩnh (fallback khi live không bắt được)
  function snapCameraFrame() {
    var video = document.getElementById('camVideo');
    if (!video || !video.videoWidth) {
      camStatus('Camera chưa sẵn sàng — chờ vài giây rồi thử lại', true);
      return;
    }
    if (camSnapping) return;
    camSnapping = true;
    camDecoding = true;
    var frame = camFrameToImageData(video, 1280);
    if (!frame) { camSnapping = false; camDecoding = false; camStatus('Không đọc được khung hình — thử lại', true); return; }
    decodeCameraImageData(frame.data, frame.w, frame.h, frame.canvas, false, true, null);
  }

  // ===== AUTO-DECODE: chạy ĐÚNG chain nút "📸 Chụp" theo nhịp cố định =====
  // PURE: quyết định tick này có chạy full-chain decode không (không chạm DOM — test
  // được trong Node, xem tests/camera-autosnap.test.js). Trả { run, tickCount }:
  // run=true khi đủ CAM_FULL_CHAIN_INTERVAL tick frame đã qua (nhịp cố định, không
  // phụ thuộc độ rung — motion gate cũ quá nhạy, bug 2026-08-12).
  function camShouldFullDecode(tickCount, interval) {
    if (tickCount + 1 >= interval) return { run: true, tickCount: 0 };
    return { run: false, tickCount: tickCount + 1 };
  }

  // FAST PATH (2026-08-16 tối ưu): 1 config Quagga mạnh nhất (full-res + x-large), format
  // đã lọc — NHẬN MỌI MÃ DẠNG "Ops…" (OPS + 3..9 số), KỂ CẢ CHƯA CÓ TRONG StaffData (Dư),
  // để done NGAY tick đầu không chờ 3 config. NV đã biết → khớp STAFF_INFO (nguồn chuẩn,
  // cắt đúng checksum dư); NV lạ → ưu tiên cắt 1 ký tự cuối (quirk +1 chiếm đa số — full
  // chain majority trước giờ cũng nhận +1 cho NV lạ, deterministic, không khá hơn).
  var CAM_FAST_QUAGGA_CONFIG = { patchSize: 'x-large', halfSample: false };

  // PURE — chọn mã từ 1 kết quả Quagga (fast path). Trả mã hợp lệ hoặc null:
  // - Khớp NV đã biết → trả mã chính xác (normalizeQuaggaCode128 dùng STAFF_INFO cắt checksum).
  // - NV lạ: FNC1 cuối bị bỏ; thử raw / cắt 1 / cắt 2 ký tự cuối còn đúng dạng Ops + 3..9 số
  //   → ưu tiên CẮT 1 (quirk +1 chiếm đa số), rồi raw (checksum là special code — hiếm),
  //   rồi cắt 2 (quirk +2 rất hiếm).
  function camFastPickCode(raw) {
    var s = String(raw || '').trim();
    if (!s) return null;
    while (s.length && s.charCodeAt(s.length - 1) === 29) s = s.slice(0, -1); // FNC1 (GS1) cuối
    if (!s) return null;
    var knownNorm = normalizeQuaggaCode128(s, camKnownStaffCode);
    if (camKnownStaffCode(knownNorm)) return knownNorm; // NV đã biết — nguồn chuẩn
    var c0 = normalizeOpsCode(knownNorm);
    var c1 = knownNorm.length > 4 ? normalizeOpsCode(knownNorm.slice(0, -1)) : null;
    var c2 = knownNorm.length > 5 ? normalizeOpsCode(knownNorm.slice(0, -2)) : null;
    return c1 || c0 || c2;
  }

  function camFastDecode(frame, onCode) {
    if (!window.Quagga) { onCode(null); return; }
    try {
      var src = frame.canvas.toDataURL('image/jpeg', 0.92);
      window.Quagga.decodeSingle({
        src: src,
        numOfWorkers: 0,
        inputStream: { size: 1280 },
        locator: CAM_FAST_QUAGGA_CONFIG,
        decoder: { readers: CAM_QUAGGA_READERS }
      }, function (result) {
        var code = result && result.codeResult && result.codeResult.code;
        var format = result && result.codeResult && result.codeResult.format;
        var clean = null;
        if (code && camQuaggaResultAllowed({ code: String(code).trim(), format: format })) {
          clean = String(code).trim();
        }
        onCode(clean ? camFastPickCode(clean) : null);
      });
    } catch (e) { onCode(null); }
  }

  // Chụp frame 1280px + decode chain đầy đủ (jsQR + 3 config Quagga) — y hệt nút
  // "📸 Chụp" nhưng TỰ ĐỘNG theo nhịp; fail im lặng để loop live tiếp tục.
  // optionalFrame: truyền frame đã chụp sẵn ở tick (tối ưu 2026-08-16 — không chụp 2 lần).
  function camAutoDecode(optionalFrame) {
    if (camSnapping || camDecoding) return;
    camSnapping = true;
    camDecoding = true;
    var statusEl = document.getElementById('camStatusLive');
    if (statusEl) statusEl.textContent = '📷 Đang nhận diện mã…';
    var frame = optionalFrame;
    if (!frame) {
      var video = document.getElementById('camVideo');
      if (!video || !video.videoWidth) { camSnapping = false; camDecoding = false; return; }
      frame = camFrameToImageData(video, 1280);
      if (!frame) { camSnapping = false; camDecoding = false; return; }
    }
    decodeCameraImageData(frame.data, frame.w, frame.h, frame.canvas, true, true, function () {
      camSnapping = false;
      var st = document.getElementById('camStatusLive');
      if (st) st.textContent = 'Đưa mã vào khung, giữ yên — tự nhận diện';
    });
  }

  // 🖼 Chụp ảnh qua camera native (input capture) — fallback khi popup bị chặn
  function pickCameraImage() {
    var fileEl = document.getElementById('camFile');
    if (!fileEl) return;
    camStatus('📷 Chụp ảnh mã — đưa mã vào khung rồi chụp');
    fileEl.value = '';
    fileEl.click();
  }

  function onCamFileChange(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    closeCameraModal();
    decodeCameraImage(file);
  }

  function camStatus(msg, isError) {
    var modal = document.getElementById('cameraModal');
    if (modal && modal.style.display === 'flex') {
      var statusEl = document.getElementById('camStatusLive');
      if (statusEl) {
        statusEl.textContent = msg;
        statusEl.style.color = isError ? 'var(--danger)' : 'var(--muted)';
        return;
      }
    }
    var card = document.getElementById('scanCard');
    if (!card) return;
    card.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'sc-empty';
    if (isError) div.style.color = 'var(--danger)';
    div.textContent = msg;
    card.appendChild(div);
  }

  function camFail(msg) {
    camDecoding = false;
    camSnapping = false;
    camStatus(msg, true);
  }

  // ===== DECODE (dùng chung: ảnh chụp + live frame) =====
  // Ảnh chụp → decode ở NHIỀU kích thước + nhiều cấu hình locator.
  // quiet = true → fail không hiện thông báo (live loop tự tiếp tục).
  function decodeCameraImage(file) {
    if (camDecoding) return;
    camDecoding = true;
    camStatus('📷 Đang nhận diện mã…');
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try { URL.revokeObjectURL(url); } catch (err) {}
      var w = img.naturalWidth || 0;
      var h = img.naturalHeight || 0;
      if (!w || !h) { camFail('Không đọc được ảnh — thử lại'); return; }
      decodeImageMultiScale(img, w, h);
    };
    img.onerror = function () {
      try { URL.revokeObjectURL(url); } catch (err) {}
      camFail('Không đọc được ảnh — thử lại');
    };
    img.src = url;
  }

  function decodeImageMultiScale(img, w, h) {
    var maxSide = Math.max(w, h);
    var scales = [];
    var seen = {};
    function add(s) {
      if (s > 1) s = 1;
      var key = s.toFixed(4);
      if (!seen[key]) { seen[key] = true; scales.push(s); }
    }
    add(1);                // ảnh gốc — BarcodeDetector đọc tốt nhất
    add(1280 / maxSide);   // 1280px
    add(800 / maxSide);    // 800px — Quagga nhận diện nhanh/nét hơn
    scales.sort(function (a, b) { return b - a; });
    decodeScaleStep(img, w, h, scales, 0);
  }

  function decodeScaleStep(img, w, h, scales, idx) {
    if (idx >= scales.length) {
      camDecoding = false;
      camSnapping = false;
      ocrPhotoFallback(img, w, h); // mã vạch mờ → thử đọc chữ Ops… (2026-08-16)
      return;
    }
    var scale = scales[idx];
    var cw = Math.max(1, Math.round(w * scale));
    var ch = Math.max(1, Math.round(h * scale));
    var canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, cw, ch);
    var imageData;
    try { imageData = ctx.getImageData(0, 0, cw, ch); } catch (e) {
      decodeScaleStep(img, w, h, scales, idx + 1);
      return;
    }
    // BarcodeDetector trên canvas ở scale này
    if (window.BarcodeDetector) {
      try {
        var detector = new window.BarcodeDetector({ formats: CAM_FORMATS });
        detector.detect(canvas).then(function (results) {
          if (results && results.length && results[0].rawValue) {
            onCameraDecoded(results[0].rawValue);
          } else {
            decodeFallbackChain(imageData, cw, ch, function () { decodeScaleStep(img, w, h, scales, idx + 1); });
          }
        }).catch(function () {
          decodeFallbackChain(imageData, cw, ch, function () { decodeScaleStep(img, w, h, scales, idx + 1); });
        });
        return;
      } catch (err) { /* không khởi tạo được → chain */ }
    }
    decodeFallbackChain(imageData, cw, ch, function () { decodeScaleStep(img, w, h, scales, idx + 1); });
  }

  function decodeFallbackChain(imageData, w, h, onDone) {
    // jsQR — QR code
    if (window.jsQR) {
      try {
        var qr = window.jsQR(imageData.data, w, h);
        if (qr && qr.data) { onCameraDecoded(qr.data); return; }
      } catch (err) { /* tiếp tục */ }
    }
    // Quagga — barcode vạch 1D (Code128/Code39/EAN…): chạy HẾT các config rồi CHỈ nhận
    // mã được ≥2 config đồng thuận (sau normalize) — chống đọc SAI (bug 2026-08-16, xem
    // normalizeQuaggaCode128/camPickQuaggaMajority bên dưới).
    if (window.Quagga) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').putImageData(imageData, 0, 0);
        var src = canvas.toDataURL('image/jpeg', 0.92);
        runQuaggaConfigs(src, CAM_QUAGGA_CONFIGS, 0, [], function (results) {
          var agree = camPickQuaggaMajority(results, camKnownStaffCode, 2);
          if (agree) { onCameraDecoded(agree); return; }
          onDone();
        });
        return;
      } catch (err) { /* tiếp tục */ }
    }
    onDone();
  }

  // quiet=true → fail im lặng (live loop tiếp tục); fullChain=true → decode đủ 3 config
  // Quagga như nút Chụp (auto-snap/snap); onFail → callback sau khi fail (reset cờ auto-snap).
  function decodeCameraImageData(imageData, w, h, canvas, quiet, fullChain, onFail) {
    // 1) BarcodeDetector — native Chrome/Edge/Android (QR + vạch 1D)
    if (window.BarcodeDetector) {
      try {
        var detector = new window.BarcodeDetector({ formats: CAM_FORMATS });
        detector.detect(canvas).then(function (results) {
          if (results && results.length && results[0].rawValue) {
            onCameraDecoded(results[0].rawValue);
          } else {
            decodeCameraFallback(imageData, w, h, quiet, fullChain, onFail);
          }
        }).catch(function () { decodeCameraFallback(imageData, w, h, quiet, fullChain, onFail); });
        return;
      } catch (err) { /* BarcodeDetector tồn tại nhưng không khởi tạo được → fallback */ }
    }
    decodeCameraFallback(imageData, w, h, quiet, fullChain, onFail);
  }

  function decodeCameraFallback(imageData, w, h, quiet, fullChain, onFail) {
    // 2) jsQR — QR code (iOS Safari / trình duyệt không có BarcodeDetector)
    if (window.jsQR) {
      try {
        var qr = window.jsQR(imageData.data, w, h);
        if (qr && qr.data) { onCameraDecoded(qr.data); return; }
      } catch (err) { /* tiếp tục fallback */ }
    }
    // 3) Quagga — barcode vạch 1D (Code128/Code39/EAN…) — fallback iOS
    var onDone = quiet
      ? function () { camDecoding = false; if (onFail) onFail(); }   // im lặng: loop tiếp tục
      : function () { camFail('Không nhận diện được mã — chụp lại gần hơn, đủ sáng, thẳng góc'); };
    if (window.Quagga && fullChain) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').putImageData(imageData, 0, 0);
        var src = canvas.toDataURL('image/jpeg', 0.92);
        // Chỉ chạy Quagga ở full chain (auto-snap/snap/ảnh) + ≥2 config đồng thuận.
        // FAST PATH (tick live 800px + halfSample) KHÔNG chạy Quagga nữa — config yếu đó
        // từng nhận NHẦM mã (bug 2026-08-16); tick live chỉ bắt bằng BarcodeDetector/jsQR,
        // mã vạch 1D do full chain (mỗi 2 tick) xử lý với đồng thuận.
        runQuaggaConfigs(src, CAM_QUAGGA_CONFIGS, 0, [], function (results) {
          var agree = camPickQuaggaMajority(results, camKnownStaffCode, 2);
          if (agree) { onCameraDecoded(agree); return; }
          onDone();
        });
        return;
      } catch (err) { /* tiếp tục xuống fail */ }
    }
    onDone();
  }

  // ===== CODE128 NORMALIZE + ĐỒNG THUẬN (PURE — test được trên Node: tests/camera-code128.test.js) =====
  // Vì sao cần (bug 2026-08-16 — camera nhận mã vạch nhưng SAI, user test trên iPhone):
  // Quagga vendored (lib-quagga.html, upstream 2016) code_128_reader có 2 quirk làm sai mã:
  //   1) checksum symbol ở CODE_C (mã SỐ) là symbol 2 ký tự (00-99) nhưng decode() chỉ
  //      v.splice(v.length-1, 1) → output CÒN THỪA 1 digit checksum.
  //   2) codeset kết thúc bằng special code (FNC1/switch) → checksum char KHÔNG bị bỏ →
  //      output kèm cả checksum char (thừa 1 ký tự).
  // Mã quét là mã NV (staffId, prefix Ops) → dùng STAFF_INFO (js.html, global — file này
  // load trước js.html nhưng hàm chỉ gọi lúc runtime) làm nguồn chuẩn: raw không khớp NV
  // nào mà bỏ 1 (hoặc 2) ký tự cuối khớp đúng 1 NV → cắt. Không khớp → giữ nguyên (NV
  // lạ / Dư vẫn quét được — không phá mã thật).
  function camKnownStaffCode(code) {
    var q = String(code || '').trim().toUpperCase();
    if (!q) return false;
    try { return !!(typeof STAFF_INFO !== 'undefined' && STAFF_INFO[q]); } catch (e) { return false; }
  }

  function normalizeQuaggaCode128(raw, isKnownCode) {
    var s = String(raw || '').trim();
    if (!s) return s;
    // FNC1 (chr 29) cuối không thuộc mã NV (GS1-128) — bỏ trước khi check
    while (s.length && s.charCodeAt(s.length - 1) === 29) s = s.slice(0, -1);
    if (!s) return s;
    if (isKnownCode(s)) return s;
    var candidates = [];
    if (s.length >= 2) candidates.push(s.slice(0, -1));   // thừa 1 digit (quirk #1/#2)
    if (s.length >= 3) candidates.push(s.slice(0, -2));   // thừa nguyên checksum 2 ký tự
    for (var i = 0; i < candidates.length; i++) {
      if (isKnownCode(candidates[i])) return candidates[i];
    }
    return s;
  }

  // Chỉ nhận mã được ≥ minAgree (mặc định 2) config cho CÙNG kết quả (sau normalize) —
  // misread ngẫu nhiên của từng config không trùng nhau → bị loại. Trả null nếu không đủ.
  function camPickQuaggaMajority(results, isKnownCode, minAgree) {
    var min = minAgree == null ? 2 : minAgree;
    if (!results || !results.length) return null;
    var counts = {};
    results.forEach(function (raw) {
      var key = normalizeQuaggaCode128(raw, isKnownCode);
      if (!key) return;
      counts[key] = (counts[key] || 0) + 1;
    });
    var best = null, bestN = 0;
    Object.keys(counts).forEach(function (key) {
      if (counts[key] > bestN) { bestN = counts[key]; best = key; }
    });
    return bestN >= min ? best : null;
  }
  // ===== CODE128 NORMALIZE + ĐỒNG THUẬN — END =====

  // ===== LỌC KẾT QUẢ QUAGGA THEO FORMAT (2026-08-16, tiếp nối fix độ chính xác) =====
  // Mã NV dạng 'Ops…' có CHỮ → reader SỐ THUẦN (EAN/UPC/i2of5) KHÔNG BAO GIỜ decode đúng
  // mã NV. Nhưng chúng vẫn chạy chung (CAM_QUAGGA_READERS) và misread của chúng DETERMINISTIC
  // (cùng ảnh + cùng reader → cùng chuỗi số trên MỌI config) → lọt qua cổng đồng thuận ≥2
  // config → vẫn submit mã SAI (bug 2026-08-16 — camera nhận được mã nhưng sai, còn sót sau
  // cổng majority). Loại kết quả numeric-only ngay tại nguồn.
  var CAM_QUAGGA_NUMERIC_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'i2of5', '2of5'];

  // PURE — test được trên Node (tests/camera-code128.test.js). r = { code, format }.
  // Không có format (reader lạ/thiếu dữ liệu) → cho qua, không chặn nhầm.
  function camQuaggaResultAllowed(r) {
    if (!r || !r.code) return false;
    var fmt = String(r.format || '').toLowerCase();
    if (!fmt) return true;
    return CAM_QUAGGA_NUMERIC_FORMATS.indexOf(fmt) === -1;
  }

  var CAM_QUAGGA_CONFIGS = [
    // Full-res trước (Code128 dày đọc chuẩn hơn — halfSample gộp vạch dễ SAI), patch
    // medium thứ 2 (mã nhỏ), halfSample cuối (ảnh mờ/lớn). Thứ tự chỉ ảnh hưởng tốc độ
    // đạt đồng thuận — kết quả luôn qua camPickQuaggaMajority (≥2 config giống nhau).
    { patchSize: 'x-large', halfSample: false },
    { patchSize: 'medium', halfSample: false },
    { patchSize: 'x-large', halfSample: true }
  ];

  // Chạy HẾT các config, gom kết quả thô vào results[] rồi onDone(results) — người gọi
  // quyết định nhận/loại (camPickQuaggaMajority). inputStream.size 1280 (không hạ xuống
  // 800 như cũ — vạch Code128 dày bị gộp ở 800px dễ đọc SAI).
  function runQuaggaConfigs(src, configs, idx, results, onDone) {
    if (idx >= configs.length) {
      if (onDone) onDone(results || []);
      return;
    }
    var cfg = configs[idx];
    window.Quagga.decodeSingle({
      src: src,
      numOfWorkers: 0,
      inputStream: { size: 1280 },
      locator: cfg,
      decoder: { readers: CAM_QUAGGA_READERS }
    }, function (result) {
      var code = result && result.codeResult && result.codeResult.code;
      var format = result && result.codeResult && result.codeResult.format;
      // Chỉ nhận format có thể chứa chữ (code_128/code_39/code_93/codabar…) — bỏ
      // EAN/UPC/i2of5 numeric-only (misread deterministic lọt cổng majority, bug 2026-08-16).
      if (code && camQuaggaResultAllowed({ code: String(code).trim(), format: format })) {
        results.push(String(code).trim());
      }
      runQuaggaConfigs(src, configs, idx + 1, results, onDone);
    });
  }

  // ===== OCR-SCAN-START (2026-08-16): đọc chữ "Ops…" khi mã vạch mờ =====
  // Thẻ NV in mã vạch Code128 + kèm dòng chữ "Ops…" (vd Ops7562, Ops158392) ngay trên/dưới
  // vạch kẻ. Khi vạch quá mờ camera không decode được → OCR đọc dòng chữ. CHẠY SONG SONG
  // với decode barcode (timer riêng, không chặn nhau) — cái nào phát hiện trước → done.
  //
  // Thư viện: Tesseract.js v5 tải TỪ CDN lúc runtime (script tag) — KHÔNG vendor được vì
  // core wasm + eng.traineddata > 500KB giới hạn file GAS. GAS HtmlService cho phép active
  // content HTTPS ngoài; jsDelivr có CORS; worker v5 load qua Blob URL (workerBlobURL mặc
  // định true) nên cross-origin OK. Lỗi load/không có mạng → im lặng tắt OCR, barcode vẫn
  // chạy bình thường (fail-open an toàn).
  var OCR_SCRIPT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  var OCR_WORKER_PATH = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js';
  var OCR_CORE_PATH = 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5';
  var OCR_LANG_PATH = 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0';
  var CAM_OCR_INTERVAL_MS = 2000;   // nhịp quét OCR song song (không chặn decode barcode)
  var CAM_OCR_MIN_CONFIDENCE = 70;  // NV lạ cần confidence >= mức này; NV khớp STAFF_INFO nhận luôn
  var camOcrEnabled = false;   // đã load xong script Tesseract
  var camOcrLoading = false;   // đang load script (chống load lặp)
  var camOcrLoadFailed = false;// load fail → bỏ OCR cả phiên (không làm chậm quét)
  var camOcrWorker = null;     // worker tái dùng trong cả phiên
  var camOcrBusy = false;      // đang có 1 OCR chạy
  var camOcrQueue = [];        // frame chờ khi busy (photo fallback đợi live OCR xong)
  var camOcrTimer = null;      // timer quét OCR song song

  // PURE — chuẩn hóa chuỗi OCR → mã 'OPS…' (test được trên Node).
  // OCR hay nhầm: chữ O ↔ số 0, p ↔ b, dính khoảng trắng/colon/gạch. Chỉ chấp nhận dạng
  // Ops + 3..9 chữ số (mã NV thật — Ops7562, Ops158392…); trả null nếu không phải.
  function normalizeOpsCode(raw) {
    var s = String(raw || '').replace(/\s+/g, '').replace(/[:：\-]/g, '').toUpperCase();
    if (/^0PS/.test(s)) s = 'OPS' + s.slice(3); // O → 0
    if (/^OBS/.test(s)) s = 'OPS' + s.slice(3); // p → b
    if (!/^OPS\d{3,9}$/.test(s)) return null;
    return s;
  }

  // PURE — tách mã "Ops…" từ kết quả OCR (text + words có confidence riêng).
  // Ưu tiên: (1) candidate khớp NV đã biết (STAFF_INFO = nguồn chuẩn, nhận luôn kể cả
  // confidence thấp); (2) candidate có confidence cao nhất >= minConfidenceUnknown (NV lạ/Dư
  // — tránh nhận nhầm chữ "Ops" trên bảng/hình nền). Trả { code, confidence } hoặc null.
  function pickOpsCandidate(text, words, isKnownCode, minConfidenceUnknown) {
    var min = minConfidenceUnknown == null ? CAM_OCR_MIN_CONFIDENCE : minConfidenceUnknown;
    var candidates = [];
    function add(raw, conf) {
      var code = normalizeOpsCode(raw);
      if (!code) return;
      for (var i = 0; i < candidates.length; i++) {
        if (candidates[i].code === code) {
          if (conf > candidates[i].confidence) candidates[i].confidence = conf;
          return;
        }
      }
      candidates.push({ code: code, confidence: conf });
    }
    if (words && words.length) {
      for (var i = 0; i < words.length; i++) {
        var w = words[i] || {};
        add(w.text, Number(w.confidence) || 0);
      }
    }
    // Fallback regex trên text thô — OCR dính chữ/số thành 1 token
    if (text) {
      var re = /(?:^|[^A-Za-z0-9])([O0][PpBb]s)\s*[:：\-]?\s*(\d{3,9})(?![0-9])/gi;
      var m;
      while ((m = re.exec(text)) !== null) {
        add(m[1] + m[2], 60); // không có per-word confidence → ước lượng trung bình
        if (re.lastIndex === m.index) re.lastIndex++;
      }
    }
    if (!candidates.length) return null;
    var known = [], unknown = [];
    candidates.forEach(function (c) {
      if (isKnownCode && isKnownCode(c.code)) known.push(c);
      else unknown.push(c);
    });
    var pool = known.length ? known : unknown;
    pool.sort(function (a, b) { return b.confidence - a.confidence; });
    var best = pool[0];
    if (known.length) return best;          // khớp NV đã biết → nhận (nguồn chuẩn)
    if (best.confidence >= min) return best; // NV lạ → cần confidence đủ cao
    return null;
  }

  // Load script Tesseract từ CDN (1 lần mỗi phiên; fail → tắt OCR im lặng)
  function ensureOcrLib(cb) {
    if (camOcrEnabled || camOcrLoadFailed || camOcrLoading) { if (cb) cb(); return; }
    if (typeof window.Tesseract !== 'undefined') {
      camOcrEnabled = true;
      initOcrWorker();
      if (cb) cb();
      return;
    }
    camOcrLoading = true;
    var head = null;
    try { head = document.head || document.getElementsByTagName('head')[0] || document.documentElement; } catch (e) { head = null; }
    var s = document.createElement('script');
    s.src = OCR_SCRIPT_URL;
    s.async = true;
    s.onload = function () {
      camOcrLoading = false;
      if (typeof window.Tesseract !== 'undefined') { camOcrEnabled = true; initOcrWorker(); }
      else camOcrLoadFailed = true;
      if (cb) cb();
    };
    s.onerror = function () {
      camOcrLoading = false;
      camOcrLoadFailed = true;
      if (cb) cb();
    };
    if (head) head.appendChild(s);
    else { camOcrLoading = false; camOcrLoadFailed = true; if (cb) cb(); }
  }

  // Khởi tạo worker (tải core wasm + eng.traineddata lần đầu) — tái dùng cho cả phiên
  function initOcrWorker() {
    if (camOcrWorker || typeof window.Tesseract === 'undefined') return;
    try {
      window.Tesseract.createWorker('eng', 1, {
        workerPath: OCR_WORKER_PATH,
        corePath: OCR_CORE_PATH,
        langPath: OCR_LANG_PATH
      }).then(function (w) {
        camOcrWorker = w;
        var statusEl = document.getElementById('camStatusLive');
        if (statusEl) statusEl.textContent = '📷 Đưa mã vào khung — tự nhận diện (vạch + chữ Ops)';
      }).catch(function () { camOcrWorker = null; });
    } catch (e) { camOcrWorker = null; }
  }

  // OCR 1 frame (canvas) → cb(code | null). Busy → xếp hàng (frame cũ chờ OCR đang chạy xong).
  function camOcrFrame(canvas, cb) {
    if (!camOcrEnabled || !camOcrWorker) { if (cb) cb(null); return; }
    if (camOcrBusy) { camOcrQueue.push({ canvas: canvas, cb: cb }); return; }
    camOcrBusy = true;
    try {
      camOcrWorker.recognize(canvas).then(function (res) {
        camOcrBusy = false;
        var code = null;
        try {
          var hit = pickOpsCandidate(
            res && res.data && res.data.text,
            res && res.data && res.data.words,
            camKnownStaffCode,
            CAM_OCR_MIN_CONFIDENCE
          );
          if (hit) code = hit.code;
        } catch (e2) { code = null; }
        if (cb) cb(code);
        drainOcrQueue();
      }).catch(function () {
        camOcrBusy = false;
        if (cb) cb(null);
        drainOcrQueue();
      });
    } catch (e) {
      camOcrBusy = false;
      if (cb) cb(null);
      drainOcrQueue();
    }
  }

  function drainOcrQueue() {
    if (camOcrBusy || !camOcrQueue.length) return;
    var next = camOcrQueue.shift();
    camOcrFrame(next.canvas, next.cb);
  }

  // Timer song song: mỗi CAM_OCR_INTERVAL_MS chụp frame 800px → OCR chữ Ops…
  // KHÔNG chặn decode barcode (khác cờ busy) — cái nào ra trước thì done.
  function startOcrLoop() {
    stopOcrLoop();
    if (camOcrLoadFailed) return;
    var statusEl = document.getElementById('camStatusLive');
    if (!camOcrEnabled && !camOcrLoading && statusEl) {
      statusEl.textContent = '📷 Đang tải nhận diện chữ Ops… (lần đầu hơi lâu)';
    }
    ensureOcrLib(function () {
      if (camOcrEnabled) {
        camOcrTimer = setInterval(function () { ocrTick(); }, CAM_OCR_INTERVAL_MS);
      }
    });
  }

  // Cắt ĐÚNG vùng khung dẫn hướng (.camera-frame — inset 9% ngang, 12% dọc) + xám hóa
  // → OCR ít pixel hơn + ít nhiễu nền → nhận diện chữ Ops… NHANH hơn (2026-08-16 tối ưu).
  function camOcrPrepareFrame(video) {
    try {
      var vw = video.videoWidth || 0;
      var vh = video.videoHeight || 0;
      if (!vw || !vh) return null;
      var x = Math.round(vw * 0.09), y = Math.round(vh * 0.12);
      var w = Math.max(1, Math.round(vw * 0.82)), h = Math.max(1, Math.round(vh * 0.76));
      var scale = Math.min(1, 800 / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement("canvas");
      canvas.width = cw;
      canvas.height = ch;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(video, x, y, w, h, 0, 0, cw, ch);
      // xám hóa nhẹ — OCR nhanh hơn trên ảnh xám
      try {
        var img = ctx.getImageData(0, 0, cw, ch);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
          var g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
          d[i] = g; d[i + 1] = g; d[i + 2] = g;
        }
        ctx.putImageData(img, 0, 0);
      } catch (e2) { /* không xám được → giữ màu */ }
      return canvas;
    } catch (e) { return null; }
  }

  function stopOcrLoop() {
    if (camOcrTimer) { clearInterval(camOcrTimer); camOcrTimer = null; }
  }

  function ocrTick() {
    if (!camStream || camOcrBusy) return;
    var video = document.getElementById('camVideo');
    if (!video || video.readyState < 2 || !video.videoWidth) return;
    var canvas = camOcrPrepareFrame(video);
    if (!canvas) return;
    camOcrFrame(canvas, function (code) {
      if (code && camStream) onCameraDecoded(code); // camera còn mở mới nhận (đã đóng → bỏ qua)
    });
  }

  // OCR fallback cho ảnh chụp (nút 🖼/camera native): mọi scale decode barcode fail → thử đọc chữ
  function ocrPhotoFallback(img, w, h) {
    var showFail = function () {
      camStatus('Không nhận diện được mã — chụp lại gần hơn, đủ sáng, thẳng góc', true);
    };
    if (!camOcrEnabled || !camOcrWorker) { showFail(); return; }
    var maxSide = Math.max(w || 0, h || 0);
    var scale = maxSide ? Math.min(1, 800 / maxSide) : 1;
    var cw = Math.max(1, Math.round((w || 0) * scale));
    var ch = Math.max(1, Math.round((h || 0) * scale));
    var canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    try { canvas.getContext('2d').drawImage(img, 0, 0, cw, ch); } catch (e) { showFail(); return; }
    camStatus('🔍 Mã vạch mờ — đang thử nhận diện chữ Ops…', false);
    camOcrFrame(canvas, function (code) {
      if (code) onCameraDecoded(code);
      else showFail();
    });
  }
  // ===== OCR-SCAN-END =====

  function onCameraDecoded(code) {
    stopCameraDecodeLoop();
    stopOcrLoop();
    camOcrQueue = [];
    camOcrBusy = false;
    if (camStream) {
      camStream.getTracks().forEach(function (t) { t.stop(); });
      camStream = null;
    }
    camSnapping = false;
    camDecoding = false;
    camPopupBusy = false; // popup đã gửi kết quả → mở popup mới được ở lần sau
    camPopupRef = null;
    camFullChainTick = 0; // nhận được mã → reset đếm tick (lần mở sau quét lại từ đầu)
    resetCamFindUi(); // nhận được mã → tắt chế độ Tìm Mã (nút về trạng thái thường)
    var clean = String(code || '').trim();
    if (camScanMode) {
      // TAB QUÉT RIÊNG: gửi kết quả về trang gốc rồi đóng tab
      try {
        localStorage.setItem('rcScanResult', JSON.stringify({ token: camScanToken, code: clean, ts: Date.now() }));
      } catch (e) {}
      try {
        if (window.opener) window.opener.postMessage({ type: 'rcScanResult', code: clean }, '*');
      } catch (e) {}
      var statusEl = document.getElementById('camStatusLive');
      if (statusEl) statusEl.textContent = '✅ Đã nhận mã: ' + clean + ' — tự đóng tab này';
      setTimeout(function () {
        closeCameraModal(); // đóng camera + window.close()
      }, 1200);
      return;
    }
    var modal = document.getElementById('cameraModal');
    if (modal) { modal.style.display = 'none'; modal.setAttribute('aria-hidden', 'true'); }
    var video = document.getElementById('camVideo');
    if (video) { video.srcObject = null; }
    var input = document.getElementById('scanInput');
    if (!input) return;
    input.value = clean;
    submitScan(); // đúng luồng quét hiện tại (reconcile + meal-move Ra/Vào)
  }

  // ===== TAB QUÉT RIÊNG (?scan=1&tk=...): tự mở camera + quét LIVE =====
  // Tab này là trang top-level (mở bằng window.open/anchor từ GAS iframe) →
  // getUserMedia hoạt động → quét live liên tục như AppSheet, thấy mã là nhận.
  function initScanModeIfNeeded() {
    // Detect scan mode bằng CẢ location.search LẪN document.referrer: wrapper GAS nạp
    // app vào iframe có thể KHÔNG forward query (location.search rỗng) nhưng referrer
    // vẫn là URL tab quét (có scan=1&tk) — bug 2026-08-12 tab trắng/không vào scan mode.
    var scanDetected = location.search.indexOf('scan=1') !== -1
      || (document.referrer || '').indexOf('scan=1') !== -1;
    if (!scanDetected) return;
    camScanMode = true;
    // Cờ cho js.html (include sau file này): mock loader + DOMContentLoaded skip app init.
    // Cờ bền hơn location.search vì wrapper có thể không forward query vào URL app.
    try { window.__RC_SCAN_MODE__ = true; } catch (e) {}
    var m = location.search.match(/[?&]tk=([^&]+)/)
      || (document.referrer || '').match(/[?&]tk=([^&]+)/);
    camScanToken = m ? decodeURIComponent(m[1]) : '';
    try { document.body.classList.add('scan-mode'); } catch (e) {}
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    if (isIOS) {
      // iOS Safari: camera CHỈ bật khi có user gesture trong chính tab này →
      // hiện nút để chạm 1 lần, sau đó quét tự động
      showScanStartButton();
    } else {
      setTimeout(function () { startCameraLive(); }, 60);
    }
  }

  function showScanStartButton() {
    var modal = document.getElementById('cameraModal');
    if (modal) { modal.style.display = 'flex'; modal.setAttribute('aria-hidden', 'false'); }
    var sb = document.getElementById('camStartBtn');
    if (sb) sb.style.display = 'inline-flex';
    var statusEl = document.getElementById('camStatusLive');
    if (statusEl) { statusEl.textContent = '📷 Bấm nút để bật camera'; statusEl.style.color = ''; }
  }
  initScanModeIfNeeded();
  // ===== CAMERA-SCAN-END =====
</script>
