<script>
  // ===== CAMERA-SCAN-START: Quét mã bằng camera điện thoại (2026-08-11) =====
  // File riêng (camera-scan.html) — nhúng qua scriptlet include('camera-scan') NGAY
  // TRƯỚC include('js') trong index.html, nên các hàm ở đây định nghĩa trước khi
  // js.html chạy (wiring DOMContentLoaded ở js.html gọi onCamFileChange).
  //
  // CHẾ ĐỘ QUÉT: LIVE qua video stream (getUserMedia) — cách đúng của mọi app quét mã,
  // decode liên tục từng frame → bắt được frame nét, KHÔNG phụ thuộc 1 ảnh chụp duy nhất
  // (chụp tĩnh dễ mờ/nghiêng/chói → không nhận diện được mã vạch kẻ).
  //
  // Chuỗi nhận diện mã:
  //   1) BarcodeDetector — native Chrome/Edge/Android (QR + vạch 1D, nhanh nhất)
  //      → loop requestAnimationFrame trên <video> trực tiếp
  //   2) jsQR (lib-jsqr.html) — QR code — iOS Safari (KHÔNG có BarcodeDetector)
  //   3) Quagga (lib-quagga.html) — barcode vạch 1D (Code128/39/EAN/UPC/ITF…) — iOS
  //      → không có BarcodeDetector: interval vẽ frame → jsQR → Quagga.decodeSingle
  // Kết quả đưa thẳng vào scanInput rồi gọi submitScan() → chạy ĐÚNG luồng quét
  // hiện tại (reconcile lẫn meal-move Ra/Vào), KHÔNG đổi logic quét.
  //
  // Cách dùng: nút "📷 Quét camera" (#btnCamScan) → mở modal live camera (#cameraModal).
  // Fallback: nút 📸 Chụp (snap 1 frame) + nút 🖼 Chọn ảnh (file từ thư viện).
  var camDecoding = false;   // đang decode 1 frame (chống chồng lấn decode)
  var camSnapping = false;   // đang chụp/decode tĩnh (snap hoặc file)
  var camStream = null;      // MediaStream đang mở
  var camTimer = null;       // interval decode khi không có BarcodeDetector
  var camRaf = null;         // requestAnimationFrame khi có BarcodeDetector
  var camDetector = null;    // BarcodeDetector instance
  var camLastFrame = 0;      // chống decode trùng frame liên tiếp
  var camScanMode = false;   // đang ở TAB QUÉT RIÊNG (?scan=1) — tự quét, kết quả gửi về trang gốc
  var camScanToken = '';     // token định danh phiên quét (tránh nhận kết quả của phiên khác)
  var scanPollTimer = null;  // poll localStorage chờ kết quả từ tab quét
  var scanPollSince = 0;     // chỉ nhận kết quả mới hơn thời điểm mở tab
  var CAM_FORMATS = ['qr_code', 'code_128', 'code_39', 'code_93', 'codabar', 'ean_13', 'ean_8', 'itf', 'upc_a', 'upc_e'];
  var CAM_QUAGGA_READERS = ['code_128_reader', 'code_39_reader', 'ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader', 'i2of5_reader', 'code_93_reader', 'codabar_reader'];

  function openCameraScan() {
    var btn = document.getElementById('btnCamScan');
    if (btn && btn.disabled) return;
    if (CURRENT_TASK && CURRENT_TASK.status !== TASK_STATUS_C.OPEN) return;
    // GAS serve web app TRONG SANDBOXED IFRAME — getUserMedia bị chặn
    // (Permissions Policy: camera not allowed). Trong iframe → mở thẳng camera
    // native qua <input capture> (cách duy nhất hoạt động trên GAS).
    // Ngoài iframe (preview/hosting local) → live scan qua video stream.
    var inFrame = false;
    try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
    if (inFrame) {
      // GAS iframe chặn getUserMedia → mở TAB QUÉT RIÊNG (?scan=1): tab mới là
      // trang top-level nên camera chạy được, TỰ quét live như AppSheet — không
      // cần bấm chụp. Kết quả gửi về qua localStorage (cùng origin) + postMessage.
      var token = 'rc' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      var base = location.href.split('?')[0] || location.href;
      var scanUrl = base + (base.indexOf('?') === -1 ? '?' : '&') + 'scan=1&tk=' + encodeURIComponent(token);
      var opened = false;
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
      if (isIOS) {
        // iOS Safari chặn window.open() programmatic từ iframe (hiện prompt URL
        // "Open?") — dùng anchor click với user gesture trực tiếp, Safari mở thẳng.
        try {
          var a = document.createElement('a');
          a.href = scanUrl;
          a.target = '_blank';
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          opened = true; // iOS không cho biết chính xác — poll chờ kết quả
        } catch (e) { opened = false; }
      } else {
        try { opened = !!window.open(scanUrl, '_blank'); } catch (e) { opened = false; }
      }
      if (opened) {
        camStatus('📷 Đang mở camera quét… Nếu Safari hỏi, chọn Mở/Open');
        startScanResultPolling(token);
        return;
      }
      // popup bị chặn → fallback chụp ảnh native
      pickCameraImage();
    } else {
      startCameraLive();
    }
  }

  // ===== NHẬN KẾT QUẢ TỪ TAB QUÉT RIÊNG =====
  function startScanResultPolling(token) {
    stopScanResultPolling();
    scanPollSince = Date.now();
    // Nếu 8s chưa thấy kết quả (Safari chưa mở tab) → nhắc user bấm Mở/Open
    var hintTimer = setTimeout(function () {
      camStatus('Nếu camera chưa mở: bấm lại 📷 Quét Camera và chọn Mở/Open khi Safari hỏi', true);
    }, 8000);
    scanPollTimer = setInterval(function () {
      var data = null;
      try {
        var raw = localStorage.getItem('rcScanResult');
        if (raw) data = JSON.parse(raw);
      } catch (e) { data = null; }
      if (!data || !data.code) return;
      if (data.token !== token || data.ts < scanPollSince) return;
      try { localStorage.removeItem('rcScanResult'); } catch (e) {}
      stopScanResultPolling();
      onCameraDecoded(data.code); // điền mã + submitScan() — Done
    }, 400);
    scanPollTimer._hint = hintTimer;
  }

  function stopScanResultPolling() {
    if (scanPollTimer) {
      if (scanPollTimer._hint) { clearTimeout(scanPollTimer._hint); }
      clearInterval(scanPollTimer);
      scanPollTimer = null;
    }
  }

  // Nhận trực tiếp nếu popup có thể postMessage tới iframe này
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('message', function (ev) {
      if (ev.data && ev.data.type === 'rcScanResult' && ev.data.code) {
        onCameraDecoded(String(ev.data.code));
      }
    });
  }

  // ===== LIVE SCAN =====
  function startCameraLive() {
    var modal = document.getElementById('cameraModal');
    var video = document.getElementById('camVideo');
    var statusEl = document.getElementById('camStatusLive');
    if (!modal || !video) return;
    if (camStream) return; // đang mở rồi
    modal.style.display = 'flex';
    modal.setAttribute('aria-hidden', 'false');
    if (statusEl) statusEl.textContent = 'Đang mở camera…';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (statusEl) statusEl.textContent = 'Trình duyệt không hỗ trợ camera trực tiếp';
      camStatus('Trình duyệt không hỗ trợ camera trực tiếp — bấm 🖼 Chọn ảnh để chọn ảnh mã', true);
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(function (stream) {
        camStream = stream;
        video.srcObject = stream;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
        if (statusEl) statusEl.textContent = 'Đưa mã vào khung — tự nhận diện';
        var sb = document.getElementById('camStartBtn');
        if (sb) sb.style.display = 'none';
        startCameraDecodeLoop();
      })
      .catch(function () {
        if (camScanMode) {
          // Tab quét chưa có user gesture (iOS Safari bật camera trong TAB MỚI
          // không tự động được — chỉ khi user chạm) → hiện nút để chạm bật lại
          var st = document.getElementById('camStatusLive');
          if (st) { st.textContent = '📷 Bấm nút dưới để bật camera'; st.style.color = '#ffd9a8'; }
          var sb = document.getElementById('camStartBtn');
          if (sb) sb.style.display = 'inline-flex';
          return;
        }
        // getUserMedia bị chặn (GAS iframe / policy) → tự chuyển sang chụp ảnh native
        closeCameraModal();
        pickCameraImage();
      });
  }

  function startCameraDecodeLoop() {
    stopCameraDecodeLoop();
    // 1) BarcodeDetector — loop rAF trên video trực tiếp (QR + 1D)
    if (window.BarcodeDetector) {
      try { camDetector = new window.BarcodeDetector({ formats: CAM_FORMATS }); } catch (e) { camDetector = null; }
    }
    if (camDetector) {
      var loop = function () {
        var video = document.getElementById('camVideo');
        if (!camStream || !video || !video.videoWidth) { camRaf = null; return; }
        camDetector.detect(video).then(function (results) {
          if (results && results.length && results[0].rawValue) {
            onCameraDecoded(results[0].rawValue);
            return;
          }
          camRaf = requestAnimationFrame(loop);
        }).catch(function () { camRaf = requestAnimationFrame(loop); });
      };
      camRaf = requestAnimationFrame(loop);
      return;
    }
    // 2) Không có BarcodeDetector (iOS Safari…) → vẽ frame → jsQR → Quagga
    camTimer = setInterval(function () {
      if (camDecoding || camSnapping || !camStream) return;
      var video = document.getElementById('camVideo');
      if (!video || video.readyState < 2 || !video.videoWidth) return;
      var now = Date.now();
      if (now - camLastFrame < 600) return;
      camLastFrame = now;
      var imageData = camFrameToImageData(video, 800);
      if (!imageData) return;
      camDecoding = true;
      decodeCameraImageData(imageData.data, imageData.w, imageData.h, imageData.canvas, true);
    }, 300);
  }

  function stopCameraDecodeLoop() {
    if (camRaf) { cancelAnimationFrame(camRaf); camRaf = null; }
    if (camTimer) { clearInterval(camTimer); camTimer = null; }
    camDetector = null;
    camDecoding = false;
  }

  function camFrameToImageData(video, maxSide) {
    try {
      var w = video.videoWidth || 0;
      var h = video.videoHeight || 0;
      if (!w || !h) return null;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw;
      canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, cw, ch);
      var imageData = ctx.getImageData(0, 0, cw, ch);
      return { data: imageData, w: cw, h: ch, canvas: canvas };
    } catch (e) { return null; }
  }

  function closeCameraModal() {
    stopCameraDecodeLoop();
    if (camStream) {
      camStream.getTracks().forEach(function (t) { t.stop(); });
      camStream = null;
    }
    camSnapping = false;
    var video = document.getElementById('camVideo');
    if (video) { video.srcObject = null; }
    var modal = document.getElementById('cameraModal');
    if (modal) { modal.style.display = 'none'; modal.setAttribute('aria-hidden', 'true'); }
    if (camScanMode) { try { window.close(); } catch (e) {} }
  }

  // 📸 Chụp frame hiện tại rồi decode tĩnh (fallback khi live không bắt được)
  function snapCameraFrame() {
    var video = document.getElementById('camVideo');
    if (!video || !video.videoWidth) {
      camStatus('Camera chưa sẵn sàng — chờ vài giây rồi thử lại', true);
      return;
    }
    if (camSnapping) return;
    camSnapping = true;
    camDecoding = true;
    var frame = camFrameToImageData(video, 1280);
    if (!frame) { camSnapping = false; camDecoding = false; camStatus('Không đọc được khung hình — thử lại', true); return; }
    decodeCameraImageData(frame.data, frame.w, frame.h, frame.canvas, false);
  }

  // 🖼 Chụp ảnh qua camera native (input capture) — hoạt động trong GAS iframe
  function pickCameraImage() {
    var fileEl = document.getElementById('camFile');
    if (!fileEl) return;
    camStatus('📷 Chụp ảnh mã — đưa mã vào khung rồi chụp');
    fileEl.value = '';
    fileEl.click();
  }

  function onCamFileChange(e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    closeCameraModal();
    decodeCameraImage(file);
  }

  function camStatus(msg, isError) {
    var modal = document.getElementById('cameraModal');
    if (modal && modal.style.display === 'flex') {
      var statusEl = document.getElementById('camStatusLive');
      if (statusEl) {
        statusEl.textContent = msg;
        statusEl.style.color = isError ? 'var(--danger)' : 'var(--muted)';
        return;
      }
    }
    var card = document.getElementById('scanCard');
    if (!card) return;
    card.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'sc-empty';
    if (isError) div.style.color = 'var(--danger)';
    div.textContent = msg;
    card.appendChild(div);
  }

  function camFail(msg) {
    camDecoding = false;
    camSnapping = false;
    camStatus(msg, true);
  }

  // ===== DECODE (dùng chung cho live loop + snap + file) =====
  // quiet = true → decode fail không hiện thông báo (live loop tự tiếp tục)
  // Ảnh chụp (GAS) → decode ở NHIỀU kích thước + nhiều cấu hình locator để tăng
  // tỉ lệ bắt được mã vạch kẻ (mã nhỏ/mờ/nghiêng ở ảnh gốc có thể đọc được ở
  // ảnh thu nhỏ hoặc ngược lại).
  function decodeCameraImage(file) {
    if (camDecoding) return;
    camDecoding = true;
    camStatus('📷 Đang nhận diện mã…');
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      try { URL.revokeObjectURL(url); } catch (err) {}
      var w = img.naturalWidth || 0;
      var h = img.naturalHeight || 0;
      if (!w || !h) { camFail('Không đọc được ảnh — thử lại'); return; }
      decodeImageMultiScale(img, w, h);
    };
    img.onerror = function () {
      try { URL.revokeObjectURL(url); } catch (err) {}
      camFail('Không đọc được ảnh — thử lại');
    };
    img.src = url;
  }

  function decodeImageMultiScale(img, w, h) {
    var maxSide = Math.max(w, h);
    var scales = [];
    var seen = {};
    function add(s) {
      if (s > 1) s = 1;
      var key = s.toFixed(4);
      if (!seen[key]) { seen[key] = true; scales.push(s); }
    }
    add(1);                // ảnh gốc — BarcodeDetector đọc tốt nhất
    add(1280 / maxSide);   // 1280px
    add(800 / maxSide);    // 800px — Quagga nhận diện nhanh/nét hơn
    scales.sort(function (a, b) { return b - a; });
    decodeScaleStep(img, w, h, scales, 0);
  }

  function decodeScaleStep(img, w, h, scales, idx) {
    if (idx >= scales.length) {
      camDecoding = false;
      camSnapping = false;
      camStatus('Không nhận diện được mã — chụp lại gần hơn, đủ sáng, thẳng góc', true);
      return;
    }
    var scale = scales[idx];
    var cw = Math.max(1, Math.round(w * scale));
    var ch = Math.max(1, Math.round(h * scale));
    var canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, cw, ch);
    var imageData;
    try { imageData = ctx.getImageData(0, 0, cw, ch); } catch (e) {
      decodeScaleStep(img, w, h, scales, idx + 1);
      return;
    }
    // BarcodeDetector trên canvas ở scale này
    if (window.BarcodeDetector) {
      try {
        var detector = new window.BarcodeDetector({ formats: CAM_FORMATS });
        detector.detect(canvas).then(function (results) {
          if (results && results.length && results[0].rawValue) {
            onCameraDecoded(results[0].rawValue);
          } else {
            decodeFallbackChain(imageData, cw, ch, function () { decodeScaleStep(img, w, h, scales, idx + 1); });
          }
        }).catch(function () {
          decodeFallbackChain(imageData, cw, ch, function () { decodeScaleStep(img, w, h, scales, idx + 1); });
        });
        return;
      } catch (err) { /* không khởi tạo được → chain */ }
    }
    decodeFallbackChain(imageData, cw, ch, function () { decodeScaleStep(img, w, h, scales, idx + 1); });
  }

  function decodeFallbackChain(imageData, w, h, onDone) {
    // jsQR — QR code
    if (window.jsQR) {
      try {
        var qr = window.jsQR(imageData.data, w, h);
        if (qr && qr.data) { onCameraDecoded(qr.data); return; }
      } catch (err) { /* tiếp tục */ }
    }
    // Quagga — barcode vạch 1D (nhiều cấu hình locator)
    if (window.Quagga) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').putImageData(imageData, 0, 0);
        var src = canvas.toDataURL('image/jpeg', 0.92);
        runQuaggaConfigs(src, CAM_QUAGGA_CONFIGS, 0, onDone);
        return;
      } catch (err) { /* tiếp tục */ }
    }
    onDone();
  }

  function decodeCameraImageData(imageData, w, h, canvas, quiet) {
    // 1) BarcodeDetector — native Chrome/Edge/Android (QR + vạch 1D)
    if (window.BarcodeDetector) {
      try {
        var detector = new window.BarcodeDetector({ formats: CAM_FORMATS });
        detector.detect(canvas).then(function (results) {
          if (results && results.length && results[0].rawValue) {
            onCameraDecoded(results[0].rawValue);
          } else {
            decodeCameraFallback(imageData, w, h, quiet);
          }
        }).catch(function () { decodeCameraFallback(imageData, w, h, quiet); });
        return;
      } catch (err) { /* BarcodeDetector tồn tại nhưng không khởi tạo được → fallback */ }
    }
    decodeCameraFallback(imageData, w, h, quiet);
  }

  function decodeCameraFallback(imageData, w, h, quiet) {
    // 2) jsQR — QR code (iOS Safari / trình duyệt không có BarcodeDetector)
    if (window.jsQR) {
      try {
        var qr = window.jsQR(imageData.data, w, h);
        if (qr && qr.data) { onCameraDecoded(qr.data); return; }
      } catch (err) { /* tiếp tục fallback */ }
    }
    // 3) Quagga — barcode vạch 1D (Code128/Code39/EAN…) — fallback iOS
    var onDone = quiet
      ? function () { camDecoding = false; }                    // live loop: im lặng tiếp tục
      : function () { camFail('Không nhận diện được mã — chụp lại gần hơn, đủ sáng, thẳng góc'); };
    if (window.Quagga) {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').putImageData(imageData, 0, 0);
        var src = canvas.toDataURL('image/jpeg', 0.92);
        // Live loop: dùng config nhanh nhất. Snap: thử nhiều config (nét hơn).
        var configs = quiet ? [CAM_QUAGGA_CONFIG_FAST] : CAM_QUAGGA_CONFIGS;
        runQuaggaConfigs(src, configs, 0, onDone);
        return;
      } catch (err) { /* tiếp tục xuống fail */ }
    }
    onDone();
  }

  var CAM_QUAGGA_CONFIG_FAST = { patchSize: 'x-large', halfSample: true };
  var CAM_QUAGGA_CONFIGS = [
    { patchSize: 'x-large', halfSample: true },
    { patchSize: 'x-large', halfSample: false },
    { patchSize: 'medium', halfSample: false }
  ];

  function runQuaggaConfigs(src, configs, idx, onDone) {
    if (idx >= configs.length) {
      if (onDone) onDone();
      return;
    }
    var cfg = configs[idx];
    window.Quagga.decodeSingle({
      src: src,
      numOfWorkers: 0,
      inputStream: { size: 800 },
      locator: cfg,
      decoder: { readers: CAM_QUAGGA_READERS }
    }, function (result) {
      var code = result && result.codeResult && result.codeResult.code;
      if (code) { onCameraDecoded(code); return; }
      runQuaggaConfigs(src, configs, idx + 1, onDone);
    });
  }

  function onCameraDecoded(code) {
    stopCameraDecodeLoop();
    if (camStream) {
      camStream.getTracks().forEach(function (t) { t.stop(); });
      camStream = null;
    }
    camSnapping = false;
    camDecoding = false;
    var clean = String(code || '').trim();
    if (camScanMode) {
      // TAB QUÉT RIÊNG: gửi kết quả về trang gốc rồi đóng tab
      try {
        localStorage.setItem('rcScanResult', JSON.stringify({ token: camScanToken, code: clean, ts: Date.now() }));
      } catch (e) {}
      try {
        if (window.opener) window.opener.postMessage({ type: 'rcScanResult', code: clean }, '*');
      } catch (e) {}
      var statusEl = document.getElementById('camStatusLive');
      if (statusEl) statusEl.textContent = '✅ Đã nhận mã: ' + clean + ' — tự đóng tab này';
      setTimeout(function () {
        closeCameraModal(); // đóng camera + window.close()
      }, 1200);
      return;
    }
    var modal = document.getElementById('cameraModal');
    if (modal) { modal.style.display = 'none'; modal.setAttribute('aria-hidden', 'true'); }
    var video = document.getElementById('camVideo');
    if (video) { video.srcObject = null; }
    var input = document.getElementById('scanInput');
    if (!input) return;
    input.value = clean;
    submitScan(); // đúng luồng quét hiện tại (reconcile + meal-move Ra/Vào)
  }

  // ===== TAB QUÉT RIÊNG (?scan=1&tk=...): tự mở camera + quét live =====
  // Trang này chạy TOP-LEVEL (mở bằng window.open từ GAS iframe) → getUserMedia
  // hoạt động → quét LIVE liên tục như AppSheet: không cần bấm chụp, thấy mã
  // là nhận ngay rồi gửi về trang gốc.
  function initScanModeIfNeeded() {
    if (location.search.indexOf('scan=1') === -1) return;
    camScanMode = true;
    var m = location.search.match(/[?&]tk=([^&]+)/);
    camScanToken = m ? decodeURIComponent(m[1]) : '';
    try { document.body.classList.add('scan-mode'); } catch (e) {}
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    if (isIOS) {
      // iOS Safari: camera CHỈ bật được khi có user gesture ngay trong tab này
      // (tab mở tự động thì getUserMedia luôn bị từ chối) → hiện nút để user
      // chạm 1 lần, sau đó quét LIVE tự động như AppSheet.
      showScanStartButton();
    } else {
      // Android/khác: có thể auto-start, nếu bị chặn sẽ hiện nút (xem .catch)
      setTimeout(function () { startCameraLive(); }, 60);
    }
  }

  function showScanStartButton() {
    var modal = document.getElementById('cameraModal');
    if (modal) { modal.style.display = 'flex'; modal.setAttribute('aria-hidden', 'false'); }
    var sb = document.getElementById('camStartBtn');
    if (sb) sb.style.display = 'inline-flex';
    var statusEl = document.getElementById('camStatusLive');
    if (statusEl) { statusEl.textContent = '📷 Bấm nút để bật camera'; statusEl.style.color = ''; }
  }
  initScanModeIfNeeded();
  // ===== CAMERA-SCAN-END =====
</script>
