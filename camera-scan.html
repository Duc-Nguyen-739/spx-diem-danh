      }
      // BẬC 4: crop vùng khung UPSCALE 1.4x + TRY_HARDER — mã XA (30cm) nhỏ được phóng to
      // (vạch dày hơn) + quét thêm góc → bắt được mã mà full frame miss (đây là đường chính
      // cho mã để xa — user báo "để xa nhận hơi lâu", 2026-08-17).
      var cropped = camZxingCrop(frame, w, h, 1.4);
      if (cropped) {
        var text2 = zxingDecodeImageData(cropped.img, cropped.w, cropped.h, true);
        if (text2) { onCode(camZxingPickCode(text2)); return; }
      }
      onCode(null);
    } catch (e) { onCode(null); }
  }

  // ===== WORKER SCAN (2026-08-17): ZXing TRY_HARDER decode trong Web Worker =====
  // Mục tiêu: KHÔNG nghẽn main thread — worker decode full frame TRY_HARDER (bậc chậm nhất)
  // ở nền, xử lý frame MỚI NHẤT liên tục trong lúc tick chính đang decode frame cũ + chờ
  // gate → mã nghiêng/mờ nhẹ bắt SỚM hơn. Main chỉ gửi khi worker rảnh (1 frame/lượt qua
  // camWorkerIdle) → không phí gửi thừa. COPY buffer khi gửi (KHÔNG transfer — main còn decode
  // tiếp bậc 2-4 + Quagga trên frame khi worker fail). Fail-open: worker không tạo được (CSP
  // GAS iframe / trình duyệt cũ / mất mạng importScripts) → im lặng dùng tick main như cũ.
  // Worker SRC dùng CHUNG cho modal (new Worker ở đây) + popup (nhúng qua JSON.stringify).
  var CAM_WORKER_SRC = [
    "importScripts('https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js');",
    "var reader = null;",
    "function decodeOne(d) {",
    "  if (!reader) reader = new ZXing.MultiFormatReader();",
    "  var src = new Uint8ClampedArray(d.buf);",
    "  var gray = new Uint8ClampedArray(d.w * d.h);",
    "  for (var i = 0, p = 0; p < d.w * d.h; i += 4, p++) {",
    "    gray[p] = (src[i] * 0.299 + src[i + 1] * 0.587 + src[i + 2] * 0.114) | 0;",
    "  }",
    "  var hints = new Map();",
    "  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_93, ZXing.BarcodeFormat.CODABAR, ZXing.BarcodeFormat.QR_CODE]);",
    "  hints.set(ZXing.DecodeHintType.TRY_HARDER, true);",
    "  var source = new ZXing.RGBLuminanceSource(gray, d.w, d.h);",
    "  var bitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(source));",
    "  var result = reader.decode(bitmap, hints);",
    "  return result && result.getText ? result.getText() : null;",
    "}",
    "self.onmessage = function (e) {",
    "  var text = null;",
    "  try { text = decodeOne(e.data); } catch (err) { text = null; }",
    "  self.postMessage({ text: text });",
    "};",
    "// Tín hiệu ready (2026-08-17): importScripts ZXing xong + worker hoạt động → main hiện",
    "// '⚙️ Worker: bật' trên UI (kiểm tra worker có chạy được trên thiết bị thật không).",
    "self.postMessage({ ready: true });"
  ].join('\n');
  var camWorker = null;
  var camWorkerFailed = false;
  var camWorkerIdle = true;   // worker đang rảnh → được gửi frame mới (1-at-a-time)

  // Chỉ báo trạng thái worker trên UI (2026-08-17, yêu cầu user kiểm tra worker chạy chưa)
  // — worker fail-open âm thầm nên không có cách nào biết; giờ hiện rõ trong ô camera.
  function camWorkerStatus(text, ok) {
    var el = document.getElementById('camWorkerStatus');
    if (!el) return;
    el.textContent = text;
    el.className = 'cam-worker-status' + (ok === false ? ' off' : (ok === true ? ' on' : ''));
  }

  function ensureZxingWorker() {
    if (camWorker || camWorkerFailed) return;
    try {
      if (typeof Worker === 'undefined' || typeof Blob === 'undefined' || typeof URL === 'undefined' || !URL.createObjectURL) {
        camWorkerFailed = true;
        camWorkerStatus('⚙️ Worker: tắt (trình duyệt không hỗ trợ)', false);
        return;
      }
      var blob = new Blob([CAM_WORKER_SRC], { type: 'application/javascript' });
      var url = URL.createObjectURL(blob);
      camWorker = new Worker(url);
      camWorker.onmessage = function (e) { camWorkerOnMessage(e.data); };
      camWorker.onerror = function () {
        camWorkerFailed = true;
        camWorker = null;
        camWorkerStatus('⚙️ Worker: tắt (lỗi chạy)', false);
      };
      camWorkerStatus('⚙️ Worker: đang tải…', null);
    } catch (e) {
      camWorkerFailed = true;
      camWorker = null;
      camWorkerStatus('⚙️ Worker: tắt (lỗi tạo)', false);
    }
  }

  // Gửi frame cho worker decode sâu. COPY buffer (KHÔNG transfer — main còn decode tiếp bậc
  // 2-4 + Quagga trên frame này khi worker fail). Worker decode đồng bộ trong onmessage →
  // không cần queue; main gate bằng camWorkerIdle.
  function camWorkerSend(frame) {
    if (!camWorker || camWorkerFailed || !camWorkerIdle) return;
    try {
      // frame modal: { data: ImageData } — popup frameToImageData: { imageData } → đọc cả 2
      var img = frame && (frame.data || frame.imageData);
      var d = img && img.data;
      if (!d || !frame.w || !frame.h) return;
      camWorkerIdle = false;
      camWorker.postMessage({ buf: d.buffer.slice(0), w: frame.w, h: frame.h });
    } catch (e) { camWorkerIdle = true; }
  }

  // Kết quả worker → chuẩn hóa như decode main (camZxingPickCode — PURE, test được).
  // Guard camSnapping: đang full-chain/chụp → bỏ qua; dedup 1.5s trong onCameraDecoded lo trùng.
  function camWorkerOnMessage(data) {
    camWorkerIdle = true;
    if (!data) return;
    if (data.ready) { camWorkerStatus('⚙️ Worker: bật', true); return; }
    if (!data.text) return;
    var code = camZxingPickCode(data.text);
    if (!code) return;
    if (camSnapping) return;
    onCameraDecoded(code);
  }

  function stopZxingWorker() {
    if (camWorker) { try { camWorker.terminate(); } catch (e) {} camWorker = null; }
    camWorkerFailed = false; // cho phép tạo lại lần mở sau (lỗi có thể tạm thời)
    camWorkerIdle = true;
  }
  // ===== ZXING-SCAN-END =====

  // ===== QUÉT LIÊN TỤC: danh sách kết quả quét ngay dưới camera (2026-08-17) =====
  // js.html showScanCard gọi camAppendResult sau mỗi lượt quét (optimistic + server
  // response) khi phiên quét camera đang mở → hiện kết quả NGAY DƯỚI CAMERA: modal
  // render #camResultsBody; popup GAS nhận postMessage {type:'rcScanInfo'} và tự render.
  // CAM_RESULT_MERGE_MS: optimistic và server response của CÙNG lượt quét (cùng mã
  // trong 2.5s) → cập nhật 1 dòng thay vì thêm dòng mới (server trả tên thật NV lạ).

  // PURE (test được trong Node): có nên merge vào dòng kết quả cuối cùng không?
  function camShouldMergeResult(prevCode, prevTs, code, now, mergeMs) {
    return !!(code && code === prevCode && prevTs > 0 && now - prevTs < mergeMs);
  }

  function camEsc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtTimeNow() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  // Flash phản hồi quét (2026-08-17, yêu cầu user): overlay trong ô camera chớp
  // màu theo trạng thái — xanh ✓ Có mặt · cam ⚠ Dư · đỏ ✕ lỗi. Chỉ chạy khi lượt
  // quét MỚI (không phải merge optimistic+server cùng lượt — tránh flash đúp).
  function camFlashMark(status, isError) {
    var el = document.getElementById('camFlash');
    if (!el) return;
    var mark = el.querySelector && el.querySelector('.cf-mark');
    if (mark) mark.textContent = isError ? '✕' : (status === 'Dư' ? '⚠' : '✓');
    el.classList.remove('on', 'extra', 'err');
    void el.offsetWidth; // restart animation
    el.classList.add(isError ? 'err' : (status === 'Dư' ? 'extra' : 'on'));
    // Glow viền khung dẫn hướng theo trạng thái (2026-08-17, yêu cầu user hiệu ứng
    // đẹp khi quét thành công) — ring lan ra + mark phóng to + khung sáng màu.
    var frameEl = document.getElementById('camFrame');
    if (frameEl) {
      frameEl.classList.remove('fl-ok', 'fl-extra', 'fl-err');
      void frameEl.offsetWidth; // restart animation
      frameEl.classList.add(isError ? 'fl-err' : (status === 'Dư' ? 'fl-extra' : 'fl-ok'));
    }
  }

  // PURE: HTML 1 dòng kết quả (không chạm DOM — test được trong Node)
  function camResultRowHTML(p) {
    var badgeCls = p.isError ? 'err' : (p.status === 'Dư' ? 'extra' : 'ok');
    return '<span class="cr-code">' + camEsc(p.code) + '</span>' +
      '<span class="cr-name">' + camEsc(p.staffName || '') + '</span>' +
      '<span class="cr-time">' + camEsc(p.time || '') + '</span>' +
      '<span class="cr-badge ' + badgeCls + '">' + camEsc(p.status || '') + '</span>';
  }

  function camAppendResult(status, target, isError) {
    if (!camOpen) return;         // chỉ khi đang quét camera (modal live HOẶC popup)
    if (!target) return;
    var code = String(target.staffId || '').trim();
    if (!code) return;
    var now = Date.now();
    var isUpdate = camShouldMergeResult(camResultCode, camResultTs, code, now, CAM_RESULT_MERGE_MS);
    if (!isUpdate) { camResultCode = code; camResultTs = now; }
    var payload = {
      type: 'rcScanInfo',
      code: code,
      status: String(status || ''),
      staffName: String(target.staffName || ''),
      time: fmtTimeNow(),
      isError: !!isError,
      update: isUpdate,
    };
    // POPUP đang mở (GAS iframe): gửi thông tin về popup — popup tự render danh sách
    if (camPopupRef && !camPopupRef.closed) {
      try { camPopupRef.postMessage(payload, '*'); } catch (e) {}
      return;
    }
    // MODAL đang mở (preview/hosting top-level): render trong #camResultsBody.
    // Chỉ render khi modal THẬT SỰ hiện (display:flex) — tránh tích dòng ẩn khi
    // popup GAS vừa đóng mà không gửi message (tab đóng bằng trình duyệt).
    var camModalEl = document.getElementById('cameraModal');
    if (!camModalEl || camModalEl.style.display !== 'flex') return;
    // Flash phản hồi — chỉ lượt quét MỚI (server response cùng lượt là update →
    // không flash lại). Chạy ở đây (sau check modal hiện) — popup mode tự flash bên trong.
    if (!isUpdate) camFlashMark(status, isError);
    var body = document.getElementById('camResultsBody');
    if (!body) return;
    if (isUpdate) {
      var last = body.lastElementChild;
      if (last && last.getAttribute && last.getAttribute('data-code') === code) {
        last.innerHTML = camResultRowHTML(payload);
        return;
      }
    }
    var row = document.createElement('div');
    // class 'new' (highlight nền rồi tự tắt — 2026-08-17) + trạng thái để màu highlight khớp
    row.className = 'cr-row new ' + (isError ? 'err' : (status === 'Dư' ? 'extra' : 'ok'));
    row.setAttribute('data-code', code);
    row.innerHTML = camResultRowHTML(payload);
    body.appendChild(row);
    // Scroll CONTAINER #camResults (.camera-results — overflow-y:auto) xuống dòng mới.
    // Trước set trên #camResultsBody (con, không scroll được) → danh sách đứng im (bug
    // 2026-08-17 — user báo "thông tin bên dưới không cuộn theo mã vừa quét").
    var scrollEl = document.getElementById('camResults');
    if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
    var head = document.getElementById('camResultsHead');
    if (head) head.textContent = 'Kết quả quét (' + body.children.length + ')';
  }
  // ===== QUÉT LIÊN TỤC-END =====

  function onCameraDecoded(code) {
    var clean = String(code || '').trim();
    if (!clean) return;
    // QUÉT LIÊN TỤC (2026-08-17): cùng mã trong CAM_CODE_COOLDOWN_MS → bỏ qua. Thẻ vẫn
    // nằm trong khung → nếu không chặn, mỗi tick (~600ms) submit 1 lần → spam toast +
    // danh sách kết quả. Cooldown khớp DUPLICATE_WINDOW_MS server (1.5s, 2026-08-17 giảm
    // từ 10s) nên không làm mất lượt quét Ra→Vào hợp lệ.
    var now = Date.now();
    if (clean === camLastCode && now - camLastCodeTs < CAM_CODE_COOLDOWN_MS) return;
    camLastCode = clean;
    camLastCodeTs = now;
    if (camScanMode) {
      // TAB QUÉT RIÊNG: gửi kết quả về trang gốc rồi đóng tab
      try {
        localStorage.setItem('rcScanResult', JSON.stringify({ token: camScanToken, code: clean, ts: Date.now() }));
      } catch (e) {}
      try {
        if (window.opener) window.opener.postMessage({ type: 'rcScanResult', code: clean }, '*');
      } catch (e) {}
      var statusEl = document.getElementById('camStatusLive');
      if (statusEl) statusEl.textContent = '✅ Đã nhận mã: ' + clean + ' — tự đóng tab này';
      setTimeout(function () {
        closeCameraModal(); // đóng camera + window.close()
      }, 1200);
      return;
    }
    // QUÉT LIÊN TỤC: KHÔNG dừng camera / không đóng modal / không đóng popup — điền mã
    // vào ô quét + submit như quét tay (reconcile + meal-move Ra/Vào). Kết quả hiện NGAY
    // DƯỚI CAMERA: js.html showScanCard → camAppendResult (render modal / postMessage
    // popup). Nút ✕ Đóng mới kết thúc phiên quét.
    var input = document.getElementById('scanInput');
    if (!input) return;
    input.value = clean;
    var st = document.getElementById('camStatusLive');
    if (st && camOpen) st.textContent = '✅ ' + clean + ' — quét mã tiếp theo';
    submitScan(); // đúng luồng quét hiện tại (reconcile + meal-move Ra/Vào)
    // Đường ảnh chụp (decodeCameraImage) set camDecoding=true — reset để lượt quét sau
    // không bị chặn bởi cờ còn treo (quét liên tục nhiều ảnh).
    camDecoding = false;
    camSnapping = false;
  }

  // ===== TAB QUÉT RIÊNG (?scan=1&tk=...): tự mở camera + quét LIVE =====
  // Tab này là trang top-level (mở bằng window.open/anchor từ GAS iframe) →
  // getUserMedia hoạt động → quét live liên tục như AppSheet, thấy mã là nhận.
  function initScanModeIfNeeded() {
    // Detect scan mode bằng CẢ location.search LẪN document.referrer: wrapper GAS nạp
    // app vào iframe có thể KHÔNG forward query (location.search rỗng) nhưng referrer
    // vẫn là URL tab quét (có scan=1&tk) — bug 2026-08-12 tab trắng/không vào scan mode.
    var scanDetected = location.search.indexOf('scan=1') !== -1
      || (document.referrer || '').indexOf('scan=1') !== -1;
    if (!scanDetected) return;
    camScanMode = true;
    // Cờ cho js.html (include sau file này): mock loader + DOMContentLoaded skip app init.
    // Cờ bền hơn location.search vì wrapper có thể không forward query vào URL app.
    try { window.__RC_SCAN_MODE__ = true; } catch (e) {}
    var m = location.search.match(/[?&]tk=([^&]+)/)
      || (document.referrer || '').match(/[?&]tk=([^&]+)/);
    camScanToken = m ? decodeURIComponent(m[1]) : '';
    try { document.body.classList.add('scan-mode'); } catch (e) {}
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    if (isIOS) {
      // iOS Safari: camera CHỈ bật khi có user gesture trong chính tab này →
      // hiện nút để chạm 1 lần, sau đó quét tự động
      showScanStartButton();
    } else {
      setTimeout(function () { startCameraLive(); }, 60);
    }
  }

  function showScanStartButton() {
    var modal = document.getElementById('cameraModal');
    if (modal) { modal.style.display = 'flex'; modal.setAttribute('aria-hidden', 'false'); }
    var sb = document.getElementById('camStartBtn');
    if (sb) sb.style.display = 'inline-flex';
    var statusEl = document.getElementById('camStatusLive');
    if (statusEl) { statusEl.textContent = '📷 Bấm nút để bật camera'; statusEl.style.color = ''; }
  }
  initScanModeIfNeeded();
  // ===== CAMERA-SCAN-END =====
</script>
