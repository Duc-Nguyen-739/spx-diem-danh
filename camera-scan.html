<script>
  // ===== CAMERA-SCAN-START: Quét mã bằng camera điện thoại (2026-08-11) =====
  // File riêng (camera-scan.html) — nhúng qua scriptlet include('camera-scan') NGAY
  // TRƯỚC include('js') trong index.html, nên các hàm ở đây định nghĩa trước khi
  // js.html chạy (wiring DOMContentLoaded ở js.html gọi onCamFileChange).
  //
  // RÀNG BUỘC NỀN TẢNG (2026-08-12, cập nhật sau khi verify thực tế):
  // - GAS serve web app trong IFRAME WRAPPER (userHtmlFrame). getUserMedia live trong
  //   iframe BỊ CHẶN trên máy thật (Permissions Policy — wrapper allow="camera *" không
  //   đủ; iOS Safari từ chối camera trong cross-origin iframe).
  // - GIẢI PHÁP POPUP (2026-08-12, hướng A — user chọn): bấm "📷 Quét Camera" trong
  //   iframe GAS → mở POPUP top-level (window.open — trang top-level nên getUserMedia
  //   chạy được trên iOS, đã verify với demo standalone) → popup TỰ nhận diện mã vạch
  //   (BarcodeDetector → jsQR → Quagga — lấy thư viện từ trang mở qua window.opener,
  //   about:blank kế thừa origin → cùng origin) → postMessage {type:'rcScanResult',
  //   code} về iframe → onCameraDecoded → Done. iOS lần đầu có thể cần chạm nút
  //   "▶ Bật camera" trong popup (user gesture không qua được document mới).
  // - Fallback an toàn (giữ nguyên đường cũ): popup bị chặn (window.open null) hoặc
  //   camera trong popup bị chặn → camera native = <input type=file capture> gọi ĐỒNG
  //   BỘ trong click handler (đang trong user gesture) → iOS/Android mở camera LẬP TỨC,
  //   chạy 100% trong iframe GAS. Chụp xong TỰ decode multi-scale (jsQR + 3 config
  //   Quagga) → điền mã → Done.
  // - BỎ TAB QUÉT RIÊNG (?scan=1) làm đường chính (bug 2026-08-12): mở URL content
  //   GAS trong tab mới bị TRẮNG lặp lại NHIỀU LẦN trên Safari/Chrome dù đã fix nhiều
  //   lần — wrapper GAS nạp app qua postMessage handshake vào iframe /blank, tab mới
  //   không render được nội dung app → không đáng dựa vào.
  //
  // CHUỖI NHẬN DIỆN (frame live lẫn ảnh chụp):
  //   1) BarcodeDetector — native Chrome/Edge/Android (QR + vạch 1D, nhanh nhất)
  //   2) jsQR (lib-jsqr.html) — QR — iOS Safari (KHÔNG có BarcodeDetector)
  //   3) Quagga (lib-quagga.html) — barcode vạch 1D (Code128/39/EAN/UPC/ITF…) — iOS
  // Ảnh chụp decode ở NHIỀU kích thước (gốc → 1280 → 800) × 3 cấu hình Quagga.
  // AUTO-DECODE (2026-08-12): live loop iOS (frame 800px + 1 config nhanh) KHÔNG bắt
  // được mã vạch kẻ; auto-snap cũ gate theo độ rung (CAM_STABLE_MOTION=6/255) quá nhạy
  // với noise camera iPhone thật → không bao giờ kích hoạt → user vẫn phải bấm "📸 Chụp"
  // (bug 2026-08-12). Giờ: TỰ ĐỘNG chạy ĐÚNG chain nút Chụp (frame 1280px + jsQR + 3
  // config Quagga — đường đã chạy tốt) theo nhịp cố định mỗi 2 tick frame (~1.2s) → đưa
  // mã vào khung là tự nhận, không cần bấm gì. Nút "📸 Chụp" vẫn giữ làm fallback thủ công.
  // Kết quả đưa thẳng vào scanInput rồi gọi submitScan() → ĐÚNG luồng quét hiện
  // tại (reconcile lẫn meal-move Ra/Vào), KHÔNG đổi logic quét.
  //
  // Nút "📷 Quét Camera" (#btnCamScan) CHỈ hiện trên mobile (desktop ẩn — CSS):
  //   - GAS (iframe): mở POPUP quét LIVE (tự nhận mã → postMessage về app → Done);
  //     popup/camera bị chặn → fallback camera native (chụp xong tự decode → Done)
  //   - Ngoài GAS (preview/hosting top-level): live scan ngay trong modal
  var camDecoding = false;   // đang decode 1 ảnh/frame (chống chồng lấn)
  var camSnapping = false;   // đang chụp/decode tĩnh (snap hoặc file)
  var camStartedAt = 0;      // thời điểm mở camera thành công (2026-08-17: tính hint khoảng cách)
  var camHintShown = false;  // đã hiện gợi ý khoảng cách chưa (hiện 1 lần/phiên)
  var camStream = null;      // MediaStream đang mở
  var camSeq = 0;            // FIX-3 seq token chống ghost: tăng mỗi lần mở/đóng, .then check stale
  var camTimer = null;       // interval decode khi không có BarcodeDetector
  var camRaf = null;         // requestAnimationFrame khi có BarcodeDetector
  var camDetector = null;    // BarcodeDetector instance
  var camSharedCanvas = null; // 1 canvas dùng chung cho mọi frame tick (2026-08-16 tối ưu:
                             // hết tạo canvas+context mới mỗi ~600ms → giảm GC trên iOS)
  var camSharedCtx = null;
  var camOcrCanvas = null; // reuse cho OCR (2026-08-21 #15) — hết tạo mới mỗi 4s
  var camOcrCtx = null;
  var camVideoEl = null; // cache element #camVideo — loop live đọc mỗi tick/frame (rAF
                         // ~60fps + interval 300ms + OCR 2s); element tĩnh trong modal →
                         // cache 1 lần, hết query DOM mỗi lần (2026-08-16 tối ưu)
  function camVideo() {
    if (!camVideoEl) camVideoEl = document.getElementById('camVideo');
    return camVideoEl;
  }
  // QUÉT LIÊN TỤC (2026-08-17): camera KHÔNG đóng sau 1 mã — quét mã tiếp theo ngay;
  // kết quả hiện NGAY DƯỚI CAMERA (modal render #camResultsBody / popup nhận rcScanInfo).
  var camOpen = false;        // phiên quét camera đang hoạt động (modal live HOẶC popup)
  var camLastCode = '';       // mã vừa nhận — dedup: thẻ vẫn nằm trong khung
  var camLastCodeTs = 0;
  var camLastMode = '';       // FIX-15: dedup theo (mode, code) — Ra→Vào trong 1.5s cùng mã là lượt HỢP LỆ
  var camResultPending = []; // các lượt optimistic đang chờ server response (merge 2.5s) — 2026-08-19:
                             // thay single slot (camResultCode/Ts) — response trễ >2.5s do queue
                             // backlog từng tạo dòng TRÙNG (chỉ so được với lượt cuối)
  var CAM_CODE_COOLDOWN_MS = 1500;   // cùng mã trong 1.5s → bỏ qua (2026-08-17: giảm từ 10s —
                                     // quét liên tục nhanh hơn; server cũng giảm DUPLICATE_WINDOW_MS
                                     // xuống 1.5s để khớp — không lo ghi trùng)
  var CAM_RESULT_MERGE_MS = 2500;    // optimistic + server response cùng lượt → cập nhật 1 dòng
  // AUTO-DECODE (2026-08-12): live loop iOS chạy ĐÚNG chain nút "📸 Chụp" (frame 1280px
  // + jsQR + 3 config Quagga — đường đã chạy tốt) theo nhịp cố định, KHÔNG gate theo độ
  // rung (threshold 6/255 quá nhạy với noise camera iPhone thật → auto-snap không bao giờ
  // kích hoạt → user vẫn phải bấm Chụp, bug 2026-08-12). Đưa mã vào khung là tự nhận.
  var camFullChainTick = 0;       // đếm tick frame giữa 2 lần chạy full-chain decode
  var CAM_FULL_CHAIN_INTERVAL = 2; // chạy full chain mỗi N tick frame (1 tick ≈ 200ms — 2026-08-17
                                   // bỏ gate 500ms bug; full chain ≈ mỗi 400ms)
  var CAM_FAST_DECODE_SIZE = 1280; // FAST PATH decode 1280px ĐẦY ĐỦ (2026-08-17, đảo từ 800px):
                                   // user test "lúc được lúc không" dù mã nét — 800px downscale
                                   // làm vạch Code128 mỏng bị alias/mất chi tiết → miss frame
                                   // (bản 2026-08-12 decode 1280px đã verify tự nhận nhanh).
  var camFindMode = false;   // "🔍 Tìm Mã" (2026-08-16): full-chain decode MỖI tick + ép focus liên tục
  // 🔍 ZOOM CAMERA (2026-08-31): zoom thuần chống mờ/mất chi tiết khi user dí sát hoặc mã
  // nhỏ — không zoom digital quá 3x (lệch xa FOV khung dẫn hướng) và không tự zoom vô hạn.
  // Bấm nút camZoomOut/camZoomIn (index.html) hoặc TỰ ZOOM sau CAM_AUTO_ZOOM_MS không nhận
  // được mã nào (camShouldAutoZoom) → camZoomStep() applyConstraints zoom qua track.
  // iOS Safari không hỗ trợ zoom constraint → applyConstraints no-op (không crash).
  var camZoomCurrent = 1.0;  // mức zoom hiện tại (1.0 = FOV gốc)
  var CAM_ZOOM_BASE = 1.0;
  var CAM_ZOOM_MAX = 3.0;    // trần zoom — cao hơn khung dẫn hướng lệch quá xa FOV gốc
  var CAM_ZOOM_STEP = 0.6;   // mỗi lần bấm nút/tự zoom tăng/giảm 0.6x
  var CAM_AUTO_ZOOM_MS = 2500; // không nhận mã nào trong 2.5s → tự zoom 1 bậc
  var camScanMode = false;   // đang ở TAB QUÉT RIÊNG (?scan=1) — kết quả gửi về trang gốc
  var camScanToken = '';     // token định danh phiên quét
  var CAM_FORMATS = ['qr_code', 'code_128', 'code_39', 'code_93', 'codabar', 'ean_13', 'ean_8', 'itf', 'upc_a', 'upc_e'];
  var CAM_QUAGGA_READERS = ['code_128_reader', 'code_39_reader', 'ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader', 'i2of5_reader', 'code_93_reader', 'codabar_reader'];

  function openCameraScan() {
    var btn = document.getElementById('btnCamScan');
    if (btn && btn.disabled) return;
    if (CURRENT_TASK && CURRENT_TASK.status !== TASK_STATUS_C.OPEN) return;
    // Tải ZXing từ CDN ngay khi bấm Quét Camera (2026-08-17): ~1-2s load 328KB — fast path
    // decode chính xác hơn (ImageData + TRY_HARDER) khi lib sẵn sàng; fail load → im lặng
    // dùng Quagga. Chạy ở đây để CẢ modal (top-level) lẫn popup GAS đều có ZXing.
    ensureZxingLib();
    var inFrame = false;
    try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
    if (inFrame) {
      // GAS iframe: mở POPUP top-level quét LIVE (tự nhận mã vạch — getUserMedia chạy
      // được ở trang top-level trên iOS, đã verify với demo standalone 2026-08-12).
      // Popup bị chặn (window.open null) hoặc camera trong popup bị chặn → fallback
      // camera native (<input capture>) — không bao giờ kẹt.
        // P2-2 (2026-08-23): OCR lazy — không load Tesseract ngay (2MB wasm) khi mở popup;
      // chỉ load sau 5 lần ZXing fail liên tiếp trên modal (tiết kiệm băng thông/CPU cho mã nét).
      // Popup OCR vẫn gate qua LIBS.ocr (camOcrFrame) → nếu chưa load thì no-op an toàn.
      openScanPopup();
      return;
    }
    // Ngoài GAS (preview/hosting top-level): quét LIVE ngay trong trang
    // FIX-19: chỉ set cờ khi phiên camera thực sự bắt đầu — modal/top-level live sắp mở
    camOpen = true;
    try { window.__RC_CAM_OPEN__ = true; } catch (e) {}
    startCameraLive();
  }

  // ===== POPUP QUÉT LIVE (2026-08-12, hướng A) =====
  // Bấm "📷 Quét Camera" trong iframe GAS → mở POPUP top-level chứa màn hình quét LIVE.
  // Popup là trang top-level → getUserMedia hoạt động trên iOS (iframe GAS bị chặn).
  // Popup tự nhận mã (BarcodeDetector → jsQR → Quagga — lấy thư viện từ trang mở qua
  // window.opener, cùng origin vì about:blank kế thừa origin) → gửi về iframe qua
  // postMessage {type:'rcScanResult', code} → onCameraDecoded → Done. Nếu popup không
  // mở được (window.open null) hoặc camera popup bị chặn → fallback camera native.
  var CAM_POPUP_NAME = 'rcCamScanPopup';
  var camPopupBusy = false;
  var camPopupRef = null;  // reference popup đang mở — check .closed để biết popup đã đóng
                             // (đóng bằng ✕ Đóng / đóng tab đều không gửi message về parent)
  var camPopupWatch = null;  // interval poll popup đóng (browser ✕ / đóng tab) — popup không
                             // gửi message 'closed' khi đóng qua browser, cờ camOpen/
                             // __RC_CAM_OPEN__ kẹt vĩnh viễn nếu không poll (bug 2026-08-18)

  function buildScanPopupHtml() {
    return [
      '<!doctype html>',
      '<html lang="vi">',
      '<head>',
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">',
      '<title>Quét mã vạch</title>',
      // Ghép chuỗi như thẻ mở script bên trên — file không được chứa literal thẻ
      // style mở/đóng (test inline-html đếm số cặp theo file).
      '<sty' + 'le>',
      'html,body{margin:0;padding:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;}',
      '#wrap{position:fixed;inset:0;display:flex;flex-direction:column;}',
      // CHIA 60/40 (2026-08-17): camera #view 60% · thông tin quét #results 40%
      // (flex 3:2) — danh sách dài thì cuộn trong #results (overflow-y:auto).
      '#view{position:relative;flex:3 1 60%;min-height:0;overflow:hidden;background:#000;}',
      '#video{width:100%;height:100%;object-fit:cover;display:block;}',
      '#frame{position:absolute;inset:12% 8%;border:2px dashed rgba(255,255,255,.85);border-radius:14px;pointer-events:none;}',
      // Thanh căn chỉnh mã vạch (2026-08-17): đường ngang sáng giữa khung — đưa mã
      // vạch nằm đúng lên đường này để decode nhanh hơn (căn theo #frame ngang 8%).
      '#scanline{position:absolute;left:8%;right:8%;top:50%;height:2px;transform:translateY(-50%);background:linear-gradient(90deg,rgba(255,109,0,0),#ff6d00 15%,#ff6d00 85%,rgba(255,109,0,0));box-shadow:0 0 10px rgba(255,109,0,.85);pointer-events:none;animation:scanPulse 1.6s ease-in-out infinite;}',
      '@keyframes scanPulse{0%,100%{opacity:.6;}50%{opacity:1;}}',
      // Flash phản hồi quét (2026-08-17): overlay chớp màu theo trạng thái — xanh ✓ Có
      // mặt · cam ⚠ Dư · đỏ ✕ lỗi. Kích hoạt bởi flashResult() khi nhận rcScanInfo.
      '#flash{position:absolute;inset:0;z-index:2;border-radius:14px;pointer-events:none;opacity:0;display:flex;align-items:center;justify-content:center;}',
      '#flash.on{animation:popFlashOk .5s ease-out;}',
      '#flash.extra{animation:popFlashExtra .5s ease-out;}',
      '#flash.err{animation:popFlashErr .5s ease-out;}',
      '#flash b{font-size:56px;font-weight:800;color:#4ade80;text-shadow:0 2px 12px rgba(0,0,0,.65);}',
      '#flash.extra b{color:#4ade80;} /* 2026-08-17: Dư cũng là quét thành công → xanh lá */',
      '#flash.err b{color:#f87171;}',
      '@keyframes popFlashOk{0%{opacity:1;background:rgba(74,222,128,.28);}100%{opacity:0;background:rgba(74,222,128,0);}}',
      '@keyframes popFlashExtra{0%{opacity:1;background:rgba(74,222,128,.28);}100%{opacity:0;background:rgba(74,222,128,0);}} /* 2026-08-17: Dư → xanh lá */',
      '@keyframes popFlashErr{0%{opacity:1;background:rgba(248,113,113,.28);}100%{opacity:0;background:rgba(248,113,113,0);}}',
      // Hiệu ứng quét thành công (2026-08-17, yêu cầu user): ring lan ra + dấu phóng to
      // + khung #frame glow màu theo trạng thái; dòng kết quả mới highlight rồi tự tắt.
      '#flash::before{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border:3px solid #4ade80;border-radius:50%;opacity:0;pointer-events:none;}',
      '#flash.on::before{border-color:rgba(74,222,128,.9);animation:popRing .6s ease-out;}',
      '#flash.extra::before{border-color:rgba(74,222,128,.9);animation:popRing .6s ease-out;} /* 2026-08-17: Dư → xanh lá */',
      '#flash.err::before{border-color:rgba(248,113,113,.9);animation:popRing .6s ease-out;}',
      '@keyframes popRing{0%{transform:scale(.25);opacity:.95;}100%{transform:scale(2.6);opacity:0;}}',
      '#flash b{display:inline-block;}',
      '#flash.on b{animation:popMarkPop .5s ease-out;}',
      '#flash.extra b{animation:popMarkPop .5s ease-out;}',
      '#flash.err b{animation:popMarkPop .5s ease-out;}',
      '@keyframes popMarkPop{0%{transform:scale(.25);opacity:0;}45%{transform:scale(1.3);opacity:1;}100%{transform:scale(1);opacity:1;}}',
      '#frame.fl-ok{animation:popFrameGlowOk .65s ease-out;}',
      '#frame.fl-extra{animation:popFrameGlowExtra .65s ease-out;}',
      '#frame.fl-err{animation:popFrameGlowErr .65s ease-out;}',
      '@keyframes popFrameGlowOk{0%{border-color:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.4),0 0 26px rgba(74,222,128,.65),inset 0 0 20px rgba(74,222,128,.22);}100%{border-color:rgba(255,255,255,.85);box-shadow:none;}}',
      '@keyframes popFrameGlowExtra{0%{border-color:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.4),0 0 26px rgba(74,222,128,.65),inset 0 0 20px rgba(74,222,128,.22);}100%{border-color:rgba(255,255,255,.85);box-shadow:none;}} /* 2026-08-17: Dư → xanh lá */',
      '@keyframes popFrameGlowErr{0%{border-color:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.4),0 0 26px rgba(248,113,113,.65),inset 0 0 20px rgba(248,113,113,.22);}100%{border-color:rgba(255,255,255,.85);box-shadow:none;}}',
      '.rrow.new{animation:rrowNew .9s ease-out;}',
      '@keyframes rrowNew{0%{background:rgba(74,222,128,.18);}100%{background:transparent;}}',
      '#status{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;text-align:center;background:rgba(0,0,0,.62);font-size:14px;color:#e2e8f0;}',
      '#bar{display:flex;gap:12px;justify-content:center;align-items:center;padding:14px;background:#0d111a;}',
      // QUÉT LIÊN TỤC (2026-08-17): danh sách kết quả quét ngay dưới camera —
      // camera ở trên (#view), thông tin vừa quét ở dưới (#results), cuộn được.
      '#results{flex:2 1 40%;min-height:0;overflow-y:auto;background:#0d111a;border-top:1px solid rgba(255,255,255,.12);}',
      '#resultsHead{padding:8px 14px;font-size:13px;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.08);}',
      '#resultsBody{padding:4px 0;}',
      '#resultsBody:empty::after{content:"Quét mã để xem kết quả ở đây — camera không tự đóng";display:block;padding:10px 14px;color:#64748b;font-size:12.5px;}',
      '.rrow{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;color:#e2e8f0;border-bottom:1px solid rgba(255,255,255,.06);}',
      '.rrow:last-child{border-bottom:0;}',
      '.rrow b{color:#fff;white-space:nowrap;}',
      '.rrow .rtime{color:#94a3b8;font-size:11px;}',
      '.rbadge{margin-left:auto;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}',
      '.rbadge.ok{background:rgba(46,125,50,.28);color:#81c784;}',
      '.rbadge.extra{background:rgba(255,152,0,.22);color:#ffb74d;}',
      '.rbadge.err{background:rgba(211,47,47,.28);color:#ef9a9a;}',
      // THÔNG BÁO CAMERA POPUP — thẻ lớn giống web (2026-08-31)
      '#camScanCard{margin:8px 14px;border-radius:12px;padding:12px 14px;border:2px solid rgba(255,255,255,.18);background:#fff;text-align:left;min-height:68px;animation:popStampIn .32s ease-out;}',
      '#camScanCard.ok{border-color:#188038;background:#e6f4ea;}',
      '#camScanCard.extra{border-color:#e37400;background:#fef7e0;}',
      '#camScanCard.err{border-color:#d93025;background:#fce8e6;}',
      '#camScanCard.out{border-color:#0b57d0;background:#e8f0fe;}',
      '#camScanCard .sc-status{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#5f6368;}',
      '#camScanCard.ok .sc-status{color:#188038;}',
      '#camScanCard.extra .sc-status{color:#e37400;}',
      '#camScanCard.err .sc-status{color:#d93025;}',
      '#camScanCard.out .sc-status{color:#0b57d0;}',
      '#camScanCard .sc-name{font-size:18px;font-weight:800;line-height:1.25;margin-top:2px;color:#1f1f1f;word-break:break-word;}',
      '#camScanCard .sc-meta{font-size:11.5px;color:#5f6368;margin-top:3px;line-height:1.4;word-break:break-word;}',

      '      // Khi quét liên tục nhanh, response cập nhật tên NV lạ về sau dòng cuối.',
      '      for (var j = body.children.length - 1; j >= 0; j--) {',
      '        var c = body.children[j];',
      '        if (c.getAttribute && c.getAttribute("data-code") === String(d.code)) { row = c; break; }',
      '      }',
      '    }',
      '    if (!row) {',
      '      row = document.createElement("div");',
      '      row.className = "rrow new"; // highlight dòng mới rồi tự tắt (2026-08-17)',
      '      row.setAttribute("data-code", String(d.code));',
      '      body.appendChild(row);',
      '      if (body.children.length > 100) { try { body.removeChild(body.children[0]); } catch (e) {} }',
      '    } else {',
      // BUG 2026-08-19: update CHỈ mang tên (camUpdateName gửi status/time rỗng) →
      // giữ badge trạng thái + giờ cũ của dòng, không xóa trắng.
      '      var ob = row.querySelector && row.querySelector(".rbadge");',
      '      var ot = row.querySelector && row.querySelector(".rtime");',
      '      if (ob && ob.textContent) d.status = ob.textContent;',
      '      if (ot && ot.textContent) d.time = ot.textContent;',
      '      row.innerHTML = "";',
      '    }',
      '    var b = document.createElement("b"); b.textContent = d.code; row.appendChild(b);',
      '    var name = document.createElement("span"); name.textContent = d.staffName || ""; row.appendChild(name);',
      '    var time = document.createElement("span"); time.className = "rtime"; time.textContent = d.time || ""; row.appendChild(time);',
      '    var badge = document.createElement("span");',
      '    badge.className = "rbadge " + (d.isError ? "err" : (d.status === "Dư" ? "extra" : "ok"));',
      '    badge.textContent = d.status || "";',
      '    row.appendChild(badge);',
      '    try{renderPopScanCard(d);}catch(e){}',
      '    // Scroll CONTAINER #results (overflow-y:auto) xuống dòng mới — trước set trên',
      '    // #resultsBody (con, không scroll được) → danh sách đứng im (bug 2026-08-17).',
      '    var sc = document.getElementById("results");',
      '    if (sc) sc.scrollTop = sc.scrollHeight;',
      '    if (head) head.textContent = "Kết quả quét (" + body.children.length + ")";',
      '  }',
      '  window.addEventListener("message", function (ev) {',
      '    if (!ev.data || typeof ev.data !== "object") return;',
      // Chỉ nhận từ trang cha mở popup (bug 2026-08-19): trước nhận mọi nguồn — trang
      // ngoài có thể gửi rcScanInfo giả để chèn dòng vào danh sách kết quả.
      '    if (ev.source !== window.opener) return;',
      '    if (ev.origin && ev.origin !== window.location.origin) return;',
      '    if (ev.data.type === "rcScanInfo") addResultRow(ev.data);',
      '  });',
      '  window.addEventListener("unload", stop);',
      '  setTimeout(function () { start(false); }, 120);',
      '})();',
      '<\/script>',
      '</body>',
      '</html>'
    ].join('\n');
  }

  // Poll popup đã đóng chưa (mỗi 500ms) — browser ✕ / đóng tab không gửi message về
  // parent → camPopupBusy/camOpen/__RC_CAM_OPEN__ kẹt vĩnh viễn, modal không mở lại
  // được (bug 2026-08-18). Chỉ chạy khi popup đang mở.
  function startCamPopupWatch() {
    stopCamPopupWatch();
    camPopupWatch = setInterval(function () {
      if (camPopupRef && camPopupRef.closed) {
        stopCamPopupWatch();
        camPopupBusy = false;
        camPopupRef = null;
        camOpen = false;
        try { window.__RC_CAM_OPEN__ = false; } catch (e) {}
      }
    }, 500);
  }
  function stopCamPopupWatch() {
    if (camPopupWatch) { clearInterval(camPopupWatch); camPopupWatch = null; }
  }

  function openScanPopup() {
    var popup = null;
    try { popup = window.open('', CAM_POPUP_NAME); } catch (e) { popup = null; }
    if (!popup) {
      // Popup bị chặn (trình duyệt không cho mở) → fallback camera native
      // FIX-19: reset cờ trước khi vào fallback native (tránh kẹt __RC_CAM_OPEN__ khi user hủy picker)
      camOpen = false;
      try { window.__RC_CAM_OPEN__ = false; } catch (e2) {}
      camStatus('📷 Trình duyệt chặn popup — dùng camera chụp ảnh thay thế', true);
      pickCameraImage();
      return;
    }
    if (camPopupBusy && camPopupRef && !camPopupRef.closed) {
      // Popup quét đang mở (chưa nhận mã / chưa đóng) → đưa về popup đó
      try { camPopupRef.focus(); } catch (e) {}
      return;
    }
    // Popup trước đã đóng (bấm ✕ Đóng / đóng tab) hoặc chưa từng mở → mở popup mới.
    // KHÔNG được chỉ focus rồi return: window.open('', tên) tạo window MỚI khi window
    // cũ cùng tên đã đóng — nếu bỏ qua không viết nội dung → TAB TRẮNG (bug 2026-08-13).
    camPopupBusy = true;
    camPopupRef = popup;
    // FIX-19: phiên popup quét live thực sự bắt đầu → set cờ
    camOpen = true;
    try { window.__RC_CAM_OPEN__ = true; } catch (e2) {}
    startCamPopupWatch();
    var html = buildScanPopupHtml();
    try {
      popup.document.open();
      popup.document.write(html);
      popup.document.close();
      camStatus('📷 Quét mã trong cửa sổ vừa mở — đưa mã vào khung là tự nhận', false);
    } catch (e) {
      stopCamPopupWatch();
      camPopupBusy = false;
      camPopupRef = null;
      camOpen = false;
      try { window.__RC_CAM_OPEN__ = false; } catch (e2) {}
      pickCameraImage();
    }
  }

  // ===== NHẬN KẾT QUẢ TỪ POPUP QUÉT (postMessage) =====
  // (FIX-19: startScanResultPolling/stopScanResultPolling + camLegacyPollTimer/Since
  // ĐÃ XOÁ — dead code, 0 caller toàn repo; đường localStorage của tab ?scan=1 cũ.)

  // Nhận kết quả từ POPUP quét live / tab quét (postMessage về iframe này)
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('message', function (ev) {
      if (!ev.data || typeof ev.data !== 'object') return;
      // Chỉ nhận từ popup quét mình mở HOẶC nguồn cùng origin (bug 2026-08-19): trước đây
      // chấp nhận mọi nguồn + gửi '*' → trang ngoài có thể gửi mã giả vào submitScan.
      // Popup live = about:blank (cùng origin) → source khớp camPopupRef; tab quét cũ
      // (đã bỏ là đường chính, vẫn nhận kết quả qua localStorage) là cùng origin GAS.
      if (ev.source !== camPopupRef && ev.origin !== window.location.origin) return;
      if (ev.data.type === 'rcScanResult' && ev.data.code) {
        onCameraDecoded(String(ev.data.code));
        return;
      }
      if (ev.data.type === 'rcScanPopup' && ev.data.state === 'failed') {
        // Popup không mở được camera (bị chặn/không hỗ trợ) → fallback camera native
        stopCamPopupWatch();
        camPopupBusy = false;
        camPopupRef = null;
        camOpen = false;
        try { window.__RC_CAM_OPEN__ = false; } catch (e2) {}
        camStatus('📷 Camera popup bị chặn — dùng camera chụp ảnh thay thế', true);
        setTimeout(pickCameraImage, 250);
        return;
      }
      if (ev.data.type === 'rcScanPopup' && ev.data.state === 'closed') {
        // User bấm "✕ Đóng" trong popup → popup tự đóng → cho mở popup mới ở lần sau
        stopCamPopupWatch();
        camPopupBusy = false;
        camPopupRef = null;
        camOpen = false;
        try { window.__RC_CAM_OPEN__ = false; } catch (e2) {}
      }
    });
  }

  // ===== LIVE SCAN (trong trang — GAS iframe + ngoài GAS) =====
  // force=true khi gọi từ nút "▶ Bật camera" (user đã chạm — có gesture). Nếu getUserMedia
  // vẫn fail lúc này → iframe/trình duyệt chặn camera trực tiếp → fallback camera native
  // (<input capture>) để không kẹt ở màn hình đen.
  function startCameraLive(force) {
    var modal = document.getElementById('cameraModal');
    var video = camVideo();
    var statusEl = document.getElementById('camStatusLive');
    if (!modal || !video) return;
    if (camStream) return; // đang mở rồi
    modal.style.display = 'flex';
    modal.setAttribute('aria-hidden', 'false');
    if (statusEl) statusEl.textContent = 'Đang mở camera…';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      if (statusEl) statusEl.textContent = 'Trình duyệt không hỗ trợ camera trực tiếp';
      var sb0 = document.getElementById('camStartBtn');
      if (sb0) sb0.style.display = 'inline-flex';
      return;
    }
    var mySeq = ++camSeq; // FIX-3 token — đóng modal khi prompt đang hiện sẽ bump camSeq
    // ideal 1920x1080 (2026-08-17): mã ở 30cm → vạch mỏng cần chi tiết cao; iPhone trả 1920
    // nếu hỗ trợ, thiết bị yếu → trả độ phân giải gần nhất (ideal, không bắt buộc)
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false })
      .then(function (stream) {
        if (mySeq !== camSeq) { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} return; }
        var curModal = document.getElementById('cameraModal');
        if (!curModal || curModal.style.display !== 'flex') { try { stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} return; }
        camStream = stream;
        video.srcObject = stream;
        video.muted = true;
        video.playsInline = true;
        video.setAttribute('muted', '');
        video.setAttribute('playsinline', '');
        // Lấy nét liên tục MẶC ĐỊNH (2026-08-16): thẻ nét lấy nét nhanh hơn ngay từ đầu,
        // không cần bấm 🔍 Tìm Mã. iOS Safari không expose focus control → no-op, bỏ qua im lặng.
        try {
          var camTrack = stream.getVideoTracks && stream.getVideoTracks()[0];
          if (camTrack && camTrack.applyConstraints) {
            var _p = camTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
            if (_p && _p.catch) _p.catch(function(){});
          }
        } catch (e) { /* không hỗ trợ focus control — bỏ qua */ }
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
        if (statusEl) statusEl.textContent = 'Đưa mã vào khung, giữ yên — tự nhận diện';
        var sb = document.getElementById('camStartBtn');
        if (sb) sb.style.display = 'none';
        camStartedAt = Date.now();
        camHintShown = false;
        camOcrFailStreak = 0;
        startCameraDecodeLoop();
        // P2-2 (2026-08-23): OCR lazy — không start ngay (2MB wasm), chỉ sau 5 lần ZXing fail liên tiếp
        // (mã nét không cần OCR → tiết kiệm băng thông/CPU; mã mờ mới cần fallback chữ).
        // TỰ TÌM MÃ (2026-08-17, điều chỉnh): fast path 800px decode MỖI tick + full
        // chain mỗi 2 tick + focus liên tục — KHÔNG bật find mode mặc định (full chain
        // MỖI tick ~1.5s/tick trên iPhone → nhận rất chậm, bug 2026-08-17); bấm nút
        // 🔍 Tìm Mã vẫn ép full chain mọi tick khi cần bắt mã khó.
      })
      .catch(function () {
        if (force) {
          // Đã có user gesture mà getUserMedia VẪN fail → trình duyệt/iframe chặn
          // camera trực tiếp → dùng camera native (chạy 100% trong iframe GAS).
          // FIX-19: reset cờ trước fallback
          camOpen = false;
          try { window.__RC_CAM_OPEN__ = false; } catch (e2) {}
          camStatus('📷 Trình duyệt chặn camera trực tiếp — dùng camera chụp ảnh thay thế', true);
          setTimeout(pickCameraImage, 250);
          return;
        }
        // Lần đầu iOS chưa có user gesture (NotAllowedError) → hiện nút để chạm 1 lần
        var st = document.getElementById('camStatusLive');
        if (st) { st.textContent = '📷 Bấm nút dưới để bật camera'; st.style.color = '#ffd9a8'; }
        var sb = document.getElementById('camStartBtn');
        if (sb) sb.style.display = 'inline-flex';
      });
  }

  function startCameraDecodeLoop() {
    stopCameraDecodeLoop();
    // 1) BarcodeDetector — loop rAF trên video trực tiếp (QR + 1D)
    if (window.BarcodeDetector) {
      try { camDetector = new window.BarcodeDetector({ formats: CAM_FORMATS }); } catch (e) { camDetector = null; }
    }
    if (camDetector) {
      var loop = function () {
        var video = camVideo();
        if (!camStream || !video || !video.videoWidth) { camRaf = null; return; }
        camDetector.detect(video).then(function (results) {
          // P2-6: guard stale sau khi đóng camera (promise resolve muộn) — chỉ nhận khi phiên còn mở
          if (!camScanMode && (!camOpen || !camStream)) { camRaf = requestAnimationFrame(loop); return; }
          if (results && results.length && results[0].rawValue) {
            onCameraDecoded(results[0].rawValue);
            // QUÉT LIÊN TỤC: sau 1 mã KHÔNG dừng loop — lên lịch frame kế tiếp
            // (bug 2026-08-17: return sớm không rAF → quét liên tục chết sau mã đầu).
            camRaf = requestAnimationFrame(loop);
            return;
          }
          camRaf = requestAnimationFrame(loop);
        }).catch(function () { camRaf = requestAnimationFrame(loop); });
      };
      camRaf = requestAnimationFrame(loop);
      return;
    }
    // 2) Không có BarcodeDetector (iOS Safari…) → TỐI ƯU 2026-08-16: 1 canvas 1280px dùng
    //    chung cho cả fast path lẫn full chain (không chụp 2 lần). FAST PATH MỖI tick:
    //    1 config Quagga mạnh nhất — nhận MỌI mã dạng "Ops…" (OPS + 3..9 số), kể cả NV
    //    chưa có trong StaffData (Dư) → done NGAY tick đầu, không chờ 3 config. TỐI ƯU
    //    2026-08-17: fast path Quagga chạy TRƯỚC jsQR — mã NV là Code128/39 1D nên jsQR
    //    (QR) fail ~mọi lần; chỉ chạy jsQR khi fast fail (QR hiếm trong use case này) →
    //    tiết ~30-80ms mỗi tick. Chỉ khi fast fail mới chạy full chain (theo nhịp /
    //    Tìm Mã = mọi tick) — majority ≥2 config chống đọc SAI. Nhịp tick 450ms
    //    (2026-08-17, giảm từ 600ms — khớp cooldown 1.5s mới). Đưa mã vào khung là tự
    //    nhận (không dùng motion gate — bug 2026-08-12).
    ensureZxingWorker(); // decode sâu TRY_HARDER chạy nền trong Web Worker (2026-08-17) —
                         // fail-open: không tạo được (CSP/trình duyệt cũ) → tick main như cũ
    camTimer = setInterval(function () {
      if (camDecoding || camSnapping || !camStream) return;
      var video = camVideo();
      if (!video || video.readyState < 2 || !video.videoWidth) return;
      // BỎ gate camLastFrame (bug 2026-08-17): interval 250 < gate 260 → decode chỉ chạy MỖI
      // 2 lần fire = 500ms/tick (từ khi giảm gate 450→320→260 mà không giảm interval, chu kỳ
      // tăng 450→500ms — "tối ưu" làm CHẬM hơn). camDecoding guard đã chặn chồng lấn; interval
      // 200ms + camera 30fps → mỗi fire có frame mới, không decode trùng frame.
      var now = Date.now();
      // TỰ ZOOM (2026-08-31): 2.5s không nhận được mã nào → zoom nhẹ 1 bậc (mã nhỏ/xa →
      // vạch dày hơn trong khung → decode dễ hơn). User zoom tay bất cứ lúc nào qua − / +.
      if (camShouldAutoZoom(now)) {
        camZoomStep(1);
        var zEl = document.getElementById('camStatusLive');
        if (zEl) zEl.textContent = '🔍 Tự zoom ' + camZoomCurrent.toFixed(1) + 'x — đưa mã vào khung';
      }
      // Gợi ý khoảng cách (2026-08-17): iPhone focus gần nhất ~10cm — dí sát quá làm vạch
      // ngoài vùng nét dù màn hình nhìn nét → decode fail lặp lại ("lúc được lúc không").
      // Hiện hint 1 lần/phiên khi 4s chưa nhận được mã nào.
      if (!camLastCodeTs && !camHintShown && camStartedAt && now - camStartedAt > 4000) {
        camHintShown = true;
        var hintEl = document.getElementById('camStatusLive');
        if (hintEl) hintEl.textContent = '💡 Chưa nhận được mã — đưa thẻ cách camera 10–30cm, thẳng góc, đủ sáng';
      }
      var frame = camFrameToImageData(video, 1920);
      if (!frame) return;
      camDecoding = true;
      camWorkerSend(frame); // decode sâu TRY_HARDER nền — không chặn tick (2026-08-17)
      // FAST PATH MỖI tick (2026-08-16 tối ưu): thẻ nét là done NGAY — thắng thì không
      // cần jsQR/full chain. jsQR chỉ chạy khi fast fail (2026-08-17 đảo thứ tự).
      // 2026-08-17 (đảo từ 800px): decode frame 1280px ĐẦY ĐỦ — 800px downscale làm vạch
      // mỏng alias → miss frame "lúc được lúc không" dù mã nét. 2 config (x-large → medium)
      // tăng xác suất bắt mỗi tick; full chain vẫn giữ nguyên làm fallback.
      camFastDecode(frame, function (code) {
        if (code) { camDecoding = false; onCameraDecoded(code); return; }
        // QR đã do ZXing lo (POSSIBLE_FORMATS gồm QR_CODE) — bỏ jsQR khỏi tick (2026-08-17:
        // jsQR trên frame 1920 tốn ~50-100ms mỗi tick; chỉ giữ jsQR trong full chain/ảnh chụp
        // làm fallback khi ZXing không load được).
        var decide = camShouldFullDecode(camFullChainTick, camFindMode ? 1 : CAM_FULL_CHAIN_INTERVAL);
        camFullChainTick = decide.tickCount;
        if (decide.run) {
          camDecoding = false;
          camAutoDecode(frame); // full chain (jsQR + 3 config + majority) — camAutoDecode tự set cờ
          // full chain sẽ gọi onCameraDecoded nếu thành công (reset streak); nếu fail thì
          // streak vẫn tăng ở tick kế — không tăng ngay để tránh đếm double (fast fail + full fail)
          return;
        }
        camDecoding = false;
        // P2-2: fast fail + không chạy full chain → 1 lần ZXing fail; đủ 5 lần mới lazy-load OCR
        if (!camOcrEnabled && !camOcrLoading && !camOcrLoadFailed) {
          camOcrFailStreak++;
          if (camOcrFailStreak >= 5) startOcrLoop();
        }
      });
    }, 200);
  }

  function stopCameraDecodeLoop() {
    if (camRaf) { cancelAnimationFrame(camRaf); camRaf = null; }
    if (camTimer) { clearInterval(camTimer); camTimer = null; }
    stopZxingWorker();        // terminate worker decode nền (2026-08-17) — đóng camera là dừng
    camDetector = null;
    camDecoding = false;
    camFullChainTick = 0;     // reset đếm tick khi dừng/khởi động lại loop
  }

  function camFrameToImageData(video, maxSide) {
    try {
      var w = video.videoWidth || 0;
      var h = video.videoHeight || 0;
      if (!w || !h) return null;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      // Tối ưu 2026-08-16: DÙNG LẠI 1 canvas/context — không tạo mới mỗi tick (~600ms).
      // An toàn: mọi consumer đọc frame ĐỒNG BỘ trong tick (jsQR đọc ImageData snapshot;
      // Quagga/fast dùng canvas.toDataURL — snapshot ngay lúc gọi; decode ảnh chụp dùng
      // canvas riêng của nó). camDecoding/camSnapping chặn redraw giữa chừng.
      if (!camSharedCanvas) {
        camSharedCanvas = document.createElement('canvas');
        // willReadFrequently (2026-08-17): đọc getImageData mỗi tick liên tục — trình duyệt
        // tối ưu canvas cho readback (tránh GPU readback chậm); không hỗ trợ → no-op an toàn.
        camSharedCtx = camSharedCanvas.getContext('2d', { willReadFrequently: true });
        // TĂNG TƯƠNG PHẢN khi vẽ frame (2026-08-17, user: mực nhạt/mất 1 đầu — súng laser đọc
        // được vì pattern vẫn còn chỉ quá nhạt): canvas filter áp cho MỌI frame decode trên main
        // (ZXing + Quagga + OCR đều đọc từ canvas này) → vạch nhạt hiện rõ. Trình duyệt không
        // hỗ trợ ctx.filter (iOS < 16.4) → property bị bỏ qua, vẽ ảnh gốc — no-op an toàn.
        try { camSharedCtx.filter = 'contrast(1.35)'; } catch (e) {}
      }
      if (camSharedCanvas.width !== cw || camSharedCanvas.height !== ch) {
        camSharedCanvas.width = cw;
        camSharedCanvas.height = ch;
        // Resize canvas → context state RESET (mất filter) — set LẠI contrast ở đây.
        // Bug 2026-08-19: trước đây filter chỉ set lúc tạo canvas (0x0) → lần resize
        // đầu tiên (luôn xảy ra ở frame thật đầu) xóa sạch → contrast CHƯA BAO GIỜ áp dụng.
        try { camSharedCtx.filter = 'contrast(1.35)'; } catch (e) {}
      }
      var ctx = camSharedCtx;
      ctx.drawImage(video, 0, 0, cw, ch);
      var imageData = ctx.getImageData(0, 0, cw, ch);
      return { data: imageData, w: cw, h: ch, canvas: camSharedCanvas };

  // (bắt mã xa 30cm — vạch mỏng giữ nguyên px); Quagga (fallback/full chain) decode 1280 như
  // cũ — toDataURL 1920 sẽ rất chậm trên iPhone. scale >= 1 → trả frame gốc (không copy).

  // [CAM_ZOOM_BASE, CAM_ZOOM_MAX] và khoảng zoom track hỗ trợ (getCapabilities().zoom —
  // min/max mỗi máy khác nhau). Apply qua advanced constraint — trình duyệt không hỗ trợ
  // → no-op an toàn (iOS Safari). Chỉ apply khi mức THẬT SỰ đổi (đỡ giật preview).

    if (!t || !t.applyConstraints) return;

  // 📸 Chụp frame hiện tại rồi decode tĩnh (fallback khi live không bắt được)

  // ===== AUTO-DECODE: chạy ĐÚNG chain nút "📸 Chụp" theo nhịp cố định =====
  // PURE: quyết định tick này có chạy full-chain decode không (không chạm DOM — test
  // được trong Node, xem tests/camera-autosnap.test.js). Trả { run, tickCount }:
  // run=true khi đủ CAM_FULL_CHAIN_INTERVAL tick frame đã qua (nhịp cố định, không
  // phụ thuộc độ rung — motion gate cũ quá nhạy, bug 2026-08-12).
  function camShouldFullDecode(tickCount, interval) {
    if (tickCount + 1 >= interval) return { run: true, tickCount: 0 };
    return { run: false, tickCount: tickCount + 1 };
  }

  // FAST PATH (2026-08-16 tối ưu): decode frame 1280px ĐẦY ĐỦ (không downscale — 800px làm
  // vạch mỏng alias → miss frame, bug 2026-08-17 "lúc được lúc không"), format đã lọc —
  // NHẬN MỌI MÃ DẠNG "Ops…" (OPS + 3..9 số), KỂ CẢ CHƯA CÓ TRONG StaffData (Dư), để done
  // NGAY tick đầu không chờ 3 config. NV đã biết → khớp STAFF_INFO (nguồn chuẩn, cắt đúng
  // checksum dư); NV lạ → ưu tiên cắt 1 ký tự cuối (quirk +1 chiếm đa số). 2 config locator:
  // x-large (mã to/dí sát) → fail thì medium (mã nhỏ/xa hơn) — tăng xác suất bắt mỗi tick.
  var CAM_FAST_QUAGGA_CONFIGS = [
    { patchSize: 'x-large', halfSample: false },
    { patchSize: 'medium', halfSample: false }
  ];

  // - Khớp NV đã biết → trả mã chính xác (normalizeQuaggaCode128 dùng STAFF_INFO cắt checksum).
  // - NV lạ: FNC1 cuối bị bỏ; thử raw / cắt 1 / cắt 2 ký tự cuối còn đúng dạng Ops + 3..9 số
  //   → ưu tiên CẮT 1 (quirk +1 chiếm đa số), rồi raw (checksum là special code — hiếm),
  //   rồi cắt 2 (quirk +2 rất hiếm).

    if (!s) return null;
    while (s.length && s.charCodeAt(s.length - 1) === 29) s = s.slice(0, -1); // FNC1 (GS1) cuối
    if (!s) return null;
    var knownNorm = normalizeQuaggaCode128(s, camKnownStaffCode);
    if (camKnownStaffCode(knownNorm)) return knownNorm; // NV đã biết — nguồn chuẩn
    var c0 = normalizeOpsCode(knownNorm);
    var c1 = knownNorm.length > 4 ? normalizeOpsCode(knownNorm.slice(0, -1)) : null;
    var c2 = knownNorm.length > 5 ? normalizeOpsCode(knownNorm.slice(0, -2)) : null;

  function camFastDecode(frame, onCode) {

    // nghiêng/mờ nhẹ mà Quagga 2016 miss ("lúc được lúc không"). ZXing fail → Quagga fallback.

  function camFastQuagga(frame, onCode) {

  // ===== DECODE (dùng chung: ảnh chụp + live frame) =====
  // Ảnh chụp → decode ở NHIỀU kích thước + nhiều cấu hình locator.
  // quiet = true → fail không hiện thông báo (live loop tự tiếp tục).
  function decodeCameraImage(file) {
    if (camDecoding) return;
    camDecoding = true;
    camStatus('📷 Đang nhận diện mã…');
    var url = URL.createObjectURL(file);
    var img = new Image();
    var revoked = false;
    function doRevoke() { if (!revoked) { try { URL.revokeObjectURL(url); } catch (err) {} revoked = true; } }
    img.onload = function () {
      doRevoke();
      var w = img.naturalWidth || 0;
      var h = img.naturalHeight || 0;
      if (!w || !h) { camFail('Không đọc được ảnh — thử lại'); return; }
      decodeImageMultiScale(img, w, h);
    };
    img.onerror = function () {
      doRevoke();
      camFail('Không đọc được ảnh — thử lại');
    };
    img.src = url;
    // Safety: revoke dù onload/onerror không bao giờ bắn (file hỏng, tab đóng sớm)
    setTimeout(doRevoke, 15000);
  }

  function decodeImageMultiScale(img, w, h) {
    var maxSide = Math.max(w, h);
    var scales = [];
    var seen = {};
    function add(s) {
      if (s > 1) s = 1;
      var key = s.toFixed(4);
      if (!seen[key]) { seen[key] = true; scales.push(s); }
    }
    add(1);                // ảnh gốc — BarcodeDetector đọc tốt nhất
    add(1280 / maxSide);   // 1280px
    add(800 / maxSide);    // 800px — Quagga nhận diện nhanh/nét hơn
    scales.sort(function (a, b) { return b - a; });
    decodeScaleStep(img, w, h, scales, 0);
  }

  function decodeScaleStep(img, w, h, scales, idx) {
    if (idx >= scales.length) {
      camDecoding = false;
      camSnapping = false;
      ocrPhotoFallback(img, w, h); // mã vạch mờ → thử đọc chữ Ops… (2026-08-16)
      return;
    }
    var scale = scales[idx];
    var cw = Math.max(1, Math.round(w * scale));
    var ch = Math.max(1, Math.round(h * scale));
    var canvas = document.createElement('canvas');
    canvas.width = cw;
    canvas.height = ch;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, cw, ch);
    var imageData;
    try { imageData = ctx.getImageData(0, 0, cw, ch); } catch (e) {
      decodeScaleStep(img, w, h, scales, idx + 1);
      return;
    }
    // BarcodeDetector trên canvas ở scale này
    if (window.BarcodeDetector) {
      try {
        var detector = new window.BarcodeDetector({ formats: CAM_FORMATS });
        detector.detect(canvas).then(function (results) {
          if (results && results.length && results[0].rawValue) {
            onCameraDecoded(results[0].rawValue);
          } else {
            decodeFallbackChain(imageData, cw, ch, function () { decodeScaleStep(img, w, h, scales, idx + 1); });
          }
        }).catch(function () {
          decodeFallbackChain(imageData, cw, ch, function () { decodeScaleStep(img, w, h, scales, idx + 1); });
        });
        return;
      } catch (err) { /* không khởi tạo được → chain */ }
    }
    decodeFallbackChain(imageData, cw, ch, function () { decodeScaleStep(img, w, h, scales, idx + 1); });
  }

  function decodeFallbackChain(imageData, w, h, onDone) {
    // jsQR — QR code
    if (window.jsQR) {
      try {
        var qr = window.jsQR(imageData.data, w, h);
        if (qr && qr.data) { onCameraDecoded(qr.data); return; }
      } catch (err) { /* tiếp tục */ }
    }
    // Quagga — barcode vạch 1D (Code128/Code39/EAN…): chạy HẾT các config rồi CHỈ nhận
    // mã được ≥2 config đồng thuận (sau normalize) — chống đọc SAI (bug 2026-08-16, xem
    // normalizeQuaggaCode128/camPickQuaggaMajority bên dưới).
    quaggaDecodeImageData(imageData, w, h, onCameraDecoded, onDone);
  }

  // Dùng chung cho ảnh chụp lẫn live frame (tách 2 khối trùng y hệt 2026-08-16): chạy
  // full chain Quagga (≥2 config đồng thuận sau normalize) trên 1 ImageData.
  // onCode(agree) khi nhận mã; onDone() khi không nhận / Quagga không có / lỗi.
  function quaggaDecodeImageData(imageData, w, h, onCode, onDone) {
    if (!window.Quagga) { onDone(); return; }
    try {
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').putImageData(imageData, 0, 0);

      // toDataURL 1920 sẽ rất chậm trên iPhone.
      if (Math.max(w, h) > 1280) {
        var small = camDownscaleFrame({ canvas: canvas, w: w, h: h }, 1280);
        canvas = small.canvas;
      }
      var src = canvas.toDataURL('image/jpeg', 0.85); // 0.85 thay 0.92 — encode nhanh hơn (2026-08-17)
      runQuaggaConfigs(src, CAM_QUAGGA_CONFIGS, 0, [], function (results) {
        var agree = camPickQuaggaMajority(results, camKnownStaffCode, 2);
        if (agree) { onCode(agree); return; }
        onDone();
      });
    } catch (err) { onDone(); }
  }

  // quiet=true → fail im lặng (live loop tiếp tục); fullChain=true → decode đủ 3 config
  // Quagga như nút Chụp (auto-snap/snap); onFail → callback sau khi fail (reset cờ auto-snap).
  function decodeCameraImageData(imageData, w, h, canvas, quiet, fullChain, onFail) {
    // 1) BarcodeDetector — native Chrome/Edge/Android (QR + vạch 1D)
    if (window.BarcodeDetector) {
      try {
        var detector = new window.BarcodeDetector({ formats: CAM_FORMATS });
        detector.detect(canvas).then(function (results) {
          if (results && results.length && results[0].rawValue) {
            onCameraDecoded(results[0].rawValue);
          } else {
            decodeCameraFallback(imageData, w, h, quiet, fullChain, onFail);
          }
        }).catch(function () { decodeCameraFallback(imageData, w, h, quiet, fullChain, onFail); });
        return;
      } catch (err) { /* BarcodeDetector tồn tại nhưng không khởi tạo được → fallback */ }
    }
    decodeCameraFallback(imageData, w, h, quiet, fullChain, onFail);
  }

  function decodeCameraFallback(imageData, w, h, quiet, fullChain, onFail) {
    // 2) jsQR — QR code (iOS Safari / trình duyệt không có BarcodeDetector)
    if (window.jsQR) {
      try {
        var qr = window.jsQR(imageData.data, w, h);
        if (qr && qr.data) { onCameraDecoded(qr.data); return; }
      } catch (err) { /* tiếp tục fallback */ }
    }
    // 3) Quagga — barcode vạch 1D (Code128/Code39/EAN…) — fallback iOS
    var onDone = quiet
      ? function () { camDecoding = false; if (onFail) onFail(); }   // im lặng: loop tiếp tục
      : function () { camFail('Không nhận diện được mã — chụp lại gần hơn, đủ sáng, thẳng góc'); };
    if (window.Quagga && fullChain) {
      // Chỉ chạy Quagga ở full chain (auto-snap/snap/ảnh) + ≥2 config đồng thuận.
      // FAST PATH (tick live 800px + halfSample) KHÔNG chạy Quagga nữa — config yếu đó
      // từng nhận NHẦM mã (bug 2026-08-16); tick live chỉ bắt bằng BarcodeDetector/jsQR,
      // mã vạch 1D do full chain (mỗi 2 tick) xử lý với đồng thuận.
      quaggaDecodeImageData(imageData, w, h, onCameraDecoded, onDone);
      return;
    }
    onDone();
  }

  // ===== CODE128 NORMALIZE + ĐỒNG THUẬN (PURE — test được trên Node: tests/camera-code128.test.js) =====
  // Vì sao cần (bug 2026-08-16 — camera nhận mã vạch nhưng SAI, user test trên iPhone):
  // Quagga vendored (lib-quagga.html, upstream 2016) code_128_reader có 2 quirk làm sai mã:
  //   1) checksum symbol ở CODE_C (mã SỐ) là symbol 2 ký tự (00-99) nhưng decode() chỉ
  //      v.splice(v.length-1, 1) → output CÒN THỪA 1 digit checksum.
  //   2) codeset kết thúc bằng special code (FNC1/switch) → checksum char KHÔNG bị bỏ →
  //      output kèm cả checksum char (thừa 1 ký tự).
  // Mã quét là mã NV (staffId, prefix Ops) → dùng STAFF_INFO (js.html, global — file này
  // load trước js.html nhưng hàm chỉ gọi lúc runtime) làm nguồn chuẩn: raw không khớp NV
  // nào mà bỏ 1 (hoặc 2) ký tự cuối khớp đúng 1 NV → cắt. Không khớp → giữ nguyên (NV
  // lạ / Dư vẫn quét được — không phá mã thật).
  function camKnownStaffCode(code) {
    var q = String(code || '').trim().toUpperCase();
    if (!q) return false;
    try { return !!(typeof STAFF_INFO !== 'undefined' && STAFF_INFO[q]); } catch (e) { return false; }
  }

  function normalizeQuaggaCode128(raw, isKnownCode) {
    var s = String(raw || '').trim();
    if (!s) return s;
    // FNC1 (chr 29) cuối không thuộc mã NV (GS1-128) — bỏ trước khi check
    while (s.length && s.charCodeAt(s.length - 1) === 29) s = s.slice(0, -1);
    if (!s) return s;
    if (isKnownCode(s)) return s;
    var candidates = [];
    if (s.length >= 2) candidates.push(s.slice(0, -1));   // thừa 1 digit (quirk #1/#2)
    if (s.length >= 3) candidates.push(s.slice(0, -2));   // thừa nguyên checksum 2 ký tự
    for (var i = 0; i < candidates.length; i++) {
      if (isKnownCode(candidates[i])) return candidates[i];
    }
    return s;
  }

  // Chỉ nhận mã được ≥ minAgree (mặc định 2) config cho CÙNG kết quả (sau normalize) —
  // misread ngẫu nhiên của từng config không trùng nhau → bị loại. Trả null nếu không đủ.
  function camPickQuaggaMajority(results, isKnownCode, minAgree) {
    var min = minAgree == null ? 2 : minAgree;
    if (!results || !results.length) return null;
    var counts = {};
    results.forEach(function (raw) {
      var key = normalizeQuaggaCode128(raw, isKnownCode);
      if (!key) return;
      counts[key] = (counts[key] || 0) + 1;
    });
    var best = null, bestN = 0;
    Object.keys(counts).forEach(function (key) {
      if (counts[key] > bestN) { bestN = counts[key]; best = key; }
    });
    return bestN >= min ? best : null;
  }
  // ===== CODE128 NORMALIZE + ĐỒNG THUẬN — END =====

  // ===== LỌC KẾT QUẢ QUAGGA THEO FORMAT (2026-08-16, tiếp nối fix độ chính xác) =====
  // Mã NV dạng 'Ops…' có CHỮ → reader SỐ THUẦN (EAN/UPC/i2of5) KHÔNG BAO GIỜ decode đúng
  // mã NV. Nhưng chúng vẫn chạy chung (CAM_QUAGGA_READERS) và misread của chúng DETERMINISTIC
  // (cùng ảnh + cùng reader → cùng chuỗi số trên MỌI config) → lọt qua cổng đồng thuận ≥2
  // config → vẫn submit mã SAI (bug 2026-08-16 — camera nhận được mã nhưng sai, còn sót sau
  // cổng majority). Loại kết quả numeric-only ngay tại nguồn.
  var CAM_QUAGGA_NUMERIC_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'i2of5', '2of5'];

  // PURE — test được trên Node (tests/camera-code128.test.js). r = { code, format }.
  // Không có format (reader lạ/thiếu dữ liệu) → cho qua, không chặn nhầm.
  function camQuaggaResultAllowed(r) {
    if (!r || !r.code) return false;
    var fmt = String(r.format || '').toLowerCase();
    if (!fmt) return true;
    return CAM_QUAGGA_NUMERIC_FORMATS.indexOf(fmt) === -1;
  }

  var CAM_QUAGGA_CONFIGS = [
    // Full-res trước (Code128 dày đọc chuẩn hơn — halfSample gộp vạch dễ SAI), patch
    // medium thứ 2 (mã nhỏ), halfSample cuối (ảnh mờ/lớn). Thứ tự chỉ ảnh hưởng tốc độ
    // đạt đồng thuận — kết quả luôn qua camPickQuaggaMajority (≥2 config giống nhau).
    { patchSize: 'x-large', halfSample: false },
    { patchSize: 'medium', halfSample: false },
    { patchSize: 'x-large', halfSample: true }
  ];

  // Chạy HẾT các config, gom kết quả thô vào results[] rồi onDone(results) — người gọi
  // quyết định nhận/loại (camPickQuaggaMajority). inputStream.size 1280 (không hạ xuống
  // 800 như cũ — vạch Code128 dày bị gộp ở 800px dễ đọc SAI).
  function runQuaggaConfigs(src, configs, idx, results, onDone) {
    if (idx >= configs.length) {
      if (onDone) onDone(results || []);
      return;
    }
    var cfg = configs[idx];
    window.Quagga.decodeSingle({
      src: src,
      numOfWorkers: 0,
      inputStream: { size: 1280 },
      locator: cfg,
      decoder: { readers: CAM_QUAGGA_READERS }
    }, function (result) {
      var code = result && result.codeResult && result.codeResult.code;
      var format = result && result.codeResult && result.codeResult.format;
      // Chỉ nhận format có thể chứa chữ (code_128/code_39/code_93/codabar…) — bỏ
      // EAN/UPC/i2of5 numeric-only (misread deterministic lọt cổng majority, bug 2026-08-16).
      if (code && camQuaggaResultAllowed({ code: String(code).trim(), format: format })) {
        results.push(String(code).trim());
      }
      // TỐI ƯU 2026-08-16 (thẻ nét nhận nhanh hơn): đủ ≥2 config đồng thuận (sau normalize)
      // → dừng sớm, KHÔNG chờ config còn lại. Majority vẫn giữ nguyên (caller gate ≥2).
      if (results.length >= 2) {
        var early = camPickQuaggaMajority(results, camKnownStaffCode, 2);
        if (early) { if (onDone) onDone(results); return; }
      }
      runQuaggaConfigs(src, configs, idx + 1, results, onDone);
    });
  }

  // ===== OCR-SCAN-START (2026-08-16): đọc chữ "Ops…" khi mã vạch mờ =====
  // Thẻ NV in mã vạch Code128 + kèm dòng chữ "Ops…" (vd Ops7562, Ops158392) ngay trên/dưới
  // vạch kẻ. Khi vạch quá mờ camera không decode được → OCR đọc dòng chữ. CHẠY SONG SONG
  // với decode barcode (timer riêng, không chặn nhau) — cái nào phát hiện trước → done.
  //
  // Thư viện: Tesseract.js v5 tải TỪ CDN lúc runtime (script tag) — KHÔNG vendor được vì
  // core wasm + eng.traineddata > 500KB giới hạn file GAS. GAS HtmlService cho phép active
  // content HTTPS ngoài; jsDelivr có CORS; worker v5 load qua Blob URL (workerBlobURL mặc
  // định true) nên cross-origin OK. Lỗi load/không có mạng → im lặng tắt OCR, barcode vẫn
  // chạy bình thường (fail-open an toàn).
  var OCR_SCRIPT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  var OCR_WORKER_PATH = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js';
  var OCR_CORE_PATH = 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5';
  var OCR_LANG_PATH = 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0';
  var CAM_OCR_INTERVAL_MS = 4000;   // nhịp quét OCR song song (2026-08-17: 2000→4000 — Tesseract
                                    // ngốn CPU/GC trên iPhone làm decode barcode chậm hẳn; OCR chỉ là
                                    // fallback cho mã MỜ nên giãn nhịp không ảnh hưởng mã nét)
  var CAM_OCR_MIN_CONFIDENCE = 70;  // NV lạ cần confidence >= mức này; NV khớp STAFF_INFO nhận luôn
  var camOcrEnabled = false;   // đã load xong script Tesseract
  var camOcrLoading = false;   // đang load script (chống load lặp)
  var camOcrLoadFailed = false;// load fail → bỏ OCR cả phiên (không làm chậm quét)
  var camOcrWorker = null;     // worker tái dùng trong cả phiên
  var camOcrBusy = false;      // đang có 1 OCR chạy
  var camOcrQueue = [];        // frame chờ khi busy (photo fallback đợi live OCR xong)
  var camOcrTimer = null;      // timer quét OCR song song
  var camOcrLoopActive = false; // (2026-08-24) guard mồ côi: interval chỉ set khi loop đang
                                // "chủ ý chạy" — tránh callback async ensureOcrLib tạo timer
                                // SAU khi camera đã đóng (bug: interval bắn mỗi 4s vĩnh viễn)
  var camOcrFailStreak = 0;    // P2-2 (2026-08-23): đếm ZXing fail liên tiếp — đủ 5 mới lazy-load Tesseract

  // PURE — chuẩn hóa chuỗi OCR → mã 'OPS…' (test được trên Node).
  // OCR hay nhầm: chữ O ↔ số 0, p ↔ b, dính khoảng trắng/colon/gạch. Chỉ chấp nhận dạng
  // Ops + 3..9 chữ số (mã NV thật — Ops7562, Ops158392…); trả null nếu không phải.
  function normalizeOpsCode(raw) {
    var s = String(raw || '').replace(/\s+/g, '').replace(/[:：\-]/g, '').toUpperCase();
    if (/^0PS/.test(s)) s = 'OPS' + s.slice(3); // O → 0
    if (/^OBS/.test(s)) s = 'OPS' + s.slice(3); // p → b
    if (!/^OPS\d{3,9}$/.test(s)) return null;
    return s;
  }

  // PURE — tách mã "Ops…" từ kết quả OCR (text + words có confidence riêng).
  // Ưu tiên: (1) candidate khớp NV đã biết (STAFF_INFO = nguồn chuẩn, nhận luôn kể cả
  // confidence thấp); (2) candidate có confidence cao nhất >= minConfidenceUnknown (NV lạ/Dư
  // — tránh nhận nhầm chữ "Ops" trên bảng/hình nền). Trả { code, confidence } hoặc null.
  function pickOpsCandidate(text, words, isKnownCode, minConfidenceUnknown) {
    var min = minConfidenceUnknown == null ? CAM_OCR_MIN_CONFIDENCE : minConfidenceUnknown;
    var candidates = [];
    function add(raw, conf) {
      var code = normalizeOpsCode(raw);
      if (!code) return;
      for (var i = 0; i < candidates.length; i++) {
        if (candidates[i].code === code) {
          if (conf > candidates[i].confidence) candidates[i].confidence = conf;
          return;
        }
      }
      candidates.push({ code: code, confidence: conf });
    }
    if (words && words.length) {
      for (var i = 0; i < words.length; i++) {
        var w = words[i] || {};
        add(w.text, Number(w.confidence) || 0);
      }
    }
    // Fallback regex trên text thô — OCR dính chữ/số thành 1 token
    if (text) {
      var re = /(?:^|[^A-Za-z0-9])([O0][PpBb]s)\s*[:：\-]?\s*(\d{3,9})(?![0-9])/gi;
      var m;
      while ((m = re.exec(text)) !== null) {
        add(m[1] + m[2], 60); // không có per-word confidence → ước lượng trung bình
        if (re.lastIndex === m.index) re.lastIndex++;
      }
    }
    if (!candidates.length) return null;
    var known = [], unknown = [];
    candidates.forEach(function (c) {
      if (isKnownCode && isKnownCode(c.code)) known.push(c);
      else unknown.push(c);
    });
    var pool = known.length ? known : unknown;
    pool.sort(function (a, b) { return b.confidence - a.confidence; });
    var best = pool[0];
    if (known.length) return best;          // khớp NV đã biết → nhận (nguồn chuẩn)
    if (best.confidence >= min) return best; // NV lạ → cần confidence đủ cao
    return null;
  }

  // Load script Tesseract từ CDN (1 lần mỗi phiên; fail → tắt OCR im lặng)
  function ensureOcrLib(cb) {
    if (camOcrEnabled || camOcrLoadFailed || camOcrLoading) { if (cb) cb(); return; }
    if (typeof window.Tesseract !== 'undefined') {
      camOcrEnabled = true;
      initOcrWorker();
      if (cb) cb();
      return;
    }
    camOcrLoading = true;
    var head = null;
    try { head = document.head || document.getElementsByTagName('head')[0] || document.documentElement; } catch (e) { head = null; }
    var s = document.createElement('script');
    s.src = OCR_SCRIPT_URL;
    s.async = true;
    s.onload = function () {
      camOcrLoading = false;
      if (typeof window.Tesseract !== 'undefined') { camOcrEnabled = true; initOcrWorker(); }
      else markOcrFailed();
      if (cb) cb();
    };
    s.onerror = function () {
      camOcrLoading = false;
      markOcrFailed();
      if (cb) cb();
    };
    if (head) head.appendChild(s);
    else { camOcrLoading = false; markOcrFailed(); if (cb) cb(); }
  }

  // FIX-24: CDN fail-open trước đây im lặng — user không biết OCR không tải được
  // (mã mờ chỉ còn đường vạch mà không hiểu vì sao). Thông báo 1 lần qua camStatus.
  function markOcrFailed() {
    camOcrLoadFailed = true;
    try { camStatus('⚠️ Không tải được nhận diện chữ (mạng/CDN) — quét vạch vẫn hoạt động', true); } catch (e) {}
  }

  // Khởi tạo worker (tải core wasm + eng.traineddata lần đầu) — tái dùng cho cả phiên
  function initOcrWorker() {
    if (camOcrWorker || typeof window.Tesseract === 'undefined') return;
    try {
      window.Tesseract.createWorker('eng', 1, {
        workerPath: OCR_WORKER_PATH,
        corePath: OCR_CORE_PATH,
        langPath: OCR_LANG_PATH
      }).then(function (w) {
        // (2026-08-24) guard mồ côi: camera có thể đã đóng trong lúc worker đang tải
        // (createWorker tải wasm+traineddata vài trăm ms) → worker mới tạo xong sẽ LEAK.
        // Nếu loop không còn active → terminate ngay thay vì giữ.
        if (!camOcrLoopActive) {
          try { if (typeof w.terminate === 'function') w.terminate(); } catch (e2) {}
          return;
        }
        camOcrWorker = w;
        var statusEl = document.getElementById('camStatusLive');
        if (statusEl) statusEl.textContent = '📷 Đưa mã vào khung — tự nhận diện (vạch + chữ Ops)';
      }).catch(function () { camOcrWorker = null; });
    } catch (e) { camOcrWorker = null; }
  }

  // OCR 1 frame (canvas) → cb(code | null). Busy → xếp hàng (frame cũ chờ OCR đang chạy xong).
  function camOcrFrame(canvas, cb) {
    if (!camOcrEnabled || !camOcrWorker) { if (cb) cb(null); return; }
    if (camOcrBusy) { camOcrQueue.push({ canvas: canvas, cb: cb }); return; }
    camOcrBusy = true;
    try {
      camOcrWorker.recognize(canvas).then(function (res) {
        camOcrBusy = false;
        var code = null;
        try {
          var hit = pickOpsCandidate(
            res && res.data && res.data.text,
            res && res.data && res.data.words,
            camKnownStaffCode,
            CAM_OCR_MIN_CONFIDENCE
          );
          if (hit) code = hit.code;
        } catch (e2) { code = null; }
        if (cb) cb(code);
        drainOcrQueue();
      }).catch(function () {
        camOcrBusy = false;
        if (cb) cb(null);
        drainOcrQueue();
      });
    } catch (e) {
      camOcrBusy = false;
      if (cb) cb(null);
      drainOcrQueue();
    }
  }

  function drainOcrQueue() {
    if (camOcrBusy || !camOcrQueue.length) return;
    var next = camOcrQueue.shift();
    camOcrFrame(next.canvas, next.cb);
  }

  // FIX-19: trạng thái THẬT của OCR (worker sống hay không) — popup quét check qua
  // ocrReady() trước khi vẽ canvas cho OCR tick (camOcrFrame hoisted luôn truthy).
  function camOcrReady() {
    return !!(camOcrEnabled && camOcrWorker);
  }

  // Timer song song: mỗi CAM_OCR_INTERVAL_MS chụp frame 800px → OCR chữ Ops…
  // KHÔNG chặn decode barcode (khác cờ busy) — cái nào ra trước thì done.
  function startOcrLoop() {
    stopOcrLoop();
    if (camOcrLoadFailed) return;
    camOcrLoopActive = true;  // guard: chỉ callback async mới được set timer khi còn active
    var statusEl = document.getElementById('camStatusLive');
    if (!camOcrEnabled && !camOcrLoading && statusEl) {
      statusEl.textContent = '📷 Đang tải nhận diện chữ Ops… (lần đầu hơi lâu)';
    }
    ensureOcrLib(function () {
      if (camOcrEnabled && camOcrLoopActive) {
        camOcrTimer = setInterval(function () { ocrTick(); }, CAM_OCR_INTERVAL_MS);
      }
    });
  }

  // Cắt ĐÚNG vùng khung dẫn hướng (.camera-frame — inset 9% ngang, 12% dọc) + xám hóa
  // → OCR ít pixel hơn + ít nhiễu nền → nhận diện chữ Ops… NHANH hơn (2026-08-16 tối ưu).
  // #15 (2026-08-21): reuse 1 canvas — hết tạo mới + GC mỗi 4s.
  function camOcrPrepareFrame(video) {
    try {
      var vw = video.videoWidth || 0;
      var vh = video.videoHeight || 0;
      if (!vw || !vh) return null;
      var x = Math.round(vw * 0.09), y = Math.round(vh * 0.12);
      var w = Math.max(1, Math.round(vw * 0.82)), h = Math.max(1, Math.round(vh * 0.76));
      var scale = Math.min(1, 800 / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
      if (!camOcrCanvas) {
        camOcrCanvas = document.createElement("canvas");
        camOcrCtx = camOcrCanvas.getContext("2d", { willReadFrequently: true });
      }
      if (camOcrCanvas.width !== cw || camOcrCanvas.height !== ch) {
        camOcrCanvas.width = cw;
        camOcrCanvas.height = ch;
      }
      var canvas = camOcrCanvas;
      var ctx = camOcrCtx;
      ctx.drawImage(video, x, y, w, h, 0, 0, cw, ch);
      // xám hóa nhẹ — OCR nhanh hơn trên ảnh xám
      try {
        var img = ctx.getImageData(0, 0, cw, ch);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
          var g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
          d[i] = g; d[i + 1] = g; d[i + 2] = g;

    var curMode = camMealMode();
    if (clean === camLastCode && curMode === camLastMode && now - camLastCodeTs < CAM_CODE_COOLDOWN_MS) { camDecoding = false; camSnapping = false; return; }
    camLastCode = clean;
    camLastCodeTs = now;
    camLastMode = curMode;
    if (camScanMode) {
      // TAB QUÉT RIÊNG: gửi kết quả về trang gốc rồi đóng tab
      try {
        localStorage.setItem('rcScanResult', JSON.stringify({ token: camScanToken, code: clean, ts: Date.now() }));
      } catch (e) {}
      try {
        if (window.opener) window.opener.postMessage({ type: 'rcScanResult', code: clean }, window.location.origin);
      } catch (e) {}
      var statusEl = document.getElementById('camStatusLive');
      if (statusEl) statusEl.textContent = '✅ Đã nhận mã: ' + clean + ' — tự đóng tab này';
      setTimeout(function () {
        closeCameraModal(); // đóng camera + window.close()
      }, 1200);
      return;
    }
    // QUÉT LIÊN TỤC: KHÔNG dừng camera / không đóng modal / không đóng popup — điền mã
    // vào ô quét + submit như quét tay (reconcile + meal-move Ra/Vào). Kết quả hiện NGAY
    // DƯỚI CAMERA: js.html showScanCard → camAppendResult (render modal / postMessage
    // popup). Nút ✕ Đóng mới kết thúc phiên quét.
    var input = document.getElementById('scanInput');
    if (!input) return;
    // FIX-11: input bị disable có chủ đích (paste batch meal-move đang chạy) — KHÔNG
    // submit song song với RPC paste (trước đây decode được mã là submit ồ ngay).
    // Reset cờ decode để lượt quét sau (sau khi paste xong) bình thường.
    if (input.disabled) {
      var stBusy = document.getElementById('camStatusLive');
      if (stBusy && camOpen) stBusy.textContent = '⏳ Đang xử lý dán mã — quét lại sau giây lát';
      camDecoding = false;
      camSnapping = false;
      return;
    }
    input.value = clean;
    var st = document.getElementById('camStatusLive');
    if (st && camOpen) st.textContent = '✅ ' + clean + ' — quét mã tiếp theo';
    submitScan(); // đúng luồng quét hiện tại (reconcile + meal-move Ra/Vào)
    // Đường ảnh chụp (decodeCameraImage) set camDecoding=true — reset để lượt quét sau
    // không bị chặn bởi cờ còn treo (quét liên tục nhiều ảnh).
    camDecoding = false;
    camSnapping = false;
  }

  // ===== TAB QUÉT RIÊNG (?scan=1&tk=...): tự mở camera + quét LIVE =====
  // Tab này là trang top-level (mở bằng window.open/anchor từ GAS iframe) →
  // getUserMedia hoạt động → quét live liên tục như AppSheet, thấy mã là nhận.
  function initScanModeIfNeeded() {
    // Detect scan mode bằng CẢ location.search LẪN document.referrer: wrapper GAS nạp
    // app vào iframe có thể KHÔNG forward query (location.search rỗng) nhưng referrer
    // vẫn là URL tab quét (có scan=1&tk) — bug 2026-08-12 tab trắng/không vào scan mode.
    var scanDetected = location.search.indexOf('scan=1') !== -1
      || (document.referrer || '').indexOf('scan=1') !== -1;
    if (!scanDetected) return;
    camScanMode = true;
    // Cờ cho js.html (include sau file này): mock loader + DOMContentLoaded skip app init.
    // Cờ bền hơn location.search vì wrapper có thể không forward query vào URL app.
    try { window.__RC_SCAN_MODE__ = true; } catch (e) {}
    var m = location.search.match(/[?&]tk=([^&]+)/)
      || (document.referrer || '').match(/[?&]tk=([^&]+)/);
    camScanToken = m ? decodeURIComponent(m[1]) : '';
    try { document.body.classList.add('scan-mode'); } catch (e) {}
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent || '');
    if (isIOS) {
      // iOS Safari: camera CHỈ bật khi có user gesture trong chính tab này →
      // hiện nút để chạm 1 lần, sau đó quét tự động
      showScanStartButton();
    } else {
      setTimeout(function () { startCameraLive(); }, 60);
    }
  }

  function showScanStartButton() {
    var modal = document.getElementById('cameraModal');
    if (modal) { modal.style.display = 'flex'; modal.setAttribute('aria-hidden', 'false'); }
    var sb = document.getElementById('camStartBtn');
    if (sb) sb.style.display = 'inline-flex';
    var statusEl = document.getElementById('camStatusLive');
    if (statusEl) { statusEl.textContent = '📷 Bấm nút để bật camera'; statusEl.style.color = ''; }
  }
  initScanModeIfNeeded();
  // ===== CAMERA-SCAN-END =====
</script>
