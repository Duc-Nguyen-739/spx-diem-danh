name: Deploy to GAS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node + clasp
        run: |
          npm install -g @google/clasp

      - name: Create .clasp.json (from secrets)
        run: |
          cat > .clasp.json << EOF
          {"scriptId":"${{ secrets.GAS_SCRIPT_ID }}","rootDir":"./"}
          EOF

      - name: Restore .clasprc.json (auth)
        run: |
          cat > ~/.clasprc.json << 'CLASPRC_EOF'
          ${{ secrets.CLASPRC_JSON }}
          CLASPRC_EOF

      - name: Push to GAS
        run: clasp push -f

      - name: Deploy new version to production (/exec)
        # /exec (bản versioned) KHÔNG tự cập nhật theo push — cần tạo version mới + gắn
        # vào deployment production (bug 2026-08-11: user thấy /exec chạy bản cũ).
        # continue-on-error: push đã xong — deploy lỗi không chặn workflow.
        continue-on-error: true
        run: |
          set -e
          VERSION=$(clasp version "auto $(git rev-parse --short HEAD)" | grep -oE '[0-9]+' | tail -1)
          if [ -z "$VERSION" ]; then
            echo "Không tạo được version — bỏ qua deploy"
            exit 0
          fi
          DEPLOY_ID=$(clasp deployments --json | node -e "
            let s = '';
            process.stdin.on('data', function (d) { s += d; });
            process.stdin.on('end', function () {
              try {
                var arr = JSON.parse(s);
                var prod = arr.filter(function (d) {
                  return d.deploymentId && d.version && d.version !== 'HEAD';
                }).sort(function (a, b) {
                  return String(b.updateTime || '').localeCompare(String(a.updateTime || ''));
                })[0];
                process.stdout.write(prod ? prod.deploymentId : '');
              } catch (e) { process.stdout.write(''); }
            });
          ")
          if [ -z "$DEPLOY_ID" ]; then
            echo "Không tìm thấy deployment versioned — bỏ qua deploy"
            exit 0
          fi
          clasp deploy --versionNumber "$VERSION" --deploymentId "$DEPLOY_ID"
          echo "✅ Đã deploy version $VERSION lên deployment $DEPLOY_ID"
