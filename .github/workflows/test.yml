name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@latest

      - name: Export CHROME_PATH for test:chrome (FIX-25)
        run: echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV

      - name: CI gate — chặn regression (dual runtime)
        run: |
          npm ci
          npm test
          pip install -r requirements.txt
          python3 -m unittest discover -s api -p 'test_*.py'
          npm run build:local
          npm run test:chrome
