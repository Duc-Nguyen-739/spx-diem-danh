<style>
/* ===== MOBILE — cấu hình điện thoại (file riêng, 2026-08-11) =====
   Chỉ áp dụng trên màn hình hẹp (<= 900px). Desktop giữ nguyên layout hiện tại.
   KHÔNG đổi logic / không ẩn bớt thao tác — chỉ cân đối trình bày cho vừa
   màn hình điện thoại: bảng gọn hơn, khoảng cách nhỏ hơn, dashboard ẩn mặc
   định (mở lại qua nút ☰ — cơ chế .dash-layout.mini đã có sẵn).
   File được nhúng qua scriptlet include('mobile') (xem index.html) ngay sau include('css'). */
@media (max-width: 900px) {
  /* Bảng task 13 cột trên điện thoại: thu gọn font/padding → vừa khung,
     vẫn cuộn ngang trong .table-wrap (overflow: auto có sẵn) */
  .task-list-card th, .task-list-card td { padding: 6px 8px; font-size: 12px; }
  .task-list-card th { font-size: 11.5px; }
  .task-list-toolbar .section-heading { font-size: 14px; }
  .intro-m10-desc { font-size: 12px; margin: 8px 0 0; line-height: 1.6; }
  .intro-m10-badge { font-size: 9.5px; padding: 2px 8px; }
  /* Nút +Task gọn lại cho vừa màn hình hẹp */
  .btn-create { padding: 10px 16px; font-size: 14px; }
  /* Nút +Task luôn bên PHẢI toolbar — khi toolbar wrap (màn hẹp), justify-content
     space-between đẩy item xuống hàng mới về BÊN TRÁI → nút bị lệch trái + menu
     (absolute right:0) tràn khỏi màn hình (bug 2026-08-13). margin-left:auto giữ nút
     sát phải mọi hàng → menu xổ ra nằm gọn trong màn hình. */
  .task-create { margin-left: auto; }
  /* Dashboard ẩn mặc định trên mobile (thêm class mini ở js.html lúc boot).
     Nút ☰ (dash-reopen) nổi lên, đặt cao hơn thanh phân trang để không đè */
  .dash-layout.mini .dash-reopen { bottom: 70px; }
  .dash-main { gap: 12px; }
  /* Dashboard = DRAWER xổ từ TRÁI trên mobile (yêu cầu 2026-08-13): sidebar không
     còn chèn ngang phía trên danh sách (flex-direction:column cũ của css.html) —
     thành panel cố định bên trái, trượt vào từ mép trái, đè lên nội dung + backdrop
     mờ phía sau (giống logic sidebar trái trên PC). ☰ mở, bấm ra ngoài panel đóng. */
  .dash-side {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: min(320px, 85vw); max-width: min(320px, 85vw); flex-basis: auto;
    z-index: 300; margin: 0;
    border-left: 1px solid rgba(255,95,46,.3); border-radius: 0 16px 16px 0;
    transform: translateX(-100%);  /* ẩn: trượt hẳn ra ngoài mép trái */
    transition: transform .3s ease;
    overflow-y: auto;
  }
  /* Ghi đè rule collapse .dash-layout.mini .dash-side của css.html (width:0/opacity:0):
     drawer ẩn bằng transform chứ không thu nhỏ — mở/đóng đều trượt ngang mượt. */
  .dash-layout.mini .dash-side {
    flex: 0 0 auto; width: min(320px, 85vw); max-width: min(320px, 85vw);
    padding: 16px; opacity: 1; border-width: 1px; overflow: hidden;
    transform: translateX(-100%);
    pointer-events: none;
  }
  .dash-layout:not(.mini) .dash-side { transform: translateX(0); }
  /* Backdrop mờ phía sau drawer — bấm vào là đóng (js.html xử lý click) */
  .dash-layout:not(.mini)::after {
    content: ''; position: fixed; inset: 0; z-index: 290;
    background: rgba(0,0,0,.55);
  }
  .dash-kpis { grid-template-columns: 1fr 1fr; }
  /* Danh sách task KÉO DÀI sát thanh phân trang trên mobile (yêu cầu 2026-08-13):
     dash-layout có chiều cao viewport (giống desktop) → task-list-card flex:1 + table-wrap
     flex:1 (rule gốc css.html) trải đầy phần còn lại, bảng cuộn bên trong. Bỏ override
     flex:none + max-height:46vh trước đây (làm card ngắn, cách xa thanh phân trang).
     Giá trị đo THỰC trên headless: 601–900px header 102 + gap 16 → layout top 118;
     thanh phân trang fixed bottom:0 cao 35 → cần 100vh - 153 (= 118 + 35). */
  .dash-layout { height: calc(100vh - 153px); }  /* 601–900px: header 102 + gap 16 + pagin 35 (fixed bottom:0) */
  .dash-main { padding-bottom: 0; }  /* chừa đáy đã nằm trong chiều cao dash-layout */
  /* Glow trang trí trong dash-side: ≤900px dash-side thành position:static → glow
     absolute neo theo dash-layout (không clip) → tràn ngang 449px tạo scroll ngang
     (bug 2026-08-13). Ẩn trên mobile — chỉ là trang trí. */
  .dash-glow { display: none; }
  /* Thanh phân trang: nút nhỏ gọn hơn trên điện thoại */
  .task-pagin { padding: 5px 8px; }
  .task-pagin button { min-width: 24px; height: 24px; padding: 0 7px; font-size: 11px; }
  .task-pagin .p-info { font-size: 10.5px; margin-left: 6px; }
}
@media (max-width: 900px) and (min-width: 601px) {
  /* Nhánh tablet/diện thoại ngang 601–900px (fix 2026-08-23): @media ≤600px trước đây
     mới có bộ #viewScan edge-to-edge (main padding 16px + card 10px → viewScan chỉ 96-97%
     viewport, counters co còn ~85%). Áp dụng bộ kéo ngang tương tự ≤600px để scan view
     full ngang màn hình ở dải 601–900px. */
  #viewScan { margin-left: -16px; margin-right: -16px; width: calc(100% + 32px); max-width: calc(100% + 32px); }
  .scan-col-left .card { padding: 8px; }
  .scan-col-right .card { padding: 0 !important; }
  .scan-topbar { padding: 10px 12px !important; gap: 8px 8px !important; }
  .scan-layout { gap: 10px !important; align-items: stretch !important; }
  .scan-col-left, .scan-col-right { width: 100% !important; max-width: 100% !important; flex: 0 0 auto !important; align-self: stretch !important; box-sizing: border-box !important; }
  .scan-col-left .card, .scan-col-right .card { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
  .scan-col-right .card .table-wrap, #scanCards, .scan-cards { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
  .scan-row-card { padding: 8px 10px !important; margin-bottom: 6px !important; width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
  .att-toolbar { padding: 8px 8px !important; gap: 6px !important; }
  .task-list-card { margin-bottom: 0; }
}
@media (max-width: 600px) {
  /* Full-bleed mobile (2026-08-23): ảnh chụp cho thấy viewScan vẫn lọt thỏm
     (main 8px + card 8px → inset ~16px mỗi bên). Cho main 0 ngang + viewScan
     100% không bù trừ, card trái 4px / card phải 0 để thông tin mã Ops tràn
     sát mép màn hình như header. */
  main { padding: 8px 0 8px 0; }
  #viewScan { margin-left: 0; margin-right: 0; width: 100%; max-width: 100%; }
  .dash-layout { margin-left: 0; margin-right: 0; width: 100%; max-width: 100%; }
  .scan-col-left .card { padding: 4px !important; }
  .scan-col-right .card { padding: 0 !important; }
  /* Full-bleed: bỏ bo góc + viền trái/phải để card/ topbar tràn sát mép
     (trước bo 12px để lại vệt xám 2 bên như ảnh). Chỉ áp trong viewScan. */
  #viewScan .scan-topbar,
  #viewScan .scan-col-left .card,
  #viewScan .scan-col-right .card { border-radius: 0 !important; border-left: 0 !important; border-right: 0 !important; }
  .scan-topbar { padding: 10px 10px !important; gap: 8px 8px !important; }
  .scan-layout { gap: 10px !important; }
  .counters { gap: 6px !important; }
  .counter { padding: 8px 4px 10px !important; }
  .counter .num { font-size: 26px !important; }
  .counter .lbl { font-size: 10px !important; padding: 1px 6px !important; letter-spacing: .3px !important; }
  .scan-card { padding: 12px 14px !important; min-height: 70px !important; }
  .scan-card .sc-name { font-size: 22px !important; }
  .scan-card .sc-meta { font-size: 12px !important; }
  .scan-row { gap: 8px !important; }
  .scan-input-wrap input { font-size: 22px !important; padding: 12px 14px !important; }
  .scan-row-card { padding: 8px 10px !important; margin-bottom: 6px !important; width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
  .att-toolbar { padding: 8px 8px !important; gap: 6px !important; }
  /* FIX co hẹp bảng Điểm danh ca trên mobile (2026-08-26): ảnh iPhone cho thấy khối
     bảng NV bị co vào, chừa khoảng trắng phải ~30% màn hình. Nguyên nhân: .scan-layout
     column với align-items:flex-start khiến flex item co theo nội dung trên Safari
     (Chrome vẫn tràn nhưng Safari shrink-wrap). Ép stretch + width 100% cho mọi cấp
     scan-col/card/table-wrap/scanCards/rowCard để tràn full màn hình như khối counters. */
  .scan-layout { align-items: stretch !important; }
  .scan-col-left, .scan-col-right { width: 100% !important; max-width: 100% !important; flex: 0 0 auto !important; align-self: stretch !important; box-sizing: border-box !important; }
  .scan-col-left .card, .scan-col-right .card { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
  .scan-col-right .card .table-wrap, #scanCards, .scan-cards { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
  /* Topbar scan cố định trên mobile (fix 2026-08-12): header (logo/thanh trên) CUỘN
     ĐI (position static), scan-topbar sticky giữ nguyên ở đỉnh màn hình — trước đây
     cả 2 cùng sticky top:0 → topbar (z-30) đè lên header (z-10) che logo khi cuộn. */
  header { position: static; }
  /* ≤600px header 2 dòng (brand + search) cao 163 + gap 16 → layout top 179;
     cần 100dvh - 214 (= 179 + pagin 35, fixed bottom:0) để card danh sách chạm mép
     trên thanh phân trang (100dvh chuẩn mobile — 100vh tụt dưới URL bar iOS, bug 2026-08-13). */
  .dash-layout { height: calc(100vh - 214px); height: calc(100dvh - 214px); }
  /* Card danh sách sát MÉP trên thanh phân trang: bỏ margin-bottom 12px mặc định
     của .card (dash-layout đã chạm đúng mép trên thanh) — không còn khoảng hở 12px. */
  .task-list-card { margin-bottom: 0; }
  .task-list-toolbar { margin-bottom: 8px; }
  /* Nút 📷 Quét camera hiện/ẩn được quản lý trong camera-css.html (cả 2 rule cùng file) */
  .camera-stage { max-width: 420px; }
  .camera-view { aspect-ratio: 3 / 4; max-height: 58vh; }
  .task-count-badge { font-size: 11px; padding: 1px 8px; }
  .scan-hint { font-size: 11.5px; }
  /* Bảng scan: font nhỏ hơn cho vừa màn hình */
  .scan-col-right th, .scan-col-right td { padding: 5px 6px; font-size: 11.5px; }
  /* Menu +Task: không tràn màn hình trên máy nhỏ (fix 2026-08-12) — bỏ min-width cứng
     320px, co theo màn hình, item gọn hơn cho chạm. */
  .task-menu { min-width: 0; width: min(320px, calc(100vw - 40px)); }
  .task-menu-item { padding: 8px 10px; }
  .task-menu-txt b { font-size: 13.5px; }
  .task-menu-txt small { font-size: 11px; line-height: 1.4; }
  /* ===== Danh sách task — dạng CARD trên mobile (2026-08-12) =====
     Bảng 13 cột quá chật trên điện thoại → renderTaskList đổi sang card
     (js.html tự quyết qua matchMedia <=600px; desktop giữ nguyên bảng).
     Card bo gọn, không tràn màn hình (fix 2026-08-12): min-width 0 + overflow hidden
     chống phình; dòng đếm không kéo giãn 2 bên (bỏ margin-left:auto của nút). */
  .task-cards { display: flex; flex-direction: column; gap: 10px; padding: 2px 0 6px; }
  .task-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .07);
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
  }
  .task-card .tc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .task-card .tc-id {
    font-family: Consolas, 'Courier New', monospace;
    font-size: 13px; font-weight: 800; color: var(--text);
    flex: 1 1 auto; min-width: 0; word-break: break-all;
  }
  .task-card .tc-type {
    display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px;
    font-size: 11.5px; color: var(--muted);
    margin-top: 6px; line-height: 1.5; min-width: 0; word-break: break-word;
  }
  .task-card .tc-mid {
    display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap;
    margin-top: 9px; min-width: 0;
  }
  .task-card .tc-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .task-card .tc-count b { font-size: 14px; color: var(--text); font-variant-numeric: tabular-nums; }
  .task-card .tc-count.ok b { color: var(--success); }
  .task-card .tc-count.extra b { color: var(--warning); }
  .task-card .tc-btn { flex: 0 0 auto; min-height: 32px; padding: 7px 13px; }
  .task-card .tc-foot {
    font-size: 11px; color: var(--muted);
    margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--border);
    word-break: break-word; min-width: 0;
  }
  /* ===== Bảng NV trong task — dạng CARD trên mobile (2026-08-13) =====
     Bảng 10 cột (reconcile 8, meal-move 10) kéo dài ngang quá khổ màn hình điện thoại
     → renderScanTable đổi sang card (js.html tự quyết qua matchMedia <=600px; desktop
     giữ nguyên bảng). Card bo gọn, không tràn màn hình: min-width 0 + chips wrap. */
  .scan-row-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 12px;
    margin-bottom: 8px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .07);
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
  }
  .scan-row-card.extra { border-color: #f5d78e; background: #fef7e0; }
  .scan-row-card .src-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0;
  }
  .scan-row-card .src-id {
    font-family: Consolas, 'Courier New', monospace;
    font-size: 13px; font-weight: 800; color: var(--text);
    min-width: 0; word-break: break-all;
  }
  .scan-row-card .src-name {
    font-size: 12.5px; font-weight: 600; color: var(--muted);
    flex: 1 1 auto; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .scan-row-card .src-badge { flex: 0 0 auto; }
  .scan-row-card .src-meta {
    display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; min-width: 0;
  }
  .scan-row-card .src-meta span {
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11px;
    color: var(--muted);
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .scan-row-card .src-meta i {
    font-style: normal; font-weight: 700; color: var(--text); margin-right: 4px;
  }
  /* ===== Topbar scan — xếp dọc gọn trên điện thoại (2026-08-13) =====
     Trước đây: nút back + tiêu đề + nút (Chuyển Quét/Hoàn Thành) nằm chung 1 hàng
     flex-wrap → trên màn hình hẹp wrap loạn, meta + ghi chú lẫn giữa các nút. Giờ
     dùng order + flex-basis trên CÙNG markup (không đổi HTML):
       Hàng 1: ← Danh sách task (trái) ...... Hoàn Thành (phải)
       Hàng 2: Mã task đậm + meta mờ + ghi chú — căn trái, full width
       Hàng 3: nút Chuyển Quét / Mở Lại — full width (dễ chạm) */
  .scan-topbar { gap: 8px 10px; padding: 10px 12px; }
  .scan-topbar > .btn-ghost:first-child { order: 1; }
  #btnFinish { order: 2; margin-left: auto; }
  #btnTransferList { order: 2; margin-left: 8px; }
  .scan-topbar-title { order: 3; flex: 1 1 100%; text-align: left; }
  .scan-topbar-title .task-title { font-size: 16px; margin-bottom: 2px; }
  .scan-topbar-title .task-meta { font-size: 12px; line-height: 1.5; margin-bottom: 0; }
  #btnMealSwitch { order: 4; flex: 1 1 100%; justify-content: center; }
  #btnReopen { order: 5; flex: 1 1 100%; justify-content: center; }
  /* ===== Modal tạo task — vừa màn hình điện thoại (2026-08-13) =====
     Trước đây .create-dialog không có max-height → nội dung (Station/Date + 3 nhóm
     chip + preview + ghi chú) cao hơn viewport, phần nút Huỷ / + Tạo task ở đáy
     không nhìn thấy/cuộn tới được. Giờ: dialog giới hạn bằng chiều cao màn hình
     (100dvh - lề 20px) + cuộn nội dung bên trong; hud-bar dính đỉnh, thanh hành
     động dính đáy → nút luôn hiện, chỉ phần filter ở giữa cuộn. Áp cho cả 2 modal
     (Điểm danh ca + Điểm danh Ra/Vào — cùng class create-dialog). */
  .create-dialog {
    max-height: calc(100vh - 20px);
    max-height: calc(100dvh - 20px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .create-dialog .hud-bar { position: sticky; top: 0; z-index: 3; }
  .create-dialog .create-actions { position: sticky; bottom: 0; z-index: 3; }
}
</style>
