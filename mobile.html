<style>
/* ===== MOBILE — cấu hình điện thoại (file riêng, 2026-08-11) =====
   Chỉ áp dụng trên màn hình hẹp (<= 900px). Desktop giữ nguyên layout hiện tại.
   KHÔNG đổi logic / không ẩn bớt thao tác — chỉ cân đối trình bày cho vừa
   màn hình điện thoại: bảng gọn hơn, khoảng cách nhỏ hơn, dashboard ẩn mặc
   định (mở lại qua nút ☰ — cơ chế .dash-layout.mini đã có sẵn).
   File được nhúng qua scriptlet include('mobile') (xem index.html) ngay sau include('css'). */
@media (max-width: 900px) {
  /* Bảng task 13 cột trên điện thoại: thu gọn font/padding → vừa khung,
     vẫn cuộn ngang trong .table-wrap (overflow: auto có sẵn) */
  .task-list-card th, .task-list-card td { padding: 6px 8px; font-size: 12px; }
  .task-list-card th { font-size: 11.5px; }
  .task-list-toolbar .section-heading { font-size: 14px; }
  .intro-m10-desc { font-size: 12px; margin: 8px 0 0; line-height: 1.6; }
  .intro-m10-badge { font-size: 9.5px; padding: 2px 8px; }
  /* Nút +Task gọn lại cho vừa màn hình hẹp */
  .btn-create { padding: 10px 16px; font-size: 14px; }
  /* Dashboard ẩn mặc định trên mobile (thêm class mini ở js.html lúc boot).
     Nút ☰ (dash-reopen) nổi lên, đặt cao hơn thanh phân trang để không đè */
  .dash-layout.mini .dash-reopen { bottom: 70px; }
  .dash-main { gap: 12px; }
  /* Card danh sách task không kéo dài hết chiều cao trên mobile —
     để nội dung tự nhiên, tránh bảng quá bé */
  .task-list-card { flex: none; }
  .task-list-card .table-wrap { max-height: 46vh; }
  /* Thanh phân trang: nút nhỏ gọn hơn trên điện thoại */
  .task-pagin { padding: 5px 8px; }
  .task-pagin button { min-width: 24px; height: 24px; padding: 0 7px; font-size: 11px; }
  .task-pagin .p-info { font-size: 10.5px; margin-left: 6px; }
}
@media (max-width: 600px) {
  /* Topbar scan cố định trên mobile (fix 2026-08-12): header (logo/thanh trên) CUỘN
     ĐI (position static), scan-topbar sticky giữ nguyên ở đỉnh màn hình — trước đây
     cả 2 cùng sticky top:0 → topbar (z-30) đè lên header (z-10) che logo khi cuộn. */
  header { position: static; }
  /* Danh sách task không tràn sát chân trang (fix 2026-08-12): chừa khoảng trống dưới
     cho thanh phân trang cố định + mép dưới màn hình (iPhone home indicator). */
  .dash-main { padding-bottom: 88px; }
  .task-list-toolbar { margin-bottom: 8px; }
  /* Nút 📷 Quét camera hiện/ẩn được quản lý trong camera-css.html (cả 2 rule cùng file) */
  .camera-stage { max-width: 420px; }
  .camera-view { aspect-ratio: 3 / 4; max-height: 58vh; }
  .task-count-badge { font-size: 11px; padding: 1px 8px; }
  .scan-hint { font-size: 11.5px; }
  /* Bảng scan: font nhỏ hơn cho vừa màn hình */
  .scan-col-right th, .scan-col-right td { padding: 5px 6px; font-size: 11.5px; }
  /* Menu +Task: không tràn màn hình trên máy nhỏ (fix 2026-08-12) — bỏ min-width cứng
     320px, co theo màn hình, item gọn hơn cho chạm. */
  .task-menu { min-width: 0; width: min(320px, calc(100vw - 40px)); }
  .task-menu-item { padding: 8px 10px; }
  .task-menu-txt b { font-size: 13.5px; }
  .task-menu-txt small { font-size: 11px; line-height: 1.4; }
  /* ===== Danh sách task — dạng CARD trên mobile (2026-08-12) =====
     Bảng 13 cột quá chật trên điện thoại → renderTaskList đổi sang card
     (js.html tự quyết qua matchMedia <=600px; desktop giữ nguyên bảng).
     Card bo gọn, không tràn màn hình (fix 2026-08-12): min-width 0 + overflow hidden
     chống phình; dòng đếm không kéo giãn 2 bên (bỏ margin-left:auto của nút). */
  .task-cards { display: flex; flex-direction: column; gap: 10px; padding: 2px 0 6px; }
  .task-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .07);
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
  }
  .task-card .tc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .task-card .tc-id {
    font-family: Consolas, 'Courier New', monospace;
    font-size: 13px; font-weight: 800; color: var(--text);
    flex: 1 1 auto; min-width: 0; word-break: break-all;
  }
  .task-card .tc-type {
    display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px;
    font-size: 11.5px; color: var(--muted);
    margin-top: 6px; line-height: 1.5; min-width: 0; word-break: break-word;
  }
  .task-card .tc-mid {
    display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap;
    margin-top: 9px; min-width: 0;
  }
  .task-card .tc-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .task-card .tc-count b { font-size: 14px; color: var(--text); font-variant-numeric: tabular-nums; }
  .task-card .tc-count.ok b { color: var(--success); }
  .task-card .tc-count.extra b { color: var(--warning); }
  .task-card .tc-btn { flex: 0 0 auto; min-height: 32px; padding: 7px 13px; }
  .task-card .tc-foot {
    font-size: 11px; color: var(--muted);
    margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--border);
    word-break: break-word; min-width: 0;
  }
}
</style>
