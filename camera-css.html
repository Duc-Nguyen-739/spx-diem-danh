<style>
/* ===== CAMERA-CSS — overlay quét camera live (file riêng, 2026-08-11) =====
   Áp dụng mọi màn hình (desktop + điện thoại). Nhúng qua scriptlet
   include('camera-css') trong index.html ngay sau include('mobile'). */
.camera-overlay {
  position: fixed; inset: 0; z-index: 500;
  display: none; align-items: center; justify-content: center;
  background: rgba(2, 6, 23, .94);
  padding: 14px;
}
.camera-stage {
  width: 100%; max-width: 480px;
  height: 100%;
  display: flex; flex-direction: column; gap: 12px;
}
.camera-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.camera-title { color: #fff; font-size: 15px; font-weight: 600; }
.camera-close { color: #fff; background: rgba(255,255,255,.08); border-radius: 10px; }
.camera-head-actions { display: flex; align-items: center; gap: 8px; }
/* Nút 🔍 Tìm Mã (2026-08-16): cạnh nút Đóng — ép focus liên tục + quét nhanh hơn.
   active = đang tìm (nền cam SPX + viền sáng), bấm lần nữa để tắt. */
.cam-find-btn {
  font-size: 13px; padding: 7px 12px; border-radius: 10px; border: 0;
  background: #0b57d0; color: #fff; cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255,255,255,.18);
}
.cam-find-btn.active {
  background: #e85d04;
  box-shadow: 0 0 0 2px rgba(255,255,255,.45), 0 0 18px rgba(232,93,4,.55);
}
/* CHIA 60/40 (2026-08-17, yêu cầu user): ô camera 60% · phần thông tin quét 40%
   chiều cao màn hình — .camera-stage lấp đầy overlay, camera-view (flex 3) rộng
   hơn camera-results (flex 2). Video object-fit:cover lấp kín ô. Danh sách thông
   tin dài thì CUỘN (overflow-y:auto trên .camera-results). */
.camera-view {
  position: relative; border-radius: 16px; overflow: hidden;
  background: #000;
  flex: 3 1 60%; min-height: 0;
  box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.55);
}
.camera-view video { width: 100%; height: 100%; object-fit: cover; display: block; }
.camera-frame {
  position: absolute; inset: 12% 9%;
  border: 2px dashed rgba(255,255,255,.8); border-radius: 12px;
  pointer-events: none;
}
/* Thanh căn chỉnh mã vạch (2026-08-17, yêu cầu user): đường ngang sáng giữa
   khung — đưa mã vạch nằm đúng lên đường này để decode nhanh hơn. Căn theo
   .camera-frame (ngang 9%). */
.camera-guide {
  position: absolute; left: 9%; right: 9%; top: 50%;
  height: 2px; transform: translateY(-50%);
  background: linear-gradient(90deg, rgba(255,109,0,0), #ff6d00 15%, #ff6d00 85%, rgba(255,109,0,0));
  box-shadow: 0 0 10px rgba(255,109,0,.85), 0 0 22px rgba(255,109,0,.4);
  pointer-events: none; z-index: 2;
  animation: camGuidePulse 1.6s ease-in-out infinite;
}
@keyframes camGuidePulse {
  0%, 100% { opacity: .6; }
  50% { opacity: 1; }
}
/* 2 đầu ngoặc — nhìn rõ điểm đặt mã vạch */
.camera-guide::before,
.camera-guide::after {
  content: '';
  position: absolute; top: 50%;
  width: 16px; height: 20px;
  border: 2px solid rgba(255,255,255,.9);
  transform: translateY(-50%);
}
.camera-guide::before {
  left: 0; border-right: 0;
  border-radius: 6px 0 0 6px;
}
.camera-guide::after {
  right: 0; border-left: 0;
  border-radius: 0 6px 6px 0;
}
/* Flash phản hồi quét (2026-08-17, yêu cầu user): overlay chớp màu theo trạng thái
   khi nhận mã — xanh ✓ Có mặt · cam ⚠ Dư · đỏ ✕ lỗi. Animation 1 lần rồi tự mờ
   (class được set lại mỗi lượt quét mới — camFlashMark trong camera-scan.html). */
.cam-flash {
  position: absolute; inset: 0; z-index: 3;
  border-radius: 16px; pointer-events: none;
  opacity: 0; display: flex; align-items: center; justify-content: center;
}
.cam-flash.on { animation: camFlashOk .5s ease-out; }
.cam-flash.extra { animation: camFlashExtra .5s ease-out; }
.cam-flash.err { animation: camFlashErr .5s ease-out; }
.cam-flash .cf-mark {
  font-size: 56px; font-weight: 800; color: #4ade80;
  text-shadow: 0 2px 12px rgba(0,0,0,.65);
}
.cam-flash.extra .cf-mark { color: #ffb74d; }
.cam-flash.err .cf-mark { color: #f87171; }
@keyframes camFlashOk {
  0% { opacity: 1; background: rgba(74, 222, 128, .28); }
  100% { opacity: 0; background: rgba(74, 222, 128, 0); }
}
@keyframes camFlashExtra {
  0% { opacity: 1; background: rgba(255, 183, 77, .28); }
  100% { opacity: 0; background: rgba(255, 183, 77, 0); }
}
@keyframes camFlashErr {
  0% { opacity: 1; background: rgba(248, 113, 113, .28); }
  100% { opacity: 0; background: rgba(248, 113, 113, 0); }
}
/* Hiệu ứng quét thành công (2026-08-17, yêu cầu user): ring lan ra từ tâm ô camera +
   dấu ✓/⚠/✕ phóng to (mark pop) + viền khung dẫn hướng glow màu theo trạng thái.
   Kích hoạt bởi camFlashMark (camera-scan.html) — restart mỗi lượt quét mới. */
.cam-flash::before {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: 44px; height: 44px; margin: -22px 0 0 -22px;
  border: 3px solid rgba(74, 222, 128, .9); border-radius: 50%;
  opacity: 0; pointer-events: none;
}
.cam-flash.on::before { border-color: rgba(74, 222, 128, .9); animation: camRing .6s ease-out; }
.cam-flash.extra::before { border-color: rgba(255, 183, 77, .9); animation: camRing .6s ease-out; }
.cam-flash.err::before { border-color: rgba(248, 113, 113, .9); animation: camRing .6s ease-out; }
@keyframes camRing {
  0% { transform: scale(.25); opacity: .95; }
  100% { transform: scale(2.6); opacity: 0; }
}
.cam-flash .cf-mark { display: inline-block; }
.cam-flash.on .cf-mark { animation: camMarkPop .5s ease-out; }
.cam-flash.extra .cf-mark { animation: camMarkPop .5s ease-out; }
.cam-flash.err .cf-mark { animation: camMarkPop .5s ease-out; }
@keyframes camMarkPop {
  0% { transform: scale(.25); opacity: 0; }
  45% { transform: scale(1.3); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.camera-frame.fl-ok { animation: camFrameGlowOk .65s ease-out; }
.camera-frame.fl-extra { animation: camFrameGlowExtra .65s ease-out; }
.camera-frame.fl-err { animation: camFrameGlowErr .65s ease-out; }
@keyframes camFrameGlowOk {
  0% { border-color: #4ade80; box-shadow: 0 0 0 3px rgba(74,222,128,.4), 0 0 26px rgba(74,222,128,.65), inset 0 0 20px rgba(74,222,128,.22); }
  100% { border-color: rgba(255,255,255,.8); box-shadow: none; }
}
@keyframes camFrameGlowExtra {
  0% { border-color: #ffb74d; box-shadow: 0 0 0 3px rgba(255,183,77,.4), 0 0 26px rgba(255,183,77,.65), inset 0 0 20px rgba(255,183,77,.22); }
  100% { border-color: rgba(255,255,255,.8); box-shadow: none; }
}
@keyframes camFrameGlowErr {
  0% { border-color: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,.4), 0 0 26px rgba(248,113,113,.65), inset 0 0 20px rgba(248,113,113,.22); }
  100% { border-color: rgba(255,255,255,.8); box-shadow: none; }
}
/* Dòng kết quả mới vừa quét: nền sáng theo trạng thái rồi tự tắt (nhấn mạnh mã mới
   trong danh sách — kết hợp scroll xuống dòng mới ở camAppendResult). */
.cr-row.new.ok { animation: crRowNewOk 1.2s ease-out; }
.cr-row.new.extra { animation: crRowNewExtra 1.2s ease-out; }
.cr-row.new.err { animation: crRowNewErr 1.2s ease-out; }
@keyframes crRowNewOk { 0% { background: rgba(74, 222, 128, .2); } 100% { background: transparent; } }
@keyframes crRowNewExtra { 0% { background: rgba(255, 183, 77, .18); } 100% { background: transparent; } }
@keyframes crRowNewErr { 0% { background: rgba(248, 113, 113, .2); } 100% { background: transparent; } }
/* Chỉ báo trạng thái worker decode (2026-08-17): "⚙️ Worker: bật/tắt" trong ô camera —
   kiểm tra nhanh Web Worker có chạy được trên thiết bị thật không (fail-open âm thầm
   nên không có cách nào biết; giờ hiện rõ). Set bởi camWorkerStatus (camera-scan.html). */
.cam-worker-status {
  /* Nằm NGOÀI #camStatusLive (để không bị textContent xóa — bug 2026-08-17) →
     tự định vị ngay phía trên thanh status, giữa ô camera. */
  position: absolute; left: 0; right: 0; bottom: 38px;
  text-align: center; z-index: 4; pointer-events: none;
  font-size: 11px; color: #64748b;
  text-shadow: 0 1px 4px rgba(0,0,0,.8);
}
.cam-worker-status.on { color: #81c784; font-weight: 700; }
.cam-worker-status.off { color: #f87171; font-weight: 700; }
.camera-status {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 8px 12px; text-align: center;
  color: #e2e8f0; font-size: 12.5px;
  background: rgba(2, 6, 23, .65);
}
.camera-actions { display: flex; gap: 10px; justify-content: center; }
.camera-actions .btn { min-width: 110px; }
@media (max-width: 600px) {
  .camera-stage { max-width: 420px; }
}
/* ===== QUÉT LIÊN TỤC (2026-08-17): camera trên, kết quả quét dưới =====
   Panel nằm trong #cameraModal — chia đôi màn hình quét: trên là ô camera,
   dưới là danh sách thông tin vừa quét (mã + tên + giờ + badge trạng thái).
   Media ≤600px (mobile) co camera-view nhường chỗ cho danh sách cuộn được. */
.camera-results {
  flex: 2 1 40%; min-height: 0;
  overflow-y: auto;   /* danh sách dài → cuộn trong panel, không đẩy camera */
  background: rgba(2, 6, 23, .62);
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 14px;
}
.camera-results-head {
  position: sticky; top: 0;
  padding: 8px 14px; font-size: 12.5px; font-weight: 600; color: #94a3b8;
  border-bottom: 1px solid rgba(255, 255, 255, .08);
  background: rgba(2, 6, 23, .96);
}
.camera-results-body { padding: 4px 0; }
.camera-results-body:empty::after {
  content: 'Quét mã để xem kết quả ở đây — camera không tự đóng';
  display: block; padding: 10px 14px;
  color: #64748b; font-size: 12.5px;
}
.cr-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; font-size: 13px; color: #e2e8f0;
  border-bottom: 1px solid rgba(255, 255, 255, .06);
}
.cr-row:last-child { border-bottom: 0; }
.cr-code { font-weight: 700; color: #fff; white-space: nowrap; }
.cr-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-time { color: #94a3b8; font-size: 11px; white-space: nowrap; }
.cr-badge { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.cr-badge.ok { background: rgba(46, 125, 50, .28); color: #81c784; }
.cr-badge.extra { background: rgba(255, 152, 0, .22); color: #ffb74d; }
.cr-badge.err { background: rgba(211, 47, 47, .28); color: #ef9a9a; }
/* ===== TAB QUÉT RIÊNG (?scan=1) — ẩn toàn app, camera fullscreen =====
   Class scan-mode được thêm vào <body> (camera-scan.html initScanModeIfNeeded) →
   selector phải là body.scan-mode, KHÔNG phải .scan-mode body (không bao giờ khớp —
   body không phải descendant của .scan-mode, bug 2026-08-12 app hiện sau modal). */
body.scan-mode { background: #000; }
body.scan-mode > :not(#cameraModal) { display: none !important; }
body.scan-mode #loadingOverlay { display: none !important; }
.scan-mode .camera-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: #000; padding: 0;
}
.scan-mode .camera-stage { max-width: none; height: 100vh; justify-content: center; gap: 10px; }
.scan-mode .camera-head { padding: 8px 14px 0; }
.scan-mode .camera-view {
  width: 100%; max-width: 560px;
  aspect-ratio: auto; max-height: none; height: 74vh;
  flex: 0 0 auto;
  border-radius: 0;
}
.scan-mode .camera-frame { inset: 8% 6%; }
.scan-mode .camera-guide { left: 6%; right: 6%; }
.scan-mode .camera-results { flex: 0 0 auto; max-height: 28vh; }
.scan-mode .camera-status { font-size: 14px; padding: 12px; }
/* Nút 📷 Quét camera CHỈ hiện trên mobile — desktop ẩn, hiện lại ≤900px.
   QUAN TRỌNG: giữ cả 2 rule CÙNG FILE — camera-css include SAU mobile.html
   nên nếu rule ẩn đứng sau rule hiện (mobile.html) sẽ ẩn cả mobile (bug 2026-08-11). */
#btnCamScan { display: none; }
@media (max-width: 900px) {
  #btnCamScan { display: inline-flex; padding: 8px 12px; font-size: 13px; }
}
/* +Task dropdown: nâng toolbar khỏi stacking context thấp (z-index 1) để menu
   không bị text intro che trên Safari mobile (bug 2026-08-11) */
.intro-m10 .task-list-toolbar { position: relative; z-index: 20; }
.cam-start-btn {
  font-size: 17px; padding: 14px 30px; border-radius: 14px;
  box-shadow: 0 0 0 2px rgba(255,255,255,.3), 0 8px 30px rgba(255,95,46,.45);
}
</style>
