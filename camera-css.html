<style>
/* ===== CAMERA-CSS — overlay quét camera live (file riêng, 2026-08-11) =====
   Áp dụng mọi màn hình (desktop + điện thoại). Nhúng qua scriptlet
   include('camera-css') trong index.html ngay sau include('mobile'). */
.camera-overlay {
  position: fixed; inset: 0; z-index: 500;
  display: none; align-items: center; justify-content: center;
  background: rgba(2, 6, 23, .94);
  padding: 14px;
}
.camera-stage {
  width: 100%; max-width: 480px;
  display: flex; flex-direction: column; gap: 12px;
}
.camera-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.camera-title { color: #fff; font-size: 15px; font-weight: 600; }
.camera-close { color: #fff; background: rgba(255,255,255,.08); border-radius: 10px; }
.camera-view {
  position: relative; border-radius: 16px; overflow: hidden;
  background: #000; aspect-ratio: 3 / 4; max-height: 64vh;
  box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.55);
}
.camera-view video { width: 100%; height: 100%; object-fit: cover; display: block; }

  pointer-events: none;
}

  position: absolute; left: 0; right: 0; bottom: 0;

}

  .camera-stage { max-width: 420px; }

}
/* ===== TAB QUÉT RIÊNG (?scan=1) — ẩn toàn app, camera fullscreen như AppSheet ===== */
.scan-mode body { background: #000; }
.scan-mode body > :not(#cameraModal) { display: none !important; }
.scan-mode .camera-overlay {

  display: flex; align-items: center; justify-content: center;
  background: #000; padding: 0;
