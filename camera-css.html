<style>
/* ===== CAMERA-CSS — overlay quét camera live (file riêng, 2026-08-11) =====
   Áp dụng mọi màn hình (desktop + điện thoại). Nhúng qua scriptlet
   include('camera-css') trong index.html ngay sau include('mobile'). */
.camera-overlay {
  position: fixed; inset: 0; z-index: 500;
  display: none; align-items: center; justify-content: center;
  background: rgba(2, 6, 23, .94);
  padding: 14px;
}
.camera-stage {
  width: 100%; max-width: 480px;
  height: 100%;
  display: flex; flex-direction: column; gap: 12px;
}
.camera-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.camera-title { color: #fff; font-size: 15px; font-weight: 600; }
.camera-close { color: #fff; background: rgba(255,255,255,.08); border-radius: 10px; }
.camera-head-actions { display: flex; align-items: center; gap: 8px; }
/* Nút 🔍 Tìm Mã (2026-08-16): cạnh nút Đóng — ép focus liên tục + quét nhanh hơn.
   active = đang tìm (nền cam SPX + viền sáng), bấm lần nữa để tắt. */
.cam-find-btn {
  font-size: 13px; padding: 7px 12px; border-radius: 10px; border: 0;
  background: #0b57d0; color: #fff; cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255,255,255,.18);
}
.cam-find-btn.active {
  background: #e85d04;
  box-shadow: 0 0 0 2px rgba(255,255,255,.45), 0 0 18px rgba(232,93,4,.55);
}
/* CHIA 50/50 (2026-08-17, yêu cầu user): ô camera và phần thông tin quét mỗi bên
   chiếm nửa chiều cao màn hình — .camera-stage lấp đầy overlay, camera-view +
   camera-results chia đều (flex 1 1 50%). Video object-fit:cover lấp kín ô. */
.camera-view {
  position: relative; border-radius: 16px; overflow: hidden;
  background: #000;
  flex: 1 1 50%; min-height: 0;
  box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 24px 60px rgba(0,0,0,.55);
}
.camera-view video { width: 100%; height: 100%; object-fit: cover; display: block; }
.camera-frame {
  position: absolute; inset: 12% 9%;
  border: 2px dashed rgba(255,255,255,.8); border-radius: 12px;
  pointer-events: none;
}
/* Thanh căn chỉnh mã vạch (2026-08-17, yêu cầu user): đường ngang sáng giữa
   khung — đưa mã vạch nằm đúng lên đường này để decode nhanh hơn. Căn theo
   .camera-frame (ngang 9%). */
.camera-guide {
  position: absolute; left: 9%; right: 9%; top: 50%;
  height: 2px; transform: translateY(-50%);
  background: linear-gradient(90deg, rgba(255,109,0,0), #ff6d00 15%, #ff6d00 85%, rgba(255,109,0,0));
  box-shadow: 0 0 10px rgba(255,109,0,.85), 0 0 22px rgba(255,109,0,.4);
  pointer-events: none; z-index: 2;
  animation: camGuidePulse 1.6s ease-in-out infinite;
}
@keyframes camGuidePulse {
  0%, 100% { opacity: .6; }
  50% { opacity: 1; }
}
/* 2 đầu ngoặc — nhìn rõ điểm đặt mã vạch */
.camera-guide::before,
.camera-guide::after {
  content: '';
  position: absolute; top: 50%;
  width: 16px; height: 20px;
  border: 2px solid rgba(255,255,255,.9);
  transform: translateY(-50%);
}
.camera-guide::before {
  left: 0; border-right: 0;
  border-radius: 6px 0 0 6px;
}
.camera-guide::after {
  right: 0; border-left: 0;
  border-radius: 0 6px 6px 0;
}
.camera-status {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 8px 12px; text-align: center;
  color: #e2e8f0; font-size: 12.5px;
  background: rgba(2, 6, 23, .65);
}
.camera-actions { display: flex; gap: 10px; justify-content: center; }
.camera-actions .btn { min-width: 110px; }
@media (max-width: 600px) {
  .camera-stage { max-width: 420px; }
}
/* ===== QUÉT LIÊN TỤC (2026-08-17): camera trên, kết quả quét dưới =====
   Panel nằm trong #cameraModal — chia đôi màn hình quét: trên là ô camera,
   dưới là danh sách thông tin vừa quét (mã + tên + giờ + badge trạng thái).
   Media ≤600px (mobile) co camera-view nhường chỗ cho danh sách cuộn được. */
.camera-results {
  flex: 1 1 50%; min-height: 0;
  overflow-y: auto;
  background: rgba(2, 6, 23, .62);
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 14px;
}
.camera-results-head {
  position: sticky; top: 0;
  padding: 8px 14px; font-size: 12.5px; font-weight: 600; color: #94a3b8;
  border-bottom: 1px solid rgba(255, 255, 255, .08);
  background: rgba(2, 6, 23, .96);
}
.camera-results-body { padding: 4px 0; }
.camera-results-body:empty::after {
  content: 'Quét mã để xem kết quả ở đây — camera không tự đóng';
  display: block; padding: 10px 14px;
  color: #64748b; font-size: 12.5px;
}
.cr-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; font-size: 13px; color: #e2e8f0;
  border-bottom: 1px solid rgba(255, 255, 255, .06);
}
.cr-row:last-child { border-bottom: 0; }
.cr-code { font-weight: 700; color: #fff; white-space: nowrap; }
.cr-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cr-time { color: #94a3b8; font-size: 11px; white-space: nowrap; }
.cr-badge { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.cr-badge.ok { background: rgba(46, 125, 50, .28); color: #81c784; }
.cr-badge.extra { background: rgba(255, 152, 0, .22); color: #ffb74d; }
.cr-badge.err { background: rgba(211, 47, 47, .28); color: #ef9a9a; }
/* ===== TAB QUÉT RIÊNG (?scan=1) — ẩn toàn app, camera fullscreen =====
   Class scan-mode được thêm vào <body> (camera-scan.html initScanModeIfNeeded) →
   selector phải là body.scan-mode, KHÔNG phải .scan-mode body (không bao giờ khớp —
   body không phải descendant của .scan-mode, bug 2026-08-12 app hiện sau modal). */
body.scan-mode { background: #000; }
body.scan-mode > :not(#cameraModal) { display: none !important; }
body.scan-mode #loadingOverlay { display: none !important; }
.scan-mode .camera-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: #000; padding: 0;
}
.scan-mode .camera-stage { max-width: none; height: 100vh; justify-content: center; gap: 10px; }
.scan-mode .camera-head { padding: 8px 14px 0; }
.scan-mode .camera-view {
  width: 100%; max-width: 560px;
  aspect-ratio: auto; max-height: none; height: 74vh;
  flex: 0 0 auto;
  border-radius: 0;
}
.scan-mode .camera-frame { inset: 8% 6%; }
.scan-mode .camera-guide { left: 6%; right: 6%; }
.scan-mode .camera-results { flex: 0 0 auto; max-height: 28vh; }
.scan-mode .camera-status { font-size: 14px; padding: 12px; }
/* Nút 📷 Quét camera CHỈ hiện trên mobile — desktop ẩn, hiện lại ≤900px.
   QUAN TRỌNG: giữ cả 2 rule CÙNG FILE — camera-css include SAU mobile.html
   nên nếu rule ẩn đứng sau rule hiện (mobile.html) sẽ ẩn cả mobile (bug 2026-08-11). */
#btnCamScan { display: none; }
@media (max-width: 900px) {
  #btnCamScan { display: inline-flex; padding: 8px 12px; font-size: 13px; }
}
/* +Task dropdown: nâng toolbar khỏi stacking context thấp (z-index 1) để menu
   không bị text intro che trên Safari mobile (bug 2026-08-11) */
.intro-m10 .task-list-toolbar { position: relative; z-index: 20; }
.cam-start-btn {
  font-size: 17px; padding: 14px 30px; border-radius: 14px;
  box-shadow: 0 0 0 2px rgba(255,255,255,.3), 0 8px 30px rgba(255,95,46,.45);
}
</style>
