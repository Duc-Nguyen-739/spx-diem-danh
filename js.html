<script>
  // ===== STANDALONE (?app=1): google.script.run → JSONP (2026-08-12) =====
  // GAS serve ?app=1 qua ContentService → trang TOP-LEVEL (KHÔNG iframe wrapper) →
  // camera live hoạt động trên iOS (quét tự nhận mã vạch). Trang top-level KHÔNG có
  // google.script.run (chỉ wrapper iframe mới inject) → shim dưới đây bắt chước ĐÚNG
  // API google.script.run bằng JSONP tới chính deployment này. Kích hoạt CHỈ khi doGet
  // inject cờ window.__RC_STANDALONE__ (cờ này bền hơn location.search — GAS redirect
  // tới URL one-time có thể bỏ query ?app=1) VÀ google.script.run chưa có sẵn — iframe
  // GAS / local mock / hosting tĩnh không có cờ → shim không chạy, mọi thứ như cũ.
  // Server: Code.gs doGet ?action=..&args=..&cb=.. → JsonpApi.gs.
  (function () {
    if (!window.__RC_STANDALONE__) return;
    // DEMO (?demo=1 preview): không gọi GAS — load mock-google.js (khối dưới) để test UI/camera
    // với dữ liệu giả. Chỉ serve.js chèn cờ __RC_DEMO__ khi URL có demo=1 — production không đổi.
    if (window.__RC_DEMO__) return;
    if (window.google && window.google.script && window.google.script.run) return;
    var base = window.__RC_API_BASE__ || '';
    if (!base) return;
    // 2026-08-19 (NEW-1): token API tùy chọn — backend Python bắt buộc khi chạy với
    // env ROLLCALL_API_TOKEN (host thật không có lá chắn deployment access như GAS).
    // Rỗng = không gửi (backward compat — preview/demo không cần token).
    var apiToken = window.__RC_API_TOKEN__ || '';
    var seq = 0;
    function resolveRpc(res, handlers) {
      if (res && res.ok === false) {
        // 2026-08-20 (review): GAS lẫn Python services đều trả {ok:false, message}
        // (vd ScanService.gs 'Task đã kết thúc') — res.error CHỈ có từ dispatch
        // exception Python → trước đây mọi reject hiện 'Lỗi server' chung chung.
        if (handlers.failure) handlers.failure({ message: res.error || res.message || 'Lỗi server' });
      } else if (handlers.success) {
        handlers.success(res && res.ok === true ? res.result : res);
      }
    }
    function jsonpCall(fnName, args, handlers) {
      var cbName = '__rcJsonp' + (++seq) + '_' + Date.now();
      var scriptId = '__rcScript_' + cbName;
      var sep = base.indexOf('?') >= 0 ? '&' : '?';
      var url = base + sep + 'action=' + encodeURIComponent(fnName)
        + '&args=' + encodeURIComponent(JSON.stringify(args || []))
        + '&cb=' + encodeURIComponent(cbName);
      // 2026-08-19 (NEW-1): token tùy chọn — backend Python bắt buộc khi env ROLLCALL_API_TOKEN
      if (apiToken) url += '&token=' + encodeURIComponent(apiToken);
      // Timeout 30s (bug 2026-08-19): jsonpCall không có cơ chế hết hạn → RPC treo
      // (mạng chết giữa chừng / GAS deploy fail) kẹt SCAN_PROCESSING vĩnh viễn.
      // Response trễ sau timeout bị bỏ qua (timedOut guard), failure handler chạy 1 lần.
      var timedOut = false;
      var timer = setTimeout(function () {
        timedOut = true;
        cleanup();
        if (handlers.failure) handlers.failure({ message: 'Không kết nối được server' });
      }, 30000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        var el = document.getElementById(scriptId);
        if (el && el.parentNode) el.parentNode.removeChild(el);
      }
      function onResult(res) {
        if (timedOut) return;
        cleanup();
        resolveRpc(res, handlers);
      }
      // PRODUCTION (2026-08-12): backend Python api cùng origin (Freebuff hosting) →
      // fetch JSON thay JSONP (không cần CORS). API trả JSON khi không có cb.
      // BUG 2026-08-20 (review): url vẫn kèm &cb= → server trả JSONP body cb({...}) →
      // r.json() fail → MỌI RPC "Không kết nối được server" trên backend cùng origin.
      // Fix: bỏ cb ở nhánh fetch (giữ token — test jsonp-api kiểm tra &token=).
      var sameOrigin = url.indexOf('//') < 0 || url.indexOf(window.location.origin) === 0;
      if (sameOrigin && typeof window.fetch === 'function') {
        fetch(url.replace(/&cb=[^&]*/, ''))
          .then(function (r) { return r.json(); })
          .then(function (res) { onResult(res); })
          .catch(function () {
            if (timedOut) return;
            cleanup();
            if (handlers.failure) handlers.failure({ message: 'Không kết nối được server' });
          });
        return;
      }
      window[cbName] = onResult;
      var s = document.createElement('script');
      s.id = scriptId;
      s.src = url;
      s.onerror = function () {
        if (timedOut) return;
        cleanup();
        if (handlers.failure) handlers.failure({ message: 'Không kết nối được server' });
      };
      (document.head || document.documentElement).appendChild(s);
    }
    function makeRunner(state) {
      state = state || { success: null, failure: null };
      var runner = {
        withSuccessHandler: function (f) { return makeRunner({ success: f, failure: state.failure }); },
        withFailureHandler: function (f) { return makeRunner({ success: state.success, failure: f }); },
        withUserObject: function () { return runner; }
      };
      return new Proxy(runner, {
        get: function (target, prop) {
          if (prop in target) return target[prop];
          return function () {
            jsonpCall(String(prop), Array.prototype.slice.call(arguments), state);
          };
        }
      });
    }
    window.google = window.google || {};
    window.google.script = window.google.script || {};
    window.google.script.run = makeRunner();
  })();

  // Mock local: khi mở file:// trực tiếp (không qua GAS), nạp mock-google.js.
  // Deploy GAS: google.script được wrapper GAS inject vào iframe → nhánh này không chạy.
  // TAB QUÉT (?scan=1): camera-scan.html (include TRƯỚC js.html) đã đặt
  // window.__RC_SCAN_MODE__ = true khi phát hiện scan mode → bỏ qua mock (app không init).
  // BUG trang trắng (2026-08-11 + 2026-08-12): mở thẳng URL content GAS, google.script
  // chưa kịp inject + scan=1 KHÔNG nằm trong location.search (wrapper GAS nạp app qua
  // document.write vào iframe /blank → query bị nuốt) → document.write lúc này XÓA TRẮNG
  // toàn trang. Giờ: document.write CHỈ khi document còn đang parse (an toàn — thêm nội
  // dung), còn lại dùng DOM injection (appendChild) — không bao giờ xoá trang.
  if (!window.__RC_SCAN_MODE__ && (typeof google === 'undefined' || !google.script)) {
    if (document.readyState === 'loading') {
      document.write('<script src="mock/mock-google.js?v=' + Date.now() + '"><\/script>');
    } else {
      var __mockEl = document.createElement('script');
      __mockEl.src = 'mock/mock-google.js?v=' + Date.now();
      document.head.appendChild(__mockEl);
    }
  }

  var META = null;
  var CURRENT_TASK = null;
  var CURRENT_LOG = [];
  var CURRENT_COUNTERS = null;  // state counters để optimistic cập nhật ngay
  var BUSY = false;
  var AUTO_FOCUS_TIMER = null;

  // P3: hằng số status — KHÔNG hardcode chuỗi tiếng Việt trong logic (đổi label = vỡ logic).
  // Khớp STATUS trong Config.gs; label hiển thị badge dùng đúng chuỗi này.
  var STATUS_C = { PENDING: '-', PRESENT: 'Có mặt', ABSENT: 'Vắng', EXTRA: 'Dư', OUT: 'Ra ngoài' };
  // meal-move: mode quét hiện tại ('ra' | 'vao'); mặc định 'ra' (creator tạo task)
  var MEAL_MODE = 'ra';
  // Email người dùng hiện tại (từ getMeta) — phân quyền chuyển Ra/Vào meal-move:
  // CHỈ email tạo task (createdBy) được dùng mode 'ra' (Quét Danh Sách); người khác khóa 'vao'.
  var CURRENT_USER_EMAIL = '';
  // ===== STAFF-CACHE-START =====
  // Client staff index cache (staffId → thông tin hiển thị) — scan NV lạ (Dư) hiện thông tin
  // NGAY từ cache, không chờ server round-trip (yêu cầu 2026-08-11). Tải lúc boot + tạo task.
  var STAFF_INFO = {}; // { staffId: { staffName, slotCode, station, team, workstation, agency } }
  function lookupStaffInfo(staffId) {
    var q = String(staffId || '').toUpperCase();
    return STAFF_INFO[q] || null;
  }
  // ===== STAFF-CACHE-END =====
  var STAFF_INFO_LOADING = false;
  // Tải staff index compact (getStaffIndexApi) + cache localStorage 12h — không tải lại mỗi lần mở app.
  function loadStaffIndex() {
    try {
      var cachedTs = Number(localStorage.getItem('rc2_staffIndexTs') || 0);
      if (cachedTs && Date.now() - cachedTs < 12 * 3600 * 1000) {
        var cached = localStorage.getItem('rc2_staffIndex');
        if (cached) { STAFF_INFO = JSON.parse(cached); return; }
      }
    } catch (e) { /* localStorage hỏng → tải lại từ server */ }
    if (STAFF_INFO_LOADING) return;
    STAFF_INFO_LOADING = true;
    google.script.run
      .withSuccessHandler(function (res) {
        STAFF_INFO_LOADING = false;
        if (!res || !res.ok || !res.staff) return;
        STAFF_INFO = res.staff || {};
        try {
          localStorage.setItem('rc2_staffIndex', JSON.stringify(STAFF_INFO));
          localStorage.setItem('rc2_staffIndexTs', String(Date.now()));
        } catch (e) {}
      })
      .withFailureHandler(function () { STAFF_INFO_LOADING = false; })
      .getStaffIndexApi();
  }
  var TT_LABEL_MEAL = { 'meal-move': 'Điểm danh Ra/Vào' };
  // Task status — khớp TASK_STATUS trong Config.gs
  var TASK_STATUS_C = { OPEN: 'open', DONE: 'done' };

  // Cache element lookup — id lặp nhiều lần (scanInput 14×, bảng, modal…) chỉ query DOM 1 lần
  // (2026-08-16 tối ưu — tránh getElementById trùng trong vòng render/quét/poll). Chỉ cache
  // khi tìm thấy (null → query lại) — an toàn với element tạo muộn / bị thay nội dung.
  // 2026-08-19 (A2): node bị thay qua innerHTML (vd textarea #taskNoteEdit) → cache còn giữ
  // node DETACH → đọc .value trên node cũ mất nội dung. document.contains kiểm tra rẻ (không
  // query DOM) — node không còn trong document → query lại. Guard typeof cho mock test không có
  // contains (scan-poll.test.js) → fallback hành vi cũ.
  var _byIdCache = {};
  function byId(id) {
    var n = _byIdCache[id];
    if (!n || (typeof document.contains === 'function' && !document.contains(n))) {
      n = _byIdCache[id] = document.getElementById(id);
    }
    return n;
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.__RC_SCAN_MODE__ || location.search.indexOf('scan=1') !== -1) {
      // TAB QUÉT RIÊNG: chỉ chạy camera (camera-scan.html tự khởi động trước đó) —
      // KHÔNG init app (google.script có thể không tồn tại khi mở thẳng URL content).
      // __RC_SCAN_MODE__ do camera-scan.html đặt (cờ bền hơn location.search — wrapper
      // GAS có thể không forward query vào URL app trong iframe, bug 2026-08-12).
      return;
    }
    loadMetaAndOptions();
    // Mobile: ẩn dashboard mặc định (bấm ☰ để mở lại — drawer xổ từ trái, 2026-08-13).
    // Giữ nguyên mọi logic lọc/KPI — chỉ ẩn sidebar khỏi màn hình chính.
    if (window.matchMedia && window.matchMedia('(max-width: 900px)').matches) {
      var layout = document.querySelector('.dash-layout');
      if (layout && !layout.classList.contains('mini')) layout.classList.add('mini');
      // Drawer: bấm ra ngoài panel (backdrop/main) → tự đóng, không cần bấm « hay ☰.
      // Loại trừ .dash-reopen vì bấm ☰ để MỞ — nếu không sẽ đóng ngay sau khi mở.
      if (layout) {
        layout.addEventListener('click', function (e) {
          if (layout.classList.contains('mini')) return;
          var t = e.target;
          if (t && t.closest && !t.closest('.dash-side, .dash-reopen')) layout.classList.add('mini');
        });
      }
    }
    // Co màn hình xuống mobile bất kỳ lúc nào → tự ẩn dashboard (tránh drawer tự
    // bung ra che cả màn hình khi thu nhỏ cửa sổ từ desktop).
    var mqDash = window.matchMedia ? window.matchMedia('(max-width: 900px)') : null;
    if (mqDash) {
      var syncDashMini = function (m) {
        var layout = document.querySelector('.dash-layout');
        if (!layout) return;
        if (m.matches) {
          if (!layout.classList.contains('mini')) layout.classList.add('mini');
        } else {
          layout.classList.remove('mini');
        }
      };
      if (mqDash.addEventListener) mqDash.addEventListener('change', syncDashMini);
      else if (mqDash.addListener) mqDash.addListener(syncDashMini);
    }
    byId('scanInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitScan();
      }
    });
    // FIX-27: dán mã (Ctrl+V) vào ô quét → tự submit — súng scanner tự gửi Enter qua
    // keydown, paste tay không có → không tự quét. setTimeout 0: paste fire TRƯỚC khi
    // value cập nhật. submitScan tự xử lý mọi path (batch/paste-busy/task đóng).
    // Input type=text sanitize strip \\n → 'a\\nb' thành 'ab' (mất batch) — chèn
    // clipboard raw trước khi sanitize để batch meal-move vẫn kích hoạt.
    byId('scanInput').addEventListener('paste', function (e) {
      try {
        var clip = e.clipboardData && e.clipboardData.getData ? e.clipboardData.getData('text') : '';
        if (clip && /[\r\n]/.test(clip)) {
          e.preventDefault();
          var text = clip.replace(/[\r\n]+/g, ', ');
          var el = byId('scanInput');
          var s = el.selectionStart != null ? el.selectionStart : el.value.length;
          var end = el.selectionEnd != null ? el.selectionEnd : el.value.length;
          el.value = el.value.slice(0, s) + text + el.value.slice(end);
          try { el.selectionStart = el.selectionEnd = s + text.length; } catch (e2) {}
        }
      } catch (e2) {}
      setTimeout(function () {
        if (byId('scanInput').value.trim()) submitScan();
      }, 0);
    });
    var camFileEl = byId('camFile');
    if (camFileEl) camFileEl.addEventListener('change', onCamFileChange);
    // +Task: bấm ra ngoài menu (backdrop phủ toàn màn) → tự cuộn lại — không cần bấm
    // đúng nút +Task (yêu cầu 2026-08-12). Nút +Task z-index cao hơn backdrop nên bấm
    // nút vẫn toggle như cũ; menu items cao hơn backdrop nên chọn task không bị chặn.
    var taskMenuBackdrop = byId('taskMenuBackdrop');
    if (taskMenuBackdrop) taskMenuBackdrop.addEventListener('click', function () { closeTaskMenu(); });
    initNetworkStatus();
    initCreatePreview();
    initHeaderSearch();
    startAutoFocusLoop();
    initScanTopbarStuck();
    initScanFilters();
  });

  /* C3: tìm kiếm + lọc trạng thái + sort cột bảng scan */
  function initScanFilters() {
    var searchEl = byId('scanSearch');
    var statusEl = byId('scanStatusFilter');
    var clearEl = byId('scanClearFilter');
    var scanTbl = byId('scanTable');
    // C1: populate filter options từ STATUS_C — 1 nguồn sự thật, đổi label không vỡ filter.
    if (statusEl && statusEl.options.length === 1) {
      var FILTER_LABELS = {};
      FILTER_LABELS[STATUS_C.PENDING] = 'Chưa điểm danh';
      FILTER_LABELS[STATUS_C.PRESENT] = STATUS_C.PRESENT;
      FILTER_LABELS[STATUS_C.ABSENT] = STATUS_C.ABSENT;
      FILTER_LABELS[STATUS_C.EXTRA] = STATUS_C.EXTRA;
      [STATUS_C.PENDING, STATUS_C.PRESENT, STATUS_C.ABSENT, STATUS_C.EXTRA].forEach(function (v) {
        var o = document.createElement('option');
        o.value = v;
        o.textContent = FILTER_LABELS[v];
        statusEl.appendChild(o);
      });
    }
    // 2026-08-20: debounce 150ms — tránh renderScanTable (sort + paint ~600 dòng)
    // chạy mỗi ký tự gõ; đồng nhất headerSearch (350ms) / previewStaff (400ms).
    var _scanSearchTimer = null;
    if (searchEl) searchEl.addEventListener('input', function () {
      SCAN_FILTER.q = searchEl.value;
      clearTimeout(_scanSearchTimer);
      _scanSearchTimer = setTimeout(function () { renderScanTable(CURRENT_LOG); }, 150);
    });
    if (statusEl) statusEl.addEventListener('change', function () {
      SCAN_FILTER.status = statusEl.value;
      renderScanTable(CURRENT_LOG);
    });
    if (clearEl) clearEl.addEventListener('click', function () {
      SCAN_FILTER.q = '';
      SCAN_FILTER.status = '';
      if (searchEl) searchEl.value = '';
      if (statusEl) statusEl.value = '';
      renderScanTable(CURRENT_LOG);
    });
    if (scanTbl) scanTbl.addEventListener('click', function (e) {
      var th = e.target && e.target.closest ? e.target.closest('th.sortable') : null;
      if (!th) return;
      var col = parseInt(th.dataset.sort, 10);
      if (SCAN_SORT.col === col) SCAN_SORT.asc = !SCAN_SORT.asc;
      else { SCAN_SORT.col = col; SCAN_SORT.asc = true; }
      updateSortIndicators();
      renderScanTable(CURRENT_LOG);
    });
    updateSortIndicators();
  }

  /* ===== Scan topbar sticky — thêm viền/bóng khi dính (thuần hiển thị) ===== */
  function initScanTopbarStuck() {
    var bar = document.querySelector('.scan-topbar');
    if (!bar) return;
    // P2: đọc chiều cao header từ CSS token --header-h (không hardcode 53) — 1 nguồn
    var HEADER_H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 53;
    var onScroll = function () {
      var rect = bar.getBoundingClientRect();
      bar.classList.toggle('stuck', rect.top <= HEADER_H);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  /* ===== Auto-focus loop (tham khảo v1): giữ focus vào scan input trên kiosk touch =====
     3s: tự quay về ô "Quét hoặc dán mã nhân viên…" khi kiosk idle — áp dụng cả 2 task
     Điểm danh ca (reconcile) và Điểm danh Ra/Vào (meal-move), cùng input #scanInput.
     KHÔNG giật focus khi đang focus ở ô lọc #scanSearch / ghi chú #taskNoteEdit (INPUT/TEXTAREA). */
  function startAutoFocusLoop() {
    if (AUTO_FOCUS_TIMER) return;
    AUTO_FOCUS_TIMER = setInterval(function () {
      // S10: modal đang mở → không giật focus về scan input
      if (anyModalOpen()) return;
      var scanView = byId('viewScan');
      var input = byId('scanInput');
      // P2 (audit): viewScan hidden → không cần giữ focus (đang ở danh sách task);
      // dừng luôn interval để không chạy vô ích mỗi 3s trên kiosk bật lâu.
      if (!scanView || scanView.classList.contains('hidden')) { stopAutoFocusLoop(); return; }
      if (input && !input.disabled) {
        var active = document.activeElement;
        // Giữ nguyên khi user đang nhập liệu (INPUT/SELECT/TEXTAREA) — tránh giật focus giữa lúc gõ
        // (lọc bảng #scanSearch / #scanStatusFilter, sửa ghi chú #taskNoteEdit). Sau 3s nếu focus
        // đã ra ngoài input (body/bảng) → tự quay về ô quét. Áp dụng cả 2 loại task cùng #scanInput.
        if (active !== input && active && active.tagName !== 'SELECT' && active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA') {
          input.focus();
        }
      }
    }, 3000);
  }
  function stopAutoFocusLoop() {
    if (AUTO_FOCUS_TIMER) { clearInterval(AUTO_FOCUS_TIMER); AUTO_FOCUS_TIMER = null; }
  }

  /* ===== Trạng thái mạng (header command center) ===== */
  // P2: netDot phản ánh BOTH network interface (navigator.onLine) VÀ server GAS còn
  // sống. navigator.onLine chỉ báo mạng — deploy fail/timeout/quota GAS không đổi nó,
  // operator dễ bị đánh lừa thấy "Online" xanh trong khi app chết. Bất kỳ RPC fail
  // (google.script.run → withFailureHandler) đều là server unreachable thật: business
  // lỗi đã được server tự catch và trả về {ok:false} qua success handler.
  var SERVER_OK = true;
  function updateNetStatus(online) {
    var dot = byId('netDot');
    var txt = byId('netText');
    if (!dot || !txt) return;
    if (online === undefined) online = navigator.onLine;
    var ok = SERVER_OK && online;
    dot.className = 'net-dot' + (ok ? '' : ' offline');
    txt.textContent = SERVER_OK ? (online ? 'Online' : 'Offline') : 'Server lỗi';
  }
  function markServerFail() {
    if (!SERVER_OK) return;
    SERVER_OK = false;
    updateNetStatus();
  }
  function markServerOk() {
    if (SERVER_OK) return;
    SERVER_OK = true;
    updateNetStatus();
  }
  function initNetworkStatus() {
    updateNetStatus();
    window.addEventListener('online', function () { updateNetStatus(true); });
    window.addEventListener('offline', function () { updateNetStatus(false); });
  }

  /* ===== Spin loading overlay (ẩn sau lần load đầu tiên) ===== */
  var OVERLAY_HIDDEN = false;
  function hideLoadingOverlay() {
    if (OVERLAY_HIDDEN) return;
    OVERLAY_HIDDEN = true;
    var o = byId('loadingOverlay');
    if (o) o.classList.add('hide');
  }
  // P2: reset cờ để lần skip kế tiếp chạy được (trước đây OVERLAY_HIDDEN=true vĩnh viễn).
  // Chỉ toggle class .hide (opacity/visibility transition) — KHÔNG đụng display:
  // timer 500ms cũ có thể display:none overlay của task đang load (race).
  function showLoadingOverlay() {
    OVERLAY_HIDDEN = false;
    var o = byId('loadingOverlay');
    if (!o) return;
    o.classList.remove('hide');
  }

  /* ===== Âm thanh toggle (tham khảo v1) ===== */
  var SOUND_ON = true;

  }

  function dashState() {

    return { st: (r && r.value) || 'all', type: vals('dashType'), stn: vals('dashStn'), ca: vals('dashCa'), team: vals('dashTeam') };

  function dashMatch(t, s) {
    if (s.st === 'open' && t.status === TASK_STATUS_C.DONE) return false;
    if (s.st === 'done' && t.status !== TASK_STATUS_C.DONE) return false;
    if (s.stn.length && s.stn.indexOf(String(t.station || '')) === -1) return false;
    if (s.ca.length && String(t.slotCode || '')) {
      var tCa = String(t.slotCode).split(',').map(function(v){ return v.trim(); }).filter(Boolean);
      var hitCa = false;
      for (var ci=0; ci<tCa.length; ci++) if (s.ca.indexOf(tCa[ci]) !== -1) { hitCa=true; break; }
      if (!hitCa) return false;

    if (s.team.length) {
      var tTeam = String(t.team || '').split(',').map(function(v){ return v.trim(); }).filter(Boolean);
      var hitTeam = false;
      for (var ti=0; ti<tTeam.length; ti++) if (s.team.indexOf(tTeam[ti]) !== -1) { hitTeam=true; break; }
      if (!hitTeam) return false;

    BUSY = true;
    var btn = byId('btnCreateSubmit');
    if (btn) btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        BUSY = false;
        if (btn) btn.disabled = false;
        if (res.ok) {
          closeCreateModal();
          showToast(res.message + ' — ' + res.count + ' NV', false);
          loadTaskList();
          // O-B (2026-08-20): bỏ loadStaffIndex() — server index đã fresh từ app load;
          // scan response tự mang info NV lạ (Dư) về → không cần tải lại full ~90KB
          openScan(res.taskId);
        } else {
          showToast(res.message, true);
        }
      })
      .withFailureHandler(function (err) {
        BUSY = false;
        if (btn) btn.disabled = false;
        showToast('Lỗi tạo task: ' + err.message, true);
      })
      .createReconcileTaskApi(input);
  }

  function openScan(taskId) {
    // (2026-08-24 review, Muse B6): mirror backToList — chặn mở task khác khi còn scan
    // queue/đang xử lý (nếu không CURRENT_TASK đổi giữa chừng → response cũ render vào
    // task mới, scan card/toast lệch task).
    if (scanBusy()) {
      showToast(SCAN_QUEUE.length > 0
        ? 'Đang xử lý ' + SCAN_QUEUE.length + ' lượt quét — chờ xong rồi mở task'
        : 'Đang xử lý lượt quét — chờ xong rồi mở task', true);
      return;
    }
    stopTaskListPolling(); // vào màn quét → màn quét tự poll chi tiết, dừng poll danh sách
    byId('viewList').classList.add('hidden');
    byId('viewScan').classList.remove('hidden');
    // P2 (2026-08-21): tải staff index LƯỜI tại đây (không phải lúc boot) — chỉ cần khi
    // mở màn quét để lookup NV lạ (Dư). Cache localStorage 12h → lần mở sau không gọi RPC.
    loadStaffIndex();
    // T1 preload có gate (2026-08-23): vào màn quét mới tải ZXing lúc idle (sau 1.5s),
    // không tải lúc boot/list (kiosk chỉ xem list không quét → tiết kiệm 328KB).
    // requestIdleCallback ưu tiên idle, fallback setTimeout; fail-open (mất mạng → Quagga).
    try {
      if (!window.__RC_DEMO__ && typeof ensureZxingLib === 'function') {
        var preloadZxing = function () { try { ensureZxingLib(); } catch (e2) {} };
        if (typeof window.requestIdleCallback === 'function') window.requestIdleCallback(preloadZxing, { timeout: 3000 });
        else setTimeout(preloadZxing, 1500);
      }
    } catch (e) {}
    // P2 (audit): interval auto-focus đã bị dừng khi về danh sách → khởi động lại
    startAutoFocusLoop();
    // P2 (SWR an toàn): vừa xem task này xong (<15s) → render NGAY từ bộ nhớ,
    // KHÔNG spinner + RPC nền sync im lặng — hết chờ đợi khi quay lại mở cùng task.
    if (CURRENT_TASK && CURRENT_TASK.taskId === taskId
        && LAST_SCAN_VIEW.taskId === taskId
        && Date.now() - LAST_SCAN_VIEW.ts < SCAN_CACHE_TTL_MS) {
      renderScanView({ task: CURRENT_TASK, log: CURRENT_LOG, counters: CURRENT_COUNTERS });
      hideLoadingOverlay();  // phòng nếu overlay còn từ lần trước
      loadTaskDetail(taskId, true);  // RPC nền — sync dữ liệu mới nhất (nếu có thay đổi)
      return;
    }
    showLoadingOverlay();  // P2: spinner khi đang load danh sách NV (ẩn ở success/failure)
    loadTaskDetail(taskId);
  }

  function backToList() {
    // P2: chặn thoát khi còn scan queue HOẶC đang xử lý item cuối (queue rỗng nhưng
    // SCAN_PROCESSING=true) — nếu không, response cũ trả về render vào task mới đang
    // xem → scan card/toast lệch task, CURRENT_LOG bị ghi đè giữa chừng.
    if (scanBusy()) {
      showToast(SCAN_QUEUE.length > 0
        ? 'Đang xử lý ' + SCAN_QUEUE.length + ' lượt quét — chờ xong rồi quay lại'
        : 'Đang xử lý lượt quét — chờ xong rồi quay lại', true);
      return;
    }
    stopScanPolling();  // rời màn quét → dừng poll đồng bộ
    byId('viewScan').classList.add('hidden');
    byId('viewList').classList.remove('hidden');
    loadTaskList();
  }

  var SCAN_LOAD_SEQ = 0; // chống response task cũ ghi đè khi chuyển task nhanh
  // P2 (SWR an toàn): snapshot task vừa xem — quay lại + mở cùng task trong 15s
  // render NGAY từ bộ nhớ (không spinner, không chờ RPC) + gọi RPC nền sync im lặng.
  // TTL 15s khớp server TASK_DETAIL — không bao giờ hiển thị data stale hơn server.
  var LAST_SCAN_VIEW = { taskId: null, ts: 0 };
  var SCAN_CACHE_TTL_MS = 15000;

  // Render view scan từ data (dùng chung cho full-load và cache-reuse)
  function renderScanView(data) {
    var skel = byId('scanSkeleton');
    var tbl = byId('scanTable');
    var empty = byId('scanEmpty');
    CURRENT_TASK = data.task;
    CURRENT_LOG = data.log || [];
    byId('scanTaskTitle').textContent = data.task.taskId;
    var metaEl = byId('scanTaskMeta');
    var TT_LABEL = { reconcile: 'Đối chiếu', 'meal-move': TT_LABEL_MEAL['meal-move'] };
    var isMealMove = data.task.taskType === 'meal-move';
    metaEl.innerHTML =
      esc(TT_LABEL[data.task.taskType] || 'Task') +
      (isMealMove ? '' : ' · ' + esc(data.task.station) + ' · ' + esc(data.task.slotCode) + ' · ' + esc(data.task.team)) +
      (data.task.status === TASK_STATUS_C.DONE ? ' · <b>Đã kết thúc</b>' : ' · Đang mở') +
      // Hiện email creator cho mọi loại task (giống meal-move)
      (data.task.createdBy ? ' · ' + esc(creatorName(data.task.createdBy)) : '');
    renderTaskNote(data.task);
    // Quyền Ra/Vào meal-move: CHỈ email tạo task (createdBy) được mode 'ra' (Quét Danh Sách);
    // người khác ẩn nút + khóa 'vao' (Điểm Danh). Anonymous web app (currentUser rỗng) →
    // fallback cũ (hiện nút, mặc định 'ra'); server resolveMealMoveMode_ vẫn tự ép quyền.
    var isCreator = CURRENT_USER_EMAIL && CURRENT_USER_EMAIL === String(data.task.createdBy || '').trim().toLowerCase();
    var effCreator = CURRENT_USER_EMAIL ? isCreator : true;
    // meal-move: hiện cột Giờ Ra / Giờ Vào / Vender / Số phút + toggle Ra|Vào + counter "Ra ngoài"
    toggleMealColumns(isMealMove);
    var toggleWrap = byId('mealToggleWrap');
    if (toggleWrap) toggleWrap.style.display = isMealMove ? 'flex' : 'none';
    // Nút "Chuyển Quét": chỉ meal-move + còn mở (disable khi đã kết thúc)
    var swBtn = byId('btnMealSwitch');
    if (swBtn) {
      swBtn.hidden = !isMealMove || !effCreator;
      swBtn.disabled = !isMealMove || !effCreator || data.task.status !== TASK_STATUS_C.OPEN;
    }
    var lockNote = byId('mealCreatorLock');
    if (lockNote) lockNote.style.display = (isMealMove && !effCreator) ? '' : 'none';
    // Reconcile (Điểm Danh Ca): render header 7 cột (Mã NV|Tên NV|Ca|Team|Station|Trạng thái|Giờ điểm danh)
    // meal-move: render header 10 cột có Giờ Ra/Giờ Vào/Vender/Số phút. Header luôn khớp body.
    renderScanHeader(isMealMove);
    if (isMealMove) {
      // Creator → mặc định 'ra' (Quét Danh Sách); người khác → ép 'vao' (Điểm Danh)
      setMealMode(effCreator ? 'ra' : 'vao');
    }
    if (skel) skel.style.display = 'none';
    if (tbl) tbl.style.display = '';
    renderScanTable(data.log);
    CURRENT_COUNTERS = data.counters || { scanned: 0, absent: 0, extra: 0, out: 0, total: (data.log || []).length };
    renderCounters(CURRENT_COUNTERS);
    var canScan = data.task.status === TASK_STATUS_C.OPEN;
    byId('scanInput').disabled = !canScan;
    byId('scanInput').placeholder = canScan ? 'Quét hoặc dán mã nhân viên…' : 'Task đã kết thúc';
    var camBtn = byId('btnCamScan');
    if (camBtn) camBtn.disabled = !canScan;
    updateFinishBtnState();
    if (canScan && !window.__RC_CAM_OPEN__) {
      var __cm = byId('cameraModal');
      if (!__cm || __cm.style.display !== 'flex') {
        byId('scanInput').focus();
      }
    }
  }

  // silent=true: gọi RPC nền (đã render từ cache) — KHÔNG show spinner, KHÔNG reset UI
  function loadTaskDetail(taskId, silent) {
    var seq = ++SCAN_LOAD_SEQ;
    if (!silent) {
      // Reset UI NGAY — tránh hiển thị dữ liệu task mở trước đó trong lúc loading
      var skel = byId('scanSkeleton');
      var tbl = byId('scanTable');
      var empty = byId('scanEmpty');
      if (skel) skel.style.display = '';
      if (tbl) tbl.style.display = 'none';
      if (empty) empty.style.display = 'none';
      CURRENT_TASK = null;
      CURRENT_LOG = [];
      byId('scanTaskTitle').textContent = 'Đang tải…';
      byId('scanTaskMeta').textContent = '';
      byId('scanInput').value = '';
      byId('scanInput').disabled = true;
      renderCounters({ scanned: 0, absent: 0, extra: 0 });
      resetScanCard();
      updateFinishBtnState();
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (seq !== SCAN_LOAD_SEQ) return; // response của task cũ — bỏ qua
        // FIX-08: RPC load về giữa chừng user đang quét/paste — render đè sẽ thay
        // nguyên CURRENT_LOG làm mồ côi dòng optimistic. Path silent: bỏ (poll 3s
        // tự đồng bộ). Path non-silent: đợi queue rảnh rồi tải lại (skeleton không kẹt).
        if (scanBusy()) {
          if (silent) return;
          // Path non-silent: đợi queue/paste rảnh rồi tải lại (tối đa 10s) — skeleton không kẹt.
          var waitedMs = 0;
          var waitFree = setInterval(function () {
            if (scanBusy() && waitedMs < 10000) { waitedMs += 300; return; }
            clearInterval(waitFree);
            var vs = byId('viewScan');
            if (vs && !vs.classList.contains('hidden')) loadTaskDetail(taskId);
          }, 300);
          return;
        }
        if (!res.ok) { if (!silent) { showToast(res.message, true); backToList(); } return; }
        renderScanView(res);
        LAST_SCAN_VIEW = { taskId: taskId, ts: Date.now() };
        hideLoadingOverlay();  // P2: load xong → ẩn spinner
        startScanPolling(taskId);  // đồng bộ real-time với thiết bị khác cùng mở task này
      })
      .withFailureHandler(function (err) {
        if (seq !== SCAN_LOAD_SEQ) return; // response của task cũ — bỏ qua
        hideLoadingOverlay();  // P2: load lỗi cũng ẩn spinner
        if (silent) return; // RPC nền lỗi — giữ view đang hiển thị (cache) — không phá UX
        var skel = byId('scanSkeleton');
        var tbl = byId('scanTable');
        var empty = byId('scanEmpty');
        if (skel) skel.style.display = 'none';
        if (tbl) tbl.style.display = '';
        // P2: reset trạng thái view khi load lỗi — hết view treo "Đang tải…" + input disabled
        byId('scanTaskTitle').textContent = 'Không tải được task';
        byId('scanTaskMeta').textContent = '';
        if (empty) { empty.textContent = 'Lỗi tải chi tiết — bấm ← Danh sách task để quay lại'; empty.style.display = ''; }
        byId('scanInput').disabled = true;
        updateFinishBtnState();
        showToast('Lỗi tải chi tiết: ' + err.message, true);
      })
      .getTaskDetailApi(taskId);
  }

  function renderCounters(c) {
    if (!c) return;
    byId('cScanned').textContent = c.scanned || 0;
    byId('cAbsent').textContent = c.absent || 0;
    byId('cExtra').textContent = c.extra || 0;
    var outEl = byId('cOut');
    if (outEl) outEl.textContent = c.out || 0;
    // Label động theo trạng thái task: đang mở → "Chưa điểm danh" (chưa quét ≠ vắng);
    // đã kết thúc → "Vắng" (markUnscannedAbsent_ đã chốt trạng thái).
    var lbl = document.querySelector('.counter.absent .lbl');
    if (lbl) {
      lbl.textContent = (!CURRENT_TASK || CURRENT_TASK.status === TASK_STATUS_C.OPEN) ? 'Chưa điểm danh' : 'Vắng';
    }
  }

  // ===== ĐỒNG BỘ REAL-TIME 2 THIẾT BỊ (2026-08-12) =====
  // Mobile + PC cùng mở 1 task: thiết bị này quét → thiết bị kia phải cập nhật NGAY
  // (không cần F5). GAS không có push (WebSocket/Channel) → poll getTaskDetailApi định
  // kỳ khi đang ở màn quét. Server cache detail 5s bị invalidate MỌI khi ghi log/đổi
  // status (scanStaff / append Dư / meal-move / completeTask đều invalidateTaskDetailCache_)
  // → poll trúng cache (không đọc sheet) hầu hết thời gian, chỉ đọc lại ngay sau khi có
  // ghi từ thiết bị khác → bên kia hiển thị mới trong vòng 1 chu kỳ poll (~3s).
  var SCAN_POLL_MS = 3000;
  var scanPollTimer = null;
  var scanPollInFlight = false;
  var lastScanPollSig = null;
  // FIX-16: message lock-bận của server (GAS + Python trả cùng chuỗi) — client tự retry.
  var LOCK_BUSY_MSG = 'Hệ thống đang bận — thử lại sau giây lát';

  // FIX-08: cập nhật lastScanPollSig theo state local SAU khi scan confirm/rollback —
  // trước đây sig chỉ set ở startScanPolling/applyPolledScanDetail → sau scan local
  // sig cũ hơn state → poll kế gửi sig lệch → server trả full detail → re-render
  // toàn view 1 lần vô ích mỗi lượt quét (reset sort/filter/focus).
  function refreshScanPollSig() {
    if (!scanPollTimer || !CURRENT_TASK) return;
    lastScanPollSig = scanDetailSignature({ task: CURRENT_TASK, log: CURRENT_LOG, counters: CURRENT_COUNTERS });
  }

  // PURE (test được): signature của task detail — so bằng nhau = không có gì đổi → bỏ
  // qua re-render (tránh renderScanView reset sort/filter/focus vô ích mỗi 4s).
  function scanDetailSignature(data) {
    var task = (data && data.task) || {};
    var c = (data && data.counters) || {};
    var log = (data && data.log) || [];
    var parts = [task.status, task.note || '', c.scanned || 0, c.absent || 0, c.extra || 0, c.out || 0];
    for (var i = 0; i < log.length; i++) {
      var r = log[i] || {};
      parts.push(String(r.staffId || '') + '|' + String(r.status || '') + '|'
        + (Number(r.timeScanEpoch) || 0) + '|' + (Number(r.timeRaEpoch) || 0));
    }
    return parts.join(';');
  }

  // PURE (test được): poll trả data "cũ hơn" state local không (chống race RPC out-of-order
  // — response poll cũ có thể về SAU response quét mới). True → bỏ qua, poll kế sẽ đúng.
  // G1 #7 (2026-08-21): thêm absent + total — absent giảm khi quét, total tăng khi thêm Dư.
  function scanPollBehind(data, currentTask, currentCounters) {
    if (!data || !data.task || !currentTask) return true;
    if (currentTask.taskId !== data.task.taskId) return true;
    var pd = data.counters || {};
    var cd = currentCounters || {};
    if ((pd.scanned || 0) < (cd.scanned || 0)) return true;
    if ((pd.extra || 0) < (cd.extra || 0)) return true;
    if ((pd.out || 0) < (cd.out || 0)) return true;
    if ((pd.absent || 0) > (cd.absent || 0)) return true;
    if ((pd.total || 0) < (cd.total || 0)) return true;
    // Local đã thấy task DONE nhưng poll vẫn OPEN → poll là response cũ
    if (currentTask.status === TASK_STATUS_C.DONE && data.task.status === TASK_STATUS_C.OPEN) return true;
    return false;
  }

  function startScanPolling(taskId) {
    stopScanPolling();
    if (window.__RC_DEMO__) return; // demo = dữ liệu giả tĩnh — không cần poll
    lastScanPollSig = scanDetailSignature({ task: CURRENT_TASK, log: CURRENT_LOG, counters: CURRENT_COUNTERS });
    scanPollTimer = setInterval(function () { scanPollTick(taskId); }, SCAN_POLL_MS);
  }

  function stopScanPolling() {
    if (scanPollTimer) { clearInterval(scanPollTimer); scanPollTimer = null; }
    scanPollInFlight = false;
  }

  // 1 chu kỳ poll — bỏ qua khi không đủ điều kiện (ẩn tab / có modal / đang xử lý quét
  // local — lúc đó UI tự cập nhật rồi, poll sẽ đè state local).
  function scanPollTick(taskId) {
    if (scanPollInFlight) return; // RPC trước chưa về — không chồng
    var vs = byId('viewScan');
    if (!vs || vs.classList.contains('hidden')) return;   // không ở màn quét
    if (document.visibilityState === 'hidden') return;     // tab ẩn — Safari/Chrome throttle sẵn
    if (isPollBlockingModalOpen()) return;                 // có modal tạo task/confirm/about — không phá (camera mở vẫn poll để thấy thiết bị khác quét)
    if (scanBusy()) return;                                // queue quét đang chạy — state local là mới nhất
    scanPollInFlight = true;
    google.script.run
      .withSuccessHandler(function (res) {
        scanPollInFlight = false;
        if (!res || !res.ok) return;
        // O-A (2026-08-20): server đã so signature — khớp → {ok, unchanged} ~40B,
        // KHÔNG gửi full log (task lớn = 40-90KB/chu kỳ lãng phí). Bỏ qua là xong.
        if (res.unchanged) return;
        applyPolledScanDetail(res);
      })
      .withFailureHandler(function () { scanPollInFlight = false; markServerFail(); })
      .getTaskDetailApi(taskId, lastScanPollSig);
  }

  // Áp dữ liệu poll vào màn quét — chỉ re-render khi THỰC SỰ có thay đổi (signature guard).
  function applyPolledScanDetail(data) {
    if (!CURRENT_TASK) return;
    // FIX-08: queue quét đang chạy — state local là mới nhất, render đè sẽ làm
    // mồ côi dòng optimistic vừa optimistic (poll kế sẽ đồng bộ khi queue rảnh).
    if (scanBusy()) return;
    if (scanPollBehind(data, CURRENT_TASK, CURRENT_COUNTERS)) return; // response cũ hơn local
    var sig = scanDetailSignature(data);
    if (sig === lastScanPollSig) return; // không đổi → không re-render (giữ sort/filter/focus)
    lastScanPollSig = sig;
    var prevMealMode = MEAL_MODE;
    var prevActive = document.activeElement;
    var prevActiveId = prevActive && prevActive.id;
    var wasOpen = CURRENT_TASK.status === TASK_STATUS_C.OPEN;
    renderScanView(data);
    // renderScanView mặc định reset meal-mode (creator → 'ra') → khôi phục chế độ người
    // dùng đang dùng (Ra/Vào là state UI local, KHÔNG đồng bộ giữa các thiết bị).
    if (CURRENT_TASK.taskType === 'meal-move' && MEAL_MODE !== prevMealMode) setMealMode(prevMealMode);
    // renderScanView focus về ô quét — đang gõ ô tìm/lọc thì trả lại focus (camera mở → không giật focus che camera)
    if (!window.__RC_CAM_OPEN__ && (prevActiveId === 'scanSearch' || prevActiveId === 'scanStatusFilter')) {
      var __cm = byId('cameraModal');
      if (!__cm || __cm.style.display !== 'flex') {
        var prev = document.getElementById(prevActiveId);
        if (prev && prev.focus) prev.focus();
      }
    }
    LAST_SCAN_VIEW = { taskId: data.task.taskId, ts: Date.now() };
    if (wasOpen && data.task.status === TASK_STATUS_C.DONE) {
      showToast('Task đã kết thúc từ thiết bị khác');
    }
  }

  // ===== ĐỒNG BỘ REAL-TIME DANH SÁCH TASK — NHIỀU NGƯỜI CÙNG TRUY CẬP (2026-08-16) =====
  // Người này tạo/kết thúc/mở lại/đổi ghi chú task → người khác đang mở app phải thấy
  // NGAY mà không cần bấm "⟳ Làm mới". GAS không có push → poll getTaskListApi định kỳ:
  // server cache 10s bị invalidate MỌI khi ghi task (insertTask_/updateTaskStatus_/
  // updateTaskNote_) → poll trúng cache hầu hết thời gian (không đọc sheet), chỉ đọc
  // lại ngay sau khi có ghi từ thiết bị khác → bên kia hiển thị mới trong 1 chu kỳ (~3s).
  var TASK_LIST_POLL_MS = 3000;
  var taskListPollTimer = null;
  var taskListPollInFlight = false;
  var lastTaskListSig = null;  // PURE (test được): signature danh sách task — bằng nhau = không có gì đổi → bỏ qua
  // re-render (tránh reset sort/filter/phân trang vô ích mỗi chu kỳ poll).
  function taskListSignature(tasks) {
    return (tasks || []).map(function (t) {
      return [t.taskId, t.status, t.total || 0, t.scanned || 0, t.extra || 0,
        t.createdAtText || '', t.completedAtText || '', t.note || ''].join('|');
    }).join(';');
  }

  function startTaskListPolling() {
    stopTaskListPolling();
    if (window.__RC_DEMO__) return; // demo = dữ liệu giả tĩnh — không cần poll
    lastTaskListSig = taskListSignature(_taskPageList);
    // B4 (2026-08-23): jitter 2500-3500ms — N thiết bị kiosk poll cố định 3s → cùng miss
    // sau bumpCacheRev_ → N rebuild full sheet đồng loạt (thundering herd). Rải lệch
    // ±500ms quanh base giúp các thiết bị không đánh đúng 1 nhịp.
    var jitter = Math.round((Math.random() - 0.5) * 1000);
    var intervalMs = Math.max(2000, TASK_LIST_POLL_MS + jitter);
    taskListPollTimer = setInterval(taskListPollTick, intervalMs);
  }

  function stopTaskListPolling() {
    if (taskListPollTimer) { clearInterval(taskListPollTimer); taskListPollTimer = null; }
    taskListPollInFlight = false;
  }

  // 1 chu kỳ poll danh sách — bỏ qua khi không đủ điều kiện (màn khác / modal / đang
  // "Làm mới" tay / đang lọc theo mã NV — poll không được đè lên bộ lọc header search).
  function taskListPollTick() {
    if (taskListPollInFlight) return; // RPC trước chưa về — không chồng
    var vs = byId('viewList');
    if (!vs || vs.classList.contains('hidden')) return;   // đang ở màn quét
    if (document.visibilityState === 'hidden') return;    // tab ẩn — browser throttle sẵn
    if (isPollBlockingModalOpen()) return;                // modal tạo task/confirm/about — không phá (camera mở không chặn vì đang ở màn quét viewList đã ẩn)
    if (_refreshLock) return;                             // đang "Làm mới" tay — RPC đó lo
    if (_taskFilterStaff) return;                         // lọc theo mã Ops — không đè lọc
    taskListPollInFlight = true;
    google.script.run
      .withSuccessHandler(function (res) {
        taskListPollInFlight = false;
        // O-A (2026-08-20): server so signature — khớp → {ok, unchanged} ~40B thay
        // full list; giữ lastTaskListSig để lần kế server so tiếp.
        // P2-11: thống nhất shape {ok, tasks} — tương thích array cũ
        if (res && res.unchanged) { markServerOk(); return; }
        var tasks = Array.isArray(res) ? res : (res && res.tasks) ? res.tasks : (res || []);
        var sig = taskListSignature(tasks);
        if (sig === lastTaskListSig) return; // không đổi → giữ nguyên (không reset sort/filter)
        lastTaskListSig = sig;
        renderDash(tasks); // render KPI + bảng task (applyDashFilters) — giống hệt "⟳ Làm mới"
        markServerOk();
      })
      .withFailureHandler(function () { taskListPollInFlight = false; markServerFail(); })
      .getTaskListApi(lastTaskListSig);
  }

  // Tối ưu mượt (2026-08-23): tab ẩn → poll tick early-return (không RPC, tiết kiệm quota/pin);
  // khi tab hiện lại → poll ngay 1 lần để thấy thay đổi trong lúc ẩn (không chờ 3s).
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) return;
      try {
        var vsL = byId('viewList');
        if (vsL && !vsL.classList.contains('hidden') && !_taskFilterStaff) taskListPollTick();
      } catch (e) {}
      try {
        var vsS = byId('viewScan');
        if (vsS && !vsS.classList.contains('hidden') && CURRENT_TASK) scanPollTick(CURRENT_TASK.taskId);
      } catch (e) {}
    });
  }

  function toggleMealMode() {

  // C3: state lọc + sort bảng scan. Mặc định sort col 6: reconcile = Trạng Thái desc
  // (Dư→Vắng→Có mặt→Chưa điểm danh — nhóm chưa quét xuống cuối; giữ CỐ Ý theo user
  // 2026-08-19, không phải bug), meal-move col 6 = Giờ Ra desc (mới nhất lên đầu) — FIX-12 sửa comment khớp mapping thật (col 6 = timeRaEpoch, col 7 = Giờ Vào).
  var SCAN_FILTER = { q: '', status: '' };
  var SCAN_SORT = { col: 6, asc: false };  // reconcile col 6 = Trạng Thái; meal-move col 6 = Giờ Ra (col 7 = Giờ Vào)
  var STATUS_ORDER = {};  // P3: dựng từ STATUS_C — tránh hardcode label
  STATUS_ORDER[STATUS_C.PENDING] = 0;
  STATUS_ORDER[''] = 0;
  STATUS_ORDER[STATUS_C.PRESENT] = 1;
  STATUS_ORDER[STATUS_C.ABSENT] = 2;
  STATUS_ORDER[STATUS_C.EXTRA] = 3;
  // C4: rank status cho sort — KHÔNG dùng `|| 9` (0 là falsy → PENDING thành 9)
  function statusRank(s) {
    var r = STATUS_ORDER[s];
    return r === undefined ? 9 : r;
  }

  function filterAndSortScan(log) {
    var q = SCAN_FILTER.q.trim().toLowerCase();
    var st = SCAN_FILTER.status;
    var out = [];
    (log || []).forEach(function (r) {
      if (st && r.status !== st) return;
      if (q) {
        var hay = (String(r.staffId || '') + ' ' + String(r.staffName || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return;
      }
      out.push(r);
    });
    var col = SCAN_SORT.col, asc = SCAN_SORT.asc;
    var isMealMove = CURRENT_TASK && CURRENT_TASK.taskType === 'meal-move';
    out.sort(function (a, b) {
      var va, vb;
      if (isMealMove) {
        // Meal-move columns: 0=Mã NV, 1=Tên NV, 2=Vender, 3=Ca, 4=Team, 5=Station, 6=Giờ Ra, 7=Giờ Vào, 8=Số phút, 9=Trạng thái
        if (col === 9) { va = statusRank(a.status); vb = statusRank(b.status); }
        else if (col === 0) { va = String(a.staffId || '').toUpperCase(); vb = String(b.staffId || '').toUpperCase(); }
        else if (col === 1) { va = String(a.staffName || '').toUpperCase(); vb = String(b.staffName || '').toUpperCase(); }
        else if (col === 2) { va = String(a.agency || ''); vb = String(b.agency || ''); }
        else if (col === 3) { va = String(a.slotCode || ''); vb = String(b.slotCode || ''); }
        else if (col === 4) { va = String(a.team || ''); vb = String(b.team || ''); }
        else if (col === 5) { va = String(a.station || ''); vb = String(b.station || ''); }
        else if (col === 6) { va = Number(a.timeRaEpoch) || 0; vb = Number(b.timeRaEpoch) || 0; }
        else if (col === 7) { va = Number(a.timeScanEpoch) || 0; vb = Number(b.timeScanEpoch) || 0; }
        else if (col === 8) { va = Number(a.durationMinutes) || 0; vb = Number(b.durationMinutes) || 0; }
      } else {
        // Reconcile (Điểm Danh Ca) columns: 0=Mã NV, 1=Tên NV, 2=Vender, 3=Ca, 4=Team, 5=Station, 6=Trạng Thái, 7=Giờ điểm danh
        if (col === 6) { va = statusRank(a.status); vb = statusRank(b.status); }
        else if (col === 0) { va = String(a.staffId || '').toUpperCase(); vb = String(b.staffId || '').toUpperCase(); }
        else if (col === 1) { va = String(a.staffName || '').toUpperCase(); vb = String(b.staffName || '').toUpperCase(); }
        else if (col === 2) { va = String(a.agency || '').toUpperCase(); vb = String(b.agency || '').toUpperCase(); }
        else if (col === 3) { va = String(a.slotCode || ''); vb = String(b.slotCode || ''); }
        else if (col === 4) { va = String(a.team || ''); vb = String(b.team || ''); }
        else if (col === 5) { va = String(a.station || ''); vb = String(b.station || ''); }
        else if (col === 7) { va = Number(a.timeScanEpoch) || 0; vb = Number(b.timeScanEpoch) || 0; }
      }
      if (va === vb) return 0;
      var cmp = va < vb ? -1 : 1;
      return asc ? cmp : -cmp;
    });
    return out;
  }

  function renderScanTable(log) {
    var body = byId('scanTableBody');
    var empty = byId('scanEmpty');
    var tbl = byId('scanTable');
    var cardsWrap = byId('scanCards');
    function hideCards() { if (cardsWrap) cardsWrap.style.display = 'none'; }

      // P3: log rỗng → ẩn luôn bảng (header trống + empty div gây rối mắt)
      body.innerHTML = '';

      if (tbl) tbl.style.display = 'none';
      empty.textContent = 'Không có nhân viên nào trong danh sách';
      empty.style.display = '';

    var rows = filterAndSortScan(log);
    if (!rows.length) {
      // C3: có log nhưng bộ lọc loại hết → báo khác empty thật
      body.innerHTML = '';

    // sang dạng CARD (scanRowCardHTML) — cùng data + filter/sort, chỉ khác hình thức (2026-08-13).
    var isCards = !!(window.matchMedia && window.matchMedia('(max-width: 600px)').matches);
    if (isCards) {
      hideCards();

      if (tbl) tbl.style.display = 'none';

    _paintScanRows(body, rows);
  }

  // I2: keyed row-diff — chỉ update cell thay đổi, không replace toàn bộ (chống flicker)
  function _paintScanRows(body, rows) {
    var existing = {};
    var i, tr;
    for (i = 0; i < body.children.length; i++) {
      tr = body.children[i];
      if (tr.dataset && tr.dataset.id) existing[tr.dataset.id] = tr;
    }
    var keep = {};
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      tr = existing[r.staffId];
      if (!tr) { tr = document.createElement('tr'); tr.dataset.id = r.staffId; }
      tr.className = r.status === STATUS_C.EXTRA ? 'extra-row' : '';  // C4: nổi bật NV lạ
      var cells = scanRowCells(r);
      if (tr.children.length !== cells.length) {
        tr.innerHTML = cells.join('');
      } else {
        for (var c = 0; c < cells.length; c++) {
          if (tr.children[c].innerHTML !== cells[c]) tr.children[c].innerHTML = cells[c];
        }
      }
      keep[r.staffId] = tr;
    }
    // Xoá tr không còn trong dữ liệu lọc
    for (i = body.children.length - 1; i >= 0; i--) {
      tr = body.children[i];
      if (!keep[tr.dataset && tr.dataset.id]) tr.remove();
    }
    // Đưa về đúng thứ tự lọc/sort (appendChild tự chuyển về cuối)
    for (i = 0; i < rows.length; i++) {
      tr = keep[rows[i].staffId];
      if (body.lastChild !== tr) body.appendChild(tr);
    }
  }

  function scanRowCells(r) {
    var badge = badgeFor(r.status);

    if (isMealMove) {

      cells = [

        '<td>' + esc(r.agency || '') + '</td>',

        '<td class="mm-col">' + esc(r.timeScanText || '') + '</td>',
        '<td class="mm-col num">' + (r.durationMinutes != null ? r.durationMinutes : '') + '</td>',
        '<td>' + badge + '</td>'

    } else {
      // Reconcile (Điểm Danh Ca): Mã NV | Tên NV | Vender | Ca | Team | Station | Trạng Thái | Giờ điểm danh
      cells = [
        '<td><b>' + esc(r.staffId) + '</b></td>',
        '<td>' + esc(r.staffName || '') + '</td>',
        '<td>' + esc(r.agency || '') + '</td>',
        '<td>' + esc(r.slotCode || '') + '</td>',
        '<td>' + esc(r.team || '') + '</td>',
        '<td>' + esc(r.station || '') + '</td>',
        '<td>' + badge + '</td>',
        '<td>' + esc(r.timeScanText || '') + '</td>'
      ];
    }
    return cells;
  }

  // Mobile (<=600px): container card NV trong task — tạo 1 lần trong .table-wrap scan
  // (cùng vùng cuộn bảng; desktop không dùng). renderScanTable tự quyết qua matchMedia.
  function getScanCardsWrap() {
    var wrap = byId('scanCards');
    if (wrap) return wrap;
    var holder = document.querySelector('.scan-col-right .table-wrap');
    if (!holder) return null;
    wrap = document.createElement('div');

  // PURE card HTML cho NV trong task (mobile <=600px) — cùng data + filter/sort với bảng,
  // chỉ khác hình thức. Header card: Mã NV + Tên + badge trạng thái; dưới = chips thông tin.
  // Lưu ý tên scanRowCardHTML (KHÔNG trùng scanCardHTML — hàm đó đã tồn tại cho scan-card
  // kết quả quét (status,target); function declaration sau ghi đè → crash, bug 2026-08-13).
  function scanRowCardHTML(r) {
    var isMealMove = CURRENT_TASK && CURRENT_TASK.taskType === 'meal-move';
    var chips = [];
    if (isMealMove) {
      if (r.slotCode) chips.push('<span><i>Ca</i>' + esc(r.slotCode) + '</span>');
      if (r.team) chips.push('<span><i>Team</i>' + esc(r.team) + '</span>');

  // Keyed diff cho card (giống _paintScanRows) — chỉ update card thay đổi, không flicker.
  function _paintScanRowCards(wrap, rows) {
    var existing = {};
    var i, el;
    for (i = 0; i < wrap.children.length; i++) {
      el = wrap.children[i];
      if (el.dataset && el.dataset.id) existing[el.dataset.id] = el;
    }
    var keep = {};
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      var html = scanRowCardHTML(r);
      el = existing[r.staffId];
      if (!el) { el = document.createElement('div'); el.dataset.id = r.staffId; wrap.appendChild(el); }
      if (el.innerHTML !== html) el.innerHTML = html;
      keep[r.staffId] = el;
    }
    for (i = wrap.children.length - 1; i >= 0; i--) {
      el = wrap.children[i];
      if (!keep[el.dataset && el.dataset.id]) el.remove();
    }
    for (i = 0; i < rows.length; i++) {
      el = keep[rows[i].staffId];
      if (wrap.lastChild !== el) wrap.appendChild(el);
    }
  }

  // Keyed diff cho card DANH SÁCH TASK mobile (2026-08-21) — giống _paintScanRowCards:
  // chỉ update card thay đổi (poll 3s không replace toàn bộ DOM → giữ scroll/flicker ít).
  function _paintTaskCards(wrap, tasks) {

    }

    for (i = 0; i < tasks.length; i++) {

      if (el.innerHTML !== html) el.innerHTML = html;
      keep[t.taskId] = el;
    }
    for (i = wrap.children.length - 1; i >= 0; i--) {
      el = wrap.children[i];
      if (!keep[el.dataset && el.dataset.id]) el.remove();

  function updateSortIndicators() {

  function badgeFor(status) {
    if (status === STATUS_C.PENDING || !status) return '<span class="badge pending">Chưa điểm danh</span>';
    if (status === STATUS_C.PRESENT) return '<span class="badge present">Có mặt</span>';
    if (status === STATUS_C.ABSENT) return '<span class="badge absent">Vắng</span>';
    if (status === STATUS_C.EXTRA) return '<span class="badge extra">Dư</span>';
    if (status === STATUS_C.OUT) return '<span class="badge out">Ra ngoài</span>';

  // Hàng đợi quét: capture + optimistic NGAY, server xử lý nền tuần tự.
  var SCAN_QUEUE = [];
  var SCAN_PROCESSING = false;
  var SCAN_QUEUE_MAX = 50; // P2: giới hạn chống spam barcode → backlog 2.5s/item
  // P2: seq chống response cũ đè scan card mới — quét B lúc response A đang bay,
  // response A về sẽ showScanCard(A) nhảy card về NV quét trước đó vài giây.
  var SCAN_CARD_SEQ = 0;
  // D2: guard dùng chung — còn scan đang chờ server hoặc trong queue hoặc paste batch.
  function scanBusy() {
    return SCAN_QUEUE.length > 0 || SCAN_PROCESSING || PASTE_BUSY;
  }
  // B: recount theo timeScan (khớp server computeCounters — ScanLogic.gs) thay vì
  // đếm theo status text: tránh lệch khi dòng có timeScan nhưng status chưa cập nhật.
  // Dùng cho: optimistic bump (submitScan), rollback/sync (processScanQueue).
  function recountFromLog() {
    var s = 0, e = 0, a = 0, out = 0;
    (CURRENT_LOG || []).forEach(function (r) {
      // P2: epoch là nguồn sự thật duy nhất (khớp server computeCounters)
      var hasScan = Number(r.timeScanEpoch) > 0;
      if (r.status === STATUS_C.OUT) { out++; return; }
      if (hasScan) s++;
      if (r.status === STATUS_C.EXTRA) e++;
      else if (!hasScan) a++;
    });
    // meal-move: scanned = đã có Vào; out = đã Ra chưa Vào
    // G1 #7 fix: thiếu total → scanPollBehind so total sai cho task <2 người (local total luôn 0)
    CURRENT_COUNTERS = { scanned: s, absent: a, extra: e, out: out, total: (CURRENT_LOG || []).length };
    renderCounters(CURRENT_COUNTERS);
  }

  // CHUYỂN DANH SÁCH (2026-08-18, yêu cầu user): từ task Điểm Danh Ca — lấy toàn bộ NV
  // "Có mặt" (CURRENT_LOG) → tự động tạo task Điểm danh Ra/Vào với danh sách đó
  // (kế thừa station + team task hiện tại). Bấm nút "Chuyển Danh Sách" cạnh Hoàn Thành.
  function transferPresentListToMealMove() {

    if (!CURRENT_TASK || CURRENT_TASK.taskType !== 'reconcile') return;
    if (CURRENT_TASK.status !== TASK_STATUS_C.OPEN) {
      showToast('Task đã kết thúc — không chuyển được', true);

    BUSY = true;

    // server giữ 1 lock cho CẢ 2 bước → không còn cửa sổ giữa 2 RPC mà task mới đã tạo
    // nhưng task cũ chưa đóng (mất mạng/complete fail → NV trùng ở 2 task).
    // res.partial=true: task mới ĐÃ tạo nhưng đóng task cũ fail → vẫn mở task mới + toast lỗi.
    google.script.run
      .withSuccessHandler(function (res) {

        } else {
          showToast(res.message, true);

        }

      .withFailureHandler(function (err) {
        BUSY = false;
        if (btn) btn.disabled = false;

  // COPY MÃ OPS (2026-08-25): copy toàn bộ mã Ops trong task hiện tại (cả reconcile + meal-move)
  // Nút nằm cùng hàng Hoàn Thành/Chuyển Danh Sách — dùng cho cả task open/done.
  function copyAllOpsCodes() {
    var list = CURRENT_LOG || [];
    if (!list.length) {
      showToast('Không có mã Ops nào để copy', true);
      return;
    }
    var codes = [];
    for (var i = 0; i < list.length; i++) {
      var id = list[i] && list[i].staffId ? String(list[i].staffId).trim() : '';
      if (id) codes.push(id);
    }
    if (!codes.length) {
      showToast('Không có mã hợp lệ để copy', true);
      return;
    }
    var text = codes.join('\n');
    var btn = byId('btnCopyOps');
    var onDone = function () {
      showToast('Đã copy ' + codes.length + ' mã Ops ✓', false);
      if (btn) {
        var old = btn.textContent;
        btn.textContent = '✓ Đã copy';
        btn.classList.add('copied');
        setTimeout(function () {
          btn.textContent = old;
          btn.classList.remove('copied');
        }, 1400);
      }
    };
    var onFail = function (msg) {
      showToast(msg || 'Không copy được — thử lại', true);
    };
    var fallbackCopy = function () {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) onDone();
        else onFail('Không copy được — trình duyệt chặn');
      } catch (e) {
        onFail(e && e.message ? e.message : 'Không copy được');
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone).catch(function () {
        fallbackCopy();
      });
    } else {
      fallbackCopy();
    }
  }

  // Meal-move: dán hàng loạt mã Ops (từ ô quét) → gọi pasteMealMoveScanApi (batch 1 RPC).

      .withSuccessHandler(function (res) {
