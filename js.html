<script>
  // ===== STANDALONE (?app=1): google.script.run → JSONP (2026-08-12) =====
  // GAS serve ?app=1 qua ContentService → trang TOP-LEVEL (KHÔNG iframe wrapper) →
  // camera live hoạt động trên iOS (quét tự nhận mã vạch). Trang top-level KHÔNG có
  // google.script.run (chỉ wrapper iframe mới inject) → shim dưới đây bắt chước ĐÚNG
  // API google.script.run bằng JSONP tới chính deployment này. Kích hoạt CHỈ khi doGet
  // inject cờ window.__RC_STANDALONE__ (cờ này bền hơn location.search — GAS redirect
  // tới URL one-time có thể bỏ query ?app=1) VÀ google.script.run chưa có sẵn — iframe
  // GAS / local mock / hosting tĩnh không có cờ → shim không chạy, mọi thứ như cũ.
  // Server: Code.gs doGet ?action=..&args=..&cb=.. → JsonpApi.gs.
  (function () {
    if (!window.__RC_STANDALONE__) return;
    // DEMO (?demo=1 preview): không gọi GAS — load mock-google.js (khối dưới) để test UI/camera
    // với dữ liệu giả. Chỉ serve.js chèn cờ __RC_DEMO__ khi URL có demo=1 — production không đổi.
    if (window.__RC_DEMO__) return;
    if (window.google && window.google.script && window.google.script.run) return;
    var base = window.__RC_API_BASE__ || '';
    if (!base) return;
    var seq = 0;
    function resolveRpc(res, handlers) {
      if (res && res.ok === false) {
        if (handlers.failure) handlers.failure({ message: res.error || 'Lỗi server' });
      } else if (handlers.success) {
        handlers.success(res && res.ok === true ? res.result : res);
      }
    }
    function jsonpCall(fnName, args, handlers) {
      var cbName = '__rcJsonp' + (++seq) + '_' + Date.now();
      var scriptId = '__rcScript_' + cbName;
      var sep = base.indexOf('?') >= 0 ? '&' : '?';
      var url = base + sep + 'action=' + encodeURIComponent(fnName)
        + '&args=' + encodeURIComponent(JSON.stringify(args || []))
        + '&cb=' + encodeURIComponent(cbName);
      // PRODUCTION (2026-08-12): backend Python api cùng origin (Freebuff hosting) →
      // fetch JSON thay JSONP (không cần CORS). API trả JSON khi không có cb.
      var sameOrigin = url.indexOf('//') < 0 || url.indexOf(window.location.origin) === 0;
      if (sameOrigin && typeof window.fetch === 'function') {
        fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (res) { resolveRpc(res, handlers); })
          .catch(function () {
            if (handlers.failure) handlers.failure({ message: 'Không kết nối được server' });
          });
        return;
      }
      window[cbName] = function (res) {
        try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        var el = document.getElementById(scriptId);
        if (el && el.parentNode) el.parentNode.removeChild(el);
        resolveRpc(res, handlers);
      };
      var s = document.createElement('script');
      s.id = scriptId;
      s.src = url;
      s.onerror = function () {
        try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        var el = document.getElementById(scriptId);
        if (el && el.parentNode) el.parentNode.removeChild(el);
        if (handlers.failure) handlers.failure({ message: 'Không kết nối được server' });
      };
      (document.head || document.documentElement).appendChild(s);
    }
    function makeRunner(state) {
      state = state || { success: null, failure: null };
      var runner = {
        withSuccessHandler: function (f) { return makeRunner({ success: f, failure: state.failure }); },
        withFailureHandler: function (f) { return makeRunner({ success: state.success, failure: f }); },
        withUserObject: function () { return runner; }
      };
      return new Proxy(runner, {
        get: function (target, prop) {
          if (prop in target) return target[prop];
          return function () {
            jsonpCall(String(prop), Array.prototype.slice.call(arguments), state);
          };
        }
      });
    }
    window.google = window.google || {};
    window.google.script = window.google.script || {};
    window.google.script.run = makeRunner();
  })();

  // Mock local: khi mở file:// trực tiếp (không qua GAS), nạp mock-google.js.
  // Deploy GAS: google.script được wrapper GAS inject vào iframe → nhánh này không chạy.
  // TAB QUÉT (?scan=1): camera-scan.html (include TRƯỚC js.html) đã đặt
  // window.__RC_SCAN_MODE__ = true khi phát hiện scan mode → bỏ qua mock (app không init).
  // BUG trang trắng (2026-08-11 + 2026-08-12): mở thẳng URL content GAS, google.script
  // chưa kịp inject + scan=1 KHÔNG nằm trong location.search (wrapper GAS nạp app qua
  // document.write vào iframe /blank → query bị nuốt) → document.write lúc này XÓA TRẮNG
  // toàn trang. Giờ: document.write CHỈ khi document còn đang parse (an toàn — thêm nội
  // dung), còn lại dùng DOM injection (appendChild) — không bao giờ xoá trang.
  if (!window.__RC_SCAN_MODE__ && (typeof google === 'undefined' || !google.script)) {
    if (document.readyState === 'loading') {
      document.write('<script src="mock/mock-google.js?v=' + Date.now() + '"><\/script>');
    } else {
      var __mockEl = document.createElement('script');
      __mockEl.src = 'mock/mock-google.js?v=' + Date.now();
      document.head.appendChild(__mockEl);
    }
  }

  var META = null;
  var CURRENT_TASK = null;
  var CURRENT_LOG = [];
  var CURRENT_COUNTERS = null;  // state counters để optimistic cập nhật ngay
  var BUSY = false;
  var AUTO_FOCUS_TIMER = null;

  // P3: hằng số status — KHÔNG hardcode chuỗi tiếng Việt trong logic (đổi label = vỡ logic).
  // Khớp STATUS trong Config.gs; label hiển thị badge dùng đúng chuỗi này.
  var STATUS_C = { PENDING: '-', PRESENT: 'Có mặt', ABSENT: 'Vắng', EXTRA: 'Dư', OUT: 'Ra ngoài' };
  // meal-move: mode quét hiện tại ('ra' | 'vao'); mặc định 'ra' (creator tạo task)
  var MEAL_MODE = 'ra';
  // Email người dùng hiện tại (từ getMeta) — phân quyền chuyển Ra/Vào meal-move:
  // CHỈ email tạo task (createdBy) được dùng mode 'ra' (Quét Danh Sách); người khác khóa 'vao'.
  var CURRENT_USER_EMAIL = '';
  // ===== STAFF-CACHE-START =====
  // Client staff index cache (staffId → thông tin hiển thị) — scan NV lạ (Dư) hiện thông tin
  // NGAY từ cache, không chờ server round-trip (yêu cầu 2026-08-11). Tải lúc boot + tạo task.
  var STAFF_INFO = {}; // { staffId: { staffName, slotCode, station, team, workstation, agency } }
  function lookupStaffInfo(staffId) {
    var q = String(staffId || '').toUpperCase();
    return STAFF_INFO[q] || null;
  }
  // ===== STAFF-CACHE-END =====
  var STAFF_INFO_LOADING = false;
  // Tải staff index compact (getStaffIndexApi) + cache localStorage 12h — không tải lại mỗi lần mở app.
  function loadStaffIndex() {
    try {
      var cachedTs = Number(localStorage.getItem('rc2_staffIndexTs') || 0);
      if (cachedTs && Date.now() - cachedTs < 12 * 3600 * 1000) {
        var cached = localStorage.getItem('rc2_staffIndex');
        if (cached) { STAFF_INFO = JSON.parse(cached); return; }
      }
    } catch (e) { /* localStorage hỏng → tải lại từ server */ }
    if (STAFF_INFO_LOADING) return;
    STAFF_INFO_LOADING = true;
    google.script.run
      .withSuccessHandler(function (res) {
        STAFF_INFO_LOADING = false;
        if (!res || !res.ok || !res.staff) return;
        STAFF_INFO = res.staff || {};
        try {
          localStorage.setItem('rc2_staffIndex', JSON.stringify(STAFF_INFO));
          localStorage.setItem('rc2_staffIndexTs', String(Date.now()));
        } catch (e) {}
      })
      .withFailureHandler(function () { STAFF_INFO_LOADING = false; })
      .getStaffIndexApi();
  }
  var TT_LABEL_MEAL = { 'meal-move': 'Điểm danh Ra/Vào' };
  // Task status — khớp TASK_STATUS trong Config.gs
  var TASK_STATUS_C = { OPEN: 'open', DONE: 'done' };

  // Cache element lookup — id lặp nhiều lần (scanInput 14×, bảng, modal…) chỉ query DOM 1 lần
  // (2026-08-16 tối ưu — tránh getElementById trùng trong vòng render/quét/poll). Chỉ cache
  // khi tìm thấy (null → query lại) — an toàn với element tạo muộn / bị thay nội dung.
  var _byIdCache = {};
  function byId(id) {
    if (!_byIdCache[id]) _byIdCache[id] = document.getElementById(id);
    return _byIdCache[id];
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.__RC_SCAN_MODE__ || location.search.indexOf('scan=1') !== -1) {
      // TAB QUÉT RIÊNG: chỉ chạy camera (camera-scan.html tự khởi động trước đó) —
      // KHÔNG init app (google.script có thể không tồn tại khi mở thẳng URL content).
      // __RC_SCAN_MODE__ do camera-scan.html đặt (cờ bền hơn location.search — wrapper
      // GAS có thể không forward query vào URL app trong iframe, bug 2026-08-12).
      return;
    }
    loadMetaAndOptions();
    // Mobile: ẩn dashboard mặc định (bấm ☰ để mở lại — drawer xổ từ trái, 2026-08-13).
    // Giữ nguyên mọi logic lọc/KPI — chỉ ẩn sidebar khỏi màn hình chính.
    if (window.matchMedia && window.matchMedia('(max-width: 900px)').matches) {
      var layout = document.querySelector('.dash-layout');
      if (layout && !layout.classList.contains('mini')) layout.classList.add('mini');
      // Drawer: bấm ra ngoài panel (backdrop/main) → tự đóng, không cần bấm « hay ☰.
      // Loại trừ .dash-reopen vì bấm ☰ để MỞ — nếu không sẽ đóng ngay sau khi mở.
      if (layout) {
        layout.addEventListener('click', function (e) {
          if (layout.classList.contains('mini')) return;
          var t = e.target;
          if (t && t.closest && !t.closest('.dash-side, .dash-reopen')) layout.classList.add('mini');
        });
      }
    }
    // Co màn hình xuống mobile bất kỳ lúc nào → tự ẩn dashboard (tránh drawer tự
    // bung ra che cả màn hình khi thu nhỏ cửa sổ từ desktop).
    var mqDash = window.matchMedia ? window.matchMedia('(max-width: 900px)') : null;
    if (mqDash) {
      var syncDashMini = function (m) {
        var layout = document.querySelector('.dash-layout');
        if (layout && m.matches && !layout.classList.contains('mini')) layout.classList.add('mini');
      };
      if (mqDash.addEventListener) mqDash.addEventListener('change', syncDashMini);
      else if (mqDash.addListener) mqDash.addListener(syncDashMini);
    }
    byId('scanInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitScan();
      }
    });
    var camFileEl = byId('camFile');
    if (camFileEl) camFileEl.addEventListener('change', onCamFileChange);
    // +Task: bấm ra ngoài menu (backdrop phủ toàn màn) → tự cuộn lại — không cần bấm
    // đúng nút +Task (yêu cầu 2026-08-12). Nút +Task z-index cao hơn backdrop nên bấm
    // nút vẫn toggle như cũ; menu items cao hơn backdrop nên chọn task không bị chặn.
    var taskMenuBackdrop = byId('taskMenuBackdrop');
    if (taskMenuBackdrop) taskMenuBackdrop.addEventListener('click', function () { closeTaskMenu(); });
    initNetworkStatus();
    initCreatePreview();
    initHeaderSearch();
    startAutoFocusLoop();
    initScanTopbarStuck();
    initScanFilters();
  });

  /* C3: tìm kiếm + lọc trạng thái + sort cột bảng scan */
  function initScanFilters() {
    var searchEl = byId('scanSearch');
    var statusEl = byId('scanStatusFilter');
    var clearEl = byId('scanClearFilter');
    var scanTbl = byId('scanTable');
    // C1: populate filter options từ STATUS_C — 1 nguồn sự thật, đổi label không vỡ filter.
    if (statusEl && statusEl.options.length === 1) {
      var FILTER_LABELS = {};
      FILTER_LABELS[STATUS_C.PENDING] = 'Chưa điểm danh';
      FILTER_LABELS[STATUS_C.PRESENT] = STATUS_C.PRESENT;
      FILTER_LABELS[STATUS_C.ABSENT] = STATUS_C.ABSENT;
      FILTER_LABELS[STATUS_C.EXTRA] = STATUS_C.EXTRA;
      [STATUS_C.PENDING, STATUS_C.PRESENT, STATUS_C.ABSENT, STATUS_C.EXTRA].forEach(function (v) {
        var o = document.createElement('option');
        o.value = v;
        o.textContent = FILTER_LABELS[v];
        statusEl.appendChild(o);
      });
    }
    if (searchEl) searchEl.addEventListener('input', function () {
      SCAN_FILTER.q = searchEl.value;
      renderScanTable(CURRENT_LOG);
    });
    if (statusEl) statusEl.addEventListener('change', function () {
      SCAN_FILTER.status = statusEl.value;
      renderScanTable(CURRENT_LOG);
    });
    if (clearEl) clearEl.addEventListener('click', function () {
      SCAN_FILTER.q = '';
      SCAN_FILTER.status = '';
      if (searchEl) searchEl.value = '';
      if (statusEl) statusEl.value = '';
      renderScanTable(CURRENT_LOG);
    });
    if (scanTbl) scanTbl.addEventListener('click', function (e) {
      var th = e.target && e.target.closest ? e.target.closest('th.sortable') : null;
      if (!th) return;
      var col = parseInt(th.dataset.sort, 10);
      if (SCAN_SORT.col === col) SCAN_SORT.asc = !SCAN_SORT.asc;
      else { SCAN_SORT.col = col; SCAN_SORT.asc = true; }
      updateSortIndicators();
      renderScanTable(CURRENT_LOG);
    });
    updateSortIndicators();
  }

  /* ===== Scan topbar sticky — thêm viền/bóng khi dính (thuần hiển thị) ===== */
  function initScanTopbarStuck() {
    var bar = document.querySelector('.scan-topbar');
    if (!bar) return;
    // P2: đọc chiều cao header từ CSS token --header-h (không hardcode 53) — 1 nguồn
    var HEADER_H = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--header-h')) || 53;
    var onScroll = function () {
      var rect = bar.getBoundingClientRect();
      bar.classList.toggle('stuck', rect.top <= HEADER_H);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  /* ===== Auto-focus loop (tham khảo v1): giữ focus vào scan input trên kiosk touch ===== */
  function startAutoFocusLoop() {
    if (AUTO_FOCUS_TIMER) return;
    AUTO_FOCUS_TIMER = setInterval(function () {
      // S10: modal đang mở → không giật focus về scan input
      if (anyModalOpen()) return;
      var scanView = byId('viewScan');
      var input = byId('scanInput');
      // P2 (audit): viewScan hidden → không cần giữ focus (đang ở danh sách task);
      // dừng luôn interval để không chạy vô ích mỗi 3s trên kiosk bật lâu.
      if (!scanView || scanView.classList.contains('hidden')) { stopAutoFocusLoop(); return; }
      if (input && !input.disabled) {
        var active = document.activeElement;
        if (active !== input && active && active.tagName !== 'SELECT' && active.tagName !== 'INPUT') {
          input.focus();
        }
      }
    }, 3000);
  }
  function stopAutoFocusLoop() {
    if (AUTO_FOCUS_TIMER) { clearInterval(AUTO_FOCUS_TIMER); AUTO_FOCUS_TIMER = null; }
  }

  /* ===== Trạng thái mạng (header command center) ===== */
  // P2: netDot phản ánh BOTH network interface (navigator.onLine) VÀ server GAS còn
  // sống. navigator.onLine chỉ báo mạng — deploy fail/timeout/quota GAS không đổi nó,
  // operator dễ bị đánh lừa thấy "Online" xanh trong khi app chết. Bất kỳ RPC fail
  // (google.script.run → withFailureHandler) đều là server unreachable thật: business
  // lỗi đã được server tự catch và trả về {ok:false} qua success handler.
  var SERVER_OK = true;
  function updateNetStatus(online) {
    var dot = byId('netDot');
    var txt = byId('netText');
    if (!dot || !txt) return;
    if (online === undefined) online = navigator.onLine;
    var ok = SERVER_OK && online;
    dot.className = 'net-dot' + (ok ? '' : ' offline');
    txt.textContent = SERVER_OK ? (online ? 'Online' : 'Offline') : 'Server lỗi';
  }
  function markServerFail() {
    if (!SERVER_OK) return;
    SERVER_OK = false;
    updateNetStatus();
  }
  function markServerOk() {
    if (SERVER_OK) return;
    SERVER_OK = true;
    updateNetStatus();
  }
  function initNetworkStatus() {
    updateNetStatus();
    window.addEventListener('online', function () { updateNetStatus(true); });
    window.addEventListener('offline', function () { updateNetStatus(false); });
  }

  /* ===== Spin loading overlay (ẩn sau lần load đầu tiên) ===== */
  var OVERLAY_HIDDEN = false;
  function hideLoadingOverlay() {
    if (OVERLAY_HIDDEN) return;
    OVERLAY_HIDDEN = true;
    var o = byId('loadingOverlay');
    if (o) o.classList.add('hide');
  }
  // P2: reset cờ để lần skip kế tiếp chạy được (trước đây OVERLAY_HIDDEN=true vĩnh viễn).
  // Chỉ toggle class .hide (opacity/visibility transition) — KHÔNG đụng display:
  // timer 500ms cũ có thể display:none overlay của task đang load (race).
  function showLoadingOverlay() {
    OVERLAY_HIDDEN = false;
    var o = byId('loadingOverlay');
    if (!o) return;
    o.classList.remove('hide');
  }

  /* ===== Âm thanh toggle (tham khảo v1) ===== */
  var SOUND_ON = true;
  try { SOUND_ON = localStorage.getItem('rc2_sound') !== '0'; } catch (e) {}
  function toggleSound() {
    SOUND_ON = !SOUND_ON;
    try { localStorage.setItem('rc2_sound', SOUND_ON ? '1' : '0'); } catch (e) {}
    var b = byId('btnSound');
    if (b) {
      b.textContent = SOUND_ON ? '🔊' : '🔇';
      b.classList.toggle('muted', !SOUND_ON);
      b.title = SOUND_ON ? 'Tắt âm thanh' : 'Bật âm thanh';
    }
    showToast(SOUND_ON ? 'Âm thanh: Bật' : 'Âm thanh: Tắt');
  }

  /* ===== Âm thanh phản hồi quét (C1) — Web Audio API, không cần file =====
     error: buzz thấp 200Hz · scan: beep cao 880Hz — gate bởi SOUND_ON */
  var _audioCtx = null;
  function playBeep(type) {
    if (!SOUND_ON) return;
    try {
      if (!_audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        _audioCtx = new AC();
      }
      var ctx = _audioCtx;
      if (ctx.state === 'suspended') ctx.resume();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if (type === 'error') {
        osc.type = 'square';
        osc.frequency.value = 200;
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
      } else {
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
      }
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start();
      osc.stop(ctx.currentTime + 0.15);
    } catch (e) { /* kiosk không hỗ trợ audio — bỏ qua */ }
  }

  /* ===== About modal (tham khảo v1) ===== */
  var aboutFocusBack = null;
  function showAbout() {
    var m = byId('aboutModal');
    if (!m) return;
    aboutFocusBack = document.activeElement; // P3: focus restore khi đóng
    m.setAttribute('aria-hidden', 'false');  // I10: screen reader đọc dialog
    m.classList.add('open');
    var closeBtn = m.querySelector('.about-dialog button');
    if (closeBtn) closeBtn.focus(); // focus trap: đưa focus vào dialog
  }
  function closeAbout() {
    var m = byId('aboutModal');
    if (m) { m.classList.remove('open'); m.setAttribute('aria-hidden', 'true'); }
    if (aboutFocusBack && aboutFocusBack.focus) aboutFocusBack.focus();
    aboutFocusBack = null;
  }
  // ===== Header: tìm kiếm nhanh mã Ops (giữa hàng logo) =====
  var _headerSearchTimer = null;
  function initHeaderSearch() {
    var input = byId('headerSearchInput');
    var clearBtn = byId('headerSearchClear');
    if (!input) return;
    function doSearch() {
      var q = input.value.trim();
      if (!q) { hideSearchResult(); return; }
      var seq = ++_headerSearchSeq;
      google.script.run
        .withSuccessHandler(function (res) { if (seq !== _headerSearchSeq) return; renderSearchResult(res, q); })
        .withFailureHandler(function (err) { if (seq !== _headerSearchSeq) return; markServerFail(); renderSearchMessage('Lỗi: ' + err.message, true); })
        .searchStaffApi(q);
    }
    input.addEventListener('input', function () {
      clearBtn.classList.toggle('show', !!input.value);
      clearTimeout(_headerSearchTimer);
      var q = input.value.trim();
      if (q.length >= 2) _headerSearchTimer = setTimeout(doSearch, 350);
      else onSearchInputCleared();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
      if (e.key === 'Escape') clearHeaderSearch();
    });
    clearBtn.addEventListener('click', clearHeaderSearch);
    document.addEventListener('click', function (e) {
      if (!e.target.closest('#headerSearchWrap')) hideSearchResult();
    });
  }
  // ===== HEADER-SEARCH-START =====
  // Chống race: mỗi lần tìm/xoá tăng seq — response cũ của searchStaffApi bị bỏ qua,
  // không được phép lọc lại danh sách sau khi người dùng đã tắt tìm kiếm.
  var _headerSearchSeq = 0;
  // Xoá ô tìm kiếm (backspace/xoá hết/✕) → bỏ lọc + trả "Danh Sách Task" đầy đủ.
  function onSearchInputCleared() {
    _headerSearchSeq++;
    if (_taskFilterStaff) {
      _taskFilterStaff = null;
      loadTaskList();
    }
    hideSearchResult();
  }
  // ===== Header search: render kết quả + lọc "Danh Sách Task" theo mã Ops =====
  function renderSearchResult(res, q) {
    var box = document.getElementById('headerSearchResult');
    if (!box) return;
    if (!res.ok) {
      renderSearchMessage(res.message || ('Không tìm thấy mã ' + q), true);
      // Mã không khớp → bỏ lọc đang hiển thị (không giữ badge cũ)
      if (_taskFilterStaff) {
        _taskFilterStaff = null;
        loadTaskList();
      }

    }
    var s = res.staff || null;
    var tasks = res.tasks || [];
    box.hidden = false;
    var html = '';
    if (s) {
      function row(k, v) { return '<div><b>' + esc(k) + '</b>' + esc(v || '—') + '</div>'; }
      html = '<div class="search-card">' +
        '<div class="sc-id">' + esc(s.staffId || q) + '</div>' +
        '<div class="sc-name">' + esc(s.staffName || '') + '</div>' +
        '<div class="sc-grid">' +
          row('Ca', s.slotCode) + row('Team', s.team) + row('Station', s.station) + row('Hợp đồng', s.contractType) +
        '</div>' +
      '</div>';
    } else {
      html = '<div class="search-card">' +
        '<div class="sc-id">' + esc(q) + '</div>' +
        '<div class="sc-name">Không có trong dữ liệu NV</div>' +
      '</div>';
    }
    box.innerHTML = html;
    if (tasks.length) applyTaskFilter(s ? s.staffId : q, tasks);
  }

  function anyModalOpen() {

    // không giật focus / không poll đè lên khi user đang quét (bug 2026-08-18 —

  // Modal confirm dùng chung — thay alert/confirm trình duyệt.
  // showConfirm(title, message, onConfirm): mở modal, bấm "Đồng ý" → chạy onConfirm.
  var confirmOnOk = null;
  function showConfirm(title, message, onConfirm) {
    confirmOnOk = onConfirm || null;
    byId('confirmModalTitle').textContent = title;
    byId('confirmModalMsg').textContent = message;
    byId('confirmOkBtn').onclick = function () {
      var cb = confirmOnOk;   // lưu TRƯỚC khi close (close reset confirmOnOk)
      closeConfirmModal();
      if (cb) cb();
    };
    byId('confirmModal').classList.add('open');
    byId('confirmModal').setAttribute('aria-hidden', 'false');  // I10
    byId('confirmOkBtn').focus();
  }
  function closeConfirmModal() {
    var m = byId('confirmModal');
    if (m) { m.classList.remove('open'); m.setAttribute('aria-hidden', 'true'); }

  document.addEventListener('keydown', function (e) {
    // P3: Escape đóng modal (focus trap cơ bản)
    if (e.key === 'Escape') {
      var tm = byId('taskMenu');
      if (tm && tm.classList.contains('show')) { closeTaskMenu(); return; }
      var m = byId('createModal');
      if (m && m.classList.contains('open')) { closeCreateModal(); return; }
      m = byId('createMealModal');
      if (m && m.classList.contains('open')) { closeCreateMealModal(); return; }
      m = byId('confirmModal');
      if (m && m.classList.contains('open')) { closeConfirmModal(); return; }
      m = byId('aboutModal');
      if (m && m.classList.contains('open')) closeAbout();
    }
    // Tab giữ trong dialog khi mở
    if (e.key === 'Tab') {
      var m = document.querySelector('.about-overlay.open');
      if (!m) return;
      var focusables = m.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if (!focusables.length) return;
      var first = focusables[0], last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  function loadMetaAndOptions() {
    google.script.run
      .withSuccessHandler(function (meta) {
        META = meta;
        // Email người dùng hiện tại (GAS Session) — phân quyền chuyển Ra/Vào meal-move
        CURRENT_USER_EMAIL = String((meta && meta.currentUser) || '').trim().toLowerCase();
        loadStaffIndex();  // cache staff index — scan NV lạ hiện thông tin ngay
        // Header mới không còn #appTitle — cập nhật brand title nếu có
        var brand = byId('brandTitle');
        if (brand && meta.appTitle) brand.textContent = meta.appTitle;
        refreshAll();
      })
      .withFailureHandler(function (err) {
        markServerFail();  // P2: RPC fail = server unreachable → netDot offline
        hideLoadingOverlay();
        showToast('Lỗi tải meta: ' + err.message, true);
        refreshAll();
      })
      .getMeta();
  }

  // P2: anti-chồng RPC — bấm '⟳ Làm mới' liên tục (hoặc load tái-kích hoạt khi đang chạy)
  // → 2 luồng getTaskListApi + getFilterOptions đè nhau. Nhả lock khi CẢ HAI RPC hoàn tất
  // (đếm _refreshPending); timeout 5s chỉ là bảo hiểm phòng RPC treo — không chốt 1.5s cứng
  // (lock hết sớm khi RPC chậm sẽ cho phép chồng luồng mới). Disable nút visual khi khóa.
  var _refreshLock = false;
  var _refreshPending = 0;
  function _releaseRefreshLock() {
    if (_refreshPending <= 0) return;  // clamp — timeout 5s đã nhả, RPC trả về sau không đẩy âm
    _refreshPending--;
    if (_refreshPending > 0) return;  // còn RPC kia chưa xong — giữ khóa
    _refreshLock = false;
    var btn = byId('btnRefresh');
    if (btn) { btn.disabled = false; btn.style.opacity = ''; }
  }
  function refreshAll() {
    if (_refreshLock) return;  // đang load rồi — bỏ qua, tránh chồng RPC
    _refreshLock = true;
    _refreshPending = 2;  // loadFilterOptions + loadTaskList
    var btn = byId('btnRefresh');
    if (btn) { btn.disabled = true; btn.style.opacity = .6; }
    loadFilterOptions();
    loadTaskList();
    // bảo hiểm an toàn: phòng RPC không bao giờ resolve (treo) — vẫn nhả sau 5s
    setTimeout(function () {
      if (_refreshPending > 0) _refreshPending = 1;  // ép nhả ở vòng kế
      _releaseRefreshLock();
    }, 5000);
  }

  function loadFilterOptions() {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.ok) { _releaseRefreshLock(); showToast(res.message, true); return; }
        fillSelect('fStation', res.stations, '-- Chọn station --');
        fillChips('fSlotCode', res.slotCodes);
        fillChips('fTeam', res.teams);
        fillSelect('fDate', res.dates, '-- Tất cả ngày --');
        fillChips('fContractType', res.contractTypes || []);
        // Tối ưu 2026-08-11: lưu options dùng chung cho modal meal-move — tránh gọi
        // getFilterOptions RPC lần 2 khi mở modal (loadMealOptions chỉ chạy nếu chưa có).
        _mealFilterOptions = res;
        var canCreate = res.stations.length > 0 && res.slotCodes.length > 0 && res.teams.length > 0;
        byId('btnCreateTask').disabled = !canCreate;
        updateCreateSubmitState();
        markServerOk();  // RPC success → server sống lại (netDot hồi phục — phủ cả trường hợp chỉ load options)
        _releaseRefreshLock();
      })
      .withFailureHandler(function (err) { markServerFail(); _releaseRefreshLock(); showToast('Lỗi tải options: ' + err.message, true); })
      .getFilterOptions();
  }

  // P2: xem truoc so NV khop bo loc khi tao task (modal) — goi previewStaffApi
  var _previewTimer = null;
  function updateCreatePreview() {
    var station = byId('fStation').value;
    var slotCode = getSelectedChips('fSlotCode');
    var team = getSelectedChips('fTeam');
    var date = byId('fDate').value;
    var contractType = getSelectedChips('fContractType');
    var box = byId('createPreview');
    var cntEl = byId('createPreviewCount');
    var hintEl = byId('createPreviewHint');
    if (!cntEl || !box) return;
    updateCreateSubmitState();
    var missing = [];
    if (!station) missing.push('Station');
    if (!slotCode.length) missing.push('Ca');
    if (!team.length) missing.push('Team');
    if (missing.length) {
      box.setAttribute('data-state', 'idle');
      cntEl.textContent = 'Chưa đủ bộ lọc để xem số NV';
      hintEl.textContent = 'Cần chọn: ' + missing.join(', ');
      updateHud(station, '—', slotCode.length, team.length);
      return;
    }
    box.setAttribute('data-state', 'loading');
    cntEl.textContent = 'Đang kiểm tra…';
    hintEl.textContent = '';
    updateHud(station, '…', slotCode.length, team.length);
    clearTimeout(_previewTimer);
    _previewTimer = setTimeout(function () {  // debounce 400ms — tranh spam RPC khi doi select lien tuc
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) {
            box.setAttribute('data-state', 'err');
            cntEl.textContent = 'Không tải được preview';
            updateHud(station, '—', slotCode.length, team.length);
            return;
          }
          box.setAttribute('data-state', 'ok');
          cntEl.textContent = 'Số NV khớp: ' + res.count + ' người';
          var scope = station;
          if (date) scope += ' · ' + date;
          scope += ' · ' + slotCode.length + ' ca · ' + team.length + ' team';
          hintEl.textContent = scope;
          updateHud(station, res.count, slotCode.length, team.length);
        })
        .withFailureHandler(function (err) { markServerFail(); box.setAttribute('data-state', 'err'); cntEl.textContent = 'Lỗi preview: ' + err.message; updateHud(station, '—', slotCode.length, team.length); })
        .previewStaffApi({ station: station, slotCode: slotCode, team: team, date: date, contractType: contractType });
    }, 400);
  }
  // HUD stat (Dark Industrial): NV khớp / Ca chọn / Team
  function updateHud(stationName, nv, ca, team) {
    var hs = byId('hudStation');
    if (hs) hs.textContent = stationName ? stationName : 'KHO —';
    var e1 = byId('statNv'); if (e1) e1.textContent = nv;
    var e2 = byId('statCa'); if (e2) e2.textContent = ca;
    var e3 = byId('statTeam'); if (e3) e3.textContent = team;
  }
  // Nút "+ Tạo task" chỉ bấm được khi đủ Station + ≥1 Ca + ≥1 Team (khớp validate createTask)
  function updateCreateSubmitState() {
    var btn = byId('btnCreateSubmit');
    if (!btn) return;
    var station = byId('fStation').value;
    var slotCode = getSelectedChips('fSlotCode');
    var team = getSelectedChips('fTeam');
    btn.disabled = !(station && slotCode.length && team.length);
  }
  function initCreatePreview() {
    ['fStation', 'fDate'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('change', updateCreatePreview);
    });
  }

  function fillSelect(id, values, placeholder) {
    var sel = document.getElementById(id);
    sel.innerHTML = '';
    // Multi-select: KHÔNG thêm placeholder option (nó thành option chọn được value='')
    if (!sel.multiple) {
      var opt = document.createElement('option');
      opt.value = '';
      opt.textContent = placeholder;
      sel.appendChild(opt);
    }
    values.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      sel.appendChild(o);
    });
  }
  // ===== Chip filter (modal tạo task v2) — một chạm toggle, dễ dùng trên kiosk touch =====
  function fillChips(id, values) {
    var group = document.getElementById(id);
    if (!group) return;
    group.innerHTML = '';
    (values || []).forEach(function (v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = v;
      b.dataset.value = v;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () {
        b.classList.toggle('selected');
        b.setAttribute('aria-pressed', b.classList.contains('selected') ? 'true' : 'false');
        updateChipCount(id);
        updateCreateSubmitState();
        updateCreatePreview();
      });
      group.appendChild(b);
    });
  }
  function getSelectedChips(id) {
    var group = document.getElementById(id);
    if (!group) return [];
    var out = [];
    var chips = group.querySelectorAll('.chip.selected');
    for (var i = 0; i < chips.length; i++) out.push(chips[i].dataset.value);
    return out;
  }
  function updateChipCount(id) {
    var countEl = document.getElementById('count' + id.slice(1));
    if (countEl) {
      var n = getSelectedChips(id).length;
      countEl.textContent = n ? n : '';
    }
  }
  function resetChips(id) {
    var group = document.getElementById(id);
    if (!group) return;
    var chips = group.querySelectorAll('.chip.selected');
    for (var i = 0; i < chips.length; i++) chips[i].classList.remove('selected');
    updateChipCount(id);
  }

  // P3: render bảng task dùng chung — loadTaskList (toàn bộ) và lọc theo mã Ops
  // (header search) đều gọi → 1 nguồn HTML duy nhất, không trùng lặp.
  // Badge màu cột "Loại task" — phân loại theo taskType (reconcile / meal-move)
  function taskTypeBadge(tt) {
    if (tt === 'meal-move') return '<span class="badge tt-meal">Điểm danh Ra/Vào</span>';
    return '<span class="badge tt-ca">Điểm danh ca</span>';
  }
  // Phân trang danh sách task — tối đa 30 dòng/trang (PAGING)
  var _taskPage = 1;
  var _taskPageList = [];
  var TASK_PAGE_SIZE = 30;
  // PURE (test được): HTML card task cho MOBILE (renderTaskList tự quyết qua matchMedia
  // <=600px — bảng 13 cột quá chật trên điện thoại). Cùng dữ liệu + action với bảng
  // desktop — 1 nguồn task data, chỉ khác hình thức trình bày.
  function taskCardHTML(t) {
    var statusBadge = t.status === TASK_STATUS_C.DONE ? '<span class="badge done">Kết Thúc</span>' : '<span class="badge open">Đang Mở</span>';
    var action = t.status === TASK_STATUS_C.OPEN
      ? '<button class="btn btn-sm tc-btn" onclick="openScan(\'' + escAttr(t.taskId) + '\')">Quét</button>'
      : '<button class="btn btn-ghost btn-sm tc-btn" onclick="openScan(\'' + escAttr(t.taskId) + '\')">Xem</button>';
    // Loại task + Station · Ca · Team — bỏ phần rỗng (meal-move không có Ca)
    var scope = [taskTypeBadge(t.taskType), esc(t.station), esc(t.slotCode), esc(t.team)]
      .filter(function (s) { return String(s || '').trim(); })
      .join(' · ');
    var foot = String(t.createdAtText || t.createdAt || '');
    if (t.createdBy) foot += (foot ? ' · ' : '') + creatorName(t.createdBy);
    return '<div class="task-card">' +
      '<div class="tc-head"><span class="tc-id">' + esc(t.taskId) + '</span>' + statusBadge + '</div>' +
      '<div class="tc-type">' + scope + '</div>' +
      '<div class="tc-mid">' +
        '<span class="tc-count"><b>' + (t.total || 0) + '</b> NV</span>' +
        '<span class="tc-count ok"><b>' + (t.scanned || 0) + '</b> Đã quét</span>' +
        '<span class="tc-count extra"><b>' + (t.extra || 0) + '</b> Dư</span>' +
        action +
      '</div>' +
      '<div class="tc-foot">' + esc(foot) + '</div>' +
    '</div>';
  }
  function renderTaskList(tasks) {
    var body = byId('taskListBody');
    if (!body) return;
    var skel = byId('taskSkeleton');
    var tbl = byId('taskListTable');
    var empty = byId('taskEmpty');
    var cnt = byId('taskCount');
    var pagin = byId('taskPagin');
    var list = tasks || [];
    _taskPageList = list;
    body.innerHTML = '';
    if (skel) skel.style.display = 'none';
    if (tbl) tbl.style.display = '';
    if (cnt) cnt.textContent = list.length;
    if (pagin) pagin.style.display = 'none';
    if (!list.length) {
      if (empty) empty.style.display = '';
      if (pagin) pagin.innerHTML = '';
      var cw0 = byId('taskCards');
      if (cw0) cw0.style.display = 'none';
      return;
    }
    if (empty) empty.style.display = 'none';
    var pages = Math.max(1, Math.ceil(list.length / TASK_PAGE_SIZE));
    if (_taskPage > pages) _taskPage = pages;
    if (_taskPage < 1) _taskPage = 1;
    var start = (_taskPage - 1) * TASK_PAGE_SIZE;
    var slice = list.slice(start, start + TASK_PAGE_SIZE);
    // MOBILE (<=600px): bảng 13 cột quá chật trên điện thoại → chuyển sang dạng CARD
    // (taskCardHTML) — cùng data + action, chỉ khác hình thức. Desktop giữ nguyên bảng.
    var cardsWrap = byId('taskCards');
    var isMobileCards = !!(window.matchMedia && window.matchMedia('(max-width: 600px)').matches);
    if (isMobileCards) {
      if (tbl) tbl.style.display = 'none';
      if (!cardsWrap) {
        cardsWrap = document.createElement('div');
        cardsWrap.id = 'taskCards';
        cardsWrap.className = 'task-cards';
        var listWrap = byId('taskListWrap');
        if (listWrap) listWrap.appendChild(cardsWrap);
      }
      cardsWrap.style.display = '';
      cardsWrap.innerHTML = slice.map(function (t) { return taskCardHTML(t); }).join('');
      renderTaskPagin(list.length, pages);
      return;
    }
    if (cardsWrap) cardsWrap.style.display = 'none';
    slice.forEach(function (t, i) {
      var idx = start + i;
      var tr = document.createElement('tr');
      var statusBadge = t.status === TASK_STATUS_C.DONE ? '<span class="badge done">Kết Thúc</span>' : '<span class="badge open">Đang Mở</span>';
      tr.innerHTML =
        '<td class="stt">' + (idx + 1) + '</td>' +
        '<td>' + esc(t.taskId) + '</td>' +
        '<td>' + taskTypeBadge(t.taskType) + '</td>' +
        '<td>' + esc(t.station) + '</td>' +
        '<td>' + esc(t.slotCode) + '</td>' +
        '<td>' + esc(t.team) + '</td>' +
        '<td class="num">' + (t.total || 0) + '</td>' +
        '<td class="num">' + (t.scanned || 0) + '</td>' +
        '<td class="num">' + (t.extra || 0) + '</td>' +
        '<td>' + statusBadge + '</td>' +
        '<td>' + esc(t.createdAtText || t.createdAt || '') + '</td>' +
        '<td>' + esc(creatorName(t.createdBy)) + '</td>' +

  // Xe tải cam SPX chạy ngang thanh phân trang (giống xe tải ở logo header — MẪU 9)
  var PAGIN_TRUCK = '<svg class="spx-truck" viewBox="0 0 70 34" width="40" height="19" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="1" y="5" width="36" height="17" rx="2" fill="#EE4D2D"/><rect x="1" y="11" width="36" height="3" fill="rgba(255,255,255,.4)"/><path d="M41 8 h9 a7 7 0 0 1 7 7 v5 h-16 z" fill="#FF5F2E"/><rect x="41" y="13" width="9" height="4" rx="1.5" fill="rgba(255,255,255,.35)"/><circle cx="17" cy="24" r="5" fill="#1a1f2e"/><circle cx="17" cy="24" r="2.2" fill="#ffd166"/><circle cx="49" cy="24" r="5" fill="#1a1f2e"/><circle cx="49" cy="24" r="2.2" fill="#ffd166"/><text x="18" y="18.5" font-size="9.5" font-weight="800" fill="#fff" font-family="Arial, sans-serif">SPX</text></svg>';
  function renderTaskPagin(total, pages) {
    var pagin = byId('taskPagin');
    if (!pagin) return;
    if (pages <= 1) { pagin.style.display = 'none'; pagin.innerHTML = ''; return; }
    pagin.style.display = '';
    var html = PAGIN_TRUCK + '<button type="button"' + (_taskPage <= 1 ? ' disabled' : '') + ' onclick="goTaskPage(' + (_taskPage - 1) + ')">‹ Trước</button>';
    var nums = [];
    for (var i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - _taskPage) <= 1) nums.push(i);
      else if (nums[nums.length - 1] !== '…') nums.push('…');
    }
    nums.forEach(function (n) {
      if (n === '…') html += '<span class="p-dots">…</span>';
      else html += '<button type="button" class="' + (n === _taskPage ? 'active' : '') + '" onclick="goTaskPage(' + n + ')">' + n + '</button>';
    });
    html += '<button type="button"' + (_taskPage >= pages ? ' disabled' : '') + ' onclick="goTaskPage(' + (_taskPage + 1) + ')">Sau ›</button>';
    var from = (_taskPage - 1) * TASK_PAGE_SIZE + 1;
    var to = Math.min(_taskPage * TASK_PAGE_SIZE, total);
    html += '<span class="p-info">' + from + '–' + to + ' / ' + total + '</span>';
    pagin.innerHTML = html;
  }
  function goTaskPage(n) {
    var list = _taskPageList || [];
    var pages = Math.max(1, Math.ceil(list.length / TASK_PAGE_SIZE));
    if (n < 1) n = 1;
    if (n > pages) n = pages;
    _taskPage = n;
    renderTaskList(list);
  }
  // ===== DASH-SIDEBAR (MẪU 6 — Executive Dark): KPI + bộ lọc lọc data thật =====
  var _dashTasks = [];
  function setText(id, v) { var e = byId(id); if (e) e.textContent = v; }
  function toggleDashGroup(btn) { var g = btn.parentElement; if (g) g.classList.toggle('open'); }
  function buildDashOpts(containerId, name, tasks, field) {
    var box = document.getElementById(containerId);
    if (!box) return;
    var map = {};
    tasks.forEach(function (t) { var v = String(t[field] || '').trim(); if (v) map[v] = (map[v] || 0) + 1; });
    var keys = Object.keys(map).sort();
    box.innerHTML = keys.map(function (v) {
      return '<label class="dash-opt"><input type="checkbox" name="' + name + '" value="' + escAttr(v) + '" checked onchange="applyDashFilters()"> ' + esc(v) + ' <span class="dash-cnt">' + map[v] + '</span></label>';
    }).join('');
  }
  // Bộ lọc "Loại Task" — 2 loại cố định: Điểm danh ca / Điểm danh Ra/Vào
  function buildDashTypeOpts() {
    var box = byId('dynType');
    if (!box) return;
    var map = { reconcile: 0, 'meal-move': 0 };
    _dashTasks.forEach(function (t) { var k = t.taskType === 'meal-move' ? 'meal-move' : 'reconcile'; map[k]++; });
    box.innerHTML =
      '<label class="dash-opt"><input type="checkbox" name="dashType" value="reconcile" checked onchange="applyDashFilters()"> Điểm danh ca <span class="dash-cnt">' + map.reconcile + '</span></label>' +
      '<label class="dash-opt"><input type="checkbox" name="dashType" value="meal-move" checked onchange="applyDashFilters()"> Điểm danh Ra/Vào <span class="dash-cnt">' + map['meal-move'] + '</span></label>';
  }
  function renderDash(tasks) {
    // Giữ lọc của user TRƯỚC khi rebuild checkbox (bug 2026-08-18: poll 5s →
    // taskListPollTick gọi renderDash → checkbox dựng lại hardcode checked + radio về
    // 'all' → filter user đang chọn bị reset). dashState chỉ có giá trị khi user
    // thật sự chọn (radio ≠ 'all' hoặc có box nào unchecked) — lần render đầu giữ default.
    var prev = dashState();
    var hasFilter = prev.st !== 'all' || prev.type.length || prev.stn.length || prev.ca.length || prev.team.length;
    _dashTasks = tasks || [];
    var total = _dashTasks.length;
    var open = _dashTasks.filter(function (t) { return t.status !== TASK_STATUS_C.DONE; }).length;
    var scan = _dashTasks.reduce(function (a, t) { return a + (t.scanned || 0); }, 0);
    setText('dKpiTotal', total); setText('dKpiOpen', open); setText('dKpiDone', total - open); setText('dKpiScan', scan);
    buildDashTypeOpts();
    buildDashOpts('dynStn', 'dashStn', _dashTasks, 'station');
    buildDashOpts('dynCa', 'dashCa', _dashTasks, 'slotCode');
    buildDashOpts('dynTeam', 'dashTeam', _dashTasks, 'team');
    setText('dSt_open', open); setText('dSt_done', total - open);
    if (hasFilter) {
      var stEl = document.querySelector('input[name="dashSt"][value="' + prev.st + '"]');
      if (stEl) stEl.checked = true;
      var dashGroups = { dashType: 'type', dashStn: 'stn', dashCa: 'ca', dashTeam: 'team' };
      Object.keys(dashGroups).forEach(function (name) {
        var want = {};
        (prev[dashGroups[name]] || []).forEach(function (v) { want[v] = true; });
        document.querySelectorAll('input[name="' + name + '"]').forEach(function (i) { i.checked = !!want[i.value]; });
      });
    } else {
      var sAll = document.querySelector('input[name="dashSt"][value="all"]');
      if (sAll) sAll.checked = true;
    }
    applyDashFilters();
  }
  function dashState() {
    var r = document.querySelector('input[name="dashSt"]:checked');
    function vals(name) { return Array.prototype.map.call(document.querySelectorAll('input[name="' + name + '"]:checked'), function (i) { return i.value; }); }
    return { st: (r && r.value) || 'all', type: vals('dashType'), stn: vals('dashStn'), ca: vals('dashCa'), team: vals('dashTeam') };
  }
  function dashMatch(t, s) {
    if (s.st === 'open' && t.status === TASK_STATUS_C.DONE) return false;
    if (s.st === 'done' && t.status !== TASK_STATUS_C.DONE) return false;
    if (s.stn.length && s.stn.indexOf(String(t.station || '')) === -1) return false;
    if (s.ca.length && String(t.slotCode || '') && s.ca.indexOf(String(t.slotCode)) === -1) return false; // meal-move: slotCode rong -> khong thuoc ca nao, khong bi loc
    if (s.team.length && s.team.indexOf(String(t.team || '')) === -1) return false;
    if (s.type.length && s.type.indexOf(t.taskType === 'meal-move' ? 'meal-move' : 'reconcile') === -1) return false;
    return true;
  }
  function applyDashFilters() {
    var s = dashState();
    var list = _dashTasks.filter(function (t) { return dashMatch(t, s); });
    setText('dFilterBadge', (list.length === _dashTasks.length || !_dashTasks.length) ? '' : '(' + list.length + ')');
    _taskPage = 1;
    renderTaskList(list);
    refreshTypeCounts(s);
  }
  // Đếm lại nhóm "📋 Loại Task" THEO bộ lọc đang chọn (trạng thái/Station/Ca/Team,
  // không tính filter Loại Task) — số hiển thị khớp đúng danh sách sẽ hiện.
  // Tránh hiểu nhầm: 19 task Ra/Vào nhưng nếu đang lọc "Kết thúc" mà không có
  // task nào kết thúc → hiển thị 0, không phải 19.
  function refreshTypeCounts(s) {
    var box = byId('dynType');
    if (!box) return;
    var base = { st: s.st, stn: s.stn, ca: s.ca, team: s.team, type: [] };
    var subset = _dashTasks.filter(function (t) { return dashMatch(t, base); });
    var c = { reconcile: 0, 'meal-move': 0 };
    subset.forEach(function (t) { var k = t.taskType === 'meal-move' ? 'meal-move' : 'reconcile'; c[k]++; });
    var labels = box.querySelectorAll('.dash-cnt');
    if (labels[0]) labels[0].textContent = c.reconcile;
    if (labels[1]) labels[1].textContent = c['meal-move'];
  }
  function dashScrollTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  document.addEventListener('scroll', function () {
    var b = byId('dashScrollTop');
    if (!b) return;
    if (window.scrollY > 300) b.classList.add('show'); else b.classList.remove('show');
  }, { passive: true });
  function toggleDashMini() {
    var layout = document.querySelector('.dash-layout');
    if (layout) layout.classList.toggle('mini');
  }
  function clearDashFilters() {
    document.querySelectorAll('#dashSide input[type="checkbox"]').forEach(function (i) { i.checked = true; });
    var r = document.querySelector('#dashSide input[name="dashSt"][value="all"]');
    if (r) r.checked = true;
    applyDashFilters();
  }

  function loadTaskList() {
    // Skeleton shimmer ngay lập tức — phản hồi tức thì thay vì "treo"
    var skel = byId('taskSkeleton');
    var tbl = byId('taskListTable');
    var empty = byId('taskEmpty');
    if (skel) skel.style.display = '';
    if (tbl) tbl.style.display = 'none';
    if (empty) empty.style.display = 'none';
    // I9: đang tải → hiện '…' thay vì số 0 gây hiểu nhầm
    var cntLoading = byId('taskCount');
    if (cntLoading) cntLoading.textContent = '…';
    google.script.run
      .withSuccessHandler(function (tasks) {
        _taskPage = 1;
        renderDash(tasks); // render KPI + bảng task (renderTaskList nằm trong applyDashFilters) — bỏ render trùng
        startTaskListPolling(); // poll đa người dùng: thay đổi từ thiết bị khác → tự cập nhật (không cần bấm Làm mới)
        hideLoadingOverlay();
        markServerOk();  // P2: RPC thành công → server sống lại → netDot hồi phục
        _releaseRefreshLock();  // P2: RPC xong → nhả lock refresh (nếu dở)
      })
      .withFailureHandler(function (err) {
        markServerFail();  // P2: RPC fail → server offline
        _releaseRefreshLock();
        if (skel) skel.style.display = 'none';
        if (tbl) tbl.style.display = '';
        hideLoadingOverlay();
        showToast('Lỗi tải task: ' + err.message, true);

  function createTask() {
    if (BUSY) return;
    var noteEl = byId('noteInput');
    var input = {
      station: byId('fStation').value,
      slotCode: getSelectedChips('fSlotCode'),
      team: getSelectedChips('fTeam'),
      date: byId('fDate').value,
      contractType: getSelectedChips('fContractType'),
      note: noteEl ? noteEl.value.trim() : ''
    };
    if (!input.station || !input.slotCode.length || !input.team.length) {
      showToast('Vui lòng chọn đủ Station, Team và Ca', true);
      return;
    }
    BUSY = true;
    var btn = byId('btnCreateSubmit');
    if (btn) btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        BUSY = false;
        if (btn) btn.disabled = false;
        if (res.ok) {
          closeCreateModal();
          showToast(res.message + ' — ' + res.count + ' NV', false);
          loadTaskList();
          loadStaffIndex();  // refresh staff cache — quét ngay có thông tin
          openScan(res.taskId);
        } else {
          showToast(res.message, true);
        }
      })
      .withFailureHandler(function (err) {
        BUSY = false;
        if (btn) btn.disabled = false;
        showToast('Lỗi tạo task: ' + err.message, true);
      })
      .createReconcileTaskApi(input);
  }

  function openScan(taskId) {
    stopTaskListPolling(); // vào màn quét → màn quét tự poll chi tiết, dừng poll danh sách
    byId('viewList').classList.add('hidden');
    byId('viewScan').classList.remove('hidden');
    // P2 (audit): interval auto-focus đã bị dừng khi về danh sách → khởi động lại
    startAutoFocusLoop();
    // P2 (SWR an toàn): vừa xem task này xong (<15s) → render NGAY từ bộ nhớ,
    // KHÔNG spinner + RPC nền sync im lặng — hết chờ đợi khi quay lại mở cùng task.
    if (CURRENT_TASK && CURRENT_TASK.taskId === taskId
        && LAST_SCAN_VIEW.taskId === taskId
        && Date.now() - LAST_SCAN_VIEW.ts < SCAN_CACHE_TTL_MS) {
      renderScanView({ task: CURRENT_TASK, log: CURRENT_LOG, counters: CURRENT_COUNTERS });
      hideLoadingOverlay();  // phòng nếu overlay còn từ lần trước
      loadTaskDetail(taskId, true);  // RPC nền — sync dữ liệu mới nhất (nếu có thay đổi)
      return;
    }
    showLoadingOverlay();  // P2: spinner khi đang load danh sách NV (ẩn ở success/failure)
    loadTaskDetail(taskId);
  }

  function backToList() {
    // P2: chặn thoát khi còn scan queue HOẶC đang xử lý item cuối (queue rỗng nhưng
    // SCAN_PROCESSING=true) — nếu không, response cũ trả về render vào task mới đang
    // xem → scan card/toast lệch task, CURRENT_LOG bị ghi đè giữa chừng.
    if (scanBusy()) {
      showToast(SCAN_QUEUE.length > 0
        ? 'Đang xử lý ' + SCAN_QUEUE.length + ' lượt quét — chờ xong rồi quay lại'
        : 'Đang xử lý lượt quét — chờ xong rồi quay lại', true);
      return;
    }
    stopScanPolling();  // rời màn quét → dừng poll đồng bộ
    byId('viewScan').classList.add('hidden');
    byId('viewList').classList.remove('hidden');
    loadTaskList();
  }

  var SCAN_LOAD_SEQ = 0; // chống response task cũ ghi đè khi chuyển task nhanh
  // P2 (SWR an toàn): snapshot task vừa xem — quay lại + mở cùng task trong 15s
  // render NGAY từ bộ nhớ (không spinner, không chờ RPC) + gọi RPC nền sync im lặng.
  // TTL 15s khớp server TASK_DETAIL — không bao giờ hiển thị data stale hơn server.
  var LAST_SCAN_VIEW = { taskId: null, ts: 0 };
  var SCAN_CACHE_TTL_MS = 15000;

  // Render view scan từ data (dùng chung cho full-load và cache-reuse)
  function renderScanView(data) {
    var skel = byId('scanSkeleton');
    var tbl = byId('scanTable');
    var empty = byId('scanEmpty');
    CURRENT_TASK = data.task;
    CURRENT_LOG = data.log || [];
    byId('scanTaskTitle').textContent = data.task.taskId;
    var metaEl = byId('scanTaskMeta');
    var TT_LABEL = { reconcile: 'Đối chiếu', 'meal-move': TT_LABEL_MEAL['meal-move'] };
    var isMealMove = data.task.taskType === 'meal-move';
    metaEl.innerHTML =
      esc(TT_LABEL[data.task.taskType] || 'Task') +
      (isMealMove ? '' : ' · ' + esc(data.task.station) + ' · ' + esc(data.task.slotCode) + ' · ' + esc(data.task.team)) +
      (data.task.status === TASK_STATUS_C.DONE ? ' · <b>Đã kết thúc</b>' : ' · Đang mở') +
      // Hiện email creator cho mọi loại task (giống meal-move)
      (data.task.createdBy ? ' · ' + esc(creatorName(data.task.createdBy)) : '');
    renderTaskNote(data.task);
    // Quyền Ra/Vào meal-move: CHỈ email tạo task (createdBy) được mode 'ra' (Quét Danh Sách);
    // người khác ẩn nút + khóa 'vao' (Điểm Danh). Anonymous web app (currentUser rỗng) →
    // fallback cũ (hiện nút, mặc định 'ra'); server resolveMealMoveMode_ vẫn tự ép quyền.
    var isCreator = CURRENT_USER_EMAIL && CURRENT_USER_EMAIL === String(data.task.createdBy || '').trim().toLowerCase();
    var effCreator = CURRENT_USER_EMAIL ? isCreator : true;
    // meal-move: hiện cột Giờ Ra / Giờ Vào / Nhà Thầu / Số phút + toggle Ra|Vào + counter "Ra ngoài"
    toggleMealColumns(isMealMove);
    var toggleWrap = byId('mealToggleWrap');
    if (toggleWrap) toggleWrap.style.display = isMealMove ? 'flex' : 'none';
    // Nút "Chuyển Quét": chỉ meal-move + còn mở (disable khi đã kết thúc)
    var swBtn = byId('btnMealSwitch');
    if (swBtn) {
      swBtn.hidden = !isMealMove || !effCreator;
      swBtn.disabled = !isMealMove || !effCreator || data.task.status !== TASK_STATUS_C.OPEN;
    }
    var lockNote = byId('mealCreatorLock');
    if (lockNote) lockNote.style.display = (isMealMove && !effCreator) ? '' : 'none';
    // Reconcile (Điểm Danh Ca): render header 7 cột (Mã NV|Tên NV|Ca|Team|Station|Trạng thái|Giờ điểm danh)
    // meal-move: render header 10 cột có Giờ Ra/Giờ Vào/Nhà Thầu/Số phút. Header luôn khớp body.
    renderScanHeader(isMealMove);
    if (isMealMove) {
      // Creator → mặc định 'ra' (Quét Danh Sách); người khác → ép 'vao' (Điểm Danh)
      setMealMode(effCreator ? 'ra' : 'vao');
    }
    if (skel) skel.style.display = 'none';
    if (tbl) tbl.style.display = '';
    renderScanTable(data.log);
    // P1: task đã có scan → khôi phục scan card (không reset về "Chưa có")
    restoreScanCard(data.log);
    CURRENT_COUNTERS = data.counters || { scanned: 0, absent: 0, extra: 0 };
    renderCounters(CURRENT_COUNTERS);
    var canScan = data.task.status === TASK_STATUS_C.OPEN;
    byId('scanInput').disabled = !canScan;
    byId('scanInput').placeholder = canScan ? 'Quét hoặc dán mã nhân viên…' : 'Task đã kết thúc';
    var camBtn = byId('btnCamScan');
    if (camBtn) camBtn.disabled = !canScan;
    updateFinishBtnState();
    if (canScan) {
      byId('scanInput').focus();
    }
  }

  // silent=true: gọi RPC nền (đã render từ cache) — KHÔNG show spinner, KHÔNG reset UI
  function loadTaskDetail(taskId, silent) {
    var seq = ++SCAN_LOAD_SEQ;
    if (!silent) {
      // Reset UI NGAY — tránh hiển thị dữ liệu task mở trước đó trong lúc loading
      var skel = byId('scanSkeleton');
      var tbl = byId('scanTable');
      var empty = byId('scanEmpty');
      if (skel) skel.style.display = '';
      if (tbl) tbl.style.display = 'none';
      if (empty) empty.style.display = 'none';
      CURRENT_TASK = null;
      CURRENT_LOG = [];
      byId('scanTaskTitle').textContent = 'Đang tải…';
      byId('scanTaskMeta').textContent = '';
      byId('scanInput').value = '';
      byId('scanInput').disabled = true;
      renderCounters({ scanned: 0, absent: 0, extra: 0 });
      resetScanCard();
      updateFinishBtnState();
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (seq !== SCAN_LOAD_SEQ) return; // response của task cũ — bỏ qua
        if (!res.ok) { if (!silent) { showToast(res.message, true); backToList(); } return; }
        renderScanView(res);
        LAST_SCAN_VIEW = { taskId: taskId, ts: Date.now() };
        hideLoadingOverlay();  // P2: load xong → ẩn spinner
        startScanPolling(taskId);  // đồng bộ real-time với thiết bị khác cùng mở task này
      })
      .withFailureHandler(function (err) {
        if (seq !== SCAN_LOAD_SEQ) return; // response của task cũ — bỏ qua
        hideLoadingOverlay();  // P2: load lỗi cũng ẩn spinner
        if (silent) return; // RPC nền lỗi — giữ view đang hiển thị (cache) — không phá UX
        var skel = byId('scanSkeleton');
        var tbl = byId('scanTable');
        var empty = byId('scanEmpty');
        if (skel) skel.style.display = 'none';
        if (tbl) tbl.style.display = '';
        // P2: reset trạng thái view khi load lỗi — hết view treo "Đang tải…" + input disabled
        byId('scanTaskTitle').textContent = 'Không tải được task';
        byId('scanTaskMeta').textContent = '';
        if (empty) { empty.textContent = 'Lỗi tải chi tiết — bấm ← Danh sách task để quay lại'; empty.style.display = ''; }
        byId('scanInput').disabled = true;
        updateFinishBtnState();
        showToast('Lỗi tải chi tiết: ' + err.message, true);
      })
      .getTaskDetailApi(taskId);
  }

  function renderCounters(c) {
    if (!c) return;
    byId('cScanned').textContent = c.scanned || 0;
    byId('cAbsent').textContent = c.absent || 0;
    byId('cExtra').textContent = c.extra || 0;
    var outEl = byId('cOut');
    if (outEl) outEl.textContent = c.out || 0;
    // Label động theo trạng thái task: đang mở → "Chưa điểm danh" (chưa quét ≠ vắng);
    // đã kết thúc → "Vắng" (markUnscannedAbsent_ đã chốt trạng thái).
    var lbl = document.querySelector('.counter.absent .lbl');
    if (lbl) {
      lbl.textContent = (!CURRENT_TASK || CURRENT_TASK.status === TASK_STATUS_C.OPEN) ? 'Chưa điểm danh' : 'Vắng';
    }
  }

  // ===== ĐỒNG BỘ REAL-TIME 2 THIẾT BỊ (2026-08-12) =====
  // Mobile + PC cùng mở 1 task: thiết bị này quét → thiết bị kia phải cập nhật NGAY
  // (không cần F5). GAS không có push (WebSocket/Channel) → poll getTaskDetailApi định
  // kỳ khi đang ở màn quét. Server cache detail 15s bị invalidate MỌI khi ghi log/đổi
  // status (scanStaff / append Dư / meal-move / completeTask đều invalidateTaskDetailCache_)
  // → poll trúng cache (không đọc sheet) hầu hết thời gian, chỉ đọc lại ngay sau khi có
  // ghi từ thiết bị khác → bên kia hiển thị mới trong vòng 1 chu kỳ poll (~4s).
  var SCAN_POLL_MS = 4000;
  var scanPollTimer = null;
  var scanPollInFlight = false;
  var lastScanPollSig = null;

  // PURE (test được): signature của task detail — so bằng nhau = không có gì đổi → bỏ
  // qua re-render (tránh renderScanView reset sort/filter/focus vô ích mỗi 4s).
  function scanDetailSignature(data) {
    var task = (data && data.task) || {};
    var c = (data && data.counters) || {};
    var log = (data && data.log) || [];
    var parts = [task.status, c.scanned || 0, c.absent || 0, c.extra || 0, c.out || 0];
    for (var i = 0; i < log.length; i++) {
      var r = log[i] || {};
      parts.push(String(r.staffId || '') + '|' + String(r.status || '') + '|'
        + (Number(r.timeScanEpoch) || 0) + '|' + (Number(r.timeRaEpoch) || 0));
    }
    return parts.join(';');
  }

  // PURE (test được): poll trả data "cũ hơn" state local không (chống race RPC out-of-order
  // — response poll cũ có thể về SAU response quét mới). True → bỏ qua, poll kế sẽ đúng.
  function scanPollBehind(data, currentTask, currentCounters) {
    if (!data || !data.task || !currentTask) return true;
    if (currentTask.taskId !== data.task.taskId) return true;
    var pd = data.counters || {};
    var cd = currentCounters || {};
    if ((pd.scanned || 0) < (cd.scanned || 0)) return true;
    if ((pd.extra || 0) < (cd.extra || 0)) return true;
    if ((pd.out || 0) < (cd.out || 0)) return true;
    // Local đã thấy task DONE nhưng poll vẫn OPEN → poll là response cũ
    if (currentTask.status === TASK_STATUS_C.DONE && data.task.status === TASK_STATUS_C.OPEN) return true;
    return false;
  }

  function startScanPolling(taskId) {
    stopScanPolling();
    if (window.__RC_DEMO__) return; // demo = dữ liệu giả tĩnh — không cần poll
    lastScanPollSig = scanDetailSignature({ task: CURRENT_TASK, log: CURRENT_LOG, counters: CURRENT_COUNTERS });
    scanPollTimer = setInterval(function () { scanPollTick(taskId); }, SCAN_POLL_MS);
  }

  function stopScanPolling() {
    if (scanPollTimer) { clearInterval(scanPollTimer); scanPollTimer = null; }
    scanPollInFlight = false;
  }

  // 1 chu kỳ poll — bỏ qua khi không đủ điều kiện (ẩn tab / có modal / đang xử lý quét
  // local — lúc đó UI tự cập nhật rồi, poll sẽ đè state local).
  function scanPollTick(taskId) {
    if (scanPollInFlight) return; // RPC trước chưa về — không chồng
    var vs = byId('viewScan');
    if (!vs || vs.classList.contains('hidden')) return;   // không ở màn quét
    if (document.visibilityState === 'hidden') return;     // tab ẩn — Safari/Chrome throttle sẵn
    if (anyModalOpen()) return;                            // có modal (tạo task/confirm) — không phá
    if (scanBusy()) return;                                // queue quét đang chạy — state local là mới nhất
    scanPollInFlight = true;
    google.script.run
      .withSuccessHandler(function (res) {
        scanPollInFlight = false;
        if (!res || !res.ok) return;
        applyPolledScanDetail(res);
      })
      .withFailureHandler(function () { scanPollInFlight = false; })
      .getTaskDetailApi(taskId);
  }

  // Áp dữ liệu poll vào màn quét — chỉ re-render khi THỰC SỰ có thay đổi (signature guard).
  function applyPolledScanDetail(data) {
    if (!CURRENT_TASK) return;
    if (scanPollBehind(data, CURRENT_TASK, CURRENT_COUNTERS)) return; // response cũ hơn local
    var sig = scanDetailSignature(data);
    if (sig === lastScanPollSig) return; // không đổi → không re-render (giữ sort/filter/focus)
    lastScanPollSig = sig;
    var prevMealMode = MEAL_MODE;
    var prevActive = document.activeElement;
    var prevActiveId = prevActive && prevActive.id;
    var wasOpen = CURRENT_TASK.status === TASK_STATUS_C.OPEN;
    renderScanView(data);
    // renderScanView mặc định reset meal-mode (creator → 'ra') → khôi phục chế độ người
    // dùng đang dùng (Ra/Vào là state UI local, KHÔNG đồng bộ giữa các thiết bị).
    if (CURRENT_TASK.taskType === 'meal-move' && MEAL_MODE !== prevMealMode) setMealMode(prevMealMode);
    // renderScanView focus về ô quét — đang gõ ô tìm/lọc thì trả lại focus
    if (prevActiveId === 'scanSearch' || prevActiveId === 'scanStatusFilter') {
      var prev = document.getElementById(prevActiveId);
      if (prev && prev.focus) prev.focus();
    }
    LAST_SCAN_VIEW = { taskId: data.task.taskId, ts: Date.now() };
    if (wasOpen && data.task.status === TASK_STATUS_C.DONE) {
      showToast('Task đã kết thúc từ thiết bị khác');
    }
  }

  // ===== ĐỒNG BỘ REAL-TIME DANH SÁCH TASK — NHIỀU NGƯỜI CÙNG TRUY CẬP (2026-08-16) =====
  // Người này tạo/kết thúc/mở lại/đổi ghi chú task → người khác đang mở app phải thấy
  // NGAY mà không cần bấm "⟳ Làm mới". GAS không có push → poll getTaskListApi định kỳ:
  // server cache 30s bị invalidate MỌI khi ghi task (insertTask_/updateTaskStatus_/
  // updateTaskNote_) → poll trúng cache hầu hết thời gian (không đọc sheet), chỉ đọc
  // lại ngay sau khi có ghi từ thiết bị khác → bên kia hiển thị mới trong 1 chu kỳ (~5s).
  var TASK_LIST_POLL_MS = 5000;
  var taskListPollTimer = null;
  var taskListPollInFlight = false;
  var lastTaskListSig = null;

  // PURE (test được): signature danh sách task — bằng nhau = không có gì đổi → bỏ qua
  // re-render (tránh reset sort/filter/phân trang vô ích mỗi 5s).
  function taskListSignature(tasks) {
    return (tasks || []).map(function (t) {
      return [t.taskId, t.status, t.total || 0, t.scanned || 0, t.extra || 0,
        t.createdAtText || '', t.completedAtText || '', t.note || ''].join('|');
    }).join(';');
  }

  function startTaskListPolling() {
    stopTaskListPolling();
    if (window.__RC_DEMO__) return; // demo = dữ liệu giả tĩnh — không cần poll
    lastTaskListSig = taskListSignature(_taskPageList);
    taskListPollTimer = setInterval(taskListPollTick, TASK_LIST_POLL_MS);
  }

  function stopTaskListPolling() {
    if (taskListPollTimer) { clearInterval(taskListPollTimer); taskListPollTimer = null; }
    taskListPollInFlight = false;
  }

  // 1 chu kỳ poll danh sách — bỏ qua khi không đủ điều kiện (màn khác / modal / đang
  // "Làm mới" tay / đang lọc theo mã NV — poll không được đè lên bộ lọc header search).
  function taskListPollTick() {
    if (taskListPollInFlight) return; // RPC trước chưa về — không chồng
    var vs = byId('viewList');
    if (!vs || vs.classList.contains('hidden')) return;   // đang ở màn quét
    if (document.visibilityState === 'hidden') return;    // tab ẩn — browser throttle sẵn
    if (anyModalOpen()) return;
    if (_refreshLock) return;                             // đang "Làm mới" tay — RPC đó lo
    if (_taskFilterStaff) return;                         // lọc theo mã Ops — không đè lọc
    taskListPollInFlight = true;
    google.script.run
      .withSuccessHandler(function (tasks) {
        taskListPollInFlight = false;
        var sig = taskListSignature(tasks);
        if (sig === lastTaskListSig) return; // không đổi → giữ nguyên (không reset sort/filter)
        lastTaskListSig = sig;
        renderDash(tasks); // render KPI + bảng task (applyDashFilters) — giống hệt "⟳ Làm mới"
        markServerOk();
      })
      .withFailureHandler(function () { taskListPollInFlight = false; })
      .getTaskListApi();
  }

  // meal-move: hiện/ẩn cột Giờ Ra / Nhà Thầu / Số phút trong bảng scan
  function toggleMealColumns(show) {
    var cols = document.querySelectorAll('.mm-col');
    for (var i = 0; i < cols.length; i++) {
      cols[i].style.display = show ? '' : 'none';
    }
    // Counter "Ra ngoài"
    var wrap = byId('cOutWrap');
    if (wrap) wrap.style.display = show ? '' : 'none';
  }

  // Render header bảng scan theo loại task — đảm bảo header khớp body
  // (reconcile = 7 cột: Mã NV|Tên NV|Ca|Team|Station|Trạng thái|Giờ điểm danh;
  //  meal-move = 10 cột có thêm Giờ Ra/Giờ Vào/Nhà Thầu/Số phút).
  // ===== Ghi chú task: hiển thị dưới task-meta + nút "Sửa ghi chú" nhỏ màu =====
  function renderTaskNote(task) {
    var wrap = byId('taskNoteWrap');
    if (!wrap) return;
    var note = String((task && task.note) || '').trim();
    var canEdit = true; // mọi trạng thái task đều sửa được ghi chú
    if (note) {
      wrap.innerHTML =
        '<div class="task-note" id="taskNoteBox">' +
          '<span class="tn-ic">📝</span>' +
          '<div class="tn-text">' + esc(note) + '</div>' +
          (canEdit ? '<div class="tn-actions"><button type="button" class="btn-note-edit" onclick="editTaskNote()">✎ Sửa ghi chú</button></div>' : '') +
        '</div>';
    } else {
      wrap.innerHTML =
        '<div class="task-note-empty">' +
          (canEdit ? '<button type="button" class="btn-note-edit" onclick="editTaskNote()">＋ Ghi chú</button>' : '') +
        '</div>';
    }
  }
  // Chuyển khối ghi chú sang chế độ chỉnh sửa (textarea + Lưu/Huỷ)
  function editTaskNote() {
    var wrap = byId('taskNoteWrap');
    if (!wrap || !CURRENT_TASK) return;
    var note = String((CURRENT_TASK && CURRENT_TASK.note) || '').trim();
    wrap.innerHTML =
      '<div class="task-note-editbox">' +
        '<textarea id="taskNoteEdit" rows="2" placeholder="Ghi chú cho task…" aria-label="Ghi chú task">' + esc(note) + '</textarea>' +
        '<div class="tne-actions">' +
          '<button type="button" class="btn" onclick="saveTaskNote()">Lưu</button>' +
          '<button type="button" class="btn btn-ghost" onclick="cancelTaskNote()">Huỷ</button>' +
        '</div>' +
      '</div>';
    var ta = byId('taskNoteEdit');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  function cancelTaskNote() {
    renderTaskNote(CURRENT_TASK);
  }
  function saveTaskNote() {
    if (!CURRENT_TASK) return;
    var ta = byId('taskNoteEdit');
    var note = ta ? ta.value : '';
    var btn = document.querySelector('.task-note-editbox .btn');
    if (btn) btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        var b2 = document.querySelector('.task-note-editbox .btn');
        if (b2) b2.disabled = false;
        if (res && res.ok) {
          CURRENT_TASK.note = String(note || '').trim();
          renderTaskNote(CURRENT_TASK);
          showToast(res.message, false);
        } else {
          showToast((res && res.message) || 'Lỗi lưu ghi chú', true);
        }
      })
      .withFailureHandler(function (err) {
        var b3 = document.querySelector('.task-note-editbox .btn');
        if (b3) b3.disabled = false;
        showToast('Lỗi lưu ghi chú: ' + err.message, true);
      })
      .updateTaskNoteApi(CURRENT_TASK.taskId, note);
  }

  function renderScanHeader(isMealMove) {
    var thead = document.querySelector('#scanTable thead');
    if (!thead) return;
    if (isMealMove) {
      thead.innerHTML = '<tr>' +
        '<th scope="col" data-sort="0" class="sortable" aria-sort="none">Mã NV</th>' +
        '<th scope="col" data-sort="1" class="sortable" aria-sort="none">Tên NV</th>' +
        '<th scope="col" data-sort="2" class="sortable" aria-sort="none">Ca</th>' +
        '<th scope="col" data-sort="3" class="sortable" aria-sort="none">Team</th>' +
        '<th scope="col" data-sort="4" class="sortable" aria-sort="none">Station</th>' +
        '<th scope="col" data-sort="5" class="sortable" aria-sort="none">Giờ Ra</th>' +
        '<th scope="col" data-sort="6" class="sortable" aria-sort="none">Giờ Vào</th>' +
        '<th scope="col" data-sort="7" class="sortable" aria-sort="none">Nhà Thầu</th>' +
        '<th scope="col" data-sort="8" class="sortable" aria-sort="none">Số phút</th>' +
        '<th scope="col" data-sort="9" class="sortable" aria-sort="none">Trạng thái</th>' +
        '</tr>';
    } else {
      thead.innerHTML = '<tr>' +
        '<th scope="col" data-sort="0" class="sortable" aria-sort="none">Mã NV</th>' +
        '<th scope="col" data-sort="1" class="sortable" aria-sort="none">Tên NV</th>' +
        '<th scope="col" data-sort="2" class="sortable" aria-sort="none">Vender</th>' +
        '<th scope="col" data-sort="3" class="sortable" aria-sort="none">Ca</th>' +
        '<th scope="col" data-sort="4" class="sortable" aria-sort="none">Team</th>' +
        '<th scope="col" data-sort="5" class="sortable" aria-sort="none">Station</th>' +
        '<th scope="col" data-sort="6" class="sortable" aria-sort="none">Trạng thái</th>' +
        '<th scope="col" data-sort="7" class="sortable" aria-sort="none">Giờ điểm danh</th>' +
        '</tr>';
    }
    updateSortIndicators();
  }

  // meal-move: set mode Ra/Vào — toggle UI + state
  function setMealMode(mode) {
    MEAL_MODE = mode;
    var pillRa = byId('mealModePillRa');
    var pillVao = byId('mealModePillVao');
    if (pillRa) pillRa.classList.toggle('active', mode === 'ra');
    if (pillVao) pillVao.classList.toggle('active', mode === 'vao');
    // Nút chuyển ở topbar: nhãn theo đích sắp chuyển
    var sw = byId('btnMealSwitch');
    if (sw) {
      sw.textContent = mode === 'ra' ? 'Chuyển Quét Điểm Danh' : 'Chuyển Quét Lấy Danh Sách';
    }
    // Cập nhật placeholder scan
    var inp = byId('scanInput');
    if (inp) {
      inp.placeholder = mode === 'ra' ? 'Quét mã Ops — lấy danh sách…' : 'Quét mã Ops — điểm danh…';
    }
  }

  // meal-move: nút chuyển cạnh nút Kết thúc — toggle Quét Danh Sách ⇄ Điểm Danh.
  // Đang 'ra' (Quét Danh Sách) → chuyển sang 'vao' (Điểm Danh); đang 'vao' → quay lại.
  function toggleMealMode() {
    if (!CURRENT_TASK) return;
    if (CURRENT_TASK.taskType !== 'meal-move') return;
    if (CURRENT_TASK.status !== TASK_STATUS_C.OPEN) {
      showToast('Task đã kết thúc — không chuyển được', true);
      return;
    }
    // Chỉ email tạo task được chuyển Quét Danh Sách ⇄ Điểm Danh (nút đã ẩn nếu không phải creator)
    if (CURRENT_USER_EMAIL && CURRENT_USER_EMAIL !== String(CURRENT_TASK.createdBy || '').trim().toLowerCase()) {
      showToast('Chỉ người tạo task được chuyển chế độ', true);
      return;
    }
    setMealMode(nextMealMode(MEAL_MODE));
  }

  // C3: state lọc + sort bảng scan — mặc định "Giờ quét" MỚI NHẤT lên đầu (col 5, desc).
  var SCAN_FILTER = { q: '', status: '' };
  var SCAN_SORT = { col: 6, asc: false };  // Trạng thái (mới nhất lên đầu) — col 6 cho reconcile, col 9 cho meal-move
  var STATUS_ORDER = {};  // P3: dựng từ STATUS_C — tránh hardcode label
  STATUS_ORDER[STATUS_C.PENDING] = 0;
  STATUS_ORDER[''] = 0;
  STATUS_ORDER[STATUS_C.PRESENT] = 1;
  STATUS_ORDER[STATUS_C.ABSENT] = 2;
  STATUS_ORDER[STATUS_C.EXTRA] = 3;
  // C4: rank status cho sort — KHÔNG dùng `|| 9` (0 là falsy → PENDING thành 9)
  function statusRank(s) {
    var r = STATUS_ORDER[s];
    return r === undefined ? 9 : r;
  }

  function filterAndSortScan(log) {
    var q = SCAN_FILTER.q.trim().toLowerCase();
    var st = SCAN_FILTER.status;
    var out = [];
    (log || []).forEach(function (r) {
      if (st && r.status !== st) return;
      if (q) {
        var hay = (String(r.staffId || '') + ' ' + String(r.staffName || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return;
      }
      out.push(r);
    });
    var col = SCAN_SORT.col, asc = SCAN_SORT.asc;
    var isMealMove = CURRENT_TASK && CURRENT_TASK.taskType === 'meal-move';
    out.sort(function (a, b) {
      var va, vb;
      if (isMealMove) {
        // Meal-move columns: 0=Mã NV, 1=Tên NV, 2=Ca, 3=Team, 4=Station, 5=Giờ Ra, 6=Giờ Vào, 7=Nhà Thầu, 8=Số phút, 9=Trạng thái
        if (col === 9) { va = statusRank(a.status); vb = statusRank(b.status); }
        else if (col === 0) { va = String(a.staffId || '').toUpperCase(); vb = String(b.staffId || '').toUpperCase(); }
        else if (col === 1) { va = String(a.staffName || '').toUpperCase(); vb = String(b.staffName || '').toUpperCase(); }
        else if (col === 2) { va = String(a.slotCode || ''); vb = String(b.slotCode || ''); }
        else if (col === 3) { va = String(a.team || ''); vb = String(b.team || ''); }
        else if (col === 4) { va = String(a.station || ''); vb = String(b.station || ''); }
        else if (col === 5) { va = Number(a.timeRaEpoch) || 0; vb = Number(b.timeRaEpoch) || 0; }
        else if (col === 6) { va = Number(a.timeScanEpoch) || 0; vb = Number(b.timeScanEpoch) || 0; }
        else if (col === 7) { va = String(a.agency || ''); vb = String(b.agency || ''); }
        else if (col === 8) { va = Number(a.durationMinutes) || 0; vb = Number(b.durationMinutes) || 0; }
      } else {
        // Reconcile (Điểm Danh Ca) columns: 0=Mã NV, 1=Tên NV, 2=Vender, 3=Ca, 4=Team, 5=Station, 6=Trạng Thái, 7=Giờ điểm danh
        if (col === 6) { va = statusRank(a.status); vb = statusRank(b.status); }
        else if (col === 0) { va = String(a.staffId || '').toUpperCase(); vb = String(b.staffId || '').toUpperCase(); }
        else if (col === 1) { va = String(a.staffName || '').toUpperCase(); vb = String(b.staffName || '').toUpperCase(); }
        else if (col === 2) { va = String(a.agency || '').toUpperCase(); vb = String(b.agency || '').toUpperCase(); }
        else if (col === 3) { va = String(a.slotCode || ''); vb = String(b.slotCode || ''); }
        else if (col === 4) { va = String(a.team || ''); vb = String(b.team || ''); }
        else if (col === 5) { va = String(a.station || ''); vb = String(b.station || ''); }
        else if (col === 7) { va = Number(a.timeScanEpoch) || 0; vb = Number(b.timeScanEpoch) || 0; }
      }
      if (va === vb) return 0;
      var cmp = va < vb ? -1 : 1;
      return asc ? cmp : -cmp;
    });
    return out;
  }

  function renderScanTable(log) {
    var body = byId('scanTableBody');
    var empty = byId('scanEmpty');
    var tbl = byId('scanTable');
    var cardsWrap = byId('scanCards');
    function hideCards() { if (cardsWrap) cardsWrap.style.display = 'none'; }
    if (!log || !log.length) {
      // P3: log rỗng → ẩn luôn bảng (header trống + empty div gây rối mắt)
      body.innerHTML = '';
      hideCards();
      if (tbl) tbl.style.display = 'none';
      empty.textContent = 'Không có nhân viên nào trong danh sách';
      empty.style.display = '';
      return;
    }
    var rows = filterAndSortScan(log);
    if (!rows.length) {
      // C3: có log nhưng bộ lọc loại hết → báo khác empty thật
      body.innerHTML = '';
      hideCards();
      if (tbl) tbl.style.display = 'none';
      empty.textContent = 'Không có NV khớp bộ lọc';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';
    // Mobile (<=600px): bảng 8–10 cột kéo dài ngang quá khổ màn hình điện thoại → chuyển
    // sang dạng CARD (scanRowCardHTML) — cùng data + filter/sort, chỉ khác hình thức (2026-08-13).
    var isCards = !!(window.matchMedia && window.matchMedia('(max-width: 600px)').matches);
    if (isCards) {
      hideCards();
      var wrap = getScanCardsWrap();
      if (tbl) tbl.style.display = 'none';
      if (wrap) {
        wrap.style.display = '';
        _paintScanRowCards(wrap, rows);
      }
      return;
    }
    hideCards();
    if (tbl) tbl.style.display = '';
    _paintScanRows(body, rows);
  }

  // I2: keyed row-diff — chỉ update cell thay đổi, không replace toàn bộ (chống flicker)
  function _paintScanRows(body, rows) {
    var existing = {};
    var i, tr;
    for (i = 0; i < body.children.length; i++) {
      tr = body.children[i];
      if (tr.dataset && tr.dataset.id) existing[tr.dataset.id] = tr;
    }
    var keep = {};
    for (i = 0; i < rows.length; i++) {
      var r = rows[i];
      tr = existing[r.staffId];
      if (!tr) { tr = document.createElement('tr'); tr.dataset.id = r.staffId; }
      tr.className = r.status === STATUS_C.EXTRA ? 'extra-row' : '';  // C4: nổi bật NV lạ
      var cells = scanRowCells(r);
      if (tr.children.length !== cells.length) {
        tr.innerHTML = cells.join('');
      } else {
        for (var c = 0; c < cells.length; c++) {
          if (tr.children[c].innerHTML !== cells[c]) tr.children[c].innerHTML = cells[c];
        }
      }
      keep[r.staffId] = tr;
    }
    // Xoá tr không còn trong dữ liệu lọc
    for (i = body.children.length - 1; i >= 0; i--) {
      tr = body.children[i];
      if (!keep[tr.dataset && tr.dataset.id]) tr.remove();
    }
    // Đưa về đúng thứ tự lọc/sort (appendChild tự chuyển về cuối)
    for (i = 0; i < rows.length; i++) {
      tr = keep[rows[i].staffId];
      if (body.lastChild !== tr) body.appendChild(tr);
    }
  }

  function scanRowCells(r) {

    if (isMealMove) {

  // Lưu ý tên scanRowCardHTML (KHÔNG trùng scanCardHTML — hàm đó đã tồn tại cho scan-card
  // kết quả quét (status,target); function declaration sau ghi đè → crash, bug 2026-08-13).
  function scanRowCardHTML(r) {
    var isMealMove = CURRENT_TASK && CURRENT_TASK.taskType === 'meal-move';

    } else {
