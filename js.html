  // ===== Meal-move: submitScan branch (Ra/Vào mode + 1.5s rule + optimistic) =====
  // 1.5s rule client-side (2026-08-17: giảm từ 10s để khớp DUPLICATE_WINDOW_MS server
  // + cooldown quét camera): quét cùng mã trong 1.5s → "Trùng mã"
  function submitScanMealMove(input, staffId, target) {
    // Trùng mã: check epoch mốc hiện tại theo mode (Ra → timeRaEpoch, Vào → timeScanEpoch).
    // Gộp 2 block Ra/Vào giống hệt (2026-08-21) — cùng pattern chặn + toast + card + focus.
    if (target) {
      var lastEpoch = MEAL_MODE === 'ra' ? Number(target.timeRaEpoch) : Number(target.timeScanEpoch);
      if (lastEpoch > 0 && (Date.now() - lastEpoch) < 1500) {
        showToast('Trùng mã — quét lại sau 1.5 giây', true);
        playBeep('error');
        showScanCard('Trùng mã', target, true);
        input.value = '';
        if (!window.__RC_CAM_OPEN__) input.focus();  // camera mở → không bật bàn phím
        return;
      }
    }
    // Học reconcile: chặn NGAY ở client, không optimistic — mirror ScanLogic.gs classifyMealMoveScan
    // Đã đủ Ra+Vào (hasRa && hasVao) → đủ cả 2 mốc
    // Ra mode mà đã có Ra (hasRa) → đã Ra
    // Vao mode mà đã có Vao (hasVao) → đã Vào/Dư (khớp reconcile EXTRA là đã điểm danh)
    if (target) {
      var __hasRa = Number(target.timeRaEpoch) > 0;
      var __hasVao = Number(target.timeScanEpoch) > 0;
      if (__hasRa && __hasVao) {
        showToast('Đã điểm danh — đủ Ra + Vào', true);
        playBeep('error');
        showScanCard('Đã điểm danh', target, true);
        input.value = '';
        if (!window.__RC_CAM_OPEN__) input.focus();
        return;
      }
      if (MEAL_MODE === 'ra' && __hasRa) {
        showToast('Đã điểm danh', true);
        playBeep('error');
        showScanCard('Đã điểm danh', target, true);
        input.value = '';
        if (!window.__RC_CAM_OPEN__) input.focus();
        return;
      }
      if (MEAL_MODE === 'vao' && __hasVao) {
        showToast('Đã điểm danh', true);
        playBeep('error');
        showScanCard('Đã điểm danh', target, true);
        input.value = '';
        if (!window.__RC_CAM_OPEN__) input.focus();
        return;
      }
    }

    input.value = '';
    if (!window.__RC_CAM_OPEN__) input.focus();  // camera mở → không bật bàn phím

    var item = {
      staffId: staffId,
      taskId: CURRENT_TASK.taskId,
      target: target,
      mode: MEAL_MODE,  // 'ra' | 'vao'
      optimisticNew: false,
      oldStatus: null,
      oldTimeRaText: null,
      oldTimeRaEpoch: null,
      oldTimeScanText: null,
      oldTimeScanEpoch: null,
    };

    if (target) {
      item.oldStatus = target.status;
      item.oldTimeRaText = target.timeRaText;
      item.oldTimeRaEpoch = target.timeRaEpoch;
      item.oldTimeScanText = target.timeScanText;
      item.oldTimeScanEpoch = target.timeScanEpoch;

      if (MEAL_MODE === 'ra') {
        // Ra: ghi timeRa, status OUT
        target.status = STATUS_C.OUT;
        target.timeRaText = fmtDate(new Date());
        target.timeRaEpoch = Date.now();
      } else {
        // Vào: ghi timeScan, status PRESENT + duration
        target.status = STATUS_C.PRESENT;
        target.timeScanText = fmtDate(new Date());
        target.timeScanEpoch = Date.now();
        if (target.timeRaEpoch) {
          // P2 (2026-08-19): clamp 0 — khớp read path server (B1). Đồng hồ lệch giữa
          // 2 lần quét (Ra sau Vào/bù) có thể cho âm → hiện "−N phút" tới khi reload.
          target.durationMinutes = Math.max(0, Math.round((target.timeScanEpoch - target.timeRaEpoch) / 60000));
        }
      }
    } else {
      // NV lạ → append EXTRA (meal-move cũng append mã lạ)
      item.optimisticNew = true;
      // NV lạ → điền thông tin NGAY từ staff cache client (nếu có) — không chờ server round-trip.
      var siInfo = lookupStaffInfo(staffId);
      target = {
        staffId: staffId, staffName: siInfo ? siInfo.staffName : '…',
        slotCode: siInfo ? (siInfo.slotCode || '') : '',
        station: siInfo ? (siInfo.station || '') : '',
        team: siInfo ? (siInfo.team || '') : '',
        workstation: siInfo ? (siInfo.workstation || '') : '',
        agency: siInfo ? (siInfo.agency || '') : '',
        timeRefText: '', timeRaText: '', timeScanText: '',
        timeRaEpoch: 0, timeScanEpoch: 0, durationMinutes: null,
        status: MEAL_MODE === 'ra' ? STATUS_C.OUT : STATUS_C.EXTRA,
      };
      if (MEAL_MODE === 'ra') {
        target.timeRaText = fmtDate(new Date());
        target.timeRaEpoch = Date.now();
      } else {
        target.timeScanText = fmtDate(new Date());
        target.timeScanEpoch = Date.now();
      }
      item.target = target;
      CURRENT_LOG.push(target);
    }

    item.scanSeq = ++SCAN_CARD_SEQ;
    item.optimisticStatus = target.status;
    playBeep('scan');
    showToast(item.optimisticStatus, false);
    showScanCard(item.optimisticStatus, target, false);
    recountFromLog();
    renderScanTable(CURRENT_LOG);
    SCAN_QUEUE.push(item);
    updateFinishBtnState();
    processScanQueueMealMove();
  }

  // Meal-move: process queue — gọi scanStaffApi với mode
  function processScanQueueMealMove() {
    if (SCAN_PROCESSING || !SCAN_QUEUE.length) return;
    SCAN_PROCESSING = true;
    var item = SCAN_QUEUE.shift();
    updateFinishBtnState();

    function rollback() {
      if (item.target && !item.optimisticNew) {
        item.target.status = item.oldStatus;
        item.target.timeRaText = item.oldTimeRaText || '';
        item.target.timeRaEpoch = item.oldTimeRaEpoch || 0;
        item.target.timeScanText = item.oldTimeScanText || '';
        item.target.timeScanEpoch = item.oldTimeScanEpoch || 0;
        item.target.durationMinutes = null;
      } else if (item.target && item.optimisticNew) {
        var idx = CURRENT_LOG.indexOf(item.target);
        if (idx >= 0) CURRENT_LOG.splice(idx, 1);
      }
    }

    function syncCounters(serverCounters) {
      if (SCAN_QUEUE.length > 0) { recountFromLog(); return; }
      if (serverCounters) { CURRENT_COUNTERS = serverCounters; renderCounters(serverCounters); }
      else { recountFromLog(); }
    }

    google.script.run
      .withSuccessHandler(function (res) {
        SCAN_PROCESSING = false;
        var busyRetry = false;  // FIX-16: BUSY → re-enqueue thay rollback
        if (!CURRENT_TASK || CURRENT_TASK.taskId !== item.taskId) {
          processScanQueueMealMove();
          return;
        }
        if (res.ok) {
          if (item.target) {
            item.target.status = res.status;
            item.target.staffName = res.staffName || item.target.staffName;
            if (res.timeRaText) item.target.timeRaText = res.timeRaText;
            // B11 (2026-08-19): đồng bộ timeRaEpoch từ server — trước chỉ set text,
            // sort cột Giờ Ra (js.html sort col 5) dùng epoch client lệch vài giây.
            if (res.timeRaEpoch) item.target.timeRaEpoch = res.timeRaEpoch;
            if (res.timeScanText) item.target.timeScanText = res.timeScanText;
            if (res.agency) item.target.agency = res.agency;
            // Dư: điền NGAY thông tin NV (Tên/Ca/Team/Station/Vender) từ staffIndex —
            // không chờ Kết Thúc mới hiện (server lookup; null = không có → giữ trống)
            if (res.slotCode != null) item.target.slotCode = res.slotCode;
            if (res.station != null) item.target.station = res.station;
            if (res.team != null) item.target.team = res.team;
            if (res.workstation != null) item.target.workstation = res.workstation;
            if (res.durationMinutes != null) item.target.durationMinutes = res.durationMinutes;
          }
          // NV lạ: response về sau khi quét NV khác → showScanCard bỏ qua (scanSeq không
          // còn mới nhất) → dòng camera giữ '…'. Điền tên thật theo mã (khớp đường
          // reconcile BUG 10 — meal-move trước đây thiếu nhánh này, 2026-08-19).
          if (res.staffName && item.optimisticNew && typeof camUpdateName === 'function') {
            camUpdateName(item.target.staffId, res.staffName);
          }
          if (item.scanSeq === SCAN_CARD_SEQ) { showScanCard(res.status || item.optimisticStatus, item.target, false); }
          syncCounters(res.counters);
          renderScanTable(CURRENT_LOG);
        } else {
          // FIX-16: lock server bận — retry tối đa 2 lần backoff 500ms (mirror
          // processScanQueue). Re-enqueue TRƯỚC rollback → giữ optimistic state.
          busyRetry = res.message === LOCK_BUSY_MSG && (item._retries || 0) < 2;
          if (busyRetry) {
            item._retries = (item._retries || 0) + 1;
            SCAN_QUEUE.unshift(item);
          } else {
            // Reject: rollback + toast
            rollback();
            if (typeof camCooldownFailed === 'function') camCooldownFailed(item.staffId);
            if (item.scanSeq === SCAN_CARD_SEQ) { showScanCard(res.message || 'Lỗi', item.target, true); }
            showToast(res.message || 'Lỗi quét', true);
            playBeep('error');
            syncCounters(res.counters);
            renderScanTable(CURRENT_LOG);
          }
        }
        // Bật lại nút Kết Thúc khi xong lượt quét (SCAN_PROCESSING đã = false) —
        // nếu không, nút kẹt disabled vĩnh viễn sau lượt quét cuối.
        updateFinishBtnState();
        refreshScanPollSig();
        if (busyRetry) setTimeout(processScanQueueMealMove, 500);
        else processScanQueueMealMove();
      })
      .withFailureHandler(function (err) {
        SCAN_PROCESSING = false;
        if (CURRENT_TASK && CURRENT_TASK.taskId === item.taskId) {
          rollback();
          if (typeof camCooldownFailed === 'function') camCooldownFailed(item.staffId);
          if (item.scanSeq === SCAN_CARD_SEQ) { showScanCard('Lỗi mạng', item.target, true); }
          showToast('Lỗi quét: ' + err.message, true);
          playBeep('error');
          syncCounters(null);
          renderScanTable(CURRENT_LOG);
          refreshScanPollSig();
        }
        updateFinishBtnState();
        processScanQueueMealMove();
      })
      .scanStaffApi(item.taskId, item.staffId, item.mode);
  }

  // ===== PURE-LOGIC-START =====
  // Logic thuần tách/quyết định mã dán — không phụ thuộc DOM/server. Khối này được
  // trích ra và test bởi tests/scan-logic.test.js (đọc marker, chạy trong vm sandbox)
  // → test ĐÚNG code được deploy, không có bản sao lệch nhau.
  // Tách chuỗi dán thành danh sách mã: khoảng trắng/tab/xuống dòng/phẩy/chấm phẩy.
  function splitScanCodes(raw) {
    return raw.split(/\s+|[;,]/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // Mã barcode nhân viên hợp lệ: bắt đầu "Ops" (case-insensitive) — khớp chuẩn server.
  function isValidBarcodeId(code) {
    return /^ops/i.test(code);
  }

  // Quyết định cách xử lý 1 lần submit từ ô quét. Trả về:
  //  - mode 'empty'           : không có mã nào (chuỗi rỗng / toàn dấu phân tách)
  //  - mode 'meal-move-batch' : meal-move + >1 mã → gửi 1 RPC batch (pasteMealMoveScanApi)
  //  - mode 'reconcile-batch' : đối chiếu + >1 mã → enqueue từng mã hợp lệ, bỏ qua mã rác
  //  - mode 'single'          : đúng 1 mã → đường quét đơn
  // Kèm: codes (mọi mã), validCodes (mã hợp lệ), invalidCount (số mã rác bị bỏ qua).
  function planScanSubmit(raw, isMealMove) {
    var codes = splitScanCodes(raw);
    if (!codes.length) {
      return { mode: 'empty', codes: codes, validCodes: [], invalidCount: 0 };
    }
    if (isMealMove && codes.length > 1) {
      return { mode: 'meal-move-batch', codes: codes, validCodes: codes, invalidCount: 0 };
    }
    if (!isMealMove && codes.length > 1) {
      var validCodes = [];
      var invalidCount = 0;
      codes.forEach(function (c) {
        if (isValidBarcodeId(c)) validCodes.push(c);
        else invalidCount++;
      });
      return { mode: 'reconcile-batch', codes: codes, validCodes: validCodes, invalidCount: invalidCount };
    }
    return { mode: 'single', codes: codes, validCodes: codes, invalidCount: 0 };
  }

  // meal-move: mode kế tiếp khi bấm "Chuyển Quét" — toggle Quét Danh Sách ⇄ Điểm Danh.
  // Đang 'ra' (đã quét Ra) → chuyển sang 'vao'; đang 'vao' → quay lại 'ra'.
  function nextMealMode(mode) {
    return mode === 'vao' ? 'ra' : 'vao';
  }
  // Cột "Người tạo": hiển thị email nhưng chỉ lấy phần tên (trước @), bỏ "@domain".
  // Logic thuần — test trong scan-logic.test.js cùng PURE-LOGIC block.
  function creatorName(email) {
    var s = String(email || '').trim();
    if (!s) return '';
    return s.split('@')[0].trim();
  }

  // CHUYỂN DANH SÁCH (2026-08-18): từ task Điểm Danh Ca (reconcile) — lấy toàn bộ NV
  // có status "Có mặt" trong log → xây input tạo task Ra/Vào (meal-move): kế thừa
  // station + team của task hiện tại, staffIds = danh sách Có Mặt. Thuần — test được.
  // 2026-08-18: thêm timeRaByStaff — map staffId → timeScanEpoch ("Giờ điểm danh")
  // của NV Có mặt, server ghi vào cột "Giờ Ra" (TIME_RA) của task Ra/Vào mới.
  // @param {Object} task — task reconcile hiện tại (CURRENT_TASK)
  // @param {Array} logRows — danh sách NV đã scan (CURRENT_LOG)
  // @param {string} presentStatus — label "Có mặt" (STATUS_C.PRESENT)
  // @returns {{station: string, team: string[], staffIds: string[], timeRaByStaff: Object, createdBy: string, note: string}}
  function buildTransferMealInput(task, logRows, presentStatus) {
    var station = task && task.station ? String(task.station).trim() : '';
    var team = [];
    if (task && task.team) {
      String(task.team).split(',').forEach(function (s) {
        var t = s.trim();
        if (t && team.indexOf(t) === -1) team.push(t);
      });
    }
    var staffIds = [];
    var timeRaByStaff = {};
    // 2026-08-25: lấy cả "Có mặt" và "Dư" (NV lạ) sang task Ra/Vào — trước chỉ lấy Có mặt
    // Hardcode 2 label để khối PURE-LOGIC không phụ thuộc STATUS_C (nằm ngoài block)
    var wantStatuses = ['Có mặt', 'Dư'];
    if (presentStatus && wantStatuses.indexOf(presentStatus) === -1) wantStatuses.push(presentStatus);
    (logRows || []).forEach(function (r) {
      if (r && wantStatuses.indexOf(r.status) >= 0 && r.staffId) {
        var id = String(r.staffId).trim();
        staffIds.push(id);
        if (Number(r.timeScanEpoch) > 0) timeRaByStaff[id] = Number(r.timeScanEpoch);
      }
    });
    return { station: station, team: team, staffIds: staffIds, timeRaByStaff: timeRaByStaff, createdBy: '', note: '' };
  }
  // ===== PURE-LOGIC-END =====

  function submitScan() {
    if (!CURRENT_TASK) return;
    // P2 (audit): chặn sớm khi task đã đóng (tab khác kết thúc task giữa chừng) —
    // tránh optimistic rồi rollback; server vẫn reject nếu race.
    if (CURRENT_TASK.status !== TASK_STATUS_C.OPEN) {
      showToast('Task đã kết thúc', true);
      playBeep('error');
      byId('scanInput').value = '';
      // F2: không focus khi camera đang mở — bàn phím bật lên che camera (khớp các
      // chỗ khác đã guard `!window.__RC_CAM_OPEN__`; bug 2026-08-18).
      if (!window.__RC_CAM_OPEN__) byId('scanInput').focus();
      return;
    }
    var input = byId('scanInput');
    var raw = input.value.trim();
    if (!raw) return;

    // Dán hàng loạt mã Ops vào ô quét → tách theo khoảng trắng/tab/xuống dòng/phẩy/chấm phẩy.
    // Meal-move: >1 mã → batch 1 RPC (pasteMealMoveScanApi) — giữ nguyên hành vi cũ.
    var plan = planScanSubmit(raw, CURRENT_TASK.taskType === 'meal-move');
    if (plan.mode === 'meal-move-batch') {
      if (PASTE_BUSY) {
        showToast('Đang xử lý dán mã — chờ giây lát', true);
        playBeep('error');
        return;
      }
      input.value = '';
      if (!window.__RC_CAM_OPEN__) input.focus();  // camera mở → không bật bàn phím
      submitPasteMealMoveBatch(plan.codes);
      return;
    }

    // P3 (fix 2026-08-08): task ĐỐI CHIẾU cũng được dán hàng loạt — trước đây cả khối
    // dán bị xem là 1 mã → 1 dòng Dư với cả loạt mã nằm ngang trong cột Mã NV. Nay
    // planScanSubmit tách từng mã → enqueue qua queue (optimistic + rollback như quét tay).
    if (plan.mode === 'reconcile-batch') {
      if (plan.invalidCount > 0) {
        showToast(plan.invalidCount + ' mã không hợp lệ — đã bỏ qua', true);
        playBeep('error');
      }
      input.value = '';
      if (!window.__RC_CAM_OPEN__) input.focus();
      if (!plan.validCodes.length) return;
      // FIX-23: giữ input cho đến khi enqueue xong — queue đầy thì khôi phục phần chưa xử lý thay vì mất hẳn (pre-clear ở trên sẽ được khôi phục nếu break)
      var batchDone = true;
      for (var bi = 0; bi < plan.validCodes.length; bi++) {
        if (!submitScanSingle(input, plan.validCodes[bi])) { // queue đầy → dừng loạt
          input.value = plan.validCodes.slice(bi).join('\n');
          batchDone = false;
          break;
        }
      }
      // batchDone true → đã clear sẵn, không cần làm gì; false → đã khôi phục phần còn lại
      return;
    }
    if (plan.mode === 'empty') return;  // lý thuyết: raw đã trim non-empty → luôn ≥1 mã

    // Một mã (quét tay / paste 1 mã) → đường quét đơn đã tách riêng
    submitScanSingle(input, plan.codes[0]);
  }

  // P3 (fix 2026-08-08): tách từ submitScan — xử lý 1 mã, dùng cho cả quét tay và
  // từng mã trong loạt dán của task đối chiếu. Trả false khi phải DỪNG loạt
  // (queue đầy / mã sai); true khi xử lý xong (kể cả reject nhẹ như Đã điểm danh).
  function submitScanSingle(input, staffId) {
    // FIX-11: paste batch meal-move đang chạy (PASTE_BUSY) — chặn RPC quét đơn chạy
    // song song (camera auto-submit/quét tay trong cửa sổ paste).
    if (PASTE_BUSY) {
      showToast('Đang xử lý dán mã — chờ giây lát', true);
      playBeep('error');
      return false;
    }
    // P2: chặn khi queue đầy — tránh backlog tăng mãi (2.5s/item)
    if (SCAN_QUEUE.length >= SCAN_QUEUE_MAX) {
      // FIX-24: báo rõ hàng đợi bao nhiêu mã và thời gian chờ ~2.5s/item (50*2.5=125s worst-case)
      showToast('Hàng đợi đang đầy (' + SCAN_QUEUE.length + ' mã — chờ ~' + Math.ceil(SCAN_QUEUE.length*2.5) + 's)', true);
      playBeep('error');
      return false;
    }
    SCAN_CARD_SEQ++;  // F7: bump 1 lần sau guard — phủ mọi path (sai mã / đã điểm danh / enqueue)

    // Chỉ chấp nhận mã barcode nhân viên bắt đầu "Ops" (case-insensitive).
    // Check client-side TRƯỚC khi vào queue → 0ms, không gọi server → KHÔNG làm chậm scan.
    if (!/^ops/i.test(staffId)) {
      showToast('Mã phải bắt đầu bằng "Ops"', true);
      playBeep('error');
      showScanCard('Sai mã', { staffId: staffId }, true);
      input.value = '';
      if (!window.__RC_CAM_OPEN__) input.focus();  // camera mở → không bật bàn phím
      return false;
    }

    // ---- Capture ngay: clear + focus + optimistic + toast tức thì (0ms) ----
    // focus bỏ qua khi camera đang mở (quét liên tục 2026-08-17) — tránh bàn phím
    // bật lên che camera trên mobile.
    input.value = '';
    if (!window.__RC_CAM_OPEN__) input.focus();

    // Tìm dòng NV trong log hiện tại; nếu chưa có → tạo dòng tạm.
    var norm = staffId.toUpperCase();
    var target = null;
    (CURRENT_LOG || []).forEach(function (r) {
      if (!target && String(r.staffId).toUpperCase() === norm) { target = r; }
    });

    // meal-move: nếu task là meal-move → logic Ra/Vào khác reconcile
    var isMealMove = CURRENT_TASK.taskType === 'meal-move';
    if (isMealMove) {
      submitScanMealMove(input, staffId, target);
      return true;
    }
    // Đã quét (Có mặt/Dư) → chặn NGAY ở client, không gọi server (tránh toast lặp)
    if (target && (target.status === STATUS_C.PRESENT || target.status === STATUS_C.EXTRA)) {
      showToast('Đã điểm danh', true);
      playBeep('error');
      showScanCard('Đã điểm danh', target, true);
      return true;  // batch: mã trùng chỉ bỏ qua, không dừng cả loạt
    }

    var item = {
      staffId: staffId,
      taskId: CURRENT_TASK.taskId,  // F1: capture task lúc enqueue — guard response cũ
      target: target,
      optimisticNew: false,
      oldStatus: null,
      oldTimeScanText: null,
      oldTimeScanEpoch: null,
    };
    if (target) {
      item.oldStatus = target.status;
      item.oldTimeScanText = target.timeScanText;
      item.oldTimeScanEpoch = target.timeScanEpoch;
      target.status = STATUS_C.PRESENT;
      target.timeScanText = fmtDate(new Date());
      target.timeScanEpoch = Date.now();  // sort key — quét tức thì nhảy lên đầu
    } else {
      item.optimisticNew = true;
      // NV lạ → dòng tạm status Dư (khớp server), không phải Có mặt.
      // Điền thông tin NGAY từ staff cache client (nếu có) — không chờ server round-trip.
      var siInfo = lookupStaffInfo(staffId);
      target = { staffId: staffId,
                 staffName: siInfo ? siInfo.staffName : '…',
                 slotCode: siInfo ? (siInfo.slotCode || '') : '',
                 station: siInfo ? (siInfo.station || '') : '',
                 team: siInfo ? (siInfo.team || '') : '',
                 workstation: siInfo ? (siInfo.workstation || '') : '',
                 agency: siInfo ? (siInfo.agency || '') : '',
                 timeRefText: '', timeScanText: fmtDate(new Date()), status: STATUS_C.EXTRA,
                 timeScanEpoch: Date.now() };
      item.target = target;
      CURRENT_LOG.push(target);
    }
    item.scanSeq = ++SCAN_CARD_SEQ;  // P2: đánh dấu lượt quét này là mới nhất — response cũ không đè card
    // Toast optimistic — hiện ĐÚNG status; server KHÔNG toast lại nếu trùng
    item.optimisticStatus = item.optimisticNew ? STATUS_C.EXTRA : STATUS_C.PRESENT;
    playBeep('scan');
    showToast(item.optimisticStatus, false);
    showScanCard(item.optimisticStatus, target, false);
    // ---- Optimistic counters: recount NGAY từ CURRENT_LOG (đã mutate/push) — khớp
    // server computeCounters; server sẽ trả giá trị chuẩn sau. ----
    recountFromLog();
    renderScanTable(CURRENT_LOG);
    SCAN_QUEUE.push(item);
    updateFinishBtnState();
    processScanQueue();
    return true;
  }

  // P1: không cho Kết thúc khi còn lượt quét chờ server (task-closed sẽ mất scan).
  function updateFinishBtnState() {
    var btn = byId('btnFinish');
    if (!btn) return;
    var isOpen = !!(CURRENT_TASK && CURRENT_TASK.status === TASK_STATUS_C.OPEN);
    var isDone = !!(CURRENT_TASK && CURRENT_TASK.status === TASK_STATUS_C.DONE);
    // DONE → ẩn nút Kết Thúc, hiện nút "Mở Lại"; OPEN → ngược lại
    var reopenBtn = byId('btnReopen');
    if (reopenBtn) reopenBtn.hidden = !isDone;
    btn.hidden = !isOpen;
    if (scanBusy()) {
      btn.disabled = true;
      btn.title = 'Đang xử lý quét — chờ xong rồi kết thúc';
    } else {
      btn.disabled = !isOpen;
      btn.title = '';
    }
    // Nút "Chuyển Danh Sách" (2026-08-18): chỉ task reconcile còn mở — disable khi
    // đang xử lý quét để không đọc log đang dở.
    var transferBtn = byId('btnTransferList');
    if (transferBtn) {
      transferBtn.hidden = !isOpen || !CURRENT_TASK || CURRENT_TASK.taskType === 'meal-move';
      transferBtn.disabled = scanBusy() || !isOpen;
      transferBtn.title = scanBusy() ? 'Đang xử lý quét — chờ xong rồi chuyển' : '';
    }
    // Nút "Copy mã Ops" (2026-08-25): hiện cho cả 2 loại task (reconcile + meal-move), cả open/done
    // Disable khi chưa có log để copy.
    var copyBtn = byId('btnCopyOps');
    if (copyBtn) {
      copyBtn.hidden = !CURRENT_TASK;
      var hasLog = !!(CURRENT_LOG && CURRENT_LOG.length);
      copyBtn.disabled = !hasLog;
      copyBtn.title = hasLog ? 'Copy ' + CURRENT_LOG.length + ' mã Ops (mỗi dòng 1 mã)' : 'Chưa có mã nào để copy';
    }
    // Nhãn nút Kết Thúc: OPEN + chưa có Ra → "Hoàn Thành" (xanh); OPEN + đã có Ra → "Kết Thúc" (đỏ)
    if (btn && CURRENT_TASK && isOpen) {
      var hasRa = false;
      (CURRENT_LOG || []).forEach(function (r) {
        if (Number(r.timeRaEpoch) > 0) hasRa = true;
      });
      if (hasRa) {
        btn.textContent = 'Kết Thúc';
        btn.className = 'btn btn-danger';
        btn.style.background = '';
        btn.style.color = '';
        btn.style.borderColor = '';
      } else {
        btn.textContent = 'Hoàn Thành';
        btn.className = 'btn';
        btn.style.background = '#2e7d32';
        btn.style.color = '#fff';
        btn.style.borderColor = '#2e7d32';
      }
    }
    updateQueueFullState();
  }

  // "Mở Lại" từ màn xem task đã kết thúc — dùng task đang mở trong view
  function reopenCurrentTask() {
    if (!CURRENT_TASK) return;
    reopenTask(CURRENT_TASK.taskId);
  }

  // I8: báo hiệu queue đầy — viền đỏ nhấp nháy quanh ô quét
  function updateQueueFullState() {
    var wrap = document.querySelector('.scan-input-wrap');
    if (!wrap) return;
    var full = SCAN_QUEUE.length >= SCAN_QUEUE_MAX;
    wrap.classList.toggle('queue-full', full);
    // P2: queue đầy → disable input luôn (hết gõ vô ích + spam toast khi Enter)
    var inp = byId('scanInput');
    if (inp) {
      // FIX-11: queue HẾT chỉ tự bật lại input khi KHÔNG bị disable có chủ đích
      // (paste batch đang chạy — PASTE_BUSY). `inp.disabled = full` vô điều kiện
      // cũ bật lại input giữa chừng paste → quét tay/RPC chạy song song batch.
      if (full) inp.disabled = true;
      else if (!PASTE_BUSY) inp.disabled = false;
    }
  }

  function processScanQueue() {
    if (SCAN_PROCESSING || !SCAN_QUEUE.length) return;
    SCAN_PROCESSING = true;
    var item = SCAN_QUEUE.shift();
    updateFinishBtnState();

    function rollback() {
      if (item.target && !item.optimisticNew) {
        item.target.status = item.oldStatus;
        // Đã Có mặt trước đó → giữ timeScanText/epoch server đã set, không ghi đè
        if (item.oldStatus !== STATUS_C.PRESENT) {
          item.target.timeScanText = item.oldTimeScanText || '';
          item.target.timeScanEpoch = item.oldTimeScanEpoch || 0;
        }
      } else if (item.target && item.optimisticNew) {
        // P1: splice theo index — KHÔNG pop() (pop xóa row CUỐI, sai khi queue
        // có 2+ NV lạ: item giữa fail → xóa nhầm row của item sau).
        var idx = CURRENT_LOG.indexOf(item.target);
        if (idx >= 0) CURRENT_LOG.splice(idx, 1);
      }
    }

    // Còn item chưa xử lý trong queue → counters optimistic đã tính trước
    // (server trả từng item sẽ ghi đè thiếu) → tính lại từ CURRENT_LOG.
    // Hết queue:
    //   - Có serverCounters (success/reject có response) → dùng counters server
    //     (chuẩn nhất — phản ánh cả scan từ tab khác).
    //   - KHÔNG có serverCounters (exception — mất response) → recount từ
    //     CURRENT_LOG để đồng bộ với rollback vừa chạy.
    function syncCounters(serverCounters) {
      if (SCAN_QUEUE.length > 0) { recountFromLog(); return; }
      if (serverCounters) { CURRENT_COUNTERS = serverCounters; renderCounters(serverCounters); }
      else { recountFromLog(); }
    }

    google.script.run
      .withSuccessHandler(function (res) {
        SCAN_PROCESSING = false;
        var busyRetry = false;  // FIX-16: BUSY → re-enqueue thay rollback
        // F1: response của scan enqueue ở task khác (user đã thoát/đổi task giữa chừng —
        // thực tế bị chặn bởi scanBusy(), guard này là defense cho đường thoát tương lai:
        // browser back, tab mới). Scan đã ghi server-side — chỉ drain queue, không đụng UI.
        if (!CURRENT_TASK || CURRENT_TASK.taskId !== item.taskId) {
          processScanQueue();
          return;
        }
if (res.ok) {
            if (item.target) {
              item.target.status = res.status;
              item.target.staffName = res.staffName || item.target.staffName;
if (res.timeScanText) item.target.timeScanText = res.timeScanText;
            // B11 (2026-08-19): meal-move thiếu sync timeScanEpoch (reconcile có :2813) —
            // sort cột Giờ Vào (col 6) dùng epoch client lệch vài giây tới khi reload.
            if (res.timeScanEpoch) item.target.timeScanEpoch = res.timeScanEpoch;
              // Dư: điền đủ Ca/Team/Station/Vender từ server (phòng cache client miss / data mới)
              if (res.agency) item.target.agency = res.agency;
              if (res.slotCode != null) item.target.slotCode = res.slotCode;
              if (res.station != null) item.target.station = res.station;
              if (res.team != null) item.target.team = res.team;
              if (res.workstation != null) item.target.workstation = res.workstation;
              // BUG 10 (2026-08-18): NV lạ — response về sau khi quét NV khác bị showScanCard
              // bỏ qua (scanSeq không còn mới nhất) → dòng camera giữ '…'. Cập nhật dòng Dư
              // theo mã (không theo scanSeq) khi server trả tên thật. (2026-08-19) điều kiện
              // mở rộng: NV lạ quét Ra ở meal-move (optimisticStatus = OUT) trước đây bị bỏ
              // qua vì chỉ khớp EXTRA → dùng optimisticNew cho đúng mọi đường quét.
              if (res.staffName && item.optimisticNew && typeof camUpdateName === 'function') {
                camUpdateName(item.target.staffId, res.staffName);
              }
            }
          // Toast optimistic đã hiện đúng → KHÔNG toast lại (tránh lặp/nháy).
          // Chỉ cập nhật nếu server trả status khác dự đoán.
          if (res.status && res.status !== item.optimisticStatus) showToast(res.status, false);
          // Scan card: làm mới từ server (lấy tên NV thật cho NV lạ) — CHỈ nếu
          // lượt quét này vẫn là mới nhất (item.scanSeq === SCAN_CARD_SEQ) — nếu
          // user đã quét NV khác khi response đang bay, không để card nhảy về cũ.
          if (res.status && item.scanSeq === SCAN_CARD_SEQ) showScanCard(res.status, item.target, false);
        } else {
          // FIX-16: lock server bận (kiosk khác đang giữ lock 10s) — client tự retry
          // tối đa 2 lần backoff 500ms thay vì mất lượt ngay. Server giữ nguyên
          // waitLock (giới hạn GAS); queue tuần tự nên re-enqueue đầu hàng an toàn.
          // Re-enqueue TRƯỚC rollback → giữ optimistic state (lượt chưa mất).
          busyRetry = res.message === LOCK_BUSY_MSG && (item._retries || 0) < 2;
          if (busyRetry) {
            item._retries = (item._retries || 0) + 1;
            SCAN_QUEUE.unshift(item);
          } else {
            rollback();
            // P3 (2026-08-19): submit fail → xoá cooldown camera (quét lại cùng mã ngay,
            // không đợi hết 1.5s dù server chưa nhận lượt nào).
            if (typeof camCooldownFailed === 'function') camCooldownFailed(item.staffId);
            playBeep('error');
            showToast(res.message, true);
          }
        }
        // FIX-16: khi retry, queue đã có lại item → syncCounters tự recount từ log
        // (không dùng counters-zeros của response BUSY) — optimistic giữ nguyên.
        syncCounters(res.counters);
        renderScanTable(CURRENT_LOG);
        updateFinishBtnState();
        refreshScanPollSig();
        if (busyRetry) setTimeout(processScanQueue, 500);
        else processScanQueue();
      })
      .withFailureHandler(function (err) {
        markServerFail();  // P2: RPC fail → server offline
        SCAN_PROCESSING = false;
        if (!CURRENT_TASK || CURRENT_TASK.taskId !== item.taskId) {
          processScanQueue();
          return;
        }
        rollback();
        if (typeof camCooldownFailed === 'function') camCooldownFailed(item.staffId);
        playBeep('error');
        showToast('Lỗi quét: ' + err.message, true);
        syncCounters(null);
        renderScanTable(CURRENT_LOG);
        updateFinishBtnState();
        processScanQueue();
      })
      .scanStaffApi(item.taskId, item.staffId);  // P2: dùng item.taskId đã capture — nhất quán với guard phòng thủ
  }

  // P2: mở lại task đã đóng (nút "Mở lại" ở danh sách task) — reset Vắng → Chưa điểm danh.
  function reopenTask(taskId) {
    if (BUSY) return;
    showConfirm(
      'Mở lại task',
      'Mở lại task ' + taskId + '?\nNV bị đánh Vắng sẽ đặt lại "Chưa điểm danh" để quét tiếp.',
      function () {
        BUSY = true;
        google.script.run
          .withSuccessHandler(function (res) {
            BUSY = false;
            showToast(res.message, !res.ok);
            // Đang xem chính task vừa mở lại → refresh view để hiện nút Kết Thúc
            if (CURRENT_TASK && CURRENT_TASK.taskId === taskId) {
              loadTaskDetail(taskId);
            } else {
              loadTaskList();
            }
          })
          .withFailureHandler(function (err) {
            markServerFail();
            BUSY = false;
            showToast('Lỗi mở lại: ' + err.message, true);
          })
          .reopenTaskApi(taskId);
      }
    );
  }

  function finishTask() {
    if (BUSY || !CURRENT_TASK) return;
    // P1: chặn Kết thúc khi scan đang chờ server (SCAN_PROCESSING) hoặc trong queue —
    // nếu không, completeTask chạy trước scanStaff → NV vừa quét bị đánh Vắng nhầm.
    if (scanBusy()) {
      showToast('Đang xử lý quét — chờ xong rồi kết thúc', true);
      return;
    }
    // Modal confirm thay cho confirm() trình duyệt — giữ UX đồng nhất với các modal khác
    showConfirm(
      'Kết thúc task',
      'Kết thúc task ' + CURRENT_TASK.taskId + '?\nKhông thể quét thêm sau khi kết thúc.',
      function () {
        BUSY = true;
        var btn = byId('btnFinish');
        if (btn) btn.disabled = true;
        google.script.run
          .withSuccessHandler(function (res) {
            BUSY = false;
            if (res.ok) {
              showToast(res.message, false);
              loadTaskDetail(CURRENT_TASK.taskId);
            } else {
              showToast(res.message, true);
              if (btn) btn.disabled = false;
            }
          })
          .withFailureHandler(function (err) {
            markServerFail();  // P2: RPC fail → server offline
            BUSY = false;
            if (btn) btn.disabled = false;
            showToast('Lỗi kết thúc: ' + err.message, true);
          })
          .completeTaskApi(CURRENT_TASK.taskId);
      }
    );
  }

  // ===== Helpers =====
  // D1: HTML scan card dùng chung — showScanCard chỉ lo className.
  function scanCardHTML(status, target) {
    return '<div class="sc-status">' + esc(status) + '</div>' +
      '<div class="sc-name">' + esc(target.staffName || target.staffId) + '</div>' +
      '<div class="sc-meta">Mã: ' + esc(target.staffId) +
      (target.slotCode ? ' · Ca: ' + esc(target.slotCode) : '') +
      (target.team ? ' · ' + esc(target.team) : '') + '</div>';
  }
  function showScanCard(status, target, isError) {
    var card = byId('scanCard');
    if (!card) return;
    if (!target) { resetScanCard(); return; }
    // C2: 3 trạng thái — Dư = amber (cảnh báo, không phải lỗi), lỗi = đỏ, ok = xanh
    var cls = isError ? 'err' : (status === STATUS_C.EXTRA ? 'extra' : 'ok');
    card.className = 'scan-card ' + cls;
    card.innerHTML = scanCardHTML(isError ? 'Lỗi' : status, target);
    // QUÉT LIÊN TỤC (2026-08-17): camera đang mở → đẩy kết quả vào danh sách NGAY DƯỚI
    // CAMERA (camera-scan.html camAppendResult — render #camResultsBody / postMessage cho
    // popup GAS). Không bật camera → bỏ qua im lặng (hành vi cũ giữ nguyên).
    // FIX-18: gán scanSeq để merge đúng lượt (Ra/Vào cùng mã trong 2.5s không gộp nhầm)
    if (typeof camAppendResult === 'function' && window.__RC_CAM_OPEN__) {
      try { target._camSeq = (typeof SCAN_CARD_SEQ !== 'undefined' ? SCAN_CARD_SEQ : null); } catch(e) {}
      camAppendResult(status, target, isError);
    }
    scheduleScanCardHide();
  }

  // 2026-08-20 (yêu cầu user): scan card TỰ ẨN sau 15s — kiosk không treo thông tin NV
  // vừa quét lâu (màn hình sạch khi ngừng quét). Mỗi lượt quét mới hủy timer cũ + đặt
  // lại — lượt mới luôn hiện đủ 15s, không bị ẩn giữa chừng bởi timer lượt trước.
  var SCAN_CARD_HIDE_MS = 15000;
  var scanCardHideTimer = null;
  function scheduleScanCardHide() {
    clearTimeout(scanCardHideTimer);
    scanCardHideTimer = setTimeout(function () { resetScanCard(); }, SCAN_CARD_HIDE_MS);
  }

  function resetScanCard() {
    clearTimeout(scanCardHideTimer);
    var card = byId('scanCard');
    if (!card) return;
    card.className = 'scan-card';
    card.innerHTML = '<div class="sc-empty">Chưa có lượt quét</div>';
  }

  var toastTimer = null;
  function showToast(msg, isError) {
    var t = byId('toast');
    t.setAttribute('role', isError ? 'alert' : 'status');
    t.setAttribute('aria-live', isError ? 'assertive' : 'polite');
    t.innerHTML = '<span class="toast-text">' + esc(msg) + '</span>' +
      (isError ? '<button class="toast-close" onclick="dismissToast()" aria-label="Đóng thông báo">✕</button>' : '');
    t.className = 'show ' + (isError ? 'err' : 'ok');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = ''; }, 2600);
  }
  function dismissToast() {
    var t = byId('toast');
    if (t) { t.className = ''; clearTimeout(toastTimer); }
  }

  function esc(s) {
    if (s === null || s === undefined) return '';
    // FIX-14: thêm escape `'` — nơi dùng attr đã qua escAttr, nhưng esc để hở `'`
    // là foot-gun khi field mới dùng esc cho attr single-quoted.
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escAttr(s) {
    return esc(s).replace(/'/g, '&#39;');
  }

  // P2: format theo TZ Asia/Ho_Chi_Minh (khớp server Session.getScriptTimeZone)
  // — không dùng local TZ của máy kiosk (có thể lệch nếu đổi vùng).
  var _fmtTZ = (function () {
    try {
      return new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'Asia/Ho_Chi_Minh' });
    } catch (e) { return null; }
  })();
  function fmtDate(d) {
    if (!d) return '';
    var dt = new Date(d);
    if (isNaN(dt.getTime())) return String(d);
    if (_fmtTZ) {
      var parts = _fmtTZ.formatToParts(dt);
      var h = '0', m = '0', s = '0';
      parts.forEach(function (p) {
        if (p.type === 'hour') h = p.value;
        else if (p.type === 'minute') m = p.value;
        else if (p.type === 'second') s = p.value;
      });
      return h + ':' + m + ':' + s;
    }
    return ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2) + ':' + ('0' + dt.getSeconds()).slice(-2);
  }
</script>
